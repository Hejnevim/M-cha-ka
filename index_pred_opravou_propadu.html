function Products({ products, setProducts, guardDelete }) {
  const [edit, setEdit] = useState(null);

  useEffect(() => { saveLS("irm-prod-view", view); }, [view]);

  const filtered = useMemo(() => {
    const s = q.trim().toLowerCase();
    if (!s) return products;
    return products.filter((p) =>
      (p.name + " " + (p.ref || "") + " " + (p.material || "")).toLowerCase().includes(s));
  }, [q, products]);

  const save = (p) => {
    setProducts((prev) => {
      const i = prev.findIndex((x) => x.id === p.id);
      if (i === -1) return prev.concat([p]);
      const c = prev.slice(); c[i] = p; return c;
    });
    setEdit(null);
  };

  const exportCsv = () => {
    const rows = [["ref", "nazev", "material", "poloha", "technologie", "sirka_mm", "vyska_mm", "pokryti_pct"]];
    for (const p of products)
      for (const x of p.positions)
        rows.push([p.ref || "", p.name, p.material || "", x.name, x.tech, x.w, x.h, x.cover != null ? x.cover : 100]);
    const csv = rows.map((r) => r.map((c) => '"' + String(c).replace(/"/g, '""') + '"').join(";")).join("\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "katalog-produktu.csv";
    a.click();

          </div>
          <button className="btn sec" onClick=${exportCsv}>Export CSV</button>
          <button className="btn" onClick=${() => setEdit({ id: uid(), ref: "", name: "", material: "", img: "", positions: [{ id: uid(), name: "", w: 50, h: 30, cover: 100, tech: "SCR", img: "" }] })}>+ Nový produkt</button>
        </div>
      </div>
      <input className="search" value=${q} onChange=${(e) => setQ(e.target.value)} placeholder="Hledat produkt / ref…" style=${{ marginBottom: 14 }} />
      ${!filtered.length ? html`<div className="empty">Nic nenalezeno.</div>` : (view === "grid" ? html`
        <div className="pgrid">
          ${filtered.slice(0, 300).map((p) => html`
            <div key=${p.id} className="pgcard">

                <${Img} src=${p.img} alt=${p.name}

/* Ceník materiálů dílny.

   Seznam se skládá ze dvou stran: co je v tabulce materiálů zapsané, a co
   se skutečně objevuje ve složení nahraných receptur. Druhá půlka je ta
   důležitá — bez ní by dílna psala ceny naslepo a nevěděla, že u poloviny
   složek žádná není. Proto se u každé složky ukazuje, v kolika recepturách
   se používá, a nejpoužívanější jdou první.

   Ceny se nepřepisují průběžně: sáhnout do souboru, ze kterého míchá celá
   dílna, se má jedním vědomým krokem, ne při každém stisku klávesy. */
function CenyMaterialu({ recipes, materialy, onUlozit, stav, mostOk }) {
  const [zmeny, setZmeny] = useState({});
  const [q, setQ] = useState("");
  const [jenBez, setJenBez] = useState(false);

  const seznam = useMemo(() => {
    const mapa = new Map();
    const pridej = (nazev, role) => {
      const klic = String(nazev || "").trim().toLowerCase();
      if (!klic) return null;
      if (!mapa.has(klic)) mapa.set(klic, { klic: klic, nazev: String(nazev).trim(),
        role: role || "", pouziti: 0, vTabulce: false });
      const z = mapa.get(klic);
      if (role && !z.role) z.role = role;
      return z;
    };
    for (const k of Object.keys(materialy || {})) {
      const m = materialy[k];
      const z = pridej(m.nazev, m.role);
      if (z) { z.vTabulce = true; z.mat = m; }
    }
    for (const r of (recipes || []))
      for (const c of (r.components || [])) {
        const z = pridej(c.name, "");
        if (z) z.pouziti++;
      }
    return Array.from(mapa.values()).sort((a, b) => b.pouziti - a.pouziti
      || String(a.nazev).localeCompare(String(b.nazev), "cs"));
  }, [recipes, materialy]);

  const hodnota = (z, pole) => {
    const zm = zmeny[z.klic];
    if (zm && zm[pole] !== undefined) return zm[pole];
    if (!z.mat) return pole === "mena" ? MENA_VYCHOZI : (pole === "jednotka" ? "kg" : "");
    if (pole === "cena") return z.mat.cena == null ? "" : z.mat.cena;
    if (pole === "role") return z.role || "";
    return z.mat[pole] || (pole === "mena" ? MENA_VYCHOZI : "kg");
  };
  const uprav = (z, pole, v) => setZmeny(Object.assign({}, zmeny,
    { [z.klic]: Object.assign({}, zmeny[z.klic], { [pole]: v }) }));

  const videt = useMemo(() => {
    const s = q.trim().toLowerCase();
    return seznam.filter((z) => (!s || z.nazev.toLowerCase().includes(s))
      && (!jenBez || !(n(hodnota(z, "cena")) > 0)));
  }, [seznam, q, jenBez, zmeny]);

  const bezCeny = seznam.filter((z) => !(n(hodnota(z, "cena")) > 0)).length;
  const pocetZmen = Object.keys(zmeny).length;

/* ============================ IMPORT / DATA ============================ */
function parseCsv(text) {
  // Excel ukládá CSV se značkou pořadí bajtů (BOM). Bez odstranění by první
  // sloupec hlavičky vyšel jako "﻿druh", hledání sloupců by selhalo
  // a soubor by se tvářil jako špatně vyplněný, ačkoli je v pořádku.
  text = String(text || "").replace(/^﻿/, "");
  const delim = ((text.match(/;/g) || []).length >= (text.match(/,/g) || []).length) ? ";" : ",";
  const lines = text.split(/\r?\n/).filter((l) => l.trim());
  return lines.map((l) => {
    const out = []; let cur = ""; let inQ = false;
    for (let i = 0; i < l.length; i++) {
      const ch = l[i];
      if (inQ) {
        if (ch === '"' && l[i + 1] === '"') { cur += '"'; i++; }
        else if (ch === '"') inQ = false;
        else cur += ch;
      } else if (ch === '"') inQ = true;
      else if (ch === delim) { out.push(cur); cur = ""; }
      else cur += ch;
    }
    out.push(cur);
    return out.map((c) => c.trim());
  });
}

const HDR = {
  ref: /^(ref|reference|kod|k.d|sku|cod)/i,
  name: /^(n.zev|name|produkt|product|nome)/i,
  material: /^(materi.l|material)/i,
  pos: /^(poloha|pozice|location|position|area|m.sto)/i,
  tech: /^(tech|technologie|technika|technique)/i,
  w: /^(sirka|.{0,2}rka|width|max.?w|w$|w_)/i,
  h: /^(vyska|v..ka|height|max.?h|h$|h_)/i,
  cover: /^(pokryti|pokryt.|cover)/i,
};

function rowsToItems(rows) {
  const head = rows[0].map((h) => h.toLowerCase());
  const col = {};
  for (const k of Object.keys(HDR)) col[k] = head.findIndex((h) => HDR[k].test(h));
  const items = [];
  for (const r of rows.slice(1)) {
    items.push({
      ref: col.ref >= 0 ? r[col.ref] : "",
      name: col.name >= 0 ? r[col.name] : "",
      material: col.material >= 0 ? r[col.material] : "",
      pimg: "", img: "",
      pos: col.pos >= 0 ? r[col.pos] : "Tisková plocha",
      techRaw: col.tech >= 0 ? r[col.tech] : "",
      w: col.w >= 0 ? n(r[col.w]) : 0,
      h: col.h >= 0 ? n(r[col.h]) : 0,
      cover: col.cover >= 0 ? n(r[col.cover], 100) : 100,
    });
  }
  return items;
}

function jsonToItems(data) {
  const arr = Array.isArray(data) ? data : (data.products || data.items || []);
  const items = [];
  for (const p of arr) {
    const ref = p.ref || p.reference || p.sku || p.code || "";
    const name = p.name || p.title || "";
    const material = p.material || p.materials || "";
    const pimg = toLocalImg(p.image || p.img || "");
    const colors = (p.colors || []).map((c) => ({
      code: String(c.code || ""), name: c.name || "", hex: c.hex || "", stock: c.stock || c.sklad || "",
      img: toLocalImg(c.img || c.image || "") }));
    const cust = p.positions || p.customizations || p.printing_areas || [];
    for (const c of cust) {
      items.push({
        ref: String(ref), name: String(name), material: String(material),
        colors: colors,
        pimg: pimg, img: toLocalImg(c.image || c.img || ""),
        pos: c.name || c.location || c.position || "Tisková plocha",
        techRaw: c.tech || c.technique || "",
        w: n(c.w != null ? c.w : (c.width != null ? c.width : (c.maxW != null ? c.maxW : c.max_width))),
        h: n(c.h != null ? c.h : (c.height != null ? c.height : (c.maxH != null ? c.maxH : c.max_height))),
        cover: n(c.cover, 100),
      });
    }
  }
  return items;
}

/* Receptury CSV: nazev;typ;rada;hustota;hex;komponenta;procento (řádek = komponenta)
   zdroj = ze kterého souboru databáze receptura je; podle něj se dá filtrovat,
   aby se dvě databáze nemíchaly dohromady */
function csvToRecipes(text, zdroj) {
  const rows = parseCsv(text);
  if (!rows.length) throw new Error("Soubor je prázdný — chybí i hlavička sloupců.");
  const head = rows[0].map((h) => h.toLowerCase());
  const idx = (re) => head.findIndex((h) => re.test(h));
  const ci = {
    name: idx(/^(n.zev|name|pantone)/), type: idx(/^typ/), series: idx(/^(.ada|rada|series)/),
    density: idx(/^hustota|density/), hex: idx(/^hex|barva|color/),
    comp: idx(/^komponent|component|slozka|složka/), pct: idx(/^(procent|pct|%|pod.l)/),
    mesh: idx(/^(s.to|sito|mesh)/), opacity: idx(/^(kryvost|opacity)/), surface: idx(/^(povrch|surface)/),
    customer: idx(/^(objednavatel|customer|z.kazn.k)/), tested: idx(/^(otestovan|tested)/), fade: idx(/^(vyblednut|odolnost|fade)/),
    zaklad: idx(/^(zaklad|z.klad|odvozeno|base)/), vazby: idx(/^(vazby|vazba|produkty|links)/),
    tech: idx(/^(technologie|tech|technika)/), visk: idx(/^(viskozita|viscosity)/),
    // dvousložkové barvy — čte se český i anglický název sloupce, protože
    // podklady od dodavatelů chodí obojí
    tuzidlo: idx(/^(tu.idlo|hardener|requires_hardener)/),
    pomerTuz: idx(/^(pomer.tu.idla|pom.r.tu.idla|hardener_ratio)/),
    potlife: idx(/^(potlife|pot.life|doba.zpracovatelnosti)/),
    mezPotlife: idx(/^(mez.potlife|mez.pot.life|critical_pot_life_ratio)/),
    hustnuti: idx(/^(hustnut|viscosity_loss_rate|rychlost.hustnut)/),
    tuzidloNazev: idx(/^(tuzidlo.nazev|tu.idlo.n.zev|hardener_name)/),
    // ředění — anglický název sloupce taky, ze stejného důvodu jako u tužidla
    pomerRed: idx(/^(pomer.[řr]edidla|pom.r.[řr]edidla|recommended_thinner_ratio)/),
    mezRed: idx(/^(mez.[řr]edidla|max_thinner_ratio)/),
  };
  if (ci.name < 0 || ci.comp < 0 || ci.pct < 0)
    throw new Error("CSV musí obsahovat sloupce: nazev, komponenta, procento (volitelně typ, rada, hustota, hex).");
  const map = new Map();
  for (const r of rows.slice(1)) {
    const name = r[ci.name]; if (!name) continue;
    if (!map.has(name)) {
      map.set(name, {
        id: uid(), name: name, zdroj: zdroj || "",
        type: ci.type >= 0 && /cust/i.test(r[ci.type] || "") ? "Custom" : "Pantone",
        series: ci.series >= 0 ? (r[ci.series] || "") : "",
        density: ci.density >= 0 ? n(r[ci.density], 1.2) : 1.2,
        hex: ci.hex >= 0 && /^#?[0-9a-f]{6}$/i.test(r[ci.hex] || "") ? (r[ci.hex][0] === "#" ? r[ci.hex] : "#" + r[ci.hex]) : "#888888",
        mesh: ci.mesh >= 0 ? (r[ci.mesh] || "") : "",
        opacity: ci.opacity >= 0 ? (r[ci.opacity] || "") : "",
        surface: ci.surface >= 0 ? (r[ci.surface] || "") : "",
        customer: ci.customer >= 0 ? (r[ci.customer] || "") : "",
        tested: ci.tested >= 0 ? /^(1|ano|yes|true|x)$/i.test((r[ci.tested] || "").trim()) : false,
        fade: ci.fade >= 0 ? /^(1|ano|yes|true|x)$/i.test((r[ci.fade] || "").trim()) : false,
        zaklad: ci.zaklad >= 0 ? (r[ci.zaklad] || "") : "",
        // technologie, pro které řada platí; prázdné = pro všechny
        tech: ci.tech >= 0 ? String(r[ci.tech] || "").toUpperCase().replace(/\s+/g, "") : "",
        viskozita: ci.visk >= 0 && r[ci.visk] !== "" ? n(r[ci.visk]) : null,
        // dvousložková barva a její pot life
        tuzidlo: ci.tuzidlo >= 0 ? /^(1|ano|yes|true|x)$/i.test((r[ci.tuzidlo] || "").trim()) : false,
        pomerTuzidla: ci.pomerTuz >= 0 && r[ci.pomerTuz] !== ""
          ? naPodil(r[ci.pomerTuz], POMER_TUZIDLA_VYCHOZI) : null,
        potlifeMin: ci.potlife >= 0 && r[ci.potlife] !== "" ? Math.round(n(r[ci.potlife])) : null,
        mezPotlife: ci.mezPotlife >= 0 && r[ci.mezPotlife] !== ""
          ? naPodil(r[ci.mezPotlife], MEZ_POTLIFE_VYCHOZI) : null,
        hustnuti: ci.hustnuti >= 0 && String(r[ci.hustnuti] || "").trim()
          ? kodHustnuti(r[ci.hustnuti]) : null,
        // které tužidlo do receptury patří — kvůli spárování s ceníkem
        tuzidloNazev: ci.tuzidloNazev >= 0 ? String(r[ci.tuzidloNazev] || "").trim() : "",
        // doporučené a mezní ředění; prázdné = platí výchozí hodnoty dílny
        pomerRedidla: ci.pomerRed >= 0 && r[ci.pomerRed] !== ""
          ? naPodil(r[ci.pomerRed], POMER_REDIDLA_VYCHOZI) : null,
        mezRedidla: ci.mezRed >= 0 && r[ci.mezRed] !== ""
          ? naPodil(r[ci.mezRed], MEZ_REDIDLA_VYCHOZI) : null,
        // na které kombinace produkt+barva+technologie+poloha byla receptura použita
        vazby: ci.vazby >= 0
          ? String(r[ci.vazby] || "").split("~").map((s) => s.trim()).filter(Boolean) : [],
        components: [],
      });
    }
    // řádek bez komponenty je receptura, u které se složení teprve dopisuje
    if (String(r[ci.comp] || "").trim())
      map.get(name).components.push({ id: uid(), name: r[ci.comp], pct: n(r[ci.pct]) });
  }
  return Array.from(map.values());
}

/* Přidá načtené receptury k těm stávajícím. Táž receptura ze stejné databáze
   se obnoví obsahem ze souboru, ale ponechá si id a co k ní nastavil technolog
   — na id visí vazby na produkt a polohu a v CSV žádné síto ani kryvost nejsou.

   Klíč je jméno VČETNĚ databáze, ze které receptura pochází: dvě databáze
   klidně mají PANTONE 485 C každá s jiným složením a nesmí si přepsat jedna
   druhou. Rozlišit je pak jde filtrem podle databáze. */
const klicReceptury = (r) => (r.zdroj ? r.zdroj + "|" : "") + String(r.name || "").toLowerCase();

function sloucReceptury(prev, nove, adopce) {
  const mapa = new Map(prev.map((r) => [klicReceptury(r), r]));
  // Receptury z dřívějška zdroj uvedený nemají. Při jednorázovém přeznačení
  // (adopce) si je databáze převezme, aby z jedné receptury nevznikly dvě.
  // Jindy se nikdy nesahá na receptury bez zdroje — jsou to ty ručně zadané.
  const kAdopci = new Map();
  if (adopce) {
    for (const r of prev) {
      if (!r.zdroj && r.type !== "Custom") kAdopci.set(String(r.name || "").toLowerCase(), r);
    }
  }
  let pridano = 0, obnoveno = 0;
  for (const r of nove) {
    if (!String(r.name || "").trim()) continue;
    const klic = klicReceptury(r);
    let stary = mapa.get(klic);
    if (!stary && r.zdroj) {
      const prevzaty = kAdopci.get(String(r.name).toLowerCase());
      if (prevzaty) {
        stary = prevzaty;
        mapa.delete(klicReceptury(prevzaty));
        kAdopci.delete(String(r.name).toLowerCase());
      }
    }
    if (stary) {
      obnoveno++;
      // co v souboru není, si receptura nechá od technologa — v CSV od dodavatele
      // žádné síto ani nastavení tužidla nebývá a přepsat je prázdnem by mlčky
      // vyplo hlídání pot life
      const drz = (nova, puvodni) => nova == null ? (puvodni == null ? null : puvodni) : nova;
      mapa.set(klic, Object.assign({}, r, {
        id: stary.id,
        mesh: r.mesh || stary.mesh || "", opacity: r.opacity || stary.opacity || "",
        surface: r.surface || stary.surface || "", customer: r.customer || stary.customer || "",
        tested: r.tested || !!stary.tested, fade: r.fade || !!stary.fade,
        tuzidlo: r.tuzidlo || !!stary.tuzidlo,
        pomerTuzidla: drz(r.pomerTuzidla, stary.pomerTuzidla),
        potlifeMin: drz(r.potlifeMin, stary.potlifeMin),
        mezPotlife: drz(r.mezPotlife, stary.mezPotlife),
        hustnuti: drz(r.hustnuti, stary.hustnuti),
        tuzidloNazev: r.tuzidloNazev || stary.tuzidloNazev || "",
        pomerRedidla: drz(r.pomerRedidla, stary.pomerRedidla),
        mezRedidla: drz(r.mezRedidla, stary.mezRedidla),
      }));
    } else {
      pridano++;
      mapa.set(klic, r);
    }
  }
  return { seznam: Array.from(mapa.values()), pridano: pridano, obnoveno: obnoveno };
}

/* ================== VLASTNÍ RECEPTURY JAKO DATABÁZE V SOUBORU ==================
   Custom receptury vznikají odvozením z receptur, které už v databázích jsou,
   a váží se na kombinaci produkt + barva produktu + technologie + poloha.
   Dokud žijí jen v prohlížeči, zmizí s vymazáním úložiště a nikdo jiný je
   neuvidí. Proto se odkládají do vlastního CSV ve složce databází — včetně
   toho, na které produkty a barvy byly použité (sloupec "vazby"). */
const SOUBOR_VLASTNI = "receptury_vlastni.csv";

/* Vazby jedné receptury: klíče "ref|barva|technologie|poloha" oddělené ~ */
function vazbyReceptury(links, id) {
  const out = [];
  for (const k of Object.keys(links || {})) if (links[k] === id) out.push(k);
  return out.sort();
}

/* Ze souboru databáze udělá čitelný název: receptury_PMS_660.csv → PMS 660 */
function nazevDb(zdroj) {
  return String(zdroj || "").replace(/\.csv$/i, "").replace(/^receptury[_ -]*/i, "")
    .replace(/_/g, " ").trim();
}

/* Ze které databáze vlastní barva vyšla. Nové odvozeniny si zdroj nesou samy;
   u starších se vyčte z názvu podkladu, kde stojí na konci v závorce. */
function zdrojOdvozeni(r) {
  if (!r) return "";
  if (r.zakladZdroj) return nazevDb(r.zakladZdroj);
  const m = /\(([^)]+)\)\s*$/.exec(String(r.zaklad || ""));
  return m ? m[1].trim() : "";
}

/* Název odvozené receptury. Nejdřív barva a databáze, ze které vznikla, pak
   číslo produktu, barva produktu a poloha potisku. Z názvu je tak vidět
   ze které řady receptura vyšla i ke které kombinaci patří — a dvě custom
   barvy odvozené ze stejného pantonu na dva různé produkty se nepletou. */
function nazevCustom(base, product, color, position) {
  const casti = [];
  const db = base ? nazevDb(base.zdroj) : "";
  casti.push((base && base.name ? base.name : "vlastní barva") + (db ? " (" + db + ")" : ""));
  const ref = product ? String(product.ref || product.name || "").trim() : "";
  if (ref) casti.push(ref);
  const bar = color ? String(color.code || color.name || "").trim() : "";
  if (bar) casti.push(bar);
  if (position) {
    const pos = (String(position.tech || "") + " " + String(position.name || "")).trim();
    if (pos) casti.push(pos);
  }
  return casti.join(" · ");
}

/* Klíč vazby je "ref|barva|technologie|poloha"; starší vazby mají jen
   první dvě části. */
function castKlice(k, i) {
  const c = String(k || "").split("|");
  return c.length > i ? c[i] : "";
}

/* Custom receptury jednoho produktu. Vlastní odstín vzniká vždycky na
   konkrétní kombinaci produkt + barva + poloha, takže u jiného produktu
   jen mate. Receptura bez jediné vazby (starší data, ruční zápis) se
   nabídne vždycky, aby o ni nikdo nepřišel.
   Vrací [{ r, presna, volna }] — přesná je ta vázaná právě na kombinaci,
   se kterou se zrovna pracuje. */
function customKProduktu(recipes, links, kde) {
  const ref = String((kde && kde.ref) || "");
  const tech = (kde && kde.tech) || "";
  const klic = (kde && kde.klic) || "";
  const vazby = new Map();
  for (const k of Object.keys(links || {})) {
    const id = links[k];
    if (!vazby.has(id)) vazby.set(id, []);
    vazby.get(id).push(k);
  }
  const out = [];
  for (const r of (recipes || [])) {
    if (r.type !== "Custom") continue;
    const ks = vazby.get(r.id) || [];
    if (!ks.length) { out.push({ r: r, presna: false, volna: true }); continue; }
    if (!ref) continue;
    const moje = ks.filter((k) => castKlice(k, 0) === ref);
    if (!moje.length) continue;
    // vazba nese i technologii — barva pro tampontisk se u sítotisku nenabídne
    if (tech && !moje.some((k) => { const t = castKlice(k, 2); return !t || t === tech; })) continue;
    out.push({ r: r, presna: !!klic && moje.indexOf(klic) >= 0, volna: false });
  }
  out.sort((a, b) => (b.presna ? 1 : 0) - (a.presna ? 1 : 0)
    || (a.volna ? 1 : 0) - (b.volna ? 1 : 0)
    || String(a.r.name || "").localeCompare(String(b.r.name || ""), "cs"));
  return out;
}

/* Které receptury patří do vlastního souboru: ty vlastní, co vznikly
   v aplikaci, plus ty, které už z tohoto souboru jsou. */
const jeVlastni = (r) => r.type === "Custom" && (!r.zdroj || r.zdroj === SOUBOR_VLASTNI);

function vlastniDoCsv(recipes, links) {
  const hlavicka = ["nazev", "typ", "rada", "hustota", "hex", "komponenta", "procento",
    "sito", "kryvost", "povrch", "objednavatel", "otestovany", "vyblednuti", "viskozita",
    "tuzidlo", "pomer_tuzidla", "potlife_min", "mez_potlife", "hustnuti", "tuzidlo_nazev",
    "pomer_redidla", "mez_redidla", "zaklad", "vazby"];
  const radky = [hlavicka];
  for (const r of recipes.filter(jeVlastni)) {
    const vazby = vazbyReceptury(links, r.id).join("~");
    const slozky = r.components && r.components.length ? r.components : [{ name: "", pct: "" }];
    for (const c of slozky) {
      radky.push([r.name, "Custom", r.series || "", r.density, (r.hex || "").replace(/^#/, ""),
        c.name || "", c.pct === "" ? "" : c.pct,
        r.mesh || "", r.opacity || "", r.surface || "", r.customer || "",
        r.tested ? "ano" : "", r.fade ? "ano" : "",
        r.viskozita == null ? "" : cislo(r.viskozita, 1),
        r.tuzidlo ? "ano" : "", r.pomerTuzidla == null ? "" : cislo(r.pomerTuzidla, 4),
        r.potlifeMin == null ? "" : cislo(r.potlifeMin, 0),
        r.mezPotlife == null ? "" : cislo(r.mezPotlife, 2), r.hustnuti || "",
        r.tuzidloNazev || "",
        r.pomerRedidla == null ? "" : cislo(r.pomerRedidla, 4),
        r.mezRedidla == null ? "" : cislo(r.mezRedidla, 4),
        r.zaklad || "", vazby]);
    }
  }
  return radky.map((r) => r.map((c) => '"' + String(c == null ? "" : c).replace(/"/g, '""') + '"')
    .join(";")).join("\r\n") + "\r\n";
}

/* ==================== SÍTA A VÝPOČET SPOTŘEBY BARVY ====================
   Kolik barvy projde sítem, je dané geometrií tkaniny. Teoretický objem
   nánosu se počítá takto:

       V [cm³/m²] = otevřená plocha [díl] × tloušťka tkaniny [µm]

   (metr čtvereční o tloušťce jednoho mikrometru je přesně 1 cm³, takže
   se čísla nemusí nijak převádět). Skutečný nános je menší — část barvy
   zůstane v sítu; tomu se říká faktor přenosu. Gramáž pak vyjde:

       g/m² = V × faktor přenosu × hustota barvy × koeficienty

   Koeficienty pokrývají to, co geometrie neví: krycí barva jde nanést
   silněji, savý textil bere víc než hladký plast a světlá barva na tmavém
   podkladu se často tiskne dvakrát.

   Parametry sít i koeficienty se načítají ze složky "parametry" — jsou to
   údaje výrobce tkaniny a zkušenost dílny, ne něco, co by aplikace mohla
   uhodnout. Dokud tam nic není, počítá se jako dosud dle technologie. */
const SLOZKA_PARAMETRY = "parametry";
const SOUBOR_SITA = "sita.csv";
const SOUBOR_KOEF = "koeficienty.csv";
const PRENOS_VYCHOZI = 0.7;      // kolik z teoretického objemu se opravdu přenese

/* Není-li otevřená plocha v datech, spočítá se z geometrie tkaniny:
   n nití na cm, průměr vlákna d µm → oko o = 10000/n − d [µm]
   otevřená plocha = (o / (o + d))², tloušťka = 1,6 × d

   Koeficient 1,6 není odhad — vyšel ze srovnání se čtyřmi skutečnými
   tkaninami (43-80, 77-55, 120-34, 150-31), kde poměr tloušťky k průměru
   vlákna vychází 1,61 až 1,64. S ním sedí teoretický objem u jemných sít
   na jednotky procent, u hrubých je asi o pětinu vyšší — dopočet je proto
   jen náhrada, dokud se nenačtou údaje výrobce tkaniny. */
function dopocitejSito(s) {
  const n_ = n(s.nitky), d = n(s.vlakno);
  const out = Object.assign({}, s);
  if (!(out.otevrena > 0) && n_ > 0 && d > 0) {
    const oko = 10000 / n_ - d;
    if (oko > 0) out.otevrena = Math.pow(oko / (oko + d), 2) * 100;
  }
  if (!(out.tloustka > 0) && d > 0) out.tloustka = d * 1.6;
  if (!(out.vth > 0) && out.otevrena > 0 && out.tloustka > 0) {
    out.vth = (out.otevrena / 100) * out.tloustka;
    out.dopocteno = true;
  }
  return out;
}

function csvNaSita(text) {
  const rows = parseCsv(text);
  if (!rows.length) throw new Error("Soubor sít je prázdný.");
  const head = rows[0].map((h) => h.toLowerCase().trim());
  const i = (re) => head.findIndex((h) => re.test(h));
  const ci = {
    tech: i(/^(technologie|tech)/), sito: i(/^(sito|s.to|mesh)/),
    nitky: i(/^(nitky|nit._cm|mesh_count|po.et_nit)/), vlakno: i(/^(vlakno|vl.kno|thread|prumer)/),
    otevrena: i(/^(otevrena|otev.en|open)/), tloustka: i(/^(tloustka|tlou..ka|thickness)/),
    vth: i(/^(vth|objem|volume|teoreticky)/), prenos: i(/^(prenos|p.enos|transfer)/),
    hloubka: i(/^(hloubka|depth|lept)/),
    viskOd: i(/^(viskozita_od|visk_od)/), viskDo: i(/^(viskozita_do|visk_do)/),
    poharek: i(/^(poharek|poh.rek|cup)/),
    pozn: i(/^(pozn|note)/),
  };
  if (ci.sito < 0) throw new Error("CSV sít musí mít sloupec sito.");
  return rows.slice(1).map((r) => {
    const zaznam = {
      tech: ci.tech >= 0 ? String(r[ci.tech] || "").toUpperCase().trim() : "",
      sito: String(r[ci.sito] || "").trim(),
      nitky: ci.nitky >= 0 ? n(r[ci.nitky]) : 0,
      vlakno: ci.vlakno >= 0 ? n(r[ci.vlakno]) : 0,
      otevrena: ci.otevrena >= 0 ? n(r[ci.otevrena]) : 0,
      tloustka: ci.tloustka >= 0 ? n(r[ci.tloustka]) : 0,
      vth: ci.vth >= 0 ? n(r[ci.vth]) : 0,
      prenos: ci.prenos >= 0 && r[ci.prenos] !== "" ? n(r[ci.prenos]) : null,
      // tampontisk nemá tkaninu — objem dává hloubka leptu klišé, a protože
      // metr čtvereční o hloubce 1 µm je 1 cm³, jde hloubka rovnou do Vth
      hloubka: ci.hloubka >= 0 ? n(r[ci.hloubka]) : 0,
      viskOd: ci.viskOd >= 0 ? n(r[ci.viskOd]) : 0,
      viskDo: ci.viskDo >= 0 ? n(r[ci.viskDo]) : 0,
      poharek: ci.poharek >= 0 ? (r[ci.poharek] || "") : "",
      pozn: ci.pozn >= 0 ? (r[ci.pozn] || "") : "",
    };
    if (!zaznam.vth && zaznam.hloubka > 0) { zaznam.vth = zaznam.hloubka; zaznam.klise = true; }
    // "120-34" v názvu síta nese nitky i vlákno, když sloupce chybí
    if ((!zaznam.nitky || !zaznam.vlakno) && /^(\d+)\s*[-/]\s*(\d+)/.test(zaznam.sito)) {
      const m = /^(\d+)\s*[-/]\s*(\d+)/.exec(zaznam.sito);
      if (!zaznam.nitky) zaznam.nitky = n(m[1]);
      if (!zaznam.vlakno) zaznam.vlakno = n(m[2]);
    }
    return dopocitejSito(zaznam);
  }).filter((s) => s.sito);
}

/* Klíč koeficientu může být i rozsah — u viskozity se nedá vypsat každá
   sekunda zvlášť. Přijímá se "18-22", "<18", ">22" i prosté číslo. */
function koefProHodnotu(tabulka, hodnota) {
  if (!tabulka || hodnota == null || hodnota === "") return null;
  const v = n(hodnota);
  for (const klic of Object.keys(tabulka)) {
    const k = String(klic).replace(/\s|s$/g, "");
    let m;
    if ((m = /^(-?[\d.]+)-(-?[\d.]+)$/.exec(k))) {
      if (v >= n(m[1]) && v <= n(m[2])) return tabulka[klic];
    } else if ((m = /^[<≤]=?(-?[\d.]+)$/.exec(k))) {
      if (v < n(m[1])) return tabulka[klic];
    } else if ((m = /^[>≥]=?(-?[\d.]+)$/.exec(k))) {
      if (v > n(m[1])) return tabulka[klic];
    } else if (/^-?[\d.]+$/.test(k) && Math.abs(v - n(k)) < 0.001) {
      return tabulka[klic];
    }
  }
  return null;
}

function csvNaKoeficienty(text) {
  const rows = parseCsv(text);
  if (!rows.length) throw new Error("Soubor koeficientů je prázdný.");
  const head = rows[0].map((h) => h.toLowerCase().trim());
  const i = (re) => head.findIndex((h) => re.test(h));
  const ci = { druh: i(/^(druh|typ|kategorie)/), klic: i(/^(klic|kl..|hodnota|nazev|n.zev)/),
    koef: i(/^(koef|nasobek|n.sobek|factor)/) };
  if (ci.druh < 0 || ci.klic < 0 || ci.koef < 0)
    throw new Error("CSV koeficientů musí mít sloupce druh, klic, koef.");
  const out = { kryvost: {}, material: {}, podklad: {}, viskozita: {} };
  for (const r of rows.slice(1)) {
    const druh = String(r[ci.druh] || "").toLowerCase().trim();
    const klic = String(r[ci.klic] || "").trim();
    const k = n(r[ci.koef]);
    if (!out[druh] || !klic || !(k > 0)) continue;
    out[druh][klic.toLowerCase()] = k;
  }
  return out;
}

/* Síta, která patří k dané technologii. Řádek bez uvedené technologie platí
   všude. Nejsou-li v parametrech žádná, vrátí se standardní řada — ať je
   z čeho vybírat, dokud dílna svoje síta nezapíše. */
function sitaPro(sita, tech, jenKlise) {
  const vsechna = (sita || []).filter((s) => !!s.klise === !!jenKlise);
  const moje = vsechna.filter((s) => s.tech === tech);
  const obecna = vsechna.filter((s) => !s.tech);
  const vybrana = moje.length ? moje.concat(obecna) : obecna;
  if (vybrana.length) return vybrana;
  return jenKlise ? [] : SITA.map((m) => ({ sito: m, tech: "", vychozi: true }));
}

/* Podklad se dělí jen na světlý / střední / tmavý — na 4 218 barevných
   variant by koeficienty nikdo neudržoval. Třída se pozná z odstínu. */
function tridaPodkladu(hex) {
  const rgb = hexNaRgb(hex);
  if (!rgb) return "";
  const jas = rgbNaLab(rgb)[0];      // L* v Lab, 0 = černá, 100 = bílá
  return jas >= 70 ? "světlý" : (jas >= 35 ? "střední" : "tmavý");
}

/* ===================== PODKLAD, KRYVOST A PROSVÍTÁNÍ =====================
   Podklad dosud vstupoval jen do spotřeby. Jenže barva na modrém tričku
   vypadá jinak než na bílém papíře, a světlý odstín na tmavém podkladu se
   bez podtisku bílou nedá vytisknout vůbec. Tohle je posouzení, ne měření:
   pracuje se s odstínem barvy a odstínem materiálu, oba aplikace zná.

   Meze níže jsou v jednotkách L* (0 = černá, 100 = bílá) a jsou to výchozí
   hodnoty, ne fyzikální konstanty — dílna si je časem upraví podle toho, co
   jí skutečně prosvítá. */
const MEZ_PODTISK = 20;   // barva o tolik světlejší než podklad -> podtisk bílou
const MEZ_RIZIKO = 8;     // ...o tolik -> hraniční, nejdřív zkouška
const MEZ_SYTOST_PODKLADU = 15;  // barevnost podkladu, od které táhne odstín

/* Název odstínu z polohy v Lab — aby se dalo napsat "podklad táhne do žluté"
   a ne "podklad má b* = 42".

   Hranice nejsou odhad: jsou to středy mezi skutečnými úhly čistých barev
   převedených do Lab. Pro kontrolu, kam co padá —
     červená 40°, oranžová 60°, žlutá 103°, zelená 136°,
     azurová 196°, modrá 306°, purpurová 328°.
   Odhad od oka tu selhal: žlutý podklad #F0D000 leží na 93°, což při dřívější
   hranici 75° vycházelo jako "zelená". */
const PASMA_ODSTINU = [
  [50, "červené"], [80, "oranžové"], [120, "žluté"], [165, "zelené"],
  [240, "tyrkysové"], [320, "modré"], [345, "purpurové"], [360, "červené"],
];
function odstinNazev(lab) {
  const [, a, b] = lab;
  const sytost = Math.sqrt(a * a + b * b);
  if (sytost < MEZ_SYTOST_PODKLADU) return "";
  const uhel = (Math.atan2(b, a) * 180 / Math.PI + 360) % 360;
  for (const [mez, jm] of PASMA_ODSTINU) if (uhel < mez) return jm;
  return "";
}

/* Posouzení dvojice barva + podklad. Vrací i důvody, ať je z čeho vyjít při
   sporu — technolog musí vidět, proč mu aplikace radí podtisk. */
function analyzaPodkladu({ barvaHex, podkladHex, kryvost }) {
  const rgbB = hexNaRgb(barvaHex), rgbP = hexNaRgb(podkladHex);
  if (!rgbB || !rgbP) return null;
  const labB = rgbNaLab(rgbB), labP = rgbNaLab(rgbP);
  const dL = labB[0] - labP[0];          // + = barva je světlejší než podklad
  const trida = tridaPodkladu(podkladHex);
  const sytostP = Math.sqrt(labP[1] * labP[1] + labP[2] * labP[2]);
  const kry = String(kryvost || "").toLowerCase();
  const kryci = /vysoce|krycí|kryci|opak/.test(kry);
  const transparentni = /transp/.test(kry);

  let stav = "ok", hlaska = "", podtisk = false;
  if (dL >= MEZ_PODTISK && !kryci) {
    stav = "podtisk"; podtisk = true;
    hlaska = "Barva je výrazně světlejší než podklad a není vysoce krycí — bez podtisku bílou prosvítá.";
  } else if (dL >= MEZ_PODTISK && kryci) {
    stav = "riziko";
    hlaska = "Barva je výrazně světlejší než podklad. Vysoce krycí barva to obvykle utáhne, ale počítejte s druhým průchodem.";
  } else if (dL >= MEZ_RIZIKO && !kryci) {
    stav = "riziko";
    hlaska = "Rozdíl jasu je hraniční — než se pustíte do série, udělejte zkoušku.";
  }

  // Průsvitná barva na barevném podkladu nese odstín podkladu s sebou.
  const tahne = transparentni && sytostP >= MEZ_SYTOST_PODKLADU ? odstinNazev(labP) : "";
  return {
    dL: dL, tridaPodkladu: trida, sytostPodkladu: sytostP,
    kryci: kryci, transparentni: transparentni,
    stav: stav, hlaska: hlaska, podtiskNutny: podtisk,
    tahneDo: tahne,
    posun: tahne ? "Podklad je sytý a barva průsvitná — výsledek se posune do " + tahne + "." : "",
  };
}

/* ================== ZÁMEK TECHNOLOGIÍ ==================
   Dílna otevírá technologie postupně — nejdřív FIR, kde jsou receptury
   i postupy, ostatní až budou data. Zamčená technologie se nesmí dát vybrat
   jako pracovní režim, ale musí být vidět, jinak ji lidi hledají.

   Stav se čte z parametry/technologie.csv, aby šlo odemykat bez zásahu do
   kódu. Není-li soubor, chová se aplikace jako dřív a nezamyká nic — jinak by
   po aktualizaci někomu zmizela technologie, ve které zrovna pracuje. */
const SOUBOR_TECHNOLOGIE = "technologie.csv";

function csvNaTechStav(text) {
  const rows = parseCsv(text);
  if (!rows.length) throw new Error("Soubor technologií je prázdný.");
  const head = rows[0].map((h) => h.toLowerCase().trim());
  const i = (re) => head.findIndex((h) => re.test(h));
  const ci = { tech: i(/^(tech|technologie)/), stav: i(/^stav/), pozn: i(/^(pozn|duvod)/) };
  if (ci.tech < 0 || ci.stav < 0)
    throw new Error("CSV technologií musí mít sloupce tech a stav.");
  const out = {};
  for (const r of rows.slice(1)) {
    const t = String(r[ci.tech] || "").trim().toUpperCase();
    const s = String(r[ci.stav] || "").trim().toLowerCase();
    if (!t || !TECHS[t]) continue;
    out[t] = { stav: s === "ostra" || s === "ostrá" ? "ostra" : "priprava",
      pozn: ci.pozn >= 0 ? String(r[ci.pozn] || "").trim() : "" };
  }
  return out;
}

/* Přiřazení databází receptur k technologiím ze souboru. Dokud bylo databází
   pár, stačilo nastavení v prohlížeči — jenže to má každý počítač svoje a
   u tří databází s různým záběrem by si dílna nastavila pokaždé něco jiného.
   Soubor proto přebíjí nastavení v prohlížeči. */
const SOUBOR_DATABAZE = "databaze.csv";

function csvNaDbTech(text) {
  const rows = parseCsv(text);
  if (!rows.length) throw new Error("Soubor databází je prázdný.");
  const head = rows[0].map((h) => h.toLowerCase().trim());
  const i = (re) => head.findIndex((h) => re.test(h));
  const ci = { soubor: i(/^(soubor|databaze|datab.ze|file)/), tech: i(/^(technologie|tech)/) };
  if (ci.soubor < 0 || ci.tech < 0)
    throw new Error("CSV databází musí mít sloupce soubor a technologie.");
  const out = {};
  for (const r of rows.slice(1)) {
    const s = String(r[ci.soubor] || "").trim();
    if (!s) continue;
    out[s] = String(r[ci.tech] || "").toUpperCase().replace(/\s+/g, "")
      .split(",").filter((t) => TECHS[t]).join(",");
  }
  return out;
}

/* Výchozí obsah souboru, není-li žádný — aby šlo zamykat i tehdy, když si
   dílna soubor ještě nevytvořila. Ostrá zůstane ta, ve které se pracuje. */
function vychoziTechCsv(ostra) {
  const radky = ["tech;stav;pozn",
    ';;"stav = ostra | priprava. Ostra = da se v ni pracovat, priprava = zamcena."'];
  for (const t of TECH_PORADI) {
    if (!TECHS[t]) continue;
    radky.push(t + ";" + (t === ostra ? "ostra" : "priprava") + ";");
  }
  return radky.join("\r\n") + "\r\n";
}

/* Rozdělení a složení řádku CSV se zachováním uvozovek — poznámka může
   obsahovat středník a ten se nesmí rozsypat. */
function rozdelRadek(l) {
  const out = []; let cur = "", vQ = false;
  for (let i = 0; i < l.length; i++) {
    const ch = l[i];
    if (vQ) {
      if (ch === '"' && l[i + 1] === '"') { cur += '""'; i++; }
      else if (ch === '"') { cur += '"'; vQ = false; }
      else cur += ch;
    } else if (ch === '"') { cur += '"'; vQ = true; }
    else if (ch === ";") { out.push(cur); cur = ""; }
    else cur += ch;
  }
  out.push(cur);
  return out;
}

/* Přepíše stav jedné technologie a nechá všechno ostatní být — komentáře,
   poznámky i pořadí řádků. Soubor je pro dílnu čitelný dokument, ne jen data;
   přegenerovat ho celý by z něj smazalo vysvětlivky. */
function zmenStavVCsv(text, tech, novyStav) {
  const zdroj = String(text || "").replace(/^﻿/, "");
  const radky = zdroj.split(/\r?\n/);
  const hlavicka = rozdelRadek(radky[0] || "").map((h) => h.trim().toLowerCase());
  let iTech = hlavicka.indexOf("tech"), iStav = hlavicka.indexOf("stav");
  if (iTech < 0) iTech = hlavicka.findIndex((h) => /^techno/.test(h));
  if (iTech < 0 || iStav < 0) throw new Error("Soubor technologií nemá sloupce tech a stav.");
  let nalezeno = false;
  for (let i = 1; i < radky.length; i++) {
    if (!radky[i].trim()) continue;
    const b = rozdelRadek(radky[i]);
    if ((b[iTech] || "").trim().toUpperCase() !== tech) continue;
    while (b.length <= iStav) b.push("");
    b[iStav] = novyStav;
    radky[i] = b.join(";");
    nalezeno = true;
    break;
  }
  if (!nalezeno) {
    const b = [];
    for (let k = 0; k < hlavicka.length; k++) b.push("");
    b[iTech] = tech; b[iStav] = novyStav;
    // před případný prázdný konec souboru
    while (radky.length && !radky[radky.length - 1].trim()) radky.pop();
    radky.push(b.join(";"));
  }
  return radky.join("\r\n").replace(/\r\n*$/, "") + "\r\n";
}

/* Zapíše ceny do tabulky materiálů a nechá všechno ostatní být.

   Soubor parametry/pigmenty.csv je pro dílnu čitelný dokument: jsou v něm
   vysvětlivky, poznámky a odstíny pigmentů naladěné podle vzorníku.
   Přegenerovat ho celý by o to připravilo, proto se mění jen buňky s cenou
   a řádky, které v souboru ještě nejsou, se připíšou na konec.

   Chybí-li sloupce ceny úplně (starší soubor), doplní se do hlavičky i do
   všech řádků, aby zůstaly zarovnané. */
function zapisCenyDoCsv(text, zmeny) {
  const zdroj = String(text || "").replace(/^﻿/, "");
  const radky = zdroj.split(/\r?\n/);
  let hlavicka = rozdelRadek(radky[0] || "").map((h) => h.trim());
  const najdi = (re) => hlavicka.findIndex((h) => re.test(h.toLowerCase()));
  const iNazev = najdi(/^(nazev|n.zev|name)/);
  const iDruh = najdi(/^(druh|typ)/);
  if (iNazev < 0 || iDruh < 0)
    throw new Error("Tabulka materiálů nemá sloupce druh a nazev — ceny není kam zapsat.");

  // sloupce ceny se v případě potřeby doplní; ostatní řádky se dorovnají
  const dopln = (jmeno, re) => {
    let i = najdi(re);
    if (i >= 0) return i;
    hlavicka = hlavicka.concat([jmeno]);
    for (let k = 1; k < radky.length; k++) {
      if (!radky[k].trim()) continue;
      radky[k] = rozdelRadek(radky[k]).concat([""]).join(";");
    }
    return hlavicka.length - 1;
  };
  const iCena = dopln("cena", /^(cena|price_per_unit|price)/);
  const iMena = dopln("mena", /^(mena|m.na|currency)/);
  const iJed = dopln("jednotka", /^(jednotka|unit)/);
  radky[0] = hlavicka.join(";");

  const zbyva = new Map();
  for (const z of (zmeny || [])) zbyva.set(String(z.nazev).trim().toLowerCase(), z);

  for (let i = 1; i < radky.length; i++) {
    if (!radky[i].trim()) continue;
    const b = rozdelRadek(radky[i]);
    const klic = String(b[iNazev] || "").trim().toLowerCase();
    const z = zbyva.get(klic);
    if (!z) continue;
    while (b.length <= Math.max(iCena, iMena, iJed)) b.push("");
    b[iCena] = z.cena == null || z.cena === "" ? "" : cislo(z.cena, 2);
    b[iMena] = z.mena || "";
    b[iJed] = z.jednotka || "";
    radky[i] = b.join(";");
    zbyva.delete(klic);
  }

  // materiál, který v tabulce ještě není — přibude i s druhem, ať se pozná,
  // jestli je to pigment, báze, tužidlo, nebo ředidlo
  for (const z of zbyva.values()) {
    if (!String(z.nazev || "").trim()) continue;
    const b = [];
    for (let k = 0; k < hlavicka.length; k++) b.push("");
    b[iDruh] = z.role || "";
    b[iNazev] = z.nazev;
    b[iCena] = z.cena == null || z.cena === "" ? "" : cislo(z.cena, 2);
    b[iMena] = z.mena || "";
    b[iJed] = z.jednotka || "";
    while (radky.length && !radky[radky.length - 1].trim()) radky.pop();
    radky.push(b.join(";"));
  }
  return radky.join("\r\n").replace(/\r\n*$/, "") + "\r\n";
}

/* Odemykací seznam: co které technologii chybí, aby se v ní dalo pracovat.
   Odškrtává se sám z dat, která aplikace má — zámek tím není byrokracie,
   ale ukazatel postupu. */
function pripravenostTech(tech, { sita, koef, pigmenty, recipes, dbTech, techStav }) {
  const st = (techStav || {})[tech];
  const maSito = techMaSito(tech);
  // Řádek se jménem síta ještě nejsou parametry. Vzorový soubor obsahuje celou
  // standardní řadu jen s počtem nití a průměrem vlákna — z toho se objem
  // dopočítá jen odhadem. Za hotové se proto počítá až údaj výrobce, tedy
  // objem zadaný nebo spočítaný z otevřené plochy a tloušťky tkaniny.
  const vlastniSita = (sita || []).filter(
    (s) => s.tech === tech && !!s.klise === !maSito && s.vth > 0 && !s.dopocteno);
  const jenNazvy = (sita || []).filter(
    (s) => s.tech === tech && !!s.klise === !maSito).length - vlastniSita.length;
  // receptury přiřazené téhle technologii přes databázi, ke které patří
  const souboryTech = Object.keys(dbTech || {}).filter(
    (f) => String((dbTech || {})[f] || "").split(",").filter(Boolean).indexOf(tech) >= 0);
  const receptur = (recipes || []).filter(
    (r) => r.type === "Custom" ? false : souboryTech.indexOf(r.zdroj) >= 0).length;
  const koefu = koef ? Object.keys(koef).reduce(
    (s, k) => s + Object.keys(koef[k] || {}).length, 0) : 0;

  const body = [
    { klic: "receptury", popis: "databáze receptur přiřazená technologii",
      hotovo: receptur > 0, detail: receptur > 0 ? receptur + " receptur" : "žádná databáze" },
    { klic: "sita", popis: maSito ? "parametry sít od výrobce" : "hloubky leptu klišé",
      hotovo: vlastniSita.length > 0,
      detail: vlastniSita.length > 0 ? vlastniSita.length + (maSito ? " sít" : " klišé")
        : (jenNazvy > 0 ? jenNazvy + (maSito ? " sít jen podle názvu" : " klišé bez hloubky")
          : "nejsou") },
    { klic: "koeficienty", popis: "koeficienty spotřeby",
      hotovo: koefu > 0, detail: koefu > 0 ? koefu + " hodnot" : "nejsou" },
    { klic: "pigmenty", popis: "pigmenty a báze",
      hotovo: pigmenty && Object.keys(pigmenty).length > 0,
      detail: pigmenty && Object.keys(pigmenty).length
        ? Object.keys(pigmenty).length + " položek" : "nejsou" },
  ];
  const hotovo = body.filter((b) => b.hotovo).length;
  return {
    tech: tech,
    stav: st ? st.stav : "ostra",     // bez souboru se nezamyká
    pozn: st ? st.pozn : "",
    body: body, hotovo: hotovo, celkem: body.length,
    podil: body.length ? hotovo / body.length : 0,
  };
}

const techOstra = (tech, techStav) =>
  !tech || !techStav || !techStav[tech] || techStav[tech].stav === "ostra";

/* ================== PIGMENT A BÁZE ODDĚLENĚ ==================
   Převzato z toho, jak má poskládaný sortiment Matsui: pár koncentrovaných
   pigmentů, které jdou do všech bází. Odstín určuje poměr pigmentů mezi sebou,
   vlastnosti (měkkost, kryvost, odbarvování, pružnost) určuje báze.

   Praktický důsledek: tentýž odstín na světlé i tmavé tričko není dvojí
   receptura, ale tentýž poměr pigmentů ve dvou bázích. A protože pigmentů je
   hrstka, dá se u nich zapsat odstín — a teprve tím může aplikace radit, ČÍM
   korigovat, ne jen počítat, kolik přidat.

   Tabulka je v parametry/pigmenty.csv; dokud tam nic není, chová se aplikace
   jako dosud a složení bere jako plochý seznam. */
const SOUBOR_PIGMENTY = "pigmenty.csv";
const MAX_PODIL_PIGMENTU = 15;   // % dávky; strop, není-li u báze uvedený vlastní

/* Tabulka materiálů vede i nákupní cenu. Druhů je víc než jen pigment a báze:
   tužidlo a ředidlo se do receptury nezapisují (nejsou to složky odstínu),
   ale platí se za ně stejně jako za barvu, takže do ceníku patří. */
const ROLE_MATERIALU = {
  pigment:    { popis: "pigment", vzor: /^pigment/ },
  baze:       { popis: "báze",    vzor: /^b[áa]ze|^base/ },
  tuzidlo:    { popis: "tužidlo", vzor: /^tu[žz]idlo|^hardener/ },
  redidlo:    { popis: "ředidlo", vzor: /^[řr]edidlo|^thinner|^rozpou/ },
  // Zpomalovač stojí obvykle násobek ředidla, takže se do ceníku musí dostat
  // zvlášť — schovaný pod "ředidlo" by dávku podhodnocoval.
  zpomalovac: { popis: "zpomalovač", vzor: /^zpomalova|^retard|zpomaluj/ },
  // Likvidace není složka, ale sazba za kilogram odpadu. Vyhozený kelímek se
  // platí dvakrát: jednou barvou, podruhé svozem nebezpečného odpadu. V ceníku
  // proto stojí jako vlastní druh — a do ceny dávky se nepřičítá nikdy, protože
  // se míchá barva, ne odpad.
  likvidace:  { popis: "likvidace odpadu", vzor: /^likvidac|^odpad|^svoz|^waste|^disposal/ },
};
const roleMaterialu = (s) => {
  const t = String(s || "").toLowerCase().trim();
  for (const k of Object.keys(ROLE_MATERIALU)) if (ROLE_MATERIALU[k].vzor.test(t)) return k;
  return "";
};

/* Měny se nesčítají. Kurz aplikace nezná a vymyslet si ho by znamenalo tvrdit
   číslo, které neplatí — materiál v cizí měně se proto do součtu nepočítá
   a řekne se to nahlas. */
const MENA_VYCHOZI = "CZK";
const MENA_ZNAK = { CZK: "Kč", EUR: "€", USD: "$", PLN: "zł", GBP: "£" };
const znakMeny = (m) => MENA_ZNAK[String(m || "").toUpperCase()] || String(m || "");

/* Cena se zadává za kilogram nebo za litr. Míchá se ale na gramy, takže se
   všechno převádí na cenu za gram; u litru přes hustotu, protože g/ml
   a kg/l je totéž číslo. */
const JEDNOTKY_CENY = ["kg", "l"];
function cenaZaGram(mat, hustota) {
  if (!mat || !(n(mat.cena) > 0)) return null;
  if (String(mat.jednotka || "kg").toLowerCase() === "l") {
    const h = n(hustota, 0);
    if (!(h > 0)) return null;          // bez hustoty se litr na gram nepřevede
    return n(mat.cena) / h / 1000;
  }
  return n(mat.cena) / 1000;
}

function csvNaPigmenty(text) {
  const rows = parseCsv(text);
  if (!rows.length) throw new Error("Soubor pigmentů je prázdný.");
  const head = rows[0].map((h) => h.toLowerCase().trim());
  const i = (re) => head.findIndex((h) => re.test(h));
  const ci = { druh: i(/^(druh|typ)/), nazev: i(/^(nazev|n.zev|name)/),
    hex: i(/^(hex|odstin|odst.n|barva)/), max: i(/^(maxpodil|max)/),
    cena: i(/^(cena|price_per_unit|price)/), mena: i(/^(mena|m.na|currency)/),
    jednotka: i(/^(jednotka|unit)/) };
  if (ci.druh < 0 || ci.nazev < 0)
    throw new Error("CSV pigmentů musí mít sloupce druh a nazev.");
  const out = {};
  for (const r of rows.slice(1)) {
    const role = roleMaterialu(r[ci.druh]);
    const nazev = String(r[ci.nazev] || "").trim();
    if (!nazev || !role) continue;
    const hex = ci.hex >= 0 ? String(r[ci.hex] || "").trim() : "";
    const jed = ci.jednotka >= 0 ? String(r[ci.jednotka] || "").toLowerCase().trim() : "";
    out[nazev.toLowerCase()] = {
      nazev: nazev, role: role,
      hex: hexNaRgb(hex) ? hex : "",
      max: ci.max >= 0 && n(r[ci.max]) > 0 ? n(r[ci.max]) : 0,
      cena: ci.cena >= 0 && n(r[ci.cena]) > 0 ? n(r[ci.cena]) : null,
      mena: ci.mena >= 0 && String(r[ci.mena] || "").trim()
        ? String(r[ci.mena]).trim().toUpperCase() : MENA_VYCHOZI,
      jednotka: JEDNOTKY_CENY.indexOf(jed) >= 0 ? jed : "kg",
    };
  }
  return out;
}

/* Rozdělí složení receptury na pigmenty a báze. Co v tabulce není, zůstane
   nezařazené — aplikace o tom mlčky nerozhoduje, radši to přizná. */
function rozborSlozeni(components, pigmenty) {
  const tab = pigmenty || {};
  const out = { pigmenty: [], baze: [], nezname: [], pctPigment: 0, pctBaze: 0, znamy: false };
  if (!components || !components.length) return out;
  for (const c of components) {
    const zn = tab[String(c.name || "").trim().toLowerCase()];
    const pct = n(c.pct);
    if (zn && zn.role === "pigment") { out.pigmenty.push(Object.assign({}, c, { hex: zn.hex })); out.pctPigment += pct; }
    // tužidlo ani ředidlo nejsou složky odstínu — do poměru pigment/báze nepatří
    else if (zn && zn.role === "baze") { out.baze.push(Object.assign({}, c, { max: zn.max })); out.pctBaze += pct; }
    else out.nezname.push(c);
  }
  out.znamy = out.pigmenty.length > 0 || out.baze.length > 0;
  // Strop bere z báze, je-li u ní uvedený — discharge snese míň než akrylát.
  const stropy = out.baze.map((b) => b.max).filter((m) => m > 0);
  out.strop = stropy.length ? Math.min.apply(null, stropy) : MAX_PODIL_PIGMENTU;
  out.pretizeno = out.pctPigment > out.strop + 1e-9;
  return out;
}

/* ===================== KOREKCE ODSTÍNU PO NÁTISKU =====================
   Uděláte nátisk, přiložíte ho k etalonu a vidíte, že je to vedle. Bez
   spektrofotometru nikdo nespočítá, o kolik — ale ví se, co se s tím dá dělat:
   z nádoby už nic neubereš, takže korekce je vždycky PŘÍDAVEK a dávka poroste.

   Podíl přidané složky se počítá z dávky, ne z té složky. Kroky jsou schválně
   malé: barvicí síla bází je velmi různá a u syté černé bývá i půl procenta
   moc. Proto se koriguje po krocích a mezi nimi se tiskne. */
const KROKY_KOREKCE = {
  mirne:    { popis: "mírně",    dil: 0.005 },
  znatelne: { popis: "znatelně", dil: 0.015 },
  vyrazne:  { popis: "výrazně",  dil: 0.040 },
};

function korekceOdstinu({ comps, totalG, index, sila }) {
  const krok = KROKY_KOREKCE[sila] || KROKY_KOREKCE.mirne;
  const T = n(totalG);
  if (!comps || !comps.length || !(T > 0)) return null;
  if (!(index >= 0 && index < comps.length)) return null;
  const pridat = T * krok.dil;
  const novaDavka = T + pridat;
  const nove = comps.map((c, i) => {
    const g = n(c.g) + (i === index ? pridat : 0);
    return { name: c.name, g: g, pct: novaDavka > 0 ? (g / novaDavka) * 100 : 0 };
  });
  const puvodniPct = comps.map((c) => (T > 0 ? (n(c.g) / T) * 100 : 0));
  return {
    slozka: comps[index].name, pridat: pridat, sila: krok.popis, dil: krok.dil,
    davka: novaDavka, puvodniDavka: T, naviceni: pridat,
    nove: nove, puvodniPct: puvodniPct,
  };
}

/* Čím korigovat: technolog popíše, co na nátisku vidí, a aplikace vybere
   pigment, který táhne opačným směrem.

   Model: přidá-li se podíl f pigmentu P do směsi M, posune se odstín přibližně
   o f × (P − M). Pigment je tedy tím vhodnější, čím líp jeho směr od současné
   barvy míří tam, kam potřebujeme; potřebný podíl vyjde jako
   f = žádaný posun / vzdálenost pigmentu od směsi.

   MEZ MODELU, kterou je nutné říct nahlas: míchání barev je odečítací, ne
   průměrovací. Silný pigment posune odstín víc, než tenhle výpočet čeká —
   u syté černé násobně. Číslo je proto začátek, ne předpis; koriguje se po
   malých krocích a rozhoduje oko. */
const SMERY_KOREKCE = {
  mocSvetle:  { popis: "je moc světlé",   v: [-1, 0, 0] },
  mocTmave:   { popis: "je moc tmavé",    v: [1, 0, 0] },
  maloCervene:{ popis: "je málo červené", v: [0, 1, 0] },
  mocCervene: { popis: "je moc červené",  v: [0, -1, 0] },
  maloZlute:  { popis: "je málo žluté",   v: [0, 0, 1] },
  mocZlute:   { popis: "je moc žluté",    v: [0, 0, -1] },
  vybledle:   { popis: "je vybledlé",     v: null, sytost: 1 },
  mocSyte:    { popis: "je moc syté",     v: null, sytost: -1 },
};
const POSUN_KOREKCE = { mirne: 1, znatelne: 3, vyrazne: 6 };   // žádaný posun v jednotkách ΔE

function doporucKorekci({ barvaHex, komponenty, pigmenty, smer, sila }) {
  const smerDef = SMERY_KOREKCE[smer];
  const rgbM = hexNaRgb(barvaHex);
  if (!smerDef || !rgbM || !komponenty || !komponenty.length) return null;
  const labM = rgbNaLab(rgbM);
  let v = smerDef.v;
  if (!v) {                       // sytost = směr od šedé (nebo k ní)
    const d = Math.sqrt(labM[1] * labM[1] + labM[2] * labM[2]);
    if (!(d > 1)) return { smer: smerDef.popis, navrhy: [], duvod: "Barva je téměř šedá — sytost nemá kam růst ani klesat." };
    v = [0, (labM[1] / d) * smerDef.sytost, (labM[2] / d) * smerDef.sytost];
  }
  const posun = POSUN_KOREKCE[sila] || POSUN_KOREKCE.mirne;
  const navrhy = [];
  for (const c of komponenty) {
    const zn = (pigmenty || {})[String(c.name || "").trim().toLowerCase()];
    if (!zn || zn.role !== "pigment" || !zn.hex) continue;
    const labP = rgbNaLab(hexNaRgb(zn.hex));
    const d = [labP[0] - labM[0], labP[1] - labM[1], labP[2] - labM[2]];
    const delka = Math.sqrt(d[0] * d[0] + d[1] * d[1] + d[2] * d[2]);
    if (!(delka > 1)) continue;   // pigment téměř totožný se směsí nikam netáhne
    const skore = (d[0] * v[0] + d[1] * v[1] + d[2] * v[2]) / delka;   // -1 až 1
    if (skore <= 0.05) continue;  // netáhne tím směrem
    const podilPct = (posun / delka) * 100;
    // Protože skutečný posun bývá větší, než lineární model čeká, je vypočtené
    // množství horní odhad — a přestřelit se nedá vzít zpět. Nabízí se proto
    // třetina, nejvýš procento dávky: raději korigovat dvakrát než jednou moc.
    navrhy.push({ name: c.name, hex: zn.hex, skore: skore, podilPct: podilPct,
      startPct: Math.min(podilPct / 3, 1) });
  }
  navrhy.sort((a, b) => b.skore - a.skore);
  return {
    smer: smerDef.popis, navrhy: navrhy,
    duvod: navrhy.length ? "" : "Žádná ze složek tímhle směrem netáhne — potřebujete pigment, který v receptuře není.",
  };
}

/* Spotřeba v g/m² ze síta a parametrů zakázky. Vrací i rozpis, aby bylo
   vidět, z čeho číslo vzniklo — technolog to musí umět zkontrolovat. */
function spotrebaZeSita({ sito, sita, tech, hustota, kryvost, material, podkladHex, koef, prenos,
                          viskozita }) {
  if (!sito || !sita || !sita.length) return null;
  const kl = String(sito).trim().toLowerCase();
  const nalezene = sita.filter((s) => s.sito.toLowerCase() === kl);
  // Parametry cizí technologie se nepoužijí — tampontisk se netiskne přes
  // sítotiskovou tkaninu a číslo z ní by nedávalo smysl. Řádek bez uvedené
  // technologie platí všude.
  const s = nalezene.find((x) => x.tech === tech) || nalezene.find((x) => !x.tech) || null;
  if (!s || !(s.vth > 0)) return null;
  const k = koef || { kryvost: {}, material: {}, podklad: {} };
  const kKryv = (kryvost && k.kryvost[String(kryvost).toLowerCase()]) || 1;
  const mat = String(material || "").toLowerCase();
  // materiál bývá složený ("Bavlna / Polyester") — vezme se nejvyšší koeficient
  let kMat = 1, matKlic = "";
  for (const klic of Object.keys(k.material || {})) {
    if (klic && mat.indexOf(klic) >= 0 && k.material[klic] > kMat) { kMat = k.material[klic]; matKlic = klic; }
  }
  const trida = tridaPodkladu(podkladHex);
  const kPod = (trida && k.podklad[trida]) || 1;
  // Řidší barva projde sítem snáz, hustší hůř. Jak moc, to je věc konkrétní
  // barvy a stroje — proto se to bere z tabulky koeficientů, ne ze vzorce.
  const kVisk = koefProHodnotu(k.viskozita, viskozita) || 1;
  const f = prenos != null ? n(prenos) : (s.prenos != null ? s.prenos : PRENOS_VYCHOZI);
  const gm2 = s.vth * f * n(hustota, 1.2) * kKryv * kMat * kPod * kVisk;
  // doporučený rozsah výtokového času k tomuhle sítu
  const dopVisk = (s.viskOd > 0 || s.viskDo > 0)
    ? { od: s.viskOd, do: s.viskDo, poharek: s.poharek } : null;
  const mimoRozsah = !!(dopVisk && n(viskozita) > 0
    && ((dopVisk.od > 0 && n(viskozita) < dopVisk.od) || (dopVisk.do > 0 && n(viskozita) > dopVisk.do)));
  return {
    gm2: gm2, sito: s, prenos: f,
    kKryvost: kKryv, kMaterial: kMat, materialKlic: matKlic,
    kPodklad: kPod, tridaPodkladu: trida,
    kViskozita: kVisk, viskozita: n(viskozita) || null,
    dopVisk: dopVisk, mimoRozsah: mimoRozsah,
  };
}

/* ========================= EVIDENCE ZBYTKŮ BAREV =========================
   Po zakázce zbude v kelímku barva. Dnes se buď vyhodí, nebo někde stojí bez
   popisku, dokud ji nikdo nepozná. Evidence ji vezme do systému: dostane kód
   na štítek, ví se z čeho je, kolik jí je, a při další zakázce aplikace sama
   nabídne, kolik z ní jde použít a kolik už stačí domíchat. */
const SOUBOR_ZBYTKY = "zbytky.csv";
const SLOZKA_EVIDENCE = "evidence";

/* Znaky kódu bez těch, které se na štítku pletou (0/O, 1/I/l). */
const ZNAKY_KODU = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
function novyKodZbytku(zbytky) {
  const obsazene = new Set((zbytky || []).map((z) => z.kod));
  for (let pokus = 0; pokus < 200; pokus++) {
    let k = "Z";
    for (let i = 0; i < 6; i++) k += ZNAKY_KODU[Math.floor(Math.random() * ZNAKY_KODU.length)];
    if (!obsazene.has(k)) return k;
  }
  return "Z" + Date.now().toString(36).toUpperCase().slice(-6);
}
const jeKodZbytku = (s) => /^Z[2-9A-HJ-NP-Z]{6}$/.test(String(s || "").trim().toUpperCase());

/* Báze (transparentní, medium) ředí barvu. Zbytek s bází se nedá použít tam,
   kde je potřeba plná sytost, a naopak — proto se na to filtruje. */
const VZOR_BAZE = /b[áa]ze|base|transparen|medium|firnis|extender/i;
const maBazi = (z) => (z.slozeni || []).some((c) => VZOR_BAZE.test(c.name || ""));
const normKomp = (s) => String(s || "").trim().toLowerCase().replace(/\s+/g, " ");

/* Kód zbytku, který v evidenci není — obsluha ho zadala ručně. */
const ZBYTEK_RUCNI = "@rucni";

/* Jak se kelímku říká na obrazovce, na štítku i na míchacím lístku. Ručně
   zadaný kelímek kód nemá a mít ho nemůže — pozná se podle toho, co o něm
   obsluha napsala. Na jednom místě proto, že se na to ptá sedm míst v aplikaci
   a rozejít se nesmějí. */
const popisKelimku = (z) => !z ? ""
  : (z.kod === ZBYTEK_RUCNI ? (z.nazev || "zbytek zadaný ručně") : z.kod);

/* ---- expirace a čas použitelnosti (pot life) ----
   Dvousložkové barvy s tužidlem tuhnou od chvíle, kdy se smíchají — po
   uplynutí pot life je kelímek k ničemu, i když je plný. Expirace je proti
   tomu prosté datum spotřeby. Sleduje se obojí a rozhoduje to, co vyprší dřív. */
const HODINA = 3600 * 1000;
const MINUTA = 60 * 1000;
const POTLIFE_VYCHOZI = 8;        // hodin, běžné u dvousložkových sítotiskových barev

/* Receptura vede pot life v MINUTÁCH, evidence kelímků v hodinách.
   Není to nedůslednost: dvousložkové barvy se liší po desítkách minut
   (4 h vs. 4,5 h je rozdíl, který v hodinách zmizí), kdežto u kelímku ve
   skladu jde o hrubý odhad, kdy ho vyhodit. Převádí se v jednom místě —
   při zakládání kelímku, funkcí potlifeHodin. */
const POTLIFE_MIN_VYCHOZI = POTLIFE_VYCHOZI * 60;   // 480 min = 8 h
const POMER_TUZIDLA_VYCHOZI = 0.1;                  // 10 % váhy báze
const MEZ_POTLIFE_VYCHOZI = 0.8;                    // po 80 % lhůty se varuje

/* Jak rychle směs po smíchání houstne. Receptura si nese jen kód, texty
   a doporučený interval kontroly viskozity jsou tady, ať je dílna má
   na jednom místě a nepřepisovaly se u každé barvy. */
const HUSTNUTI = {
  SLOW:   { popis: "pomalu",  kontrolaMin: 120,
            rada: "viskozita drží dlouho — stačí měřit jednou za dvě hodiny" },
  MEDIUM: { popis: "středně", kontrolaMin: 60,
            rada: "viskozitu měřte zhruba jednou za hodinu" },
  FAST:   { popis: "rychle",  kontrolaMin: 30,
            rada: "houstne rychle — měřte po půlhodině a řeďte podle síta" },
};
const HUSTNUTI_VYCHOZI = "MEDIUM";
const kodHustnuti = (v) => {
  const k = String(v == null ? "" : v).trim().toUpperCase();
  return HUSTNUTI[k] ? k : HUSTNUTI_VYCHOZI;
};

/* Poměr smí přijít jako 0,1 i jako 10 (procenta) — v Excelu to lidé píšou
   obojím způsobem a spletená desetina by znamenala desetkrát víc tužidla.
   Nad 1 se tedy bere jako procenta; 1 zůstane 1 (poměr 1:1 existuje). */
function naPodil(v, vychozi) {
  if (v == null || v === "") return vychozi;
  let x = n(v, NaN);
  if (isNaN(x) || x <= 0) return vychozi;
  if (x > 1) x = x / 100;
  return x;
}

/* Pot life receptury s doplněnými výchozími hodnotami. Jednosložkové barvy
   ani receptury z dřívějška žádné z těch polí nemají — bez tohohle by se
   všude opakovalo pět kontrol na null. */
function potlifeReceptury(r) {
  const kod = kodHustnuti(r && r.hustnuti);
  return {
    tuzidlo: !!(r && r.tuzidlo),
    minut: n(r && r.potlifeMin, 0) > 0 ? n(r.potlifeMin) : POTLIFE_MIN_VYCHOZI,
    pomer: naPodil(r && r.pomerTuzidla, POMER_TUZIDLA_VYCHOZI),
    mez: Math.min(0.99, naPodil(r && r.mezPotlife, MEZ_POTLIFE_VYCHOZI)),
    hustnuti: kod,
    hustnutiPopis: HUSTNUTI[kod].popis,
    hustnutiRada: HUSTNUTI[kod].rada,
    kontrolaMin: HUSTNUTI[kod].kontrolaMin,
  };
}
const potlifeHodin = (cfg) => (cfg && cfg.tuzidlo && n(cfg.minut) > 0)
  ? Math.round(n(cfg.minut) / 60 * 10) / 10 : null;

/* Tužidlo se počítá z váhy BÁZE, ne z hotové směsi: 10 % znamená
   100 g báze + 10 g tužidla = 110 g směsi. Kdyby se počítalo ze směsi,
   namíchalo by se tužidla o desetinu míň a barva by nevytvrdila. */
function davkaTuzidla(cfg, bazeG) {
  const baze = Math.max(0, n(bazeG));
  const pomer = (cfg && cfg.tuzidlo) ? n(cfg.pomer) : 0;
  const tuz = baze * pomer;
  return { baze: baze, tuzidlo: tuz, celkem: baze + tuz, pomer: pomer };
}

/* ================= ADITIVA: ŘEDIDLO A ZPOMALOVAČ SCHNUTÍ =================
   Barva se z kelímku nikdy netiskne tak, jak se namíchala. Podle síta, teploty
   v dílně a toho, jak dlouho už stojí, se do ní přilévá ředidlo; na jemná síta
   a velké formáty ještě zpomalovač, aby nezasychala v okách dřív, než projede
   stěrka.

   Doteď o tom aplikace věděla jedinou věc: kolik ředidla se nalilo, aby se to
   dalo připočítat k ceně. Do hmotnosti dávky se to nezapočítávalo, na štítku
   to nebylo a asistent vážení to nevedl — lilo se od oka mimo systém.

   Co aditivum udělá s odstínem: nic. Pigment se nikam neztratí, jen ho je
   v každém gramu míň. Tiskne se ale po gramech, ne po pigmentu, takže
   naředěná barva položí na potisk míň barviva.

   Kolik přesně, to se odsud netvrdí. Vliv viskozity na spotřebu se bere
   z naměřené tabulky koeficientů (viz spotrebaZeSita) a ta zůstává rozhodčím —
   po naředění se má viskozita změřit a zapsat. Tady se počítá jen to, co
   plyne přímo z hmotností v kelímku. */
const ADITIVA = {
  redidlo:    { popis: "ředidlo", role: "redidlo",
                rada: "ředí se podle naměřené viskozity, ne od oka" },
  zpomalovac: { popis: "zpomalovač schnutí", role: "zpomalovac",
                rada: "na jemná síta a velké formáty — barva pak nezasychá v okách" },
};
const DRUHY_ADITIV = Object.keys(ADITIVA);

const POMER_REDIDLA_VYCHOZI = 0.05;   // 5 % váhy bází
const MEZ_REDIDLA_VYCHOZI = 0.12;     // nad 12 % barva neteče, ale stéká

/* Doporučené a mezní ředění receptury s doplněnými výchozími hodnotami —
   stejně jako u pot life: starší receptury ta pole nemají a bez tohohle by
   se všude opakovaly kontroly na null. */
function redeniReceptury(r) {
  const dop = naPodil(r && r.pomerRedidla, POMER_REDIDLA_VYCHOZI);
  // Strop nesmí spadnout pod doporučení — to by hlásilo překročení hned
  // po nalití doporučeného množství.
  return { pomer: dop, mez: Math.max(dop, naPodil(r && r.mezRedidla, MEZ_REDIDLA_VYCHOZI)) };
}

/* Rozbor naředěné dávky.

   Doporučené množství se počítá z váhy BÁZÍ, ne z hotové směsi — stejně jako
   tužidlo a ze stejného důvodu: 5 % znamená 200 g barvy a 10 g ředidla.

   Pokles se měří proti DOPORUČENÉMU ředění, ne proti neředěné barvě. Receptura
   s ředěním počítá a spotřeba v g/m² je naměřená na barvě připravené k tisku,
   ne na koncentrátu z kelímku. Referencí je tedy stav, se kterým počítala
   kalkulace:

       koncentrace = báze / (báze + aditiva)
       pokles      = 1 − koncentrace / koncentrace_při_doporučeném
                   = (aditiva − doporučeno) / (báze + aditiva)

   Podíl aditiv se naopak uvádí z hotové směsi — to je to, co tiskař vidí
   v kelímku, a s tím se porovnává strop. */
function rozborNaredeni({ bazeG, aditiva, cfg }) {
  const B = Math.max(0, n(bazeG));
  if (!(B > 0)) return null;
  const polozky = DRUHY_ADITIV
    .map((k) => ({ druh: k, popis: ADITIVA[k].popis, g: Math.max(0, n(aditiva && aditiva[k])) }))
    .filter((p) => p.g > 0);
  const A = polozky.reduce((s, p) => s + p.g, 0);
  const celkem = B + A;
  const dopG = B * n(cfg && cfg.pomer);
  const mezG = B * n(cfg && cfg.mez);
  const nadDoporucenim = Math.max(0, A - dopG);
  return {
    baze: B, aditiva: A, celkem: celkem, polozky: polozky,
    doporuceno: dopG, strop: mezG,
    podil: celkem > 0 ? A / celkem : 0,
    podilDoporuceny: (B + dopG) > 0 ? dopG / (B + dopG) : 0,
    nadDoporucenim: nadDoporucenim,
    naredeno: nadDoporucenim > 0.005,
    prilisRidke: A > mezG + 0.005,
    nadStropem: Math.max(0, A - mezG),
    doStropu: Math.max(0, mezG - A),
    // 0,037 = v každém gramu je o 3,7 % míň pigmentu, než se počítalo
    pokles: celkem > 0 ? nadDoporucenim / celkem : 0,
  };
}

/* Kompenzace naředění: o kolik zvětšit dávku.

   Naředěná barva nese v každém gramu míň pigmentu, takže se jí na tutéž
   zakázku spotřebuje víc — v poměru 1 / (1 − pokles). Zvětšuje se celá dávka
   i s aditivy, aby poměr ředění a s ním viskozita zůstaly takové, na jaké je
   barva nastavená; mění se jenom množství.

   Co tímhle kompenzované NENÍ: kolik barvy projde sítem. To závisí na skutečně
   naměřené viskozitě a bere se z tabulky koeficientů. Tenhle dopočet měření
   nenahrazuje, jen dorovnává pigment, o který se dávka naředěním připravila. */
function kompenzaceNaredeni(rozbor) {
  if (!rozbor || !(rozbor.pokles > 0)) return null;
  const k = 1 - rozbor.pokles;
  if (!(k > 0)) return null;
  const nasobek = 1 / k;
  return {
    nasobek: nasobek,
    baze: rozbor.baze * nasobek, pridatBazi: rozbor.baze * (nasobek - 1),
    aditiva: rozbor.aditiva * nasobek, pridatAditiv: rozbor.aditiva * (nasobek - 1),
    celkem: rozbor.celkem * nasobek, navic: rozbor.celkem * (nasobek - 1),
  };
}

/* Stav rozpracované směsi od chvíle, kdy se do báze přidalo tužidlo.
   "kriticky" = uplynula kritická část lhůty (výchozí 80 %) — barva ještě
   jde tisknout, ale je nejvyšší čas; "prosle" = tuhne v kelímku. */
function stavPotlife(od, cfg, ted) {
  const lhuta = n(cfg && cfg.minut) * MINUTA;
  if (!cfg || !cfg.tuzidlo || !(n(od) > 0) || !(lhuta > 0))
    return { plati: false, stav: "ok", podil: 0, zbyva: null, uplynulo: 0, doKdy: null, lhuta: 0 };
  const nyni = ted || Date.now();
  const doKdy = n(od) + lhuta;
  const uplynulo = Math.max(0, nyni - n(od));
  const podil = uplynulo / lhuta;
  return {
    plati: true,
    stav: podil >= 1 ? "prosle" : (podil >= cfg.mez ? "kriticky" : "ok"),
    podil: podil, zbyva: doKdy - nyni, uplynulo: uplynulo, doKdy: doKdy, lhuta: lhuta,
  };
}

function stavZbytku(z, ted) {
  const nyni = ted || Date.now();
  const zacatek = n(z.namichano) || n(z.ulozeno) || nyni;
  const meze = [];
  if (z.expirace) {
    // datum spotřeby platí do konce toho dne
    const d = new Date(z.expirace + "T23:59:59");
    if (!isNaN(d)) {
      // "brzy" = poslední pětina lhůty, nejvýš ale den dopředu, ať roční
      // spotřeba neřve dva měsíce dopředu
      const lhuta = d.getTime() - zacatek;
      meze.push({ do: d.getTime(), duvod: "spotřeba do " + z.expirace,
        prah: Math.min(24 * HODINA, Math.max(HODINA, lhuta * 0.2)) });
    }
  }
  if (n(z.potlifeH) > 0) {
    // hranici varování si kelímek nese z receptury; u pot life rozhoduje
    // podíl lhůty, ne hodiny — u dvouhodinové směsi je pětina 24 minut
    const lhuta = n(z.potlifeH) * HODINA;
    const mez = Math.min(0.99, naPodil(z.mezPotlife, MEZ_POTLIFE_VYCHOZI));
    meze.push({ do: zacatek + lhuta, prah: lhuta * (1 - mez),
      duvod: "pot life " + fmt(n(z.potlifeH), 0) + " h od namíchání" });
  }
  if (!meze.length) return { stav: "ok", zbyva: null, doKdy: null, duvod: "" };
  const nej = meze.reduce((a, b) => (a.do <= b.do ? a : b));
  const zbyva = nej.do - nyni;
  return {
    stav: zbyva <= 0 ? "prosle" : (zbyva <= nej.prah ? "brzy" : "ok"),
    zbyva: zbyva, doKdy: nej.do, duvod: nej.duvod,
  };
}

/* Doba lidsky: "3 h 20 min", "2 dny" */
function dobaText(ms) {
  const m = Math.abs(n(ms));
  const dny = Math.floor(m / (24 * HODINA));
  const hod = Math.floor((m % (24 * HODINA)) / HODINA);
  const min = Math.floor((m % HODINA) / 60000);
  if (dny > 0) return dny + (dny === 1 ? " den" : (dny < 5 ? " dny" : " dní")) + (hod ? " " + hod + " h" : "");
  if (hod > 0) return hod + " h" + (min ? " " + min + " min" : "");
  return Math.max(1, min) + " min";
}

/* Zbývající čas lidsky: "za 3 h 20 min", "před 2 dny" */
function zbyvaText(ms) {
  if (ms == null) return "";
  return (ms < 0 ? "před " : "za ") + dobaText(ms);
}

/* ======================= CO TA DÁVKA STOJÍ =======================
   Dílna se tiskaře neptá, kolik barvy namíchal, ale co zakázka stála. Dokud
   se cena počítala až ve fakturaci, nedalo se u míchačky poznat, že se dvě
   stě gramů navíc prodraží víc než celý tisk.

   Počítá se z toho, co už aplikace ví: navážka každé složky v gramech krát
   nákupní cena té složky. Ztráty na sítu jsou v dávce započítané už dřív
   (dávka = netto × (1 + ztráty %)), takže se nepřičítají znovu — barva
   propadlá sítem je prostě součástí toho, co se navažuje.

   Čemu se aplikace vyhýbá: dopočítávat chybějící ceny odhadem. Nezná-li cenu
   složky, řekne to a spočítá zbytek — číslo, které vypadá úplně, ale úplné
   není, je horší než přiznaná mezera. */

/* Nejčastější měna v ceníku je měna dílny; ostatní se do součtu nepočítají. */
function menaDilny(materialy) {
  const pocty = new Map();
  for (const k of Object.keys(materialy || {})) {
    const m = materialy[k];
    if (!(n(m.cena) > 0)) continue;
    const mena = String(m.mena || MENA_VYCHOZI).toUpperCase();
    pocty.set(mena, (pocty.get(mena) || 0) + 1);
  }
  if (!pocty.size) return MENA_VYCHOZI;
  return Array.from(pocty.entries()).sort((a, b) => b[1] - a[1])[0][0];
}

/* Materiál z ceníku podle jména složky. Jméno se musí shodovat s tím
   v receptuře — spárovat "Binder" a "binder 745" aplikace neumí a hádat
   nebude. */
const materialPodleJmena = (materialy, jmeno) =>
  (materialy || {})[String(jmeno || "").trim().toLowerCase()] || null;

/* Jediné tužidlo (ředidlo) v ceníku, není-li určené jménem. Je-li jich víc
   a receptura neřekne které, cena se nepočítá — vybrat za dílnu to nejde. */
function materialRole(materialy, role, jmeno) {
  if (jmeno) {
    const m = materialPodleJmena(materialy, jmeno);
    return (m && m.role === role) ? m : null;
  }
  const vsechny = Object.keys(materialy || {}).map((k) => materialy[k])
    .filter((m) => m.role === role && n(m.cena) > 0);
  return vsechny.length === 1 ? vsechny[0] : null;
}

/* Cena namíchané dávky.

   Vrací i to, co spočítat nešlo: složky bez ceny a složky v jiné měně.
   `kryto` je podíl gramů, u kterých cena známá byla — podle něj se pozná,
   jestli je součet celá pravda, nebo jen její část.

   `gramCena` je průměrná cena gramu POČÍTANÉ části, ne celé dávky. Kdyby se
   dělilo všemi gramy, vyšla by u neúplného ceníku cena nižší, než jaká je,
   a úspora ze zbytku by se podhodnotila. */
function cenaDavky({ comps, totalG, materialy, hustota, tuzidloG, tuzidloNazev,
                     redidloG, redidloNazev, aditiva, mena }) {
  const men = String(mena || menaDilny(materialy) || MENA_VYCHOZI).toUpperCase();
  const out = { mena: men, celkem: 0, gramCena: 0, kryto: 0, uplna: true,
    polozky: [], bezCeny: [], jinaMena: [], gramu: 0, gramuSCenou: 0 };

  const pridej = (nazev, gramu, mat, role) => {
    const g = n(gramu);
    if (!(g > 0.0005)) return;
    out.gramu += g;
    const polozka = { nazev: nazev, gramu: g, role: role, cena: null, zaGram: null,
      cenaJednotky: mat ? n(mat.cena) : null, jednotka: mat ? mat.jednotka : "" };
    if (!mat || !(n(mat.cena) > 0)) { out.bezCeny.push(nazev); out.polozky.push(polozka); return; }
    if (String(mat.mena || MENA_VYCHOZI).toUpperCase() !== men) {
      out.jinaMena.push(nazev + " (" + mat.mena + ")");
      out.polozky.push(polozka); return;
    }
    const zaGram = cenaZaGram(mat, hustota);
    if (zaGram == null) { out.bezCeny.push(nazev); out.polozky.push(polozka); return; }
    polozka.zaGram = zaGram;
    polozka.cena = zaGram * g;
    out.celkem += polozka.cena;
    out.gramuSCenou += g;
    out.polozky.push(polozka);
  };

  for (const c of (comps || [])) {
    const mat = materialPodleJmena(materialy, c.name);
    pridej(c.name, c.g, mat, mat ? mat.role : "");
  }
  if (n(tuzidloG) > 0) {
    const mat = materialRole(materialy, "tuzidlo", tuzidloNazev);
    pridej(mat ? mat.nazev : (tuzidloNazev || "tužidlo"), tuzidloG, mat, "tuzidlo");
  }
  /* Aditiva: ředidlo si kvůli zpětné kompatibilitě drží vlastní parametr —
     volá se to i odjinud než z kalkulace. Přijde-li `aditiva`, platí ono
     a `redidloG` se ignoruje, aby se ředidlo nezapočítalo dvakrát. */
  if (aditiva) {
    for (const druh of DRUHY_ADITIV) {
      const g = n(aditiva[druh]);
      if (!(g > 0)) continue;
      const mat = materialRole(materialy, ADITIVA[druh].role,
        druh === "redidlo" ? redidloNazev : "");
      pridej(mat ? mat.nazev : ADITIVA[druh].popis, g, mat, ADITIVA[druh].role);
    }
  } else if (n(redidloG) > 0) {
    const mat = materialRole(materialy, "redidlo", redidloNazev);
    pridej(mat ? mat.nazev : (redidloNazev || "ředidlo"), redidloG, mat, "redidlo");
  }

  out.gramCena = out.gramuSCenou > 0 ? out.celkem / out.gramuSCenou : 0;
  out.kryto = out.gramu > 0 ? out.gramuSCenou / out.gramu : 0;
  out.uplna = out.gramu > 0 && out.bezCeny.length === 0 && out.jinaMena.length === 0;
  out.znama = out.gramuSCenou > 0;
  return out;
}

/* Cena barvy na jeden vytištěný kus. */
const cenaNaKus = (celkem, ks) => (n(ks) > 0 && n(celkem) > 0) ? n(celkem) / n(ks) : null;

/* Kolik ušetří použití zbytku.

   Zbytek je už zaplacený — leží v kelímku bez ohledu na to, jestli se použije,
   nebo vyhodí. Použitím se ušetří čerstvá barva, kterou by bylo nutné navážit
   místo něj: tedy jeho váha krát cena gramu téhle receptury. */
function usporaZeZbytku(pouzitG, gramCena) {
  const g = n(pouzitG), c = n(gramCena);
  return (g > 0 && c > 0) ? g * c : 0;
}

/* ---- druhá půlka ceny vyhozeného kelímku ----
   Nespotřebovaná barva nekončí v koši, ale ve svozu nebezpečného odpadu, a ten
   se platí podle váhy. Za kelímek se tedy platí dvakrát: jednou dodavateli za
   barvu, podruhé svozové firmě za to, že se jí dílna zbaví.

   Sazba je jedna pro celou dílnu a stojí v témž ceníku jako materiál, jen jako
   vlastní druh. Není-li vyplněná, vrací se nula a aplikace o likvidaci mlčí —
   ceník svozové firmy se odhadnout nedá. Cizí měna zůstane mimo součet ze
   stejného důvodu jako u ceny dávky: kurz aplikace nezná. */
function sazbaLikvidace(materialy, hustota, mena) {
  const m = materialRole(materialy, "likvidace");
  if (!m) return 0;
  const men = String(mena || menaDilny(materialy) || MENA_VYCHOZI).toUpperCase();
  if (String(m.mena || MENA_VYCHOZI).toUpperCase() !== men) return 0;
  const zaGram = cenaZaGram(m, hustota);
  return zaGram > 0 ? zaGram : 0;
}

/* Co stojí likvidace daného množství barvy. S cenou dávky se to nesčítá:
   cenu téhle dávky to nemění, jsou to peníze pro svozovou firmu, ne pro
   dodavatele barvy. Sečíst obojí do jednoho čísla by znamenalo tvrdit, že se
   za dávku nakoupí míň, než se doopravdy nakoupí. */
const cenaLikvidace = (gramu, sazba) =>
  (n(gramu) > 0 && n(sazba) > 0) ? n(gramu) * n(sazba) : 0;

/* Peníze česky: desetinná čárka a značka měny. Drobné položky potřebují víc
   desetinných míst — cena na kus bývá haléřová a "0,00 Kč" by neřeklo nic. */
function cenaText(v, mena, des) {
  const x = n(v);
  const d = des != null ? des : (Math.abs(x) > 0 && Math.abs(x) < 0.01 ? 4 : 2);
  return fmt(x, d) + " " + znakMeny(mena);
}

/* Viskozita se u zbytku měří výtokovým pohárkem — barva časem houstne,
   takže se drží i předchozí měření, aby byl vidět posun. */
const POHARKY = ["DIN 4 mm", "DIN 6 mm", "Ford 4 mm", "ISO 4 mm", "Zahn 2"];
function viskHistDoTextu(h) {
  return (h || []).map((m) => cislo(m.s, 1) + "@" + m.kdy).join("|");
}
function viskHistZTextu(s) {
  return String(s || "").split("|").filter(Boolean).map((kus) => {
    const [v, kdy] = kus.split("@");
    return { s: n(v), kdy: n(kdy) };
  }).filter((m) => m.s > 0);
}

/* Podíly složek v kelímku, přepočtené na jedničku. Procenta v evidenci se
   nemusejí sečíst přesně do sta — rozhoduje poměr mezi složkami, ne součet. */
function podilyZbytku(zbytek) {
  const radky = (zbytek && zbytek.slozeni) || [];
  const soucet = radky.reduce((s, c) => s + n(c.pct), 0);
  if (!(soucet > 0)) return null;
  const m = new Map();
  for (const c of radky) {
    const k = normKomp(c.name);
    m.set(k, (m.get(k) || 0) + n(c.pct) / soucet);
  }
  return m;
}

/* Podíly složek v cílové dávce, taky na jedničku — druhá strana téže úvahy. */
function podilyCile(comps, totalG) {
  if (!comps || !comps.length || !(totalG > 0)) return null;
  const m = new Map();
  for (const c of comps) {
    const k = normKomp(c.name);
    m.set(k, (m.get(k) || 0) + n(c.g) / totalG);
  }
  return m;
}

/* Kolik zbytku jde do dávky použít, aniž by se rozhodil poměr.
   Zbytek je vlastně předem namíchaná část dávky: pro každou složku musí platit
   zbytek × jeho_podíl ≤ dávka × cílový_podíl. Nejtěsnější z těch podmínek
   určuje, kolik zbytku se vejde. Obsahuje-li zbytek složku, kterou cíl vůbec
   nemá, použít nejde vůbec. */
function vyuzitelnyZbytek(zbytek, comps, totalG) {
  if (!zbytek || !(n(zbytek.gramu) > 0)) return null;
  const cil = podilyCile(comps, totalG);
  const zb = podilyZbytku(zbytek);
  if (!cil || !zb) return null;
  let nejtesnejsi = Infinity;
  for (const [k, q] of zb) {
    if (!(q > 0)) continue;
    const p = cil.get(k) || 0;
    if (!(p > 0)) return null;               // složka navíc — zbytek sem nepatří
    nejtesnejsi = Math.min(nejtesnejsi, p / q);
  }
  if (!isFinite(nejtesnejsi) || nejtesnejsi <= 0) return null;
  const pouzit = Math.min(n(zbytek.gramu), totalG * nejtesnejsi);
  if (!(pouzit > 0.05)) return null;
  // čím se zbytek podílí na jednotlivých složkách
  const prispevek = comps.map((c) => pouzit * (zb.get(normKomp(c.name)) || 0));
  return {
    zbytek: zbytek,
    pouzit: pouzit,
    domichat: Math.max(0, totalG - pouzit),
    zbudeVKelimku: Math.max(0, n(zbytek.gramu) - pouzit),
    prispevek: prispevek,
    // 1 = složení sedí přesně, míň = zbytek je v něčem sytější než cíl
    shoda: Math.min(1, nejtesnejsi),
    pomer: nejtesnejsi,      // neomezeně — potřeba pro dopočet celé dávky
  };
}

/* Přepočet receptury tak, aby se spotřeboval CELÝ zbytek.
   Do dávky, kterou žádá zakázka, se často vejde jen část starého kelímku.
   Zbytek se dá využít celý, když se dávka zvětší — nejmenší možná dávka je ta,
   ve které ani jedna složka zbytku nepřesahuje svůj podíl:

       dávka = zbytek / nejtěsnější poměr

   Odstín zůstává přesný, jen se namíchá víc, než zakázka potřebuje.

   Do určité míry. Je-li kelímek v některé složce mnohem sytější než cíl,
   vyjde nejmenší možná dávka násobně větší než zakázka — dvě stě gramů staré
   barvy si vynutí kilo nové. Uspořit se tím nedá nic, jen se vyrobí větší
   zbytek než ten původní, a tak se od téhle meze varianta „celý kelímek"
   přestává nabízet sama. Ručně zadaný kelímek se počítá dál: tam se ptá
   obsluha, která už ví, že si namíchá do zásoby. */
const MEZ_ZVETSENI_DAVKY = 2;    // dávka smí kvůli zbytku narůst nejvýš na dvojnásobek

function zbytekCelyPlan(zbytek, comps, totalG) {
  const zaklad = vyuzitelnyZbytek(zbytek, comps, totalG);
  if (!zaklad || !(zaklad.pomer > 0)) return null;
  const L = n(zbytek.gramu);
  // Nikdy míň, než žádá zakázka — vejde-li se zbytek do její dávky celý,
  // není co zvětšovat a plán je totožný s běžným využitím.
  const davka = Math.max(totalG, L / zaklad.pomer);
  const podil = comps.map((c) => (totalG > 0 ? n(c.g) / totalG : 0));
  // kolik z které složky zbytek přináší (celý, ne jen jeho použitelná část)
  const prispevek = zaklad.prispevek.map((p) => zaklad.pouzit > 0 ? p / zaklad.pouzit * L : 0);
  return Object.assign({}, zaklad, {
    celyZbytek: true,
    davka: davka,
    pouzit: L,
    prispevek: prispevek,
    pridat: comps.map((c, i) => Math.max(0, davka * podil[i] - prispevek[i])),
    domichat: Math.max(0, davka - L),
    zbudeVKelimku: 0,
    prebytek: Math.max(0, davka - totalG),   // o kolik víc, než zakázka žádá
    prilisVelka: davka > totalG * MEZ_ZVETSENI_DAVKY + 0.005,
  });
}

/* Co přidat do zbytku, aby z něj vznikl žádaný odstín.

   Zbytek je předem namíchaná část dávky. Aby výsledek seděl přesně, musí pro
   každou složku platit

       zbytek × podíl_ve_zbytku ≤ dávka × podíl_v_cíli,

   protože z kelímku už nic ubrat nejde — přilévá se jen. Nejmenší dávka, do
   které se celý kelímek vejde, je tedy

       dávka = zbytek × max(podíl_ve_zbytku / podíl_v_cíli)

   a přidat se musí rozdíl mezi cílovou navážkou a tím, co kelímek přinesl.
   Ten poměr je vždycky aspoň 1 (obě složení jsou procenta ze sta), takže
   výsledku je vždy víc než zbytku — nikdy ne míň.

   Složku, kterou cíl vůbec nemá, z kelímku nedostaneme. Pak se řekne, která
