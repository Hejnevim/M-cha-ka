<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ink Recipe Manager — Printcolor</title>
<style>
:root{
  /* Vzhled zůstává měkký — karty vystupují z plochy stínem, ne rámečkem.
     Mění se jen barvy: plocha je neutrálně šedá místo teplé béžové a inkoust
     je tmavší, aby se na to dalo dívat celý den. Barevný akcent zmizel;
     zvýraznění dělá inkoust, barva zůstala tam, kde nese význam (odstín
     barvy, varování, stav vážení). */
  /* --bg maluje JEN plochu stránky; všechno, co na ní leží (karty, lišty,
     tlačítka, pole, štítky), bere barvu z --paper. Ty dvě proměnné jdou
     nastavit nezávisle — plocha je samostatná jednotka. */
  --bg:#949494; --paper:#dbdbdb; --zvyraz:#949494; --logo:#949494;
  --ink:#141414; --ink-2:#767676; --line:#D8D8D8; --line-2:#C7C7C7;
  --cyan:#141414; --magenta:#C97B63; --yellow:#D9B44A; --key:#141414;
  --btn-ink:#FFFFFF; --focus:rgba(20,20,20,.20); --danger:#b31919;
  --ok:#3dc760; --warn:#e8c545;
  /* Tvary: každý druh prvku má vlastní zaoblení, aby šlo ladit zvlášť
     karty, tlačítka, pole a dlaždice. Ikony jsou kreslené, ne obrázkové —
     velikost, tloušťka tahu i zakončení se řídí odsud. Ikona stojící uvnitř
     řádku textu se neřídí velikostí samostatných ikon, ale písmem kolem sebe
     — proto je v em a zmenší se s ním. */
  --radius:23px; --radius-btn:35px; --radius-pole:15px; --radius-dlazdice:15px;
  --radius-stitek:15px;
  --ikona:27px; --ikona-tah:1.5; --ikona-konec:round; --ikona-pruhlednost:1;
  --ikona-radek:1.2em;
  --pruhlednost-karty:1;
  /* Písmo se řídí podle role, ne podle prvku: co je nadpis, co popisek, co
     výsledek. Zvětšené varianty na domovské stránce se z těchto hodnot
     dopočítají, takže celá škála drží pohromadě. */
  --pismo:15.5px; --pismo-nadpis:19.5px; --pismo-popisek:12.5px;
  --pismo-poznamka:14px; --pismo-tabulka:19px; --pismo-vysledek:50px;
  --logo-velikost:116px; --prostrkani:0.07em; --tloustka-nadpisu:900; --radek:1.4;
  /* Rozestupy: odsazení uvnitř karty, mezera mezi kartami, mezera mezi poli
     v řádku a odsazení uvnitř polí a tlačítek (to určuje jejich výšku). */
  /* Míchací režim má vlastní sadu rozměrů. Nečte se od klávesnice, ale od
     váhy — často ve stoje a v rukavicích — takže se ladí zvlášť od zbytku
     aplikace a nesmí se hýbat, když se sáhne na obecnou škálu. */
  --mich-nazev:26px; --mich-davka:34px; --mich-vzorek:52px;
  --mich-hlavicka:12px; --mich-tabulka:20px; --mich-gramy:26px;
  --mich-radek:11px; --mich-vysledek:52px; --mich-wbar:20px;
  --mich-tlacitko:15px; --mich-mezera:22px;
  --mich-pole:20px; --mich-hlaseni:15px; --mich-stitek:14px;
  --mezera-karta-y:20px; --mezera-karta-x:22px; --mezera-karet:16px;
  --mezera-poli:12px; --pole-y:9px; --pole-x:12px;
  --tlacitko-y:10px; --tlacitko-x:18px; --okraj-stranky:20px;
  /* Rozvržení hlavní stránky: kde která karta stojí, jak je široká a jak
     vysoká. Každá karta má sloupec, řádek, šířku, zarovnání a nejmenší výšku
     — dohromady tedy polohu i velikost. Ladí se v barvy.html na stránce
     Rozvržení; platí od šířky okna 960 px, pod ní se karty skládají pod sebe.
     Dvě karty ve stejném sloupci a řádku by se překryly — nástroj to hlídá. */
  --sirka-stranky:none; --sloupec-1:1fr; --sloupec-2:1fr; --mezera-sloupcu:40px;
  --produkt-sloupec:1; --produkt-radek:1; --produkt-sirka:auto;
  --produkt-zarovnani:stretch; --produkt-vyska:auto;
  --vysledek-sloupec:2; --vysledek-radek:1; --vysledek-sirka:auto;
  --vysledek-zarovnani:stretch; --vysledek-vyska:auto;
  --recept-sloupec:1; --recept-radek:2; --recept-sirka:67%;
  --recept-zarovnani:start; --recept-vyska:auto;
  --zakazka-sloupec:1 / -1; --zakazka-radek:2; --zakazka-sirka:32.7%;
  --zakazka-zarovnani:end; --zakazka-vyska:auto;
  --tisk-sloupec:1 / -1; --tisk-radek:2;
  --tisk-sirka:33%;
  --tisk-zarovnani:center; --tisk-vyska:auto;
  --neu:-5px -5px 20px rgba(255,255,255,0.11), 5px 5px 20px rgba(0,0,0,0.43);
  --neu-sm:-4px -4px 14px rgba(255,255,255,0.105), 4px 4px 14px rgba(0,0,0,0.473);
  --neu-in:inset 2px 2px 4px rgba(0,0,0,0.387), inset -2px -2px 4px rgba(255,255,255,0.105);
  --neu-in-lg:inset 3px 3px 6px rgba(0,0,0,0.43), inset -3px -3px 6px rgba(255,255,255,0.11);
  --modal-shadow:0 7px 40px rgba(0,0,0,0.86);
  --logo-shadow:-2px -2px 2px rgba(255,255,255,0.14), 2px 2px 2px rgba(0,0,0,0.1);
  --mono:'Segoe UI',system-ui,sans-serif;
  --sans:system-ui,sans-serif;
}
:root[data-theme="dark"]{
  /* Tmavý režim je hlubší než dřív, ale ne černý — na černé plochu nejde
     osvětlit a stíny by zmizely. Hlavní tlačítko je světlé s tmavým písmem.
     Linky se posouvají spolu s pozadím, aby zůstaly stejně zřetelné. */
  --bg:#545454; --paper:#333333; --zvyraz:#545454; --logo:#545454;
  --ink:#EDEDED; --ink-2:#8C8C8C; --line:#595959; --line-2:#7a7a7a;
  --cyan:#EDEDED; --magenta:#C97B63; --yellow:#D9B44A; --key:#EDEDED;
  --btn-ink:#000000; --focus:rgba(237,237,237,.22); --danger:#b31919;
  --ok:#3dc760; --warn:#e8c545;
  --neu:-9px -9px 24px rgba(255,255,255,0.08), 9px 9px 24px rgba(0,0,0,0.51);
  --neu-sm:-4px -4px 10px rgba(255,255,255,0.076), 4px 4px 10px rgba(0,0,0,0.561);
  --neu-in:inset 3px 3px 4px rgba(0,0,0,0.459), inset -3px -3px 4px rgba(255,255,255,0.076);
  --neu-in-lg:inset 4px 4px 6px rgba(0,0,0,0.51), inset -4px -4px 6px rgba(255,255,255,0.08);
  --modal-shadow:0 13px 48px rgba(0,0,0,1);
  --logo-shadow:-2px -2px 2px rgba(255,255,255,0.14), 2px 2px 2px rgba(0,0,0,0.1);
}
/* ZACATEK BAREV STRANEK */
/* Vlastní barvy jednotlivých stránek. Proměnné se dědí, takže co se nastaví
   na obal stránky, platí uvnitř ní a přebije základ; co se tu neuvede, bere
   stránka z aplikace. Prázdný úsek znamená, že všechny stránky vypadají
   stejně. Zapisuje sem barvy.html — ručně to needitujte, přepsalo by se to. */
:root:not([data-theme="dark"]) .michbg{--paper:#cccccc; --zvyraz:#919191; --ink:#000000; --ink-2:#8b8b8b; --line:#9e9e9e; --line-2:#949494; --key:#000000; --btn-ink:#ffffff; --cyan:#000000; --bg:#ffffff;}
:root[data-theme="dark"] .michbg{--paper:#2e2e2e; --zvyraz:#545454;}
/* KONEC BAREV STRANEK */
:root[data-theme="dark"] .warnbox,:root[data-theme="dark"] #chyba{background:#2C2317;border-color:#463824;color:#E0AE6B}
:root[data-theme="dark"] .okbox{background:#182A20;border-color:#284434;color:#79CFA0}
:root[data-theme="dark"] .imgwarn{background:#2C2317 !important;color:#E0AE6B !important}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);line-height:var(--radek);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
input,select,button,textarea{font-family:inherit;font-size:var(--pismo)}
input,select,textarea{border:none;border-radius:var(--radius-pole);padding:var(--pole-y) var(--pole-x);background:var(--paper);color:var(--ink);width:100%;box-shadow:var(--neu-in);transition:box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;box-shadow:var(--neu-in),0 0 0 3px var(--focus)}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
input[type=number]{font-family:var(--mono);appearance:textfield;-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
select{appearance:none;-webkit-appearance:none;-moz-appearance:none;
  background-image:linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(135deg, var(--ink-2) 50%, transparent 50%);
  background-position: calc(100% - 20px) calc(50% - 3px), calc(100% - 14px) calc(50% - 3px);
  background-size:6px 6px, 6px 6px; background-repeat:no-repeat; padding-right:36px}
/* Rozbalenou nabídku kreslil dosud sám prohlížeč a CSS na ni nedosáhlo —
   proto ta hranatá šedá nabídka s modrým pruhem uprostřed měkkého prostředí.
   Chrome ji dnes umí předat stránce: `appearance:base-select` z ní udělá
   běžný prvek, který poslouchá tytéž proměnné jako všechno ostatní. Starší
   prohlížeč celé pravidlo přeskočí a dostane nabídku jako dřív — aplikace
   proto funguje v obou případech. */
@supports (appearance: base-select){
  select,::picker(select){appearance:base-select}
  /* Zavřené pole musí zůstat na chlup stejné: šipku kreslíme pozadím, takže
     tu, kterou přidává prohlížeč, schováme, a pole srovnáme jako dřív. */
  select::picker-icon{display:none}
  /* Výběr se nově chová jako běžný textový prvek, takže by zdědil výšku řádku
     z těla stránky — a vyrostl by o pixel proti poli vedle sebe. Textová pole
     mají `normal`, výběr musí mít totéž, jinak se rozjede řádkování. */
  select{display:block;text-align:start;line-height:normal}
  select:open{box-shadow:var(--neu-in),0 0 0 3px var(--focus)}
  .bigform select:open{box-shadow:var(--neu-sm),0 0 0 3px var(--focus)}
  ::picker(select){
    appearance:base-select;border:none;
    background:var(--paper);color:var(--ink);
    /* Vlásová linka navíc: nabídka má stejnou barvu jako karta pod ní,
       takže by se bez ní na okraji ztrácela. */
    border-radius:var(--radius-pole);box-shadow:var(--modal-shadow),0 0 0 1px var(--line-2);
    padding:6px;margin-top:8px;
    max-height:min(52vh,440px);overflow-y:auto;overscroll-behavior:contain;
    font-size:var(--pismo)}
  option{
    display:flex;align-items:center;gap:10px;
    padding:9px 12px;border-radius:calc(var(--radius-pole) * .7);
    background:transparent;color:var(--ink);cursor:pointer;
    transition:background .1s}
  option:hover,option:focus{background:var(--zvyraz);outline:none}
  option:checked{background:var(--key);color:var(--btn-ink);font-weight:700}
  option:disabled{opacity:.45;cursor:default}
  /* Odškrtnutí drží místo i u neoznačených položek, jinak by se text
     u vybrané řádky posunul stranou a seznam by poskakoval. */
  option::checkmark{order:2;margin-left:auto;content:"✓";font-weight:700}
  option:not(:checked)::checkmark{visibility:hidden}
}
input[type=color]{padding:4px;height:40px;cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:none;border-radius:7px}
input[type=color]::-moz-color-swatch{border:none;border-radius:7px}
textarea{font-family:var(--mono);font-size:12.5px;min-height:160px;resize:vertical;line-height:1.5}
/* Ikony se kreslí vektorem — velikost, tloušťka tahu a zakončení jdou
   z proměnných, takže se dají ladit stejně jako barvy. CSS má přednost před
   atributy v SVG, proto stačí tohle jediné pravidlo. */
svg[viewBox="0 0 24 24"]{width:var(--ikona);height:var(--ikona);opacity:var(--ikona-pruhlednost)}
svg[viewBox="0 0 24 24"] path,svg[viewBox="0 0 24 24"] circle,svg[viewBox="0 0 24 24"] line{
  stroke-width:var(--ikona-tah);stroke-linecap:var(--ikona-konec);stroke-linejoin:var(--ikona-konec)}
/* Ikona uvnitř řádku textu (zámek u zamčené technologie) sedí v písmu, ne
   vedle něj — velikost bere z textu kolem sebe, aby v menu i v nadpisu držela
   stejný poměr. Kresba i tah zůstávají z pravidla výše. */
svg[viewBox="0 0 24 24"].ikona-radek{width:var(--ikona-radek);height:var(--ikona-radek);
  vertical-align:-.24em;margin-right:.3em}
.hdr{background:transparent;color:var(--ink);padding:9px clamp(16px,3vw,40px);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
.themebtn{grid-column:3;justify-self:end;flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:none;background:var(--paper);box-shadow:var(--neu-sm);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;line-height:1;transition:opacity .15s;color:var(--ink)}
.themebtn:hover{opacity:.8}
.hdr h1{grid-column:2;margin:0;font-size:clamp(calc(var(--logo-velikost) * .73),8.4vw,var(--logo-velikost));font-weight:var(--tloustka-nadpisu);letter-spacing:.04em;text-align:center;color:var(--logo);text-shadow:var(--logo-shadow);cursor:pointer;transition:opacity .15s}
.hdr h1:hover{opacity:.85}
.menuwrap{position:relative}
.navleft{grid-column:1;justify-self:start;display:flex;align-items:center;gap:8px;min-width:0}
.backbtn{height:42px;border:none;border-radius:21px;background:var(--paper);box-shadow:var(--neu-sm);cursor:pointer;color:var(--ink);display:flex;align-items:center;gap:7px;padding:0 16px 0 12px;font-weight:700;font-size:13px;white-space:nowrap;transition:opacity .15s}
.backbtn:hover{opacity:.8}
.backbtn:active{box-shadow:var(--neu-in)}
@media(max-width:720px){.backbtn{padding:0;width:42px;border-radius:50%;justify-content:center}.backbtn span{display:none}}
.navbtn{width:42px;height:42px;border-radius:50%;border:none;background:var(--paper);box-shadow:var(--neu-sm);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink);transition:opacity .15s}
.navbtn:hover{opacity:.8}
.navdrop{position:absolute;top:calc(100% + 10px);left:0;background:var(--paper);border-radius:14px;box-shadow:var(--neu);padding:6px;z-index:45;min-width:180px;display:flex;flex-direction:column;gap:2px}
.navdrop button{background:none;border:none;text-align:left;padding:10px 14px;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--ink);cursor:pointer;transition:background .15s}
.navdrop button:hover{background:var(--zvyraz)}
.navdrop button.on{color:var(--cyan);font-weight:800}
:root[data-theme="dark"] .navdrop button:hover{background:rgba(127,163,217,.16)}
.wrap{max-width:var(--sirka-stranky);margin:0 auto;padding:var(--okraj-stranky) clamp(16px,3vw,40px) 56px}
.grid{display:grid;gap:var(--mezera-karet)}
/* Kalkulace stojí na dvou stejných polovinách: vlevo zadání, vpravo výsledek.
   Obě okna mají tutéž šířku a potkávají se přesně uprostřed stránky. */
@media(min-width:960px){.grid.calc{grid-template-columns:minmax(0,var(--sloupec-1)) minmax(0,var(--sloupec-2));
  column-gap:var(--mezera-sloupcu);align-items:stretch}}
/* Obě okna končí ve stejné výšce: levý sloupec je sloupec pružný, poslední
   karta v něm dorovná zbytek místa, a karta výsledku vyplní svůj sloupec celý.
   Tlačítka se v obou drží u dolního okraje. */
/* Kde která karta stojí, se řídí proměnnými — poloha, šířka i nejmenší výška.
   Výchozí stav: Vybraný produkt a Kolik namíchat vedle sebe v prvním řádku,
   pod nimi receptura a zakázka, a parametry tisku ve třetím řádku na středu.
   Karta parametrů je přitom široká přesně jako jeden sloupec mřížky, což není
   jen kvůli symetrii: díky stejné šířce, stejnému odsazení a stejným třem
   sloupcům vyjdou dlaždice parametrů na chlup stejně velké jako náhledy
   produktu — a to při každé šířce okna, ne jen při jedné. Přestavuje se to
   v barvy.html na stránce Rozvržení, ne tady. */
@media(min-width:960px){
  .grid.calc>.karta-produkt{grid-column:var(--produkt-sloupec);grid-row:var(--produkt-radek);
    width:var(--produkt-sirka);justify-self:var(--produkt-zarovnani);min-height:var(--produkt-vyska)}
  .grid.calc>.bigpanel{grid-column:var(--vysledek-sloupec);grid-row:var(--vysledek-radek);
    width:var(--vysledek-sirka);justify-self:var(--vysledek-zarovnani);min-height:var(--vysledek-vyska)}
  .grid.calc>.karta-recept{grid-column:var(--recept-sloupec);grid-row:var(--recept-radek);
    width:var(--recept-sirka);justify-self:var(--recept-zarovnani);min-height:var(--recept-vyska)}
  .grid.calc>.karta-cisla{grid-column:var(--zakazka-sloupec);grid-row:var(--zakazka-radek);
    width:var(--zakazka-sirka);justify-self:var(--zakazka-zarovnani);min-height:var(--zakazka-vyska)}
  .grid.calc>.karta-tisk{grid-column:var(--tisk-sloupec);grid-row:var(--tisk-radek);
    width:var(--tisk-sirka);justify-self:var(--tisk-zarovnani);min-height:var(--tisk-vyska)}
  .grid.calc>.card{margin-bottom:0}
  .karta-produkt{display:flex;flex-direction:column}
}
.grid.calc>.bigpanel{align-content:stretch}
.bigpanel>.card{height:100%;display:flex;flex-direction:column}
.bigpanel .michtl{margin-top:auto}
/* Zvětšené varianty nemají vlastní čísla — počítají se z téže škály, aby
   změna velikosti písma nebo rozestupů platila i tady. */
.bigpanel .card{padding:calc(var(--mezera-karta-y) * 1.25) calc(var(--mezera-karta-x) * 1.27);margin-bottom:calc(var(--mezera-karet) * 1.25)}
.bigpanel .card h2{font-size:calc(var(--pismo-nadpis) * 1.36)}
.bigpanel .card .hint{font-size:calc(var(--pismo-poznamka) * 1.24)}
.bigpanel .result-big{font-size:clamp(calc(var(--pismo-vysledek) * 1.35),4.6vw,calc(var(--pismo-vysledek) * 2))}
.bigpanel .result-sub{font-size:calc(var(--pismo) * 1.21)}
/* Pruh složení má stejnou výšku všude, kde je zvětšené zadání — jinak by se
   tentýž údaj na dvou místech tvářil jako dvě různé věci. */
.bigpanel .mixbar,.bigform .mixbar{height:30px}
.bigpanel table.t{font-size:calc(var(--pismo-tabulka) * 1.26)}
.bigpanel table.t th{padding:10px}
.bigpanel table.t td{padding:11px 10px}
.bigpanel .note{font-size:calc(var(--pismo-poznamka) * 1.24)}
.bigpanel .btn{font-size:calc(var(--pismo) * 1.14);padding:calc(var(--tlacitko-y) * 1.2) calc(var(--tlacitko-x) * 1.22)}
.bigpanel .swatch{width:34px;height:34px}
.bigpanel .tag{font-size:calc(var(--pismo-popisek) * 1.27);padding:4px 11px}
.bigpanel .wbar{height:17px}
.bigform.card>h2{font-size:calc(var(--pismo-nadpis) * 1.36)}
.bigform.card>.hint{font-size:calc(var(--pismo-poznamka) * 1.24)}
.bigform label.f{font-size:calc(var(--pismo-popisek) * 1.27);margin-bottom:8px}
.bigform select,.bigform input{font-size:calc(var(--pismo) * 1.21);padding:calc(var(--pole-y) * 1.44) calc(var(--pole-x) * 1.25);border-radius:var(--radius-pole);box-shadow:var(--neu-sm)}
.bigform select{padding-right:40px}
/* Síto, kryvost a povrch se čtou od stroje, ne od klávesnice — tiskař stojí
   krok od obrazovky a potřebuje je poznat pohledem, ne přečíst zblízka.
   Proto jsou tahle tři pole výrazně větší než všechna ostatní a vyplní kartu.
   Roste s nimi i popisek, šipka a nabídka, jinak by na velkém poli zůstaly
   drobné a pole by vypadalo jako omylem zvětšené. */
.karta-tisk label.f{font-size:calc(var(--pismo-popisek) * 1.5);margin-bottom:10px;text-align:center}
/* Dlaždice přesně jako náhled produktu: čtverec vyplňující svůj sloupec,
   hodnota uprostřed. Roztažené pole přes celou třetinu řádku se z odstupu
   čte hůř než blok, který má tvar — oko najde dřív dlaždici než dlouhý pruh. */
/* Písmo, odsazení i šipka se měří od šířky dlaždice, ne pevným počtem pixelů.
   Pevná velikost drží čtverec jen na široké obrazovce — jakmile se dlaždice
   zmenší, text se zalomí na tři řádky, dlaždice se protáhne na výšku a přestane
   odpovídat náhledu produktu. Takhle se zmenší celá kresba naráz a tvar drží. */
.karta-tisk .frow.c3>div{container-type:inline-size}
.karta-tisk select{font-size:min(calc(var(--pismo) * 2), 11cqw);font-weight:700;text-align:center;
  width:100%;aspect-ratio:1;
  display:flex;align-items:center;justify-content:center;
  /* Hodnota a šipka stojí pod sebou jako jedna dvojice na středu dlaždice.
     Proto se tady nekreslí šipka pozadím jako u ostatních polí — pozadí je
     přilepené k okraji a text by zůstal nad středem. Místo toho se použije
     šipka, kterou prohlížeč k výběru sám přidává: je to skutečný prvek, takže
     ji lze do dvojice postavit a vycentrovat obojí naráz. */
  flex-direction:column;gap:4cqw;padding:5cqw;background-image:none}
/* Prohlížeč šipku sám odsouvá k pravému okraji (`margin-inline-start:auto`),
   protože počítá s tím, že stojí vedle textu. Ve sloupci ji to vytlačí na kraj
   místo na střed — okraj se proto ruší. Text vedle ní se roztahuje na celou
   šířku, což by dvojici rozhodilo taky. */
.karta-tisk select::picker-icon{display:block;width:9cqw;height:9cqw;margin:0;flex:none;
  color:var(--ink-2);transition:rotate .15s}
.karta-tisk select::select-fallback-button-text{flex:0 1 auto;text-align:center}
.karta-tisk select:open::picker-icon{rotate:180deg}
.karta-tisk select::picker(select){font-size:calc(var(--pismo) * 1.5)}
.karta-tisk option{padding:calc(var(--pole-y) * 1.4) calc(var(--pole-x) * 1.4)}
.bigform select:focus,.bigform input:focus{box-shadow:var(--neu-sm),0 0 0 3px var(--focus)}
.bigform .frow{gap:calc(var(--mezera-poli) * 1.33);margin-bottom:calc(var(--mezera-poli) * 1.33)}
.bigform .note{font-size:calc(var(--pismo-poznamka) * 1.16)}
.bigform .swatch{width:36px;height:36px;border-radius:var(--radius-pole)}
.bigform .tgl{font-size:15.5px;gap:12px}
.bigform .tglt{width:50px;height:27px;border-radius:14px}
.bigform .tglt::after{width:23px;height:23px}
.bigform .tgl input:checked + .tglt::after{transform:translateX(23px)}
.bigform .flags{gap:28px}
.card{background:var(--paper);border-radius:var(--radius);opacity:var(--pruhlednost-karty);padding:var(--mezera-karta-y) var(--mezera-karta-x);margin-bottom:var(--mezera-karet);box-shadow:var(--neu)}
.card h2{margin:0 0 4px;font-size:var(--pismo-nadpis);font-weight:var(--tloustka-nadpisu);text-transform:uppercase;letter-spacing:calc(var(--prostrkani) * .83);color:var(--ink)}
.card .hint{color:var(--ink-2);font-size:var(--pismo-poznamka);margin:0 0 14px}
.frow{display:grid;gap:var(--mezera-poli);margin-bottom:var(--mezera-poli)}
@media(min-width:640px){.frow.c2{grid-template-columns:1fr 1fr}.frow.c3{grid-template-columns:1fr 1fr 1fr}.frow.c4{grid-template-columns:1fr 1fr 1fr 1fr}}
label.f{display:block;font-size:var(--pismo-popisek);line-height:1.25;font-weight:700;letter-spacing:var(--prostrkani);text-transform:uppercase;color:var(--ink-2);margin-bottom:5px}
/* Popisek se v užším okně zalomí na dva řádky a pole pod ním se propadne níž
   než sousední. Popisek v mřížce má proto vždy výšku dvou řádků a text sedí
   u jeho spodní hrany — pole v řádku tak drží linku při každé šířce okna. */
@media(min-width:640px){.frow.c2>div>label.f:first-child,.frow.c3>div>label.f:first-child,.frow.c4>div>label.f:first-child,.zakazka-cisla>div>label.f:first-child{display:flex;align-items:flex-end;min-height:2.5em}
/* Buňka s přepínači popisek nemá, takže by v mřížce začínala výš než pole
   vedle ní — srovnáme ji na spodní hranu řádku, na střed sousedního pole. */
.frow>.flags{align-self:end;margin-top:0;padding-bottom:8px}}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:none;background:var(--paper);border-radius:var(--radius-btn);padding:calc(var(--tlacitko-y) * .7) calc(var(--tlacitko-x) * .78);cursor:pointer;font-weight:600;font-size:calc(var(--pismo) - 1px);display:inline-flex;align-items:center;justify-content:center;text-align:center;transition:box-shadow .15s,background .15s,color .15s;box-shadow:var(--neu-sm)}
.chip.on{background:var(--key);color:var(--btn-ink)}
.btn{border:none;border-radius:var(--radius-btn);padding:var(--tlacitko-y) var(--tlacitko-x);font-weight:700;cursor:pointer;background:var(--key);color:var(--btn-ink);transition:opacity .15s;box-shadow:var(--neu-sm)}
.btn:hover{opacity:.82}
.btn.sec{background:var(--paper);color:var(--ink)}
.btn.sec:hover{opacity:1}
.btn.sm{padding:calc(var(--tlacitko-y) * .6) calc(var(--tlacitko-x) * .67);font-size:var(--pismo-poznamka)}
.btn.danger{background:var(--paper);color:var(--danger)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
table.t{width:100%;border-collapse:collapse;font-size:var(--pismo-tabulka)}
table.t th{text-align:left;font-size:var(--pismo-popisek);letter-spacing:var(--prostrkani);text-transform:uppercase;color:var(--ink-2);border-bottom:1.5px solid var(--ink);padding:8px}
table.t td{border-bottom:1px solid var(--line);padding:9px 8px;vertical-align:top}
/* Číslice musí mít stejnou šířku, jinak se sloupce gramáží rozházejí. Když je
   --mono skutečně strojopis, platí to samo; u běžného písma to musí zapnout
   tohle pravidlo. */
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.swatch{width:26px;height:26px;border-radius:var(--radius-pole);border:1px solid rgba(0,0,0,.12);display:inline-block;vertical-align:middle}
/* text-align kvůli úzkému sloupci: jakmile se štítek zalomí na víc řádků,
   zarovnaný doleva vypadá roztřepeně — uvnitř oblého tvaru patří na střed */
.tag{display:inline-block;text-align:center;font-family:var(--mono);font-size:var(--pismo-popisek);padding:3px 9px;border-radius:var(--radius-stitek);background:var(--paper);box-shadow:var(--neu-in);color:var(--ink-2)}
.tag.tech{background:var(--key);color:var(--btn-ink);box-shadow:var(--neu-sm)}
/* Velká čísla mají výšku řádku `normal`, ne utaženou hodnotu. Utažený řádek
   vytlačí dolní dotah písmene („g" ve „50,0 g") pod vlastní rámeček a text
   přeteče přes údaj pod sebou — a protože se rámečky neprotnou, nepozná se to
   jinak než měřením kresby písma. `normal` je přesně tolik, kolik dané písmo
   potřebuje, takže to platí i po výměně písma v barvy.html. */
.result-big{font-family:var(--mono);font-size:var(--pismo-vysledek);font-weight:600;line-height:normal;color:var(--ink)}
.result-sub{font-family:var(--mono);color:var(--ink-2);font-size:13px}
.mixbar{display:flex;height:20px;border-radius:8px;overflow:hidden;box-shadow:var(--neu-in);margin:10px 0 4px}
.warnbox{background:#F6EEDF;border:1px solid #E3CFA6;color:#8A5A1E;border-radius:10px;padding:10px 12px;font-size:calc(var(--pismo-poznamka) - 1px);margin-top:12px}
.imgwarn{background:#FBF1E4 !important;color:#8A5A1E !important}
.rowactive td{background:var(--zvyraz)}
.okbox{background:#E7F1EA;border:1px solid #C0D9C9;color:#1E6B44;border-radius:10px;padding:10px 12px;font-size:calc(var(--pismo-poznamka) - 1px);margin-top:12px}
.empty{color:var(--ink-2);font-size:13.5px;padding:20px;text-align:center;border-radius:var(--radius);box-shadow:var(--neu-in)}
.rowline{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.note{font-size:calc(var(--pismo-poznamka) - .5px);color:var(--ink-2)}
.search{max-width:340px}
pre.tpl{background:var(--paper);border-radius:10px;padding:12px;font-size:12px;overflow:auto;font-family:var(--mono);box-shadow:var(--neu-in)}
/* Fotka produktu a plocha pro zakázkový list jsou dvě stejné dlaždice vedle
   sebe. Text a volby jdou pod ně na celou šířku — ve třech sloupcích vedle
   sebe se při užším okně název rozsypal na jedno písmeno na řádek. */
/* Horní pruh karty produktu: tři stejné dlaždice přes celou šířku — co se
   tiskne, kam se to tiskne a kam pustit zakázkový list. Text a volby jdou pod
   ně na celou šířku; ve sloupcích vedle textu se název při užším okně rozsypal
   na jedno slovo na řádek. */
/* Čísla zakázky mají vlastní kartu o polovině stránky — ve dvou sloupcích,
   protože pod sebou by byla zbytečně dlouhá a pole by byla přes celou šířku.
   V úzkém okně se srovnají pod sebe. */
/* Obě půlky výběru receptur mají stejný rytmus: popisek, filtr, hledání,
   výběr. Když se v jedné zalomí lišta filtru na dva řádky, musela by se
   druhá posunout taky — proto sdílejí řádky mřížky, ne jen sloupce.
   Co je pod výběrem (poznámka, mazání) už na řádcích nezávisí. */
@supports (grid-template-rows: subgrid){
  @media(min-width:640px){
    .recept-pulky{grid-template-rows:auto auto auto auto}
    .recept-pulky>div{display:grid;grid-template-rows:subgrid;grid-row:span 4;align-content:start}
  }
}

.produkt-dlazdice button.prodphoto{border:none;color:var(--ink-2);font-size:13px;padding:10px}
.pdfdrop{min-width:0;cursor:pointer}

.poscard{border:none;border-radius:var(--radius-dlazdice);background:var(--paper);padding:8px;cursor:pointer;text-align:center;transition:box-shadow .15s;box-shadow:var(--neu)}

.modalbox{width:min(860px,100%)}
.modalbox .card{margin:0;box-shadow:var(--modal-shadow)}
/* Míchací režim — celá obrazovka jen pro to, co tiskař u váhy potřebuje.
   Písmo je záměrně o dost větší: na displej se kouká z metru a se špinavýma
   rukama, ne z pracovní vzdálenosti. */
.michbg{position:fixed;inset:0;z-index:80;background:var(--bg);overflow:auto;display:flex;flex-direction:column}
.michhlav{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;
  gap:calc(var(--mich-mezera) * .73);flex-wrap:wrap;
  padding:calc(var(--mich-mezera) * .64) var(--mich-mezera);box-shadow:0 6px 16px rgba(24,23,15,.10)}
.michhlav .nazev{font-size:var(--mich-nazev);font-weight:800;line-height:normal;color:var(--ink)}

  box-shadow:var(--neu-sm);flex:none}

  padding:calc(var(--mich-mezera) * .82) var(--mich-mezera) calc(var(--mich-mezera) * 1.27);align-items:start}
.michtab{width:100%;border-collapse:collapse;font-size:var(--mich-tabulka)}
.michtab th{font-size:var(--mich-hlavicka);text-transform:uppercase;letter-spacing:.6px;color:var(--ink-2);
  text-align:left;padding:calc(var(--mich-radek) * .55) 10px;border-bottom:2px solid var(--line-2)}

/* Ovládání uvnitř režimu je větší — míchá se ve stoje, často v rukavicích. */
/* Karty tu stojí z plochy stejně jako v kalkulaci — asistent navážení je něco,
   co se obsluhuje, takže má být ohraničený, ne rozpitý do pozadí. Odsazení si
   bere z míchací sady, ne z obecné: uvnitř režimu je všechno o kus větší. */
.michbg .card{padding:var(--mich-mezera);margin-bottom:var(--mich-mezera)}
.michbg .card>h2{font-size:calc(var(--pismo-nadpis) * 1.03)}
.michbg .btn{padding:calc(var(--mich-tlacitko) * .87) calc(var(--mich-tlacitko) * 1.47);font-size:var(--mich-tlacitko)}
.michbg .btn.sm{padding:calc(var(--mich-tlacitko) * .6) calc(var(--mich-tlacitko) * 1);font-size:calc(var(--mich-tlacitko) * .9)}
.michbg .result-big{font-size:var(--mich-vysledek)}
.michbg .wbar{height:var(--mich-wbar)}
.michbg .note,.michbg .result-sub{font-size:calc(var(--pismo-poznamka) * .96)}
/* Pole, hlášení a štítky uvnitř režimu. Doteď to sem nikdo nepotřeboval —
   míchalo se podle tabulky a mačkala tlačítka. S aditivy se u váhy poprvé
   ZADÁVÁ: kolik ředidla se nalilo, se píše do pole v rukavicích, a strop
   ředění je hlášení, podle kterého se tiskař rozhoduje. Poměry v calc() jsou
   ty ze základní škály (pole 9/12 px při písmu 15,5; hlášení 10/12 při 13;
   štítek 3/9 při 12,5), takže se tvar prvku nemění, jen roste.
   Poznámky schválně nerostou — jsou to doprovodné věty, ne čísla k jednání. */
.michbg input,.michbg select{font-size:var(--mich-pole);
  padding:calc(var(--mich-pole) * .58) calc(var(--mich-pole) * .77)}
.michbg .warnbox,.michbg .okbox{font-size:var(--mich-hlaseni);
  padding:calc(var(--mich-hlaseni) * .77) calc(var(--mich-hlaseni) * .92)}
.michbg .tag{font-size:var(--mich-stitek);
  padding:calc(var(--mich-stitek) * .24) calc(var(--mich-stitek) * .72)}
.michbg .pickbox{padding:calc(var(--mich-mezera) * .55)}

(function () {
"use strict";
const { useState, useEffect, useMemo, useRef, useCallback } = React;
const html = htm.bind(React.createElement);

/* ---------- technologie a výchozí spotřeby (g/m², editovatelné) ---------- */
/* sito:false = technologie sítem netiskne (tampontisk jede přes leptané
   klišé), takže se u ní síto nevybírá ani netiskne na lístek. */
const TECHS = {
  SCR: { name: "Sítotisk (plast, papír) / rotační", gm2: 6.0 },
  PDP: { name: "Tampontisk", gm2: 2.5, sito: false },
  TXP: { name: "Sítotisk (textil)", gm2: 14.0 },
  TRS: { name: "Transfer", gm2: 18.0 },
  FIR: { name: "Firing — Low Temperature", gm2: 8.0 },
};
const techMaSito = (t) => !(TECHS[t] && TECHS[t].sito === false);
/* Standardní sítotisková síta (nití/cm – průměr vlákna µm), řada Sefar/Saati
   dle DF06. Slouží jen jako výchozí nabídka, dokud nejsou v parametrech
   vlastní síta — každá technologie totiž používá jinou sadu a jakmile se
   do parametry/sita.csv zapíšou, nabízejí se jen ta její. */
const SITA = [
  "32-100","36-100","43-80","48-70","54-64","61-64","68-55","68-64",
  "77-48","77-55","77-64","90-40","90-48","95-40","100-40","110-40",
  "120-31","120-34","120-40","130-34","140-31","140-34","150-31","150-34",
  "165-31","180-31",
];
const KRYVOSTI = ["Vysoce krycí", "Standard", "Transparentní"];
const POVRCHY = [
  "Aluminium Foil mat","Bílé","Mléčně bílá / přírodní","Stupeň",
  "Stříbro","transparentní","Černé",
];

/* ===================== TECHNOLOGIE JAKO PRACOVNÍ REŽIM =====================
   Dílna nepracuje s celým katalogem najednou — sítotiskař řeší jen produkty,
   které se sítotiskem tisknou, a jen svoje řady barev a síta. Zvolená
   technologie proto zužuje katalog, polohy potisku i databáze receptur.

   Rozdělit katalog natvrdo ale nejde: 577 z 1 320 produktů se tiskne víc
   technologiemi (tričko sítotiskem i transferem). Technologie je tedy filtr,
   ne přihrádka — produkt se objeví v každé technologii, kterou umí. */
const TECH_PORADI = ["SCR", "TXP", "PDP", "TRS", "FIR"];

/* Umí produkt tuhle technologii? */
const produktUmi = (p, tech) => !tech || (p.positions || []).some((x) => x.tech === tech);
/* Polohy potisku zúžené na technologii. */
const polohyTech = (p, tech) => !p ? []
  : (tech ? (p.positions || []).filter((x) => x.tech === tech) : (p.positions || []));

const TECH_MAP = [
  { match: /tampon/i, code: "PDP" },
  { match: /rota.n.\s*s.totisk|rotary\s*screen/i, code: "SCR" },
  { match: /s.totisk.*textil|screen.*textil|textil.*s.totisk/i, code: "TXP" },
  { match: /s.totisk|screen\s*print/i, code: "SCR" },
  { match: /^trf$/i, code: "TRS" },
  { match: /digit.ln.\s*transfer/i, code: "TRS" },
  { match: /transfer/i, code: "TRS" },
  { match: /firing|vypalov/i, code: "FIR" },
];
const mapTech = (s) => {
  if (!s) return null;
  const t = String(s).trim();
  if (TECHS[t.toUpperCase()]) return t.toUpperCase();
  for (const m of TECH_MAP) if (m.match.test(t)) return m.code;
  return null;
};
const REMOTE_BASE = "https://www.stricker-europe.com/fotos/produtos/";
const toLocalImg = (u) => (u && u.startsWith(REMOTE_BASE)) ? "obrazky/" + u.slice(REMOTE_BASE.length) : (u || "");

/* Receptura kromě složení nese i to, jestli je barva dvousložková:

     tuzidlo       ano/ne — vyžaduje tužidlo (bez něj se nevytvrdí)
     pomerTuzidla  podíl tužidla k VÁZE BÁZE (0,1 = 10 %)
     potlifeMin    doba zpracovatelnosti smíchané barvy v minutách
     mezPotlife    podíl lhůty, po kterém se začne varovat (0,8 = po 80 %)
     hustnuti      jak rychle houstne: SLOW | MEDIUM | FAST

   Jednosložkové barvy ta pole mít nemusí — chybějící se dopočítají
   výchozími hodnotami ve funkci potlifeReceptury. */
const SEED_RECIPES = [
  { id: "r1", name: "PANTONE 485 C", type: "Pantone", series: "Printcolor 390 (SCR)", density: 1.25, hex: "#DA291C",
    tuzidlo: false, pomerTuzidla: 0.1, potlifeMin: 480, mezPotlife: 0.8, hustnuti: "MEDIUM",
    components: [
      { id: "c1", name: "Printcolor Warm Red", pct: 62 },
      { id: "c2", name: "Printcolor Yellow 012", pct: 28 },
      { id: "c3", name: "Transparentní báze", pct: 10 }] },
  { id: "r2", name: "PANTONE 286 C", type: "Pantone", series: "Printcolor 752 (PDP)", density: 1.18, hex: "#0032A0",
    tuzidlo: false, pomerTuzidla: 0.1, potlifeMin: 480, mezPotlife: 0.8, hustnuti: "MEDIUM",
    components: [
      { id: "c1", name: "Printcolor Reflex Blue", pct: 71 },
      { id: "c2", name: "Printcolor Process Blue", pct: 17 },
      { id: "c3", name: "Transparentní báze", pct: 12 }] },
];

const uid = () => Math.random().toString(36).slice(2, 9);
const n = (v, d = 0) => { const x = parseFloat(String(v).replace(",", ".")); return isNaN(x) ? d : x; };
const fmt = (v, dec = 1) => v.toLocaleString("cs-CZ", { minimumFractionDigits: dec, maximumFractionDigits: dec });

/* ======================= BARVA POTISKU: PANTONE / CMYK =======================
   Zakázkový list barvu potisku pojmenuje ("Black", "PANTONE 485 C") a nakreslí
   k ní vzorník. Vzorník je ale jen RGB pro obrazovku, takže:
     · je-li pantone napsaný v názvu, platí ten — je přesný,
     · jinak se z RGB dopočítá CMYK a najde nejbližší pantone z databáze.
   Dopočítaná hodnota je orientační, ne kolorimetricky změřená. */
const hexNaRgb = (h) => {
  const m = /^#?([0-9a-f]{6})$/i.exec(String(h || "").trim());
  if (!m) return null;
  const v = parseInt(m[1], 16);
  return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
};
const rgbNaCmyk = (rgb) => {
  const [r, g, b] = rgb.map((v) => Math.max(0, Math.min(1, v / 255)));
  const k = 1 - Math.max(r, g, b);
  if (k > 0.999) return [0, 0, 0, 100];
  return [(1 - r - k) / (1 - k), (1 - g - k) / (1 - k), (1 - b - k) / (1 - k), k]
    .map((v) => Math.round(v * 100));
};
const cmykText = (c) => c.join(" / ");

/* sRGB -> Lab; v Lab odpovídá vzdálenost tomu, jak rozdíl vidí oko,
   kdežto v RGB by "nejbližší" barva vycházela nesmyslně */
function rgbNaLab(rgb) {
  const f = rgb.map((v) => { const s = v / 255; return s <= 0.04045 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4); });
  const [r, g, b] = f;
  const x = (0.4124 * r + 0.3576 * g + 0.1805 * b) / 0.95047;
  const y = (0.2126 * r + 0.7152 * g + 0.0722 * b);
  const z = (0.0193 * r + 0.1192 * g + 0.9505 * b) / 1.08883;
  const t = (v) => v > 0.008856 ? Math.cbrt(v) : (7.787 * v + 16 / 116);
  const [fx, fy, fz] = [t(x), t(y), t(z)];
  return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
}
const deltaE = (a, b) => Math.sqrt((a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2 + (a[2] - b[2]) ** 2);

/* Pantone zapsaný v názvu barvy — "PANTONE 485 C", "PMS 485C", "485 C" */
function pantoneZNazvu(nazev) {
  const s = String(nazev || "").trim();
  if (!s) return "";
  let m = /(?:PANTONE|PMS)\s*([0-9]{1,4}\s*[A-Z]{0,3}|[A-Z][a-z]+(?:\s+[A-Z][a-z]+)*\s*[CU])/i.exec(s);
  if (m) return ("PANTONE " + m[1].replace(/\s+/g, " ")).toUpperCase().trim();
  m = /^([0-9]{3,4})\s*([CU])$/i.exec(s);
  return m ? ("PANTONE " + m[1] + " " + m[2]).toUpperCase() : "";
}

/* Nejbližší pantone z databáze receptur podle barvy vzorníku. */
function nejblizsiPantone(rgb, recipes) {
  const lab = rgbNaLab(rgb);
  let nej = null, nejd = Infinity;
  for (const r of (recipes || [])) {
    if (r.type === "Custom") continue;
    const c = hexNaRgb(r.hex);
    if (!c) continue;
    const d = deltaE(lab, rgbNaLab(c));
    if (d < nejd) { nej = r; nejd = d; }
  }
  return nej ? { recipe: nej, dE: nejd } : null;
}

/* Najde vzorník, u kterého v listu stojí zrovna tahle hodnota
   (název tiskové barvy nebo kód barvy zboží). */
function vzornikProHodnotu(vzorniky, hodnota) {
  const h = String(hodnota || "").trim().toLowerCase();
  if (!h || !vzorniky || !vzorniky.length) return null;
  let volny = null;
  for (const v of vzorniky) {
    const p = String(v.popisek || "").trim().toLowerCase();
    if (p === h) return v;
    if (!volny && p && (p.indexOf(h) === 0 || h.indexOf(p) === 0)) volny = v;
  }
  return volny;
}

/* Souhrn barvy potisku pro zobrazení i pro tisk lístku. */
function popisBarvyPotisku(nazev, hex, recipes) {
  const psany = pantoneZNazvu(nazev);
  const rgb = hexNaRgb(hex);
  // presny = pantone je daný přímo názvem barvy (z listu i z databáze receptur),
  // ne dopočítaný z odstínu vzorníku
  const out = { pantone: psany, presny: !!psany, hex: rgb ? hex : "", cmyk: null, blizky: null };
  if (rgb) {
    out.cmyk = rgbNaCmyk(rgb);
    if (!psany) {
      const b = nejblizsiPantone(rgb, recipes);
      // ΔE se vypisuje, ať je vidět, jak moc je to jen podobné; nad 25 už
      // nemá smysl nabízet nic
      if (b && b.dE < 25) out.blizky = b;
    }
  }
  return out;
}

function loadLS(key, fallback) {
  try { const s = localStorage.getItem(key); if (s) return JSON.parse(s); } catch (e) {}
  return fallback;
}
function saveLS(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); }
  catch (e) { console.error("Uložení selhalo:", e); }
}

function Img({ src, srcs, alt, className, fallback = null, errFallback = null }) {
  const list = (srcs && srcs.length ? srcs : (src ? [src] : [])).filter(Boolean);
  const key = list.join("|");
  const [idx, setIdx] = useState(0);
  useEffect(() => { setIdx(0); }, [key]);
  if (!list.length) return fallback;
  if (idx >= list.length) return errFallback != null ? errFallback : fallback;
  return html`<img className=${className} src=${list[idx]} alt=${alt || ""} loading="lazy" onError=${() => setIdx((i) => i + 1)} />`;
}

/* Zámek u technologie, která ještě není odemčená. Kreslený stejně jako ostatní
   ikony aplikace — čtyřiadvacítková mřížka, jen obrys, barva z textu, tloušťka
   tahu i zakončení z proměnných vzhledu. Stojí uvnitř věty, proto má třídu
   ikona-radek: velikost si bere z písma, ve kterém je vysázený. */

      <path d=${otevreny ? "M7 11V7a5 5 0 0 1 9.9-1" : "M7 11V7a5 5 0 0 1 10 0v4"}

}

const fixTech = (ps) => (ps || []).map((p) => Object.assign({}, p, {

/* ==================== SPECIFIKACE ZAKÁZKY Z ČÁROVÉHO / QR KÓDU ====================
   Kód může nést buď samotné ref. číslo produktu ("11101"), nebo celou zakázku

   Neznámé klíče se ignorují, chybějící hodnoty zůstanou beze změny.          */
const SPEC_ALIAS = {

  qty:      /^(ks|mn|mnozstvi|mno.stv.|qty|pocet|po.et|quantity|amount)$/i,
  pos:      /^(poz|pos|poloha|pozice|position|misto|m.sto)$/i,
  color:    /^(barva|color|col|odstin|odst.n)$/i,

  size:     /^(rozmer|rozm.r|velikost|size)$/i,

  loss:     /^(ztraty|ztr.ty|loss|odpad)$/i,

  order:    /^(obj|objednavka|objedn.vka|zakazka|zak.zka|order|po)$/i,
  customer: /^(zakaznik|z.kazn.k|customer|objednavatel|odberatel|odb.ratel)$/i,
  mesh:     /^(sito|s.to|mesh)$/i,
  opacity:  /^(kryvost|opacity)$/i,

const SPEC_LABEL = {

  recipe: "Receptura", series: "Řada barvy", tech: "Technologie",
