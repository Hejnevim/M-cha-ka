   to je, a nepočítá se nic; míchat by se muselo od začátku. */
function domichaniZeZbytku({ slozeni, gramu, cil, chciCelkem }) {
  const L = n(gramu);
  const sluc = (radky) => {
    const mapa = new Map();
    for (const c of (radky || [])) {
      const jm = String(c.name || "").trim();
      const pct = n(c.pct);
      if (!jm || !(pct > 0)) continue;
      const k = normKomp(jm);
      if (mapa.has(k)) mapa.get(k).pct += pct;
      else mapa.set(k, { name: jm, pct: pct, k: k });
    }
    return Array.from(mapa.values());
  };
  const cilR = sluc(cil), zbR = sluc(slozeni);
  const sumC = cilR.reduce((s, c) => s + c.pct, 0);
  const sumZ = zbR.reduce((s, c) => s + c.pct, 0);
  if (!(L > 0) || !(sumC > 0) || !(sumZ > 0)) return null;

  const podilCil = new Map(cilR.map((c) => [c.k, c.pct / sumC]));
  const podilZb = new Map(zbR.map((c) => [c.k, c.pct / sumZ]));

  const cizi = [];
  let nejhorsi = 0;                       // max(podíl ve zbytku / podíl v cíli)
  for (const c of zbR) {
    const p = podilCil.get(c.k) || 0;
    if (!(p > 0)) { cizi.push(c.name); continue; }
    nejhorsi = Math.max(nejhorsi, (podilZb.get(c.k) || 0) / p);
  }
  if (cizi.length) return { ok: false, cizi: cizi, zbytek: L };
  if (!(nejhorsi > 0)) return null;

  const minDavka = L * nejhorsi;
  const zadano = n(chciCelkem);
  const davka = zadano > minDavka ? zadano : minDavka;
  const radky = cilR.map((c) => {
    const celkem = davka * (c.pct / sumC);
    const zeZbytku = L * (podilZb.get(c.k) || 0);
    return { name: c.name, pct: c.pct / sumC * 100, zeZbytku: zeZbytku,
      pridat: Math.max(0, celkem - zeZbytku), celkem: celkem };
  });
  return {
    ok: true,
    zbytek: L,
    davka: davka,
    minDavka: minDavka,
    // dávka vyšla větší, než se žádalo — kelímek se jinak celý nevejde
    zvetseno: zadano > 0 && minDavka > zadano + 0.005,
    radky: radky,
    pridat: radky.filter((r) => r.pridat > 0.005),
    celkemPridat: radky.reduce((s, r) => s + r.pridat, 0),
    // 1 = zbytek už má přesně složení cíle, není co dorovnávat
    sedi: nejhorsi <= 1.0001,
    // kelímek je v něčem tak sytý, že dávka narostla přes únosnou mez —
    // spočítá se to dál, ale obsluze se to musí říct nahlas
    prilisVelka: zadano > 0 && minDavka > zadano * MEZ_ZVETSENI_DAVKY + 0.005,
  };
}

/* ---- čárový kód Code 128 pro štítek na kelímek ----
   Kreslí se rovnou v aplikaci, aby štítek šel vytisknout i bez internetu.
   Code 128 zvládne každá běžná čtečka i kamera v mobilu; sada B pokrývá
   číslice i velká písmena, ze kterých se kód zbytku skládá. */
const C128 = ["212222", "222122", "222221", "121223", "121322", "131222", "122213", "122312",
  "132212", "221213", "221312", "231212", "112232", "122132", "122231", "113222", "123122",
  "123221", "223211", "221132", "221231", "213212", "223112", "312131", "311222", "321122",
  "321221", "312212", "322112", "322211", "212123", "212321", "232121", "111323", "131123",
  "131321", "112313", "132113", "132311", "211313", "231113", "231311", "112133", "112331",
  "132131", "113123", "113321", "133121", "313121", "211331", "231131", "213113", "213311",
  "213131", "311123", "311321", "331121", "312113", "312311", "332111", "314111", "221411",
  "431111", "111224", "111422", "121124", "121421", "141122", "141221", "112214", "112412",
  "122114", "122411", "142112", "142211", "241211", "221114", "413111", "241112", "134111",
  "111242", "121142", "121241", "114212", "124112", "124211", "411212", "421112", "421211",
  "212141", "214121", "412121", "111143", "111341", "131141", "114113", "114311", "411113",
  "411311", "113141", "114131", "311141", "411131", "211412", "211214", "211232", "2331112"];

/* Vrátí šířky čar a mezer (střídavě, začíná čárou) pro daný text. */
function code128Pruhy(text) {
  const s = String(text || "");
  const hodnoty = [104];                       // START B
  for (let i = 0; i < s.length; i++) {
    const c = s.charCodeAt(i);
    if (c < 32 || c > 126) throw new Error("Kód obsahuje znak, který Code 128 sada B neumí.");
    hodnoty.push(c - 32);
  }
  let kontrola = 104;
  for (let i = 1; i < hodnoty.length; i++) kontrola += hodnoty[i] * i;
  hodnoty.push(kontrola % 103);
  hodnoty.push(106);                           // STOP
  const pruhy = [];
  for (const h of hodnoty) for (const z of C128[h]) pruhy.push(parseInt(z, 10));
  return pruhy;
}

function code128Svg(text, vyska, modul) {
  const pruhy = code128Pruhy(text);
  const m = modul || 2;
  const v = vyska || 60;
  let x = 10, cary = "";
  for (let i = 0; i < pruhy.length; i++) {
    const w = pruhy[i] * m;
    if (i % 2 === 0) cary += '<rect x="' + x + '" y="0" width="' + w + '" height="' + v + '"/>';
    x += w;
  }
  const sirka = x + 10;
  return '<svg xmlns="http://www.w3.org/2000/svg" width="' + sirka + '" height="' + v
    + '" viewBox="0 0 ' + sirka + ' ' + v + '" fill="#000">' + cary + '</svg>';
}
const code128Url = (text, vyska, modul) =>
  "data:image/svg+xml;charset=utf-8," + encodeURIComponent(code128Svg(text, vyska, modul));

/* Evidence se odkládá do souboru evidence/zbytky.csv — kelímek stojí v dílně
   a musí být vidět ze všech počítačů, ne jen z toho, kde ho někdo zapsal. */
const ZBYTKY_HLAVICKA = ["kod", "nazev", "gramu", "puvodne", "hustota", "hex", "zakazka",
  "produkt", "barva", "technologie", "poloha", "ulozeno", "zmeneno", "expirace", "pozn",
  "zdroj", "namichano", "potlife_h", "tuzidlo", "mez_potlife", "pomer_tuzidla", "hustnuti",
  "ks", "cena", "cena_ks", "mena", "uspora", "uspora_likvidace", "cena_uplna",
  "viskozita_s", "viskozita_pohar",
  "viskozita_kdy", "viskozita_historie", "stav", "davka_g", "komponenta", "procento"];

/* Čísla se zaokrouhlují — soubor někdo otevře v Excelu a 71,61999999999999
   tam vypadá jako chyba, i když o setinu procenta v barvě nejde. */
const cislo = (v, des) => (v == null || v === "") ? "" : String(Math.round(n(v) * Math.pow(10, des)) / Math.pow(10, des));

function zbytkyDoCsv(zbytky) {
  const radky = [ZBYTKY_HLAVICKA];
  for (const z of zbytky) {
    const slozky = (z.slozeni && z.slozeni.length) ? z.slozeni : [{ name: "", pct: "" }];
    for (const c of slozky) {
      radky.push([z.kod, z.nazev || "", cislo(z.gramu, 2), z.puvodne == null ? "" : cislo(z.puvodne, 2),
        z.hustota == null ? "" : z.hustota, (z.hex || "").replace(/^#/, ""),
        z.zakazka || "", z.produkt || "", z.barva || "", z.tech || "", z.poloha || "",
        z.ulozeno || "", z.zmeneno || "", z.expirace || "", z.pozn || "", z.zdroj || "",
        z.namichano || "", z.potlifeH == null ? "" : cislo(z.potlifeH, 1),
        z.tuzidlo ? "ano" : "",
        z.mezPotlife == null ? "" : cislo(z.mezPotlife, 2),
        z.pomerTuzidla == null ? "" : cislo(z.pomerTuzidla, 4), z.hustnuti || "",
        z.ks == null ? "" : cislo(z.ks, 0), z.cena == null ? "" : cislo(z.cena, 2),
        z.cenaKs == null ? "" : cislo(z.cenaKs, 4), z.mena || "",
        z.uspora == null ? "" : cislo(z.uspora, 2),
        z.usporaLikvidace == null ? "" : cislo(z.usporaLikvidace, 2),
        z.cenaUplna ? "ano" : "",
        z.viskozita == null || z.viskozita === "" ? "" : cislo(z.viskozita, 1),
        z.viskPohar || "", z.viskKdy || "", viskHistDoTextu(z.viskHist),
        z.stav || "sklad", z.davkaG == null ? "" : cislo(z.davkaG, 2),
        c.name || "", c.pct === "" ? "" : cislo(c.pct, 4)]);
    }
  }
  return radky.map((r) => r.map((c) => '"' + String(c == null ? "" : c).replace(/"/g, '""') + '"')
    .join(";")).join("\r\n") + "\r\n";
}

function csvNaZbytky(text) {
  const rows = parseCsv(text);
  if (!rows.length) return [];
  const head = rows[0].map((h) => h.toLowerCase().trim());
  const i = (jm) => head.indexOf(jm);
  const ci = {};
  for (const jm of ZBYTKY_HLAVICKA) ci[jm] = i(jm);
  if (ci.kod < 0) throw new Error("CSV zbytků musí mít sloupec kod.");
  const mapa = new Map();
  for (const r of rows.slice(1)) {
    const kod = String(r[ci.kod] || "").trim();
    if (!kod) continue;
    if (!mapa.has(kod)) {
      const hex = String(r[ci.hex] || "").trim();
      mapa.set(kod, {
        id: uid(), kod: kod, nazev: r[ci.nazev] || "",
        gramu: n(r[ci.gramu]), puvodne: ci.puvodne >= 0 && r[ci.puvodne] !== "" ? n(r[ci.puvodne]) : null,
        hustota: ci.hustota >= 0 && r[ci.hustota] !== "" ? n(r[ci.hustota], 1.2) : 1.2,
        hex: /^#?[0-9a-f]{6}$/i.test(hex) ? (hex[0] === "#" ? hex : "#" + hex) : "#888888",
        zakazka: r[ci.zakazka] || "", produkt: r[ci.produkt] || "", barva: r[ci.barva] || "",
        tech: r[ci.technologie] || "", poloha: r[ci.poloha] || "",
        ulozeno: n(r[ci.ulozeno]) || 0, zmeneno: n(r[ci.zmeneno]) || n(r[ci.ulozeno]) || 0,
        expirace: r[ci.expirace] || "", pozn: r[ci.pozn] || "", zdroj: r[ci.zdroj] || "",
        namichano: n(r[ci.namichano]) || n(r[ci.ulozeno]) || 0,
        potlifeH: ci.potlife_h >= 0 && r[ci.potlife_h] !== "" ? n(r[ci.potlife_h]) : null,
        tuzidlo: /^(1|ano|yes|true|x)$/i.test(String(r[ci.tuzidlo] || "").trim()),
        // starší soubory tyhle sloupce nemají — pak platí výchozí hodnoty
        mezPotlife: ci.mez_potlife >= 0 && r[ci.mez_potlife] !== ""
          ? naPodil(r[ci.mez_potlife], MEZ_POTLIFE_VYCHOZI) : null,
        pomerTuzidla: ci.pomer_tuzidla >= 0 && r[ci.pomer_tuzidla] !== ""
          ? naPodil(r[ci.pomer_tuzidla], POMER_TUZIDLA_VYCHOZI) : null,
        hustnuti: ci.hustnuti >= 0 && String(r[ci.hustnuti] || "").trim()
          ? kodHustnuti(r[ci.hustnuti]) : "",
        ks: ci.ks >= 0 && r[ci.ks] !== "" ? n(r[ci.ks]) : null,
        cena: ci.cena >= 0 && r[ci.cena] !== "" ? n(r[ci.cena]) : null,
        cenaKs: ci.cena_ks >= 0 && r[ci.cena_ks] !== "" ? n(r[ci.cena_ks]) : null,
        mena: ci.mena >= 0 ? String(r[ci.mena] || "").trim().toUpperCase() : "",
        uspora: ci.uspora >= 0 && r[ci.uspora] !== "" ? n(r[ci.uspora]) : null,
        // starší soubory sloupec nemají — pak se o ušetřené likvidaci mlčí
        usporaLikvidace: ci.uspora_likvidace >= 0 && r[ci.uspora_likvidace] !== ""
          ? n(r[ci.uspora_likvidace]) : null,
        cenaUplna: ci.cena_uplna >= 0 && /^(1|ano|yes|true|x)$/i.test(String(r[ci.cena_uplna] || "").trim()),
        viskozita: ci.viskozita_s >= 0 && r[ci.viskozita_s] !== "" ? n(r[ci.viskozita_s]) : "",
        viskPohar: r[ci.viskozita_pohar] || "", viskKdy: n(r[ci.viskozita_kdy]) || 0,
        viskHist: viskHistZTextu(r[ci.viskozita_historie]),
        // "vtisku" = barva se právě namíchala a je na stroji, kolik zbude
        // se teprve dozvíme; "sklad" = zbytek v kelímku k dalšímu použití
        stav: String(r[ci.stav] || "sklad").trim().toLowerCase() === "vtisku" ? "vtisku" : "sklad",
        davkaG: ci.davka_g >= 0 && r[ci.davka_g] !== "" ? n(r[ci.davka_g]) : null,
        slozeni: [],
      });
    }
    const jmenoK = String(r[ci.komponenta] || "").trim();
    if (jmenoK) mapa.get(kod).slozeni.push({ name: jmenoK, pct: n(r[ci.procento]) });
  }
  return Array.from(mapa.values());
}

/* Sloučení evidence ze souboru s tou v prohlížeči. Rozhoduje čas poslední
   změny — kelímek mohl někdo upravit na jiném počítači. */
function sloucZbytky(mistni, ze_souboru) {
  const mapa = new Map((mistni || []).map((z) => [z.kod, z]));
  for (const z of (ze_souboru || [])) {
    const stary = mapa.get(z.kod);
    if (!stary || n(z.zmeneno) > n(stary.zmeneno)) mapa.set(z.kod, Object.assign({}, z,
      { id: stary ? stary.id : z.id }));
  }
  return Array.from(mapa.values()).sort((a, b) => n(b.zmeneno) - n(a.zmeneno));
}

/* ---- přímá shoda proti kaskádovému dopočtu ----
   Zbytek se dá na zakázku použít dvěma způsoby a pro tiskaře u míchačky je
   mezi nimi propastný rozdíl:

     přímá shoda  — kelímek má TOTOŽNÉ složení jako cíl. Nemíchá se nic,
                    barva se přelije a jede se.
     kaskáda      — kelímek je jiný odstín, do kterého se dováží čisté složky,
                    až z něj cílová barva vznikne. Váží se, počítá, kontroluje.

   Podle čeho se přímá shoda pozná: ne podle jména na štítku a ne podle čísla
   receptury. Číslo si kelímek nenese a nést by ho ani nemohl — id se
   receptuře přiděluje při každém načtení souboru znovu, takže by po restartu
   ukazovalo na jinou barvu. Jméno zas bývá zkomolené nebo dopsané ručně.
   Rozhoduje jediné, co o odstínu doopravdy rozhoduje: složení.

   Počítat se to nemusí zvlášť — umí to už vyuzitelnyZbytek. Jeho shoda je
   nejmenší z poměrů podíl_v_cíli / podíl_ve_zbytku a je nejvýš 1. Vyjde-li 1,
   musí být obě složení totožná: kdyby byl kelímek v jedné složce chudší, je
   nutně v jiné bohatší (obojí je sto procent) a ten poměr by spadl pod 1.
   Přímá shoda je tedy prostě shoda == 1.

   Mez je na zaokrouhlení v CSV, ne na míchání — desetina procenta se stejně
   na váhu nenaváží. */
const ODCHYLKA_SHODY = 0.001;
const jePresnaShoda = (v) => !!v && v.shoda >= 1 - ODCHYLKA_SHODY;

/* Stáří kelímku se počítá od namíchání, ne od zápisu do evidence — kelímek
   se běžně zapisuje až druhý den a barva mezitím stárne dál. */
const stariZbytku = (z) => n(z && z.namichano) || n(z && z.ulozeno) || 0;

/* Nabídky zbytků pro danou dávku — jeden seznam, ve kterém tiskař čte odshora.
   Prošlé se nenabízejí vůbec: v kelímku sice barva je, ale použitelná není.
   Stejně tak ty na stroji, u kterých se teprve uvidí, co zbude.

   Pořadí sype nahoru to, co dá nejmíň práce a nejdřív propadne:

     1. přímé shody, mezi nimi od nejstaršího kelímku (barva ve skladu se nemá
        dožít data spotřeby a mladší kelímek počká)
     2. kaskádové dopočty, mezi nimi od největší úspory

   a napříč oběma skupinami předbíhá to, čemu končí lhůta — buď se to
   spotřebuje teď, nebo se to vyhodí. */
function nabidkyZbytku(zbytky, comps, totalG, ted) {
  return (zbytky || [])
    .map((z) => {
      const v = vyuzitelnyZbytek(z, comps, totalG);
      if (!v) return null;
      const presna = jePresnaShoda(v);
      return Object.assign(v, {
        stav: stavZbytku(z, ted),
        druh: presna ? "presna" : "kaskada",
        // kelímek pokryje celou dávku sám — nemíchá se vůbec nic
        pokryjeVse: presna && v.domichat <= 0.05,
      });
    })
    .filter((v) => v && v.stav.stav !== "prosle" && v.zbytek.stav !== "vtisku")
    .sort((a, b) => (a.druh === "presna" ? 0 : 1) - (b.druh === "presna" ? 0 : 1)
      || (a.stav.stav === "brzy" ? 0 : 1) - (b.stav.stav === "brzy" ? 0 : 1)
      || (a.druh === "presna"
        ? stariZbytku(a.zbytek) - stariZbytku(b.zbytek)
        : b.pouzit - a.pouzit));
}

/* Jen kelímky, na které stačí sáhnout. Vybírá se z hotových nabídek, aby
   platilo jedno pravidlo o prošlých a jedno pořadí — ne dvě podobná vedle
   sebe, která se časem rozejdou. */
function presneShodyZbytku(zbytky, comps, totalG, ted) {
  return nabidkyZbytku(zbytky, comps, totalG, ted).filter((v) => v.druh === "presna");
}

/* ================== SKLÁDÁNÍ DVOU ZBYTKŮ ==================
   Kelímek se do dávky vejde jen potud, dokud žádná jeho složka nepřesáhne
   svůj podíl v cíli. Tou nejsytější složkou se zarazí — a co chybí do dávky,
   se pak váží z čerstvého, přestože vedle na polici stojí druhý kelímek,
   který je právě v té složce chudý. Každý sám nesedí, dohromady sednou.

   Hledají se dvě gramáže x a y (z prvního a z druhého kelímku), pro které
   u každé složky platí

       x × podíl_v_prvním + y × podíl_v_druhém ≤ dávka × podíl_v_cíli

   a jejichž součet je co největší. K tomu ještě x ≤ co je v prvním kelímku,
   y ≤ co je v druhém, a záporně nabrat nejde.

   Jsou to samé nerovnosti o dvou neznámých, takže hledaná dvojice leží
   vždycky v ROHU oblasti, kterou vytnou — a každý roh je průsečík dvou
   z nich. Rohů je pár desítek, projdou se tedy všechny a vybere se nejlepší.
   Není to odhad ani hledání nejlepší z několika možností: víc než tohle
   do dávky nejde dostat.

   Nová data k tomu nejsou potřeba žádná — je to táž matematika jako
   u jednoho kelímku, jen o jednu neznámou dál. */

/* Roh se počítá dělením, takže do porovnání jde vždycky drobná tolerance —
   bez ní by se roh vlastní zaokrouhlovací chybou sám vyhodnotil jako nesedící. */
const TOLERANCE_ROHU = 1e-6;

/* Druhý kelímek se musí dojít vzít, navážit do stejné nádoby a odepsat.
   Pár gramů navíc za tu práci nestojí, a tak se dvojice nabídne, teprve když
   ušetří aspoň desetinu dávky a zároveň aspoň dvacet gramů čerstvé barvy —
   u malých dávek rozhoduje ta druhá mez, u velkých ta první. */
const NEJMENSI_ZISK_DVOJICE = 20;          // g čerstvé barvy
const NEJMENSI_PODIL_ZISKU_DVOJICE = 0.1;  // z dávky

/* Největší x + y splňující všechna omezení tvaru a·x + b·y ≤ c.
   Vyjde-li stejný součet víc způsoby (obě složení sedí přesně, a je tedy
   jedno, ze kterého kelímku se nabere), rozhodne `prednost`: 1 = nabrat
   radši z prvního, 2 = z druhého. */
function nejvetsiDvojice(omezeni, prednost) {
  const sedi = (x, y) => omezeni.every((o) => o.a * x + o.b * y <= o.c + TOLERANCE_ROHU);
  let nej = null;
  const zkus = (x, y) => {
    if (!(x >= -TOLERANCE_ROHU) || !(y >= -TOLERANCE_ROHU) || !sedi(x, y)) return;
    const cx = Math.max(0, x), cy = Math.max(0, y);
    const soucet = cx + cy, prvni = prednost === 2 ? cy : cx;
    if (!nej || soucet > nej.soucet + TOLERANCE_ROHU
      || (soucet > nej.soucet - TOLERANCE_ROHU && prvni > nej.prvni + TOLERANCE_ROHU)) {
      nej = { x: cx, y: cy, soucet: soucet, prvni: prvni };
    }
  };
  for (let i = 0; i < omezeni.length; i++) {
    for (let j = i + 1; j < omezeni.length; j++) {
      const p = omezeni[i], q = omezeni[j];
      const det = p.a * q.b - q.a * p.b;
      if (Math.abs(det) < 1e-12) continue;            // rovnoběžky, roh nedají
      zkus((p.c * q.b - q.c * p.b) / det, (p.a * q.c - q.a * p.c) / det);
    }
  }
  return nej;
}

/* Plán na dva kelímky. Výsledek má schválně stejný tvar jako výsledek
   vyuzitelnyZbytek — míchací lístek, asistent vážení, štítek i cena tak
   počítají dál se svým, jen `kusy` navíc říká, ze kterých kelímků to je. */
function dvojiceZbytku(zA, zB, comps, totalG, ted) {
  if (!zA || !zB || zA.kod === zB.kod) return null;
  const vA = vyuzitelnyZbytek(zA, comps, totalG);
  const vB = vyuzitelnyZbytek(zB, comps, totalG);
  if (!vA || !vB) return null;
  const pA = podilyZbytku(zA), pB = podilyZbytku(zB), cil = podilyCile(comps, totalG);
  if (!pA || !pB || !cil) return null;
  const LA = n(zA.gramu), LB = n(zB.gramu);

  /* Složku, kterou cíl nemá, tu řešit nemusíme: kelímek s ní neprojde už přes
     vyuzitelnyZbytek a sem se nedostane. Zapsané nuly se přeskakují — složka,
     které je v kelímku nula, nic neomezuje a jinak by kvůli ní dvojice padla
     na složce, kterou do dávky stejně nepřinese. */
  const omez = [];
  for (const k of new Set(Array.from(pA.keys()).concat(Array.from(pB.keys())))) {
    const a = pA.get(k) || 0, b = pB.get(k) || 0;
    if (!(a > 0) && !(b > 0)) continue;
    omez.push({ a: a, b: b, c: totalG * (cil.get(k) || 0) });
  }
  omez.push({ a: 1, b: 0, c: LA });     // víc, než v kelímku je, nabrat nejde
  omez.push({ a: 0, b: 1, c: LB });
  omez.push({ a: -1, b: 0, c: 0 });     // a záporně taky ne
  omez.push({ a: 0, b: -1, c: 0 });

  /* Který kelímek jde první: ten, kterému dřív končí lhůta, jinak ten starší.
     Totéž pořadí platí pro nalévání i pro rozhodnutí, ze kterého nabrat víc,
     když je to jinak jedno — barva ve skladu se nemá dožít data spotřeby. */
  const sA = vA.stav || stavZbytku(zA, ted), sB = vB.stav || stavZbytku(zB, ted);
  const naspech = (s) => (s && s.stav === "brzy" ? 0 : 1);
  const prvniJeA = (naspech(sA) !== naspech(sB))
    ? naspech(sA) < naspech(sB)
    : stariZbytku(zA) <= stariZbytku(zB);

  const res = nejvetsiDvojice(omez, prvniJeA ? 1 : 2);
  if (!res || !(res.soucet > 0.05)) return null;

  const kusA = { zbytek: zA, pouzit: res.x, zbude: Math.max(0, LA - res.x),
    samotny: vA.pouzit, shoda: vA.shoda, stav: sA };
  const kusB = { zbytek: zB, pouzit: res.y, zbude: Math.max(0, LB - res.y),
    samotny: vB.pouzit, shoda: vB.shoda, stav: sB };
  const kusy = prvniJeA ? [kusA, kusB] : [kusB, kusA];
  const prispevek = comps.map((c) => {
    const k = normKomp(c.name);
    return res.x * (pA.get(k) || 0) + res.y * (pB.get(k) || 0);
  });

  return {
    dvojice: true,
    kusy: kusy,
    /* Zástupný kelímek, aby zbytek aplikace nemusel vědět, že jsou dva.
       Kód je oba kódy za sebou — přesně to, co si má obsluha vzít z police. */
    zbytek: {
      kod: kusy.map((k) => popisKelimku(k.zbytek)).join(" + "),
      nazev: kusy.map((k) => k.zbytek.nazev || "").filter(Boolean).join(" + "),
      hex: kusy[0].zbytek.hex, gramu: LA + LB,
    },
    pouzit: res.soucet,
    domichat: Math.max(0, totalG - res.soucet),
    zbudeVKelimku: kusA.zbude + kusB.zbude,
    prispevek: prispevek,
    // kaskáda je to, jakmile je kaskádou aspoň jeden z kelímků
    shoda: Math.min(vA.shoda, vB.shoda),
    // o kolik čerstvé barvy je to míň, než kolik by ušetřil lepší z nich sám
    zisk: res.soucet - Math.max(vA.pouzit, vB.pouzit),
    samotny: Math.max(vA.pouzit, vB.pouzit),
  };
}

/* Nabídky dvojic pro danou dávku, od největší úspory.

   Vychází z hotových nabídek jednotlivých kelímků, aby platilo jedno pravidlo
   o prošlých a o těch na stroji — ne dvě podobná vedle sebe. Zisk se počítá
   proti lepšímu z té dvojice: nabídnout se má jen to, co jeden kelímek sám
   nedokáže.

   Že oba kelímky do dvojice doopravdy přispějí, hlídat nemusíme. Je-li dvojice
   x + y možná, je možné i vzít z prvního samotného těch x — zisk proti němu
   tedy nikdy nevyjde větší než y, a stejně tak ani větší než x. Projde-li tedy
   zisk mezí, přinesl každý z kelímků aspoň tolik. */
const NEJVIC_KANDIDATU_DVOJIC = 14;   // 91 dvojic — dost na sklad, málo na počítání

function nabidkyDvojic(nabidky, comps, totalG, ted) {
  const kand = (nabidky || []).slice(0, NEJVIC_KANDIDATU_DVOJIC);
  const mez = Math.max(NEJMENSI_ZISK_DVOJICE, totalG * NEJMENSI_PODIL_ZISKU_DVOJICE);
  const ven = [];
  for (let i = 0; i < kand.length; i++) {
    for (let j = i + 1; j < kand.length; j++) {
      const d = dvojiceZbytku(kand[i].zbytek, kand[j].zbytek, comps, totalG, ted);
      if (d && d.zisk >= mez) ven.push(d);
    }
  }
  return ven.sort((a, b) => b.zisk - a.zisk);
}

/* ================== PŘEDPOVĚĎ ZBYTKU ==================
   Zbytek se nejlíp využije tak, že vůbec nevznikne. Evidence u každého kelímku
   ví, z jaké dávky pochází a kolik ho bylo — z toho vyjde podíl, který u té
   receptury zbývá. Opakuje-li se, není to náhoda: znamená to, že ztráty jsou
   nastavené výš, než jaká je skutečnost.

   Bere se MEDIÁN, ne průměr. Jedna zakázka, kde se rozlila půlka dávky, by
   průměr utáhla tam, kam nepatří, a aplikace by pak radila míchat míň, než je
   zdrávo. Medián takový výkyv přejde.

   Míň než dva záznamy se nepočítají vůbec — jeden kelímek není zkušenost. */
const NEJMIN_VZORKU_ZBYTKU = 2;

function predpovedZbytku(zbytky, nazev, davkaG, poloha) {
  const jm = String(nazev || "").trim().toLowerCase();
  if (!jm || !(davkaG > 0)) return null;
  const podily = (zbytky || [])
    .filter((z) => String(z.nazev || "").trim().toLowerCase() === jm)
    .filter((z) => n(z.davkaG) > 0 && n(z.puvodne) > 0)
    // Zbytek větší než dávka je překlep v evidenci, ne poznatek.
    .filter((z) => n(z.puvodne) <= n(z.davkaG) * 1.001)
    .map((z) => ({ podil: n(z.puvodne) / n(z.davkaG), poloha: z.poloha || "", kod: z.kod }));
  if (!podily.length) return null;

  /* Táž barva se na různé polohy míchá jinak, takže se nejdřív hledá shoda
     i v poloze. Vyjít z ní se ale dá, jen když je vzorků dost — jinak je
     přesnější širší základ než přesnější klíč. */
  const zPolohy = poloha ? podily.filter((p) => p.poloha === poloha) : [];
  const vzorek = zPolohy.length >= NEJMIN_VZORKU_ZBYTKU ? zPolohy : podily;
  if (vzorek.length < NEJMIN_VZORKU_ZBYTKU) return null;

  const set = vzorek.map((p) => p.podil).sort((a, b) => a - b);
  const stred = set.length % 2
    ? set[(set.length - 1) / 2]
    : (set[set.length / 2 - 1] + set[set.length / 2]) / 2;

  return {
    pocet: vzorek.length,
    podlePolohy: vzorek === zPolohy,
    podil: stred,
    zbudeG: davkaG * stred,
    nejmensi: set[0],
    nejvetsi: set[set.length - 1],
  };
}

/* O kolik snížit ztráty, aby zbytek vyšel na nulu.

   Dávka = netto × (1 + ztráty/100). Zbývá-li z ní podíl p, spotřebovalo se
   jen (1 − p), takže by stačily ztráty

       nové = ((1 + ztráty/100) × (1 − p) − 1) × 100

   Vyjde-li záporně, netto samo je nadsazené a ztráty za to nemůžou — pak se
   nedoporučuje nic. Nikdy se to nemění samo: rezerva na nátisky je vědomé
   rozhodnutí dílny, ne chyba k opravě. */
function navrhZtrat(ztraty, podil) {
  const z = n(ztraty), p = n(podil);
  if (!(p > 0) || !(z > 0)) return null;
  const nove = ((1 + z / 100) * (1 - p) - 1) * 100;
  if (!(nove >= 0) || nove >= z - 0.5) return null;
  return Math.round(nove * 10) / 10;
}

/* ================== NÁTISK Z MALÉ DÁVKY ==================
   Oprava stojí 47,8 minuty. Vyjde-li odstín špatně, je ten čas týž, ať se
   vyhodí 60 g nebo 550 — ale materiál ne. Namíchat nejdřív malou dávku,
   vytisknout nátisk a teprve po schválení domíchat zbytek je proto levnější
   u každé receptury, u které si člověk není jistý.

   Nátisk se ale nesmí míchat libovolně malý, a tohle je celé jádro věci.
   Má-li receptura složku, které jsou dvě procenta, je jí ve dvacetigramové
   dávce 0,4 g — tedy míň, než kolik dělá tolerance váhy. Takový nátisk
   neukáže odstín receptury, ale odstín toho, jak přesně se to zrovna povedlo
   navážit. Schválí se něco, co se v plné dávce nezopakuje, a oprava přijde
   stejně — jen o nátisk později.

   Nejmenší rozumný nátisk proto určuje NEJMENŠÍ SLOŽKA, ne velikost dávky
   ani cit. */
/* Čím váha ještě rozliší, ne tolerance přijetí. Tolerance v asistentu (±0,5 g)
   říká, kdy je navážka hotová; tady jde o to, jestli se ta složka dá vůbec
   trefit. Dílenská váha na barvy váží po desetinách gramu. */
const ROZLISENI_VAHY = 0.1;
const PRESNOST_NATISKU = 5;   // nejmenší složka musí vážit aspoň pětinásobek rozlišení
const KROK_NATISKU = 5;       // navrhuje se po pěti gramech, ať se to dá zapamatovat
/* Nátisk musí ušetřit dost na to, aby stálo za to vážit dvakrát. Nad tuhle
   část dávky se nenabízí: kdo má míchat 50 g na zkoušku ze sedmdesátigramové
   dávky, ať rovnou namíchá celou. */
const MEZ_UZITKU_NATISKU = 0.6;

function davkaNaNatisk({ comps, totalG, rozliseni, minBatch, chci }) {
  if (!comps || !comps.length || !(totalG > 0)) return null;
  const tol = Math.max(0.01, n(rozliseni, ROZLISENI_VAHY));
  let nejm = null;
  for (const c of comps) {
    const podil = n(c.g) / totalG;
    if (!(podil > 0)) continue;
    if (!nejm || podil < nejm.podil) nejm = { name: c.name, podil: podil, vPlne: n(c.g) };
  }
  if (!nejm) return null;

  /* Nejmenší dávka, ve které nejmenší složka ještě vyjde na násobek tolerance.
     Zaokrouhluje se nahoru na pětigramy — číslo, které si jde pamatovat. */
  const zPresnosti = tol * PRESNOST_NATISKU / nejm.podil;
  const zDilny = Math.max(0, n(minBatch));
  const doporucena = Math.ceil(Math.max(zPresnosti, zDilny) / KROK_NATISKU) * KROK_NATISKU;

  // Ušetří-li nátisk málo, není co dělit.
  if (doporucena >= totalG * MEZ_UZITKU_NATISKU) {
    return { nemaSmysl: true, nejmensi: nejm, doporucena: doporucena, davka: totalG,
      duvod: zPresnosti > zDilny
        ? "nejmenší složka " + nejm.name + " je jen " + fmt(nejm.podil * 100, 1) + " % dávky"
        : "nejmenší dávka dílny je " + fmt(zDilny, 0) + " g" };
  }

  const davka = Math.max(KROK_NATISKU, n(chci) > 0 ? n(chci) : doporucena);
  const naNejmensi = davka * nejm.podil;
  return {
    nemaSmysl: false,
    nejmensi: nejm,
    doporucena: doporucena,
    davka: davka,
    naNejmensi: naNejmensi,
    // jakou část nejmenší složky ukrojí nepřesnost váhy — čím víc, tím míň nátisk platí
    chyba: naNejmensi > 0 ? tol / naNejmensi : 1,
    rozliseni: tol,
    spolehlivy: davka >= doporucena - 0.001,
    zbyvaPoSchvaleni: Math.max(0, totalG - davka),
    podilDavky: davka / totalG,
  };
}

/* ================== RIZIKO OPRAVY PŘED MÍCHÁNÍM ==================
   Oprava stojí 47,8 minuty a dvě třetiny z toho stojí výroba, která čeká.
   Aplikace přitom ví předem skoro všechno, z čeho opravy vznikají: že barva
   na tom podkladu prosvítá, že viskozita nesedí k sítu, že receptura nikdy
   nebyla otestovaná, že se míchá z kelímku jiného odstínu.

   Každý ten signál se dosud hlásil zvlášť a na jiném místě obrazovky, takže
   je nikdo nesečetl a leckterý se přehlédl. Tohle nepočítá nic nového — jen
   sebere hotové závěry ostatních funkcí a řekne je jednou, na jednom místě,
   dřív než se sáhne po váze.

   Pořadí je podle síly, ne podle toho, v jakém se to počítalo: kdo si přečte
   jen první řádek, má přečtené to nejhorší. */
const RIZIKO_ZADNE = "zadne", RIZIKO_POZOR = "pozor", RIZIKO_VYSOKE = "vysoke";

function rizikoOpravy({ recipe, podklad, zeSita, slozeni, pctSum, pocetSlozek,
                        vyuziti, redeni, viskozita }) {
  const body = [];
  const pridej = (sila, co, coStim) => body.push({ sila: sila, co: co, coStim: coStim });

  if (!(pocetSlozek > 0)) {
    pridej(RIZIKO_VYSOKE, "Složení receptury není v aplikaci zadané.",
      "Míchá se podle firemního předpisu — aplikace neporadí s navážkou ani s korekcí.");
  } else if (pctSum != null && Math.abs(pctSum - 100) > 0.01) {
    pridej(RIZIKO_POZOR, "Součet složení je " + fmt(pctSum) + " %, ne 100 %.",
      "Poměry se normalizovaly; zkontrolujte, jestli složka nechybí.");
  }

  if (podklad) {
    if (podklad.stav === "podtisk") {
      pridej(RIZIKO_VYSOKE, podklad.hlaska, "Podtisk bílou, nebo sáhnout po krycí barvě.");
    } else if (podklad.stav === "riziko") {
      pridej(RIZIKO_POZOR, podklad.hlaska, "Zkouška před sérií stojí míň než oprava.");
    }
    if (podklad.tahneDo) {
      pridej(RIZIKO_POZOR, "Průsvitná barva na sytém podkladu se posune do "
        + podklad.tahneDo + ".", "Nátisk dělejte na tomtéž materiálu, ne na bílé.");
    }
  }

  if (zeSita && zeSita.mimoRozsah && zeSita.dopVisk) {
    const d = zeSita.dopVisk;
    pridej(RIZIKO_VYSOKE, "Viskozita " + fmt(n(viskozita), 1) + " s je mimo rozsah síta "
      + zeSita.sito.sito + (d.od > 0 && d.do > 0 ? " (" + fmt(d.od, 1) + "—" + fmt(d.do, 1) + " s)" : "") + ".",
      n(viskozita) > n(d.do) ? "Naředit před tiskem." : "Nechat zhoustnout, nebo přidat míň ředidla.");
  } else if (recipe && recipe.mesh && !zeSita) {
    pridej(RIZIKO_POZOR, "K sítu " + recipe.mesh + " nejsou v parametrech uložené hodnoty.",
      "Spotřeba se počítá paušálem podle technologie.");
  }

  if (recipe && !recipe.tested) {
    pridej(RIZIKO_POZOR, "Receptura není označená jako otestovaná.",
      "Namíchejte nejdřív malou dávku na nátisk.");
  }

  /* #888888 je náhradní odstín, který dostane receptura bez hexu při načtení
     ze souboru — není to šedá barva, je to „nevíme". */
  const bezOdstinu = !!recipe && (!/^#?[0-9a-f]{6}$/i.test(String(recipe.hex || ""))
    || String(recipe.hex).toLowerCase() === "#888888");
  if (bezOdstinu) {
    pridej(RIZIKO_POZOR, "U receptury není uložený odstín.",
      "Bez něj neporadí prosvítání ani korekce po nátisku.");
  }

  if (slozeni && slozeni.nezname && slozeni.nezname.length) {
    pridej(RIZIKO_POZOR, slozeni.nezname.length === 1
      ? "Složku " + slozeni.nezname[0].name + " aplikace nezná."
      : slozeni.nezname.length + " složek aplikace nezná.",
      "Doplňte je do parametry/pigmenty.csv, jinak neporadí s korekcí.");
  }

  if (vyuziti && vyuziti.shoda < 0.999) {
    pridej(RIZIKO_POZOR, "Míchá se z " + (vyuziti.dvojice ? "kelímků jiných odstínů"
      : "kelímku jiného odstínu") + " — složení sedí na "
      + fmt(vyuziti.shoda * 100, 0) + " %.",
      vyuziti.dvojice
        ? "Dopočet je přesný, ale oba kelímky mohly mezitím zhoustnout — a každý jinak."
        : "Dopočet je přesný, ale starý kelímek mohl mezitím zhoustnout.");
  }

  if (redeni && redeni.prilisRidke) {
    pridej(RIZIKO_VYSOKE, "Aditiv je " + fmt(redeni.aditiva) + " g, strop receptury je "
      + fmt(redeni.strop) + " g.", "Nad stropem barva neteče, ale stéká.");
  }

  const vysokych = body.filter((b) => b.sila === RIZIKO_VYSOKE).length;
  body.sort((a, b) => (a.sila === RIZIKO_VYSOKE ? 0 : 1) - (b.sila === RIZIKO_VYSOKE ? 0 : 1));
  return {
    stupen: vysokych ? RIZIKO_VYSOKE : (body.length ? RIZIKO_POZOR : RIZIKO_ZADNE),
    vysokych: vysokych, pozoru: body.length - vysokych, body: body,
  };
}

/* ==================== AKTIVNÍ NAMÍCHANÉ DÁVKY ====================
   Dvousložková barva začne tuhnout ve chvíli, kdy se do báze přidá tužidlo.
   Doteď si tenhle čas držela jen kalkulace — jedno číslo v paměti obrazovky.
   Stačilo přepnout recepturu nebo obnovit stránku a odpočet byl pryč, i když
   kelímek na stole tuhnul dál; a míchá-li se na dvě zakázky najednou, hlídat
   se stejně dala jen jedna směs.

   Dávka je proto samostatný záznam s vlastním životem: založí se, když se
   začne míchat, čas tužidla si pamatuje na minutu přesně a nese si i to,
   kolik báze a kolik tužidla v ní doopravdy je. Končí buď spotřebováním,
   nebo košem — obojí zapsané, protože vyhozená dávka je ztráta, kterou dílna
   potřebuje vidět.

   Průběžný stav se NEUKLÁDÁ, počítá se z hodin: uložené „zpracovatelná" by
   po ránu tvrdilo, že včerejší směs pořád běží. Uloženo je jen to, co čas
   nedopočítá — rozhodnutí člověka, že se dávka spotřebovala nebo vyhodila. */
const SOUBOR_DAVKY = "davky.csv";

/* Stavy dávky. Čtyři průběžné plynou z času, dva koncové z rozhodnutí
   obsluhy — a jen ty druhé se zapisují do souboru. */
const DAVKA_STAVY = {
  michani:      { popis: "míchá se",      uzavrena: false },
  bezi:         { popis: "zpracovatelná", uzavrena: false },
  konci:        { popis: "končí lhůta",   uzavrena: false },
  prosla:       { popis: "po lhůtě",      uzavrena: false },
  spotrebovana: { popis: "spotřebovaná",  uzavrena: true },
  vyhozena:     { popis: "vyhozená",      uzavrena: true },
};
const DAVKA_UZAVRENI = ["spotrebovana", "vyhozena"];

/* Kód dávky je datum a pořadí toho dne. U míchačky se čte nahlas a opisuje
   rukou, takže sedm náhodných znaků jako u kelímku je zbytečně moc — a v
   souboru seřazeném podle kódu jdou dávky rovnou po dnech.

   Kelímek si svůj vlastní kód (a čárový kód na štítku) drží dál; dávka na
   něj jen ukazuje. Jsou to dvě různé věci: dávka je směs, která tuhne,
   kelímek je nádoba, která pak stojí ve skladu. */
function novyKodDavky(davky, ted) {
  const d = new Date(ted || Date.now());
  const den = String(d.getFullYear())
    + String(d.getMonth() + 1).padStart(2, "0")
    + String(d.getDate()).padStart(2, "0");
  const predpona = "DAVKA-" + den + "-";
  let max = 0;
  for (const x of (davky || [])) {
    const s = String((x && x.kod) || "");
    if (s.indexOf(predpona) !== 0) continue;
    const p = parseInt(s.slice(predpona.length), 10);
    if (p > max) max = p;
  }
  return predpona + String(max + 1).padStart(3, "0");
}
const jeKodDavky = (s) => /^DAVKA-\d{8}-\d{3}$/.test(String(s || "").trim().toUpperCase());

/* Založení dávky. V životě jedné směsi se volá jednou, ale ve dvou různých
   chvílích: buď při započetí míchání, kdy tužidlo ještě přidané není
   (tuzidloKdy = 0, lhůta neběží), nebo rovnou při jeho potvrzení na váze.
   Kdo míchá ze zvyku, klikne až potom — a dávka nesmí kvůli tomu chybět. */
function novaDavka({ davky, cfg, recepturaId, nazev, zakazka, produkt, tech,
                     bazeG, tuzidloKdy, kodKelimku, ted }) {
  const nyni = ted || Date.now();
  const baze = Math.max(0, n(bazeG));
  const tuz = davkaTuzidla(cfg, baze);
  const od = n(tuzidloKdy) > 0 ? n(tuzidloKdy) : 0;
  const lhuta = (cfg && cfg.tuzidlo) ? n(cfg.minut) * MINUTA : 0;
  return {
    id: uid(), kod: novyKodDavky(davky, nyni),
    recepturaId: recepturaId || "", nazev: nazev || "",
    zakazka: zakazka || "", produkt: produkt || "", tech: tech || "",
    kodKelimku: kodKelimku || "",        // doplní se, až se vytiskne štítek
    zalozeno: nyni,
    tuzidloKdy: od,                      // 0 = tužidlo ještě není v bázi
    vyprsi: (od > 0 && lhuta > 0) ? od + lhuta : 0,
    bazeG: baze, tuzidloG: tuz.tuzidlo,
    tuzidlo: !!(cfg && cfg.tuzidlo),
    minut: n(cfg && cfg.minut) || POTLIFE_MIN_VYCHOZI,
    mez: cfg && cfg.mez != null ? n(cfg.mez) : MEZ_POTLIFE_VYCHOZI,
    pomerTuzidla: tuz.pomer, hustnuti: kodHustnuti(cfg && cfg.hustnuti),
    uzavrena: "", uzavrenaKdy: 0, pozn: "", zmeneno: nyni,
  };
}

/* Potvrzení tužidla na váze — od téhle chvíle běží lhůta a teprve teď se dá
   spočítat, kdy vyprší. Zapisuje se čas potvrzení, ne čas založení dávky:
   mezi navážením báze a tužidlem bývá klidně čtvrt hodiny a o tu by se
   lhůta zkrátila.

   Váha ví, kolik báze je v nádobě doopravdy — po korekci odstínu nebo po
   domíchání ze zbytku to není číslo z kalkulace. Bere se proto skutečná
   navážka, protože z ní se počítá i tužidlo. */
function davkaSTuzidlem(d, kdy, bazeG) {
  if (!d) return d;
  const od = n(kdy) > 0 ? n(kdy) : Date.now();
  const lhuta = n(d.minut) * MINUTA;
  const baze = n(bazeG) > 0 ? n(bazeG) : n(d.bazeG);
  return Object.assign({}, d, {
    tuzidlo: true, tuzidloKdy: od,
    vyprsi: lhuta > 0 ? od + lhuta : 0,
    bazeG: baze, tuzidloG: baze * n(d.pomerTuzidla),
    zmeneno: Date.now(),
  });
}

/* Uzavření dávky. Spotřebovaná = doběhla do tisku, vyhozená = ztuhla nebo se
   nepovedla. Rozdíl je v tom, jestli se za barvu platilo nadarmo — proto se
   to rozlišuje, i když pro odpočet je konec jako konec. */
function davkaUzavrena(d, jak, ted) {
  const stav = DAVKA_UZAVRENI.indexOf(jak) >= 0 ? jak : "spotrebovana";
  const nyni = ted || Date.now();
  return Object.assign({}, d, { uzavrena: stav, uzavrenaKdy: nyni, zmeneno: nyni });
}

/* Stav dávky teď. Uzavřená si nese svůj konec, ostatní se počítají z hodin —
   a to tímtéž výpočtem, jakým se kreslí pruh pot life, aby pruh u váhy a
   seznam dávek nikdy neukazovaly každý něco jiného. */
function stavDavky(d, ted) {
  if (!d) return null;
  const nyni = ted || Date.now();
  const lhuta = n(d.minut) * MINUTA;
  if (d.uzavrena) {
    const s = DAVKA_STAVY[d.uzavrena] ? d.uzavrena : "spotrebovana";
    return { stav: s, popis: DAVKA_STAVY[s].popis, uzavrena: true, plati: false,
      podil: 1, zbyva: null, doKdy: n(d.vyprsi) || null, lhuta: lhuta };
  }
  const st = stavPotlife(d.tuzidloKdy,
    { tuzidlo: !!d.tuzidlo, minut: n(d.minut), mez: n(d.mez, MEZ_POTLIFE_VYCHOZI) }, nyni);
  if (!st.plati)
    return { stav: "michani", popis: DAVKA_STAVY.michani.popis, uzavrena: false,
      plati: false, podil: 0, zbyva: null, doKdy: null, lhuta: lhuta };
  const stav = st.stav === "prosle" ? "prosla" : (st.stav === "kriticky" ? "konci" : "bezi");
  return { stav: stav, popis: DAVKA_STAVY[stav].popis, uzavrena: false, plati: true,
    podil: st.podil, zbyva: st.zbyva, doKdy: st.doKdy, lhuta: st.lhuta };
}

/* Dávky, které se ještě hlídají, od nejbližší lhůty. Prošlá se nezavírá sama:
   někdo ji musí vzít do ruky a rozhodnout, jestli se ještě stihla vytisknout,
   nebo šla do koše — aplikace to od stolu nepozná. */
function davkyKHlidani(davky, ted) {
  return (davky || [])
    .map((d) => ({ davka: d, stav: stavDavky(d, ted) }))
    .filter((x) => x.stav && !x.stav.uzavrena)
    .sort((a, b) => (a.stav.zbyva == null ? Infinity : a.stav.zbyva)
      - (b.stav.zbyva == null ? Infinity : b.stav.zbyva));
}

const DAVKY_HLAVICKA = ["kod", "nazev", "receptura", "zakazka", "produkt", "technologie",
  "kelimek", "zalozeno", "tuzidlo_kdy", "vyprsi", "baze_g", "tuzidlo_g", "tuzidlo",
  "potlife_min", "mez_potlife", "pomer_tuzidla", "hustnuti", "uzavrena", "uzavrena_kdy",
  "pozn", "zmeneno"];

function davkyDoCsv(davky) {
  const radky = [DAVKY_HLAVICKA];
  for (const d of (davky || [])) {
    radky.push([d.kod, d.nazev || "", d.recepturaId || "", d.zakazka || "", d.produkt || "",
      d.tech || "", d.kodKelimku || "", d.zalozeno || "", d.tuzidloKdy || "", d.vyprsi || "",
      cislo(d.bazeG, 2), cislo(d.tuzidloG, 2), d.tuzidlo ? "ano" : "",
      cislo(d.minut, 0), cislo(d.mez, 2), cislo(d.pomerTuzidla, 4), d.hustnuti || "",
      d.uzavrena || "", d.uzavrenaKdy || "", d.pozn || "", d.zmeneno || ""]);
  }
  return radky.map((r) => r.map((c) => '"' + String(c == null ? "" : c).replace(/"/g, '""') + '"')
    .join(";")).join("\r\n") + "\r\n";
}

function csvNaDavky(text) {
  const rows = parseCsv(text);
  if (!rows.length) return [];
  const head = rows[0].map((h) => h.toLowerCase().trim());
  const ci = {};
  for (const jm of DAVKY_HLAVICKA) ci[jm] = head.indexOf(jm);
  if (ci.kod < 0) throw new Error("CSV dávek musí mít sloupec kod.");
  const out = [];
  for (const r of rows.slice(1)) {
    const kod = String(r[ci.kod] || "").trim();
    if (!kod) continue;
    const uz = String(r[ci.uzavrena] || "").trim().toLowerCase();
    out.push({
      id: uid(), kod: kod, nazev: r[ci.nazev] || "", recepturaId: r[ci.receptura] || "",
      zakazka: r[ci.zakazka] || "", produkt: r[ci.produkt] || "",
      tech: r[ci.technologie] || "", kodKelimku: r[ci.kelimek] || "",
      zalozeno: n(r[ci.zalozeno]) || 0, tuzidloKdy: n(r[ci.tuzidlo_kdy]) || 0,
      vyprsi: n(r[ci.vyprsi]) || 0,
      bazeG: n(r[ci.baze_g]), tuzidloG: n(r[ci.tuzidlo_g]),
      tuzidlo: /^(1|ano|yes|true|x)$/i.test(String(r[ci.tuzidlo] || "").trim()),
      minut: n(r[ci.potlife_min]) > 0 ? n(r[ci.potlife_min]) : POTLIFE_MIN_VYCHOZI,
      mez: naPodil(r[ci.mez_potlife], MEZ_POTLIFE_VYCHOZI),
      pomerTuzidla: naPodil(r[ci.pomer_tuzidla], POMER_TUZIDLA_VYCHOZI),
      hustnuti: kodHustnuti(r[ci.hustnuti]),
      uzavrena: DAVKA_UZAVRENI.indexOf(uz) >= 0 ? uz : "",
      uzavrenaKdy: n(r[ci.uzavrena_kdy]) || 0, pozn: r[ci.pozn] || "",
      zmeneno: n(r[ci.zmeneno]) || n(r[ci.zalozeno]) || 0,
    });
  }
  return out;
}

/* Sloučení dávek ze souboru s těmi v prohlížeči — jako u kelímků rozhoduje čas
   poslední změny. Míchá se na víc počítačích a dávku mohl uzavřít někdo jiný. */
function sloucDavky(mistni, ze_souboru) {
  const mapa = new Map((mistni || []).map((d) => [d.kod, d]));
  for (const d of (ze_souboru || [])) {
    const stary = mapa.get(d.kod);
    if (!stary || n(d.zmeneno) > n(stary.zmeneno))
      mapa.set(d.kod, Object.assign({}, d, { id: stary ? stary.id : d.id }));
  }
  return Array.from(mapa.values()).sort((a, b) => n(b.zalozeno) - n(a.zalozeno));
}

/* ================== POŘADÍ MÍCHÁNÍ VE FRONTĚ ==================
   Zbytek jedné zakázky sedne na druhou — ale jen tehdy, když se ta druhá míchá
   POTOM. Kelímek, který by za dvě zakázky posloužil jako základ, dnes vzniká
   až po nich, protože o pořadí rozhoduje to, co komu leží na stole. Aplikace
   přitom ví, co se dnes má míchat, ví, kolik po které dávce zbude, a umí
   spočítat, co ze kterého kelímku jde použít — dosud to jen nikdy nepostavila
   do řady.

   Fronta je seznam toho, co se dnes namíchá. Plán je tentýž seznam v pořadí,
   ve kterém se z něj ušetří nejvíc čerstvé barvy. Nová matematika k tomu není
   žádná:

     · co ze kterého kelímku jde použít   → vyuzitelnyZbytek
     · které kelímky se na dávku hodí     → nabidkyZbytku (a v jakém pořadí)
     · kolik po dávce zbude               → predpovedZbytku

   Nové je jediné pravidlo, a je to celý rozdíl mezi frontou a hromadou:
   kelímek ze skladu je k mání od začátku, zbytek po položce až po ní.

   Čemu se plán vyhýbá:

     · Nehádá zbytek tam, kde ho evidence neumí předpovědět. Bez dvou minulých
       dávek téže barvy položka do plánu jako zdroj nevstupuje — počítat
       s ničím je lepší než počítat s vymyšleným kelímkem.
     · Nepřerovnává nic sám. Co je ve frontě naspěch, ví mistr, ne aplikace;
       plán je tlačítko.
     · Nepočítá s dvojicemi kelímků. Na jednu položku jde v plánu jeden
       kelímek; dvojici nabídne míchací režim, jakmile se k položce dojde. */
const SOUBOR_FRONTA = "fronta.csv";

/* Stavy položky. Žádný z nich se nedopočítává z hodin: fronta je rozhodnutí
   dílny, co se dnes namíchá, a to čas nezmění — uzavírá ji vždycky člověk. */
const FRONTA_STAVY = {
  ceka:      { popis: "čeká",      uzavrena: false },
  namichano: { popis: "namícháno", uzavrena: true },
  zruseno:   { popis: "zrušeno",   uzavrena: true },
};
const stavFronty = (p) => FRONTA_STAVY[(p && p.stav) || "ceka"] || FRONTA_STAVY.ceka;
const polozkaCeka = (p) => !!p && !stavFronty(p).uzavrena;

/* Kód položky je datum a pořadí toho dne — stejně jako u dávky, a ze stejného
   důvodu: u míchačky se čte nahlas („ber trojku") a v souboru seřazeném podle
   kódu jdou dny po sobě. */
function novyKodFronty(fronta, ted) {
  const d = new Date(ted || Date.now());
  const den = String(d.getFullYear())
    + String(d.getMonth() + 1).padStart(2, "0")
    + String(d.getDate()).padStart(2, "0");
  const predpona = "FRONTA-" + den + "-";
  let max = 0;
  for (const x of (fronta || [])) {
    const s = String((x && x.kod) || "");
    if (s.indexOf(predpona) !== 0) continue;
    const p = parseInt(s.slice(predpona.length), 10);
    if (p > max) max = p;
  }
  return predpona + String(max + 1).padStart(3, "0");
}
const jeKodFronty = (s) => /^FRONTA-\d{8}-\d{3}$/.test(String(s || "").trim().toUpperCase());

/* Fronta v tom pořadí, ve kterém ji dílna zadala. `poradi` drží ruční přesuny;
   při shodě rozhoduje čas přidání, aby seznam nikdy nepřeskakoval sám. */
const frontaKMichani = (fronta) => (fronta || []).filter(polozkaCeka)
  .slice().sort((a, b) => n(a.poradi) - n(b.poradi) || n(a.pridano) - n(b.pridano));

/* Nová položka fronty.

   Bere se dávka, kterou žádá zakázka — ne zvětšená kvůli celému kelímku ani
   zmenšená na nátisk. Fronta je plán, co se má namíchat; co se nakonec nalije,
   se rozhodne u váhy.

   Složení si položka nese v procentech opsané z receptury, ne odkazem na ni.
   Id se receptuře přiděluje při každém načtení databáze znovu, takže by po
   obnovení stránky ukazovalo na jinou barvu a plán by tiše počítal s cizím
   složením. Vydrží název — a v dílně je to stejně to, čemu kelímku říkají. */
function novaPolozkaFronty({ fronta, recipe, davkaG, ks, zakazka, produkt, barva,
                             tech, poloha, pozn, ted }) {
  const nyni = ted || Date.now();
  const slozky = (recipe && recipe.components) || [];
  const pct = slozky.reduce((s, c) => s + n(c.pct), 0);
  const cfg = potlifeReceptury(recipe);
  let poradi = 0;
  for (const x of (fronta || [])) poradi = Math.max(poradi, n(x && x.poradi));
  return {
    id: uid(), kod: novyKodFronty(fronta, nyni),
    nazev: (recipe && recipe.name) || "", recepturaId: (recipe && recipe.id) || "",
    zakazka: zakazka || "", produkt: produkt || "", barva: barva || "",
    tech: tech || "", poloha: poloha || "",
    davkaG: Math.max(0, n(davkaG)), ks: n(ks) > 0 ? n(ks) : null,
    hustota: n(recipe && recipe.density, 1.2), hex: (recipe && recipe.hex) || "#888888",
    tuzidlo: !!cfg.tuzidlo, potlifeH: potlifeHodin(cfg),
    poradi: poradi + 1, stav: "ceka", pridano: nyni, zmeneno: nyni, pozn: pozn || "",
    slozeni: slozky.map((c) => ({ name: c.name,
      pct: pct > 0 ? n(c.pct) / pct * 100 : n(c.pct) })),
  };
}

/* Položka přepočtená na gramy složek — do týchž souřadnic, ve kterých počítá
   zbytky celá aplikace (comps s polem `g`). */
function compsFronty(p) {
  const radky = (p && p.slozeni) || [];
  const soucet = radky.reduce((s, c) => s + n(c.pct), 0);
  const davka = n(p && p.davkaG);
  if (!(soucet > 0) || !(davka > 0)) return [];
  return radky.map((c) => ({ name: c.name, pct: n(c.pct),
    norm: n(c.pct) / soucet * 100, g: davka * n(c.pct) / soucet }));
}

/* Předpovězený zbytek pod gram je šum evidence, ne kelímek — v plánu se
   s ním nepočítá. */
const NEJMENSI_PREDPOKLADANY_ZBYTEK = 1;      // g

/* Podklad pod plán: co se na pořadí nemění, se spočítá jednou. Cena gramu ani
   předpověď zbytku na pořadí nezávisí, takže zkoušení pořadí pak jen skládá
   hotová čísla — jinak by se tisíckrát počítalo totéž. */
function frontaPodklad({ polozky, zbytky, materialy, ted }) {
  const nyni = ted || Date.now();
  return (polozky || []).map((p) => {
    const comps = compsFronty(p);
    const cena = comps.length ? cenaDavky({ comps: comps, totalG: n(p.davkaG),
      materialy: materialy, hustota: n(p.hustota, 1.2) }) : null;
    const pred = comps.length
      ? predpovedZbytku(zbytky, p.nazev, n(p.davkaG), p.poloha || "") : null;
    return {
      polozka: p, comps: comps, davkaG: n(p.davkaG),
      gramCena: (cena && cena.znama) ? cena.gramCena : 0,
      /* Cena gramu se počítá i z poloprázdného ceníku — je to průměr té části,
         která cenu má (cenaDavky). Na ukázání úspory to stačí, na SROVNÁNÍ
         položek mezi sebou ne: položka se známou cenou dvou složek ze tří by
         proti úplně nacenené vypadala levněji, než jaká je. Podle korun se
         proto řadí, teprve když je cena úplná u všech. */
      cenaUplna: !!(cena && cena.uplna),
      mena: cena ? cena.mena : MENA_VYCHOZI,
      /* Sazba za svoz je jedna pro celou dílnu, ale přepočet na gram může viset
         na hustotě položky — počítá se proto tady, u ní. */
      likvidaceGram: sazbaLikvidace(materialy, n(p.hustota, 1.2), cena ? cena.mena : ""),
      predpoved: pred,
      /* Kelímek, který po položce zůstane. Složení má po ní — zbytek je tatáž
         barva. Stáří se počítá od teď, takže mezi přímými shodami dá pořadí
         přednost skutečnému kelímku ze skladu; ten stárne, tenhle teprve
         vznikne. */
      budouci: (pred && pred.zbudeG > NEJMENSI_PREDPOKLADANY_ZBYTEK) ? {
        kod: p.kod, nazev: p.nazev, hex: p.hex || "#888888",
        gramu: pred.zbudeG, stav: "sklad", predpoved: true,
        namichano: nyni, ulozeno: nyni, expirace: "",
        tuzidlo: !!p.tuzidlo,
        potlifeH: p.tuzidlo ? (n(p.potlifeH) || POTLIFE_VYCHOZI) : null,
        slozeni: (p.slozeni || []).map((c) => ({ name: c.name, pct: n(c.pct) })),
      } : null,
    };
  });
}

/* Které kelímky na kterou položku vůbec sednou. Sedne, nebo nesedne, se pozná
   ze složení; kolik v kelímku zbylo, rozhoduje jen o tom, kolik se z něj
   nabere. Proto se to spočítá jednou dopředu a každé zkoušené pořadí se pak
   ptá jen těch pár kelímků, které mají smysl. */
function kandidatiFronty(podklad, kelimky) {
  return (podklad || []).map((p) => !p.comps.length ? [] : (kelimky || [])
    .filter((z) => !!vyuzitelnyZbytek(z, p.comps, p.davkaG))
    .map((z) => z.kod));
}

/* Průběh míchání v zadaném pořadí.

   Z kelímku se ubere jen to, co se doopravdy použije — co v něm zůstane, může
   posloužit další položce. Který kelímek dostane přednost, rozhoduje
   `nabidkyZbytku`, tedy totéž pravidlo, podle kterého se kelímky nabízejí
   u míchačky: dvě podobná pravidla vedle sebe by se časem rozešla a plán by
   radil něco jiného, než co pak aplikace nabídne u váhy. */
function planFronty({ podklad, kelimky, kandidati, poradi, ted }) {
  const nyni = ted || Date.now();
  const police = new Map();
  for (const z of (kelimky || [])) if (!z.predpoved) police.set(z.kod, Object.assign({}, z));
  const kroky = [];
  let gramu = 0, uspora = 0, usporaLikvidace = 0, zeSkladu = 0, zFronty = 0, bezCeny = 0;
  for (const i of (poradi || [])) {
    const p = podklad[i];
    if (!p) continue;
    const krok = { index: i, polozka: p.polozka, davkaG: p.davkaG, zdroj: null,
      pouzit: 0, domichat: p.davkaG, uspora: null, druh: "", shoda: 0, zPredpovedi: false };
    const dostupne = (kandidati[i] || []).map((k) => police.get(k))
      .filter((z) => z && n(z.gramu) > 0);
    const nab = dostupne.length ? nabidkyZbytku(dostupne, p.comps, p.davkaG, nyni) : [];
    const nej = nab.length ? nab[0] : null;
    if (nej) {
      const kelimek = police.get(nej.zbytek.kod);
      krok.zdroj = nej.zbytek; krok.pouzit = nej.pouzit; krok.druh = nej.druh;
      krok.shoda = nej.shoda; krok.domichat = nej.domichat;
      krok.zPredpovedi = !!(kelimek && kelimek.predpoved);
      gramu += nej.pouzit;
      if (krok.zPredpovedi) zFronty += nej.pouzit; else zeSkladu += nej.pouzit;
      if (p.gramCena > 0) {
        krok.uspora = usporaZeZbytku(nej.pouzit, p.gramCena);
        uspora += krok.uspora;
      } else bezCeny++;
      /* Ušetřená likvidace se sčítá zvlášť a do výběru pořadí nevstupuje:
         sazba je pro všechny položky táž, takže by přerovnávala frontu podle
         gramů zrovna tam, kde se pořadí vybírá podle korun. */
      usporaLikvidace += cenaLikvidace(nej.pouzit, p.likvidaceGram);
      if (kelimek) kelimek.gramu = Math.max(0, n(kelimek.gramu) - nej.pouzit);
    }
    // teprve teď je zbytek po položce na světě — a právě proto na pořadí záleží
    if (p.budouci) police.set(p.budouci.kod, Object.assign({}, p.budouci));
    kroky.push(krok);
  }
  return { poradi: (poradi || []).slice(), kroky: kroky, gramu: gramu, uspora: uspora,
    usporaLikvidace: usporaLikvidace, zeSkladu: zeSkladu, zFronty: zFronty, bezCeny: bezCeny };
}

/* Kolik pořadí se zkusí.

   Sedm položek je 5 040 pořadí a ta se projdou všechna — u téhle velikosti se
   tedy nehledá nejlepší nalezené, ale nejlepší, jaké existuje. Nad tím počet
   pořadí roste tak, že by se u obrazovky čekalo: deset položek je 3,6 milionu.
   Tam se fronta skládá postupně (vždycky ta položka, která zrovna ušetří
   nejvíc) a hotové pořadí se pak zkouší zlepšovat přesouváním jednotlivých
   položek. Že je to nejlepší možné, se v tom případě netvrdí — plán to o sobě
   řekne sám.

   Přehazovat frontu kvůli pár gramům nemá cenu: pod tuhle mez je rozdíl šum
   předpovědi, ne poznatek. */
const FRONTA_PRESNE_DO = 7;
const FRONTA_PRUCHODU = 6;
const NEJMENSI_ZISK_PORADI = 5;      // g čerstvé barvy

function nejlepsiPoradiFronty({ polozky, zbytky, materialy, ted }) {
  const nyni = ted || Date.now();
  const podklad = frontaPodklad({ polozky: polozky, zbytky: zbytky,
    materialy: materialy, ted: nyni });
  const kelimky = (zbytky || [])
    .filter((z) => z.stav !== "vtisku" && n(z.gramu) > 0)
    .map((z) => Object.assign({}, z))
    .concat(podklad.map((p) => p.budouci).filter(Boolean));
  const kandidati = kandidatiFronty(podklad, kelimky);
  /* Podle čeho se pořadí vybírá: podle korun, zná-li ceník cenu všech složek
     u všech položek fronty, jinak podle gramů čerstvé barvy. Míchat v jiném
     pořadí kvůli mezeře v ceníku by bylo horší než počítat to, co je známé
     vždycky. */
  const cenyUplne = podklad.every((p) => !p.comps.length || p.cenaUplna);
  const hodnota = (pl) => cenyUplne ? pl.uspora : pl.gramu;
  const vyhodnot = (poradi) => planFronty({ podklad: podklad, kelimky: kelimky,
    kandidati: kandidati, poradi: poradi, ted: nyni });

  const zadane = podklad.map((p, i) => i);
  const dnes = vyhodnot(zadane);
  const vsechna = podklad.length <= FRONTA_PRESNE_DO;
  let nej = dnes, zkouseno = 1;
  // zlepšení se bere, jen když je doopravdy zlepšení — při shodě zůstane
  // pořadí, které zadala dílna
  const lepsi = (pl) => hodnota(pl) > hodnota(nej) + 0.005;

  if (vsechna) {
    const prochazej = (zbylo, hotovo) => {
      if (!zbylo.length) {
        const pl = vyhodnot(hotovo);
        zkouseno++;
        if (lepsi(pl)) nej = pl;
        return;
      }
      for (let i = 0; i < zbylo.length; i++)
        prochazej(zbylo.slice(0, i).concat(zbylo.slice(i + 1)), hotovo.concat([zbylo[i]]));
    };
    prochazej(zadane, []);
  } else {
    let rada = [], zbylo = zadane.slice();
    while (zbylo.length) {
      let kdo = 0, nejH = -Infinity;
      for (let i = 0; i < zbylo.length; i++) {
        const pl = vyhodnot(rada.concat([zbylo[i]]));
        zkouseno++;
        if (hodnota(pl) > nejH + 0.005) { nejH = hodnota(pl); kdo = i; }
      }
      rada = rada.concat([zbylo[kdo]]);
      zbylo = zbylo.slice(0, kdo).concat(zbylo.slice(kdo + 1));
    }
    let stav = vyhodnot(rada);
    zkouseno++;
    for (let pruchod = 0; pruchod < FRONTA_PRUCHODU; pruchod++) {
      let zmena = false;
      for (let z = 0; z < rada.length; z++) {
        for (let kam = 0; kam < rada.length; kam++) {
          if (kam === z) continue;
          const bez = rada.slice(0, z).concat(rada.slice(z + 1));
          const zkus = bez.slice(0, kam).concat([rada[z]], bez.slice(kam));
          const pl = vyhodnot(zkus);
          zkouseno++;
          if (hodnota(pl) > hodnota(stav) + 0.005) { stav = pl; rada = zkus; zmena = true; }
        }
      }
      if (!zmena) break;
    }
    if (lepsi(stav)) nej = stav;
  }

  const zisk = { gramu: nej.gramu - dnes.gramu, uspora: nej.uspora - dnes.uspora };
  return {
    podklad: podklad, dnes: dnes, plan: nej, zkouseno: zkouseno, vsechna: vsechna,
    cenyUplne: cenyUplne, mena: podklad.length ? podklad[0].mena : MENA_VYCHOZI,
    zisk: zisk,
    prerovnat: nej !== dnes && zisk.gramu >= NEJMENSI_ZISK_PORADI,
    // položky, se kterými plán nepočítá jako se zdrojem, a proč
    bezPredpovedi: podklad.filter((p) => p.comps.length && !p.predpoved).map((p) => p.polozka),
    bezCeny: podklad.filter((p) => p.comps.length && !p.cenaUplna).map((p) => p.polozka),
    bezSlozeni: podklad.filter((p) => !p.comps.length).map((p) => p.polozka),
  };
}

const FRONTA_HLAVICKA = ["kod", "nazev", "receptura", "zakazka", "produkt", "barva",
  "technologie", "poloha", "davka_g", "ks", "hustota", "hex", "tuzidlo", "potlife_h",
  "poradi", "stav", "pridano", "zmeneno", "pozn", "komponenta", "procento"];

function frontaDoCsv(fronta) {
  const radky = [FRONTA_HLAVICKA];
  for (const p of (fronta || [])) {
    const slozky = (p.slozeni && p.slozeni.length) ? p.slozeni : [{ name: "", pct: "" }];
    for (const c of slozky) {
      radky.push([p.kod, p.nazev || "", p.recepturaId || "", p.zakazka || "",
        p.produkt || "", p.barva || "", p.tech || "", p.poloha || "",
        cislo(p.davkaG, 2), p.ks == null ? "" : cislo(p.ks, 0),
        p.hustota == null ? "" : cislo(p.hustota, 3), (p.hex || "").replace(/^#/, ""),
        p.tuzidlo ? "ano" : "", p.potlifeH == null ? "" : cislo(p.potlifeH, 1),
        cislo(p.poradi, 0), p.stav || "ceka", p.pridano || "", p.zmeneno || "",
        p.pozn || "", c.name || "", c.pct === "" ? "" : cislo(c.pct, 4)]);
    }
  }
  return radky.map((r) => r.map((c) => '"' + String(c == null ? "" : c).replace(/"/g, '""') + '"')
    .join(";")).join("\r\n") + "\r\n";
}

function csvNaFrontu(text) {
  const rows = parseCsv(text);
  if (!rows.length) return [];
  const head = rows[0].map((h) => h.toLowerCase().trim());
  const ci = {};
  for (const jm of FRONTA_HLAVICKA) ci[jm] = head.indexOf(jm);
  if (ci.kod < 0) throw new Error("CSV fronty musí mít sloupec kod.");
  const mapa = new Map();
  for (const r of rows.slice(1)) {
    const kod = String(r[ci.kod] || "").trim();
    if (!kod) continue;
    if (!mapa.has(kod)) {
      const hex = String(r[ci.hex] || "").trim();
      const stav = String(r[ci.stav] || "ceka").trim().toLowerCase();
      mapa.set(kod, {
        id: uid(), kod: kod, nazev: r[ci.nazev] || "", recepturaId: r[ci.receptura] || "",
        zakazka: r[ci.zakazka] || "", produkt: r[ci.produkt] || "", barva: r[ci.barva] || "",
        tech: r[ci.technologie] || "", poloha: r[ci.poloha] || "",
        davkaG: n(r[ci.davka_g]),
        ks: ci.ks >= 0 && r[ci.ks] !== "" ? n(r[ci.ks]) : null,
        // starší soubor tyhle sloupce nemusí mít — pak platí výchozí hodnoty
        hustota: ci.hustota >= 0 && r[ci.hustota] !== "" ? n(r[ci.hustota], 1.2) : 1.2,
        hex: /^#?[0-9a-f]{6}$/i.test(hex) ? (hex[0] === "#" ? hex : "#" + hex) : "#888888",
        tuzidlo: /^(1|ano|yes|true|x)$/i.test(String(r[ci.tuzidlo] || "").trim()),
        potlifeH: ci.potlife_h >= 0 && r[ci.potlife_h] !== "" ? n(r[ci.potlife_h]) : null,
        poradi: n(r[ci.poradi]),
        stav: FRONTA_STAVY[stav] ? stav : "ceka",
        pridano: n(r[ci.pridano]) || 0,
        zmeneno: n(r[ci.zmeneno]) || n(r[ci.pridano]) || 0,
        pozn: r[ci.pozn] || "", slozeni: [],
      });
    }
    const jmenoK = String(r[ci.komponenta] || "").trim();
    if (jmenoK) mapa.get(kod).slozeni.push({ name: jmenoK, pct: n(r[ci.procento]) });
  }
  return Array.from(mapa.values());
}

/* Sloučení fronty ze souboru s tou v prohlížeči. U dvou míchaček musí obě
   vidět, co je hotové — „namícháno" zapsané u jedné nesmí druhá vrátit
   zpátky do fronty, a proto rozhoduje čas poslední změny. */
function sloucFrontu(mistni, ze_souboru) {
  const mapa = new Map((mistni || []).map((p) => [p.kod, p]));
  for (const p of (ze_souboru || [])) {
    const stary = mapa.get(p.kod);
    if (!stary || n(p.zmeneno) > n(stary.zmeneno))
      mapa.set(p.kod, Object.assign({}, p, { id: stary ? stary.id : p.id }));
  }
  return Array.from(mapa.values())
    .sort((a, b) => n(a.poradi) - n(b.poradi) || n(a.pridano) - n(b.pridano));
}

/* ======================= CO PROPADNE =======================
   Dosud se prošlost poznala až u míchačky: kelímek po lhůtě aplikace
   nenabídla a tím to skončilo — barva se vyhodila, aniž by o tom dílna
   předem věděla. Přehled se proto dívá dopředu: co propadne dnes, co zítra,
   co do konce týdne, kolik je to gramů a korun, a na kterou položku fronty
   to ještě sedne.

   Nová data k tomu nejsou žádná. Lhůtu kelímku počítá stavZbytku, lhůtu
   rozpracované dávky stavDavky, kolik se kam vejde vyuzitelnyZbytek —
   všechno se jen srovná podle času a přiloží se k tomu, co ve frontě čeká.

   Dvě věci přehled rozlišuje a bez nich by radil špatně:

     · Rozpracovaná dávka a kelímek ve stavu „v tisku" jsou tatáž nádoba na
       stroji. Ta se nepřesměrovává, ta se má stihnout dotisknout. Existuje-li
       k nádobě dávka, platí dávka: nese lhůtu na minuty a dá se uzavřít.
     · Kelímek ve skladu přesměrovat jde, a proto se u něj hledá, na kterou
       položku fronty sedne.

   Čemu se přehled vyhýbá:

     · Nehádá, kdy se která položka fronty bude míchat. Fronta má pořadí,
       hodiny ne — řekne se tedy, že to sedne, ne že se to stihne.
     · Nesčítá koruny, které nezná. Chybí-li v ceníku cena složky, spočítá se
       hodnota známé části a řekne se, že skutečná ztráta je vyšší. */
const PROPAD_DNI = 7;                 // jak daleko dopředu se přehled dívá
const PROPAD_NEJMENSI_ZBYTEK = 1;     // g — pod gram je to šum evidence, ne kelímek

/* Do kterého dne položka patří: 0 = dnes, 1 = zítra, záporně už po lhůtě.
   Počítá se přes kalendářní dny, ne přes 24hodinové úseky — kelímek, kterému
   lhůta končí dnes ve 23:00, propadá dnes, ne „za jedenáct hodin". */
function denPropadu(doKdy, ted) {
  const rano = new Date(ted || Date.now()).setHours(0, 0, 0, 0);
  const den = new Date(n(doKdy)).setHours(0, 0, 0, 0);
  return Math.round((den - rano) / (24 * HODINA));
}

/* Jak se dni říká v přehledu. Od pozítří dál se den v týdnu čte lépe než
   odpočet: mistr plánuje podle dnů, ne podle toho, kolik zbývá hodin.
   Všechno prošlé je jeden den — kdyby se dělilo po dnech, vznikne pět
   nadpisů se stejným jménem. */
const PROPAD_DNY_NAZVY = ["dnes", "zítra", "pozítří"];
function nazevDnePropadu(den, doKdy) {
  if (den < 0) return "už po lhůtě";
  if (den < PROPAD_DNY_NAZVY.length) return PROPAD_DNY_NAZVY[den];
  return new Date(n(doKdy)).toLocaleDateString("cs-CZ",
    { weekday: "long", day: "numeric", month: "numeric" });
}

/* Co je v kelímku za peníze — vyhozená barva je zaplacená barva.

   Dávka označená při míchání si svou cenu nese zapsanou: spočítala se
   s tužidlem i aditivy v okamžiku, kdy se vážila, a přepočtem ze složení by
   se ta část zahodila. Platí to jen dokud se z kelímku neubralo; po odpisu
   patří zapsaná cena k jinému množství a počítá se znovu ze složení.

   Nezná-li ceník cenu všech složek, vrátí se hodnota známé části a `uplna`
   je nepravda. Dopočítat chybějící cenu odhadem by znamenalo tvrdit ztrátu,
   kterou nikdo nezměřil. */
function hodnotaKelimku(z, materialy) {
  const gramu = n(z && z.gramu);
  const mena = (z && z.mena) || menaDilny(materialy);
  if (n(z && z.cena) > 0 && gramu > 0 && Math.abs(gramu - n(z.davkaG)) < 0.05)
    return { celkem: n(z.cena), uplna: !!z.cenaUplna, znama: true, mena: mena };
  const radky = (z && z.slozeni) || [];
  const soucet = radky.reduce((s, c) => s + n(c.pct), 0);
  if (!(soucet > 0) || !(gramu > 0))
    return { celkem: 0, uplna: false, znama: false, mena: mena };
  const cena = cenaDavky({
    comps: radky.map((c) => ({ name: c.name, g: gramu * n(c.pct) / soucet })),
    totalG: gramu, materialy: materialy, hustota: n(z.hustota, 1.2) });
  return { celkem: cena.celkem, uplna: cena.uplna, znama: cena.znama, mena: cena.mena };
}

/* Fronta přepočtená na to, co přehled potřebuje: složky v gramech a cena
   gramu. Spočítá se jednou pro celou frontu — u každého kelímku znovu by to
   bylo tolikrát totéž číslo. `poradi` je číslo položky, jak ji dílna vidí ve
   frontě; podle něj se u míchačky říká „ber trojku". */
function podkladFrontyPropadu(cekaji, materialy) {
  return (cekaji || []).map((p, i) => {
    const comps = compsFronty(p);
    const cena = comps.length ? cenaDavky({ comps: comps, totalG: n(p.davkaG),
      materialy: materialy, hustota: n(p.hustota, 1.2) }) : null;
    return { polozka: p, poradi: i + 1, comps: comps, davkaG: n(p.davkaG),
      gramCena: (cena && cena.znama) ? cena.gramCena : 0,
      mena: cena ? cena.mena : MENA_VYCHOZI };
  }).filter((x) => x.comps.length > 0 && x.davkaG > 0);
}

/* Na které položky fronty nádoba ještě sedne. Ptá se týmž výpočtem, jakým se
   kelímky nabízejí u míchačky (vyuzitelnyZbytek) — dvě podobná pravidla vedle
   sebe by se časem rozešla a přehled by radil něco jiného, než co pak
   aplikace u váhy nabídne.

   Nahoře je přímá shoda, mezi shodami ta položka, do které se vejde nejvíc:
   z kelímku ubere nejvíc a nejspíš ho spotřebuje celý. */
function kamPropadSedne(nadoba, podklad) {
  if (!nadoba || !(n(nadoba.gramu) > 0) || !((nadoba.slozeni || []).length)) return [];
  const out = [];
  for (const x of (podklad || [])) {
    const v = vyuzitelnyZbytek(nadoba, x.comps, x.davkaG);
    if (!v) continue;
    out.push({ polozka: x.polozka, poradi: x.poradi, pouzit: v.pouzit,
      domichat: v.domichat, shoda: v.shoda, presna: jePresnaShoda(v),
      cely: v.zbudeVKelimku <= 0.05,
      uspora: usporaZeZbytku(v.pouzit, x.gramCena), mena: x.mena });
  }
  return out.sort((a, b) => (a.presna ? 0 : 1) - (b.presna ? 0 : 1) || b.pouzit - a.pouzit);
}

/* Přehled propadů: rozpracované dávky a kelímky ze skladu v jednom seznamu od
   nejbližší lhůty. Prošlé jdou do přehledu taky — ztráta, kterou se ještě dá
   vzít do ruky a hlavně spočítat, je poznatek, ne uzavřená položka. Dozadu se
   ale dívá jen tak daleko jako dopředu; starší kelímky po lhůtě jsou v
   evidenci zbytků a v týdenním přehledu by přebily to, co je teď na spadnutí. */
function prehledPropadu({ zbytky, davky, fronta, materialy, ted, dni }) {
  const nyni = ted || Date.now();
  const horizont = n(dni) > 0 ? n(dni) : PROPAD_DNI;
  const podklad = podkladFrontyPropadu(frontaKMichani(fronta), materialy);
  const podleKodu = new Map((zbytky || []).map((z) => [z.kod, z]));
  const radky = [];

  /* Nádoby na stroji. Kelímek, ke kterému dávka existuje, se přeskočí —
     jinak by tatáž barva byla v přehledu dvakrát, jednou po hodinách a jednou
     po minutách. Kelímek si dávka zabere i tehdy, když lhůta ještě neběží:
     dokud tužidlo není v bázi, směs netuhne a propadat nemá co. */
  const obsazene = new Set();
  for (const x of davkyKHlidani(davky, nyni)) {
    const kelimek = x.davka.kodKelimku ? podleKodu.get(x.davka.kodKelimku) : null;
    if (kelimek) obsazene.add(kelimek.kod);
    if (!x.stav.doKdy) continue;
    const gramu = n(x.davka.bazeG) + n(x.davka.tuzidloG);
    if (!(gramu > PROPAD_NEJMENSI_ZBYTEK)) continue;
    radky.push({
      druh: "davka", kod: x.davka.kodKelimku || x.davka.kod, kodDavky: x.davka.kod,
      nazev: x.davka.nazev || (kelimek ? kelimek.nazev : ""),
      hex: (kelimek && kelimek.hex) || "#888888", gramu: gramu,
      zakazka: x.davka.zakazka || (kelimek ? kelimek.zakazka : ""),
      doKdy: x.stav.doKdy, zbyva: x.stav.zbyva, stavPopis: x.stav.popis,
      duvod: "pot life " + fmt(n(x.davka.minut) / 60, 1) + " h od tužidla",
      slozeni: (kelimek && kelimek.slozeni) || [],
      hodnota: kelimek ? hodnotaKelimku(kelimek, materialy) : null,
      likvidaceGram: sazbaLikvidace(materialy, n(kelimek && kelimek.hustota, 1.2)),
      naStroji: true, kam: [], navrh: null,
    });
  }

  /* Kelímky. Dobrané a ty pod gram do přehledu nepatří, kelímek bez data
     spotřeby a bez pot life nemá čemu propadnout. */
  for (const z of (zbytky || [])) {
    if (obsazene.has(z.kod)) continue;
    if (!(n(z.gramu) > PROPAD_NEJMENSI_ZBYTEK)) continue;
    const st = stavZbytku(z, nyni);
    if (!st.doKdy) continue;
    const naStroji = z.stav === "vtisku";
    radky.push({
      druh: "kelimek", kod: z.kod, kodDavky: "", nazev: z.nazev || "",
      hex: z.hex || "#888888", gramu: n(z.gramu), zakazka: z.zakazka || "",
      doKdy: st.doKdy, zbyva: st.zbyva, duvod: st.duvod,
      stavPopis: naStroji ? "v tisku" : "ve skladu",
      slozeni: z.slozeni || [], hodnota: hodnotaKelimku(z, materialy),
      likvidaceGram: sazbaLikvidace(materialy, n(z.hustota, 1.2)),
      naStroji: naStroji, kam: [], navrh: null,
    });
  }

  const starsi = radky.filter((x) => denPropadu(x.doKdy, nyni) < -horizont);
  const vybrane = radky
    .filter((x) => {
      const den = denPropadu(x.doKdy, nyni);
      return den <= horizont && den >= -horizont;
    })
    .map((x) => Object.assign(x, {
      den: denPropadu(x.doKdy, nyni),
      // nádobu na stroji přesměrovat nejde — ta se má stihnout dotisknout
      kam: x.naStroji ? [] : kamPropadSedne(x, podklad),
    }))
    .sort((a, b) => a.doKdy - b.doKdy);

  /* Kam co půjde. Jedna položka fronty si v přehledu vezme jednu nádobu: do
     dávky se sice dají složit i dva kelímky (dvojiceZbytku v míchacím režimu),
     ale sečíst gramy ze všech kelímků, které na položku sednou, by nasčítalo
     víc barvy, než se do ní vejde. Přednost má nádoba s nejbližší lhůtou —
     seznam je v tom pořadí, takže stačí projít odshora. */
  const obsazenaFronta = new Set();
  for (const x of vybrane) {
    for (const k of x.kam) {
      if (obsazenaFronta.has(k.polozka.kod)) continue;
      obsazenaFronta.add(k.polozka.kod);
      x.navrh = k;
      break;
    }
  }

  const soucet = (kde) => {
    const ks = vybrane.filter(kde);
    return {
      ks: ks.length,
      gramu: ks.reduce((s, x) => s + x.gramu, 0),
      hodnota: ks.reduce((s, x) => s + ((x.hodnota && x.hodnota.znama) ? x.hodnota.celkem : 0), 0),
      /* Druhá půlka ztráty: za vyhozený kelímek se platí dvakrát — jednou
         dodavateli za barvu, podruhé svozové firmě za nebezpečný odpad. Sčítá
         se zvlášť, protože zaplacenou barvu to nezlevňuje. */
      likvidace: ks.reduce((s, x) => s + cenaLikvidace(x.gramu, x.likvidaceGram), 0),
      uplne: ks.every((x) => x.hodnota && x.hodnota.uplna),
    };
  };
  const sedne = vybrane.filter((x) => x.navrh);
  return {
    radky: vybrane, horizont: horizont, mena: menaDilny(materialy),
    frontaKs: podklad.length,
    prosle: soucet((x) => x.den < 0),
    dnes: soucet((x) => x.den === 0),
    celkem: soucet(() => true),
    /* Co se dá zachránit: gramy, které se vejdou do přiřazené položky fronty,
       a co se tím ušetří na čerstvé barvě. */
    zachranitelne: {
      ks: sedne.length,
      gramu: sedne.reduce((s, x) => s + x.navrh.pouzit, 0),
      uspora: sedne.reduce((s, x) => s + n(x.navrh.uspora), 0),
      likvidace: sedne.reduce((s, x) => s + cenaLikvidace(x.navrh.pouzit, x.likvidaceGram), 0),
    },
    // kelímky, na které ve frontě nesedne nic — bez další zakázky se vyhodí
    nikam: vybrane.filter((x) => !x.naStroji && !x.kam.length),
    nikamLikvidace: vybrane.filter((x) => !x.naStroji && !x.kam.length)
      .reduce((s, x) => s + cenaLikvidace(x.gramu, x.likvidaceGram), 0),
    // dávky bez kelímku: štítek se ještě netiskl, takže se nezná složení ani cena
    bezSlozeni: vybrane.filter((x) => !((x.slozeni || []).length)),
    starsiProsle: { ks: starsi.length, gramu: starsi.reduce((s, x) => s + x.gramu, 0) },
  };
}

/* Databáze, ze kterých receptury pocházejí — podklad pro filtr. */
function zdrojeReceptur(recipes) {
  const mapa = new Map();
  for (const r of (recipes || [])) {
    const z = r.zdroj || "";
    mapa.set(z, (mapa.get(z) || 0) + 1);
  }
  return Array.from(mapa.entries())
    .map(([zdroj, pocet]) => ({ zdroj: zdroj, pocet: pocet,
      nazev: zdroj ? zdroj.replace(/\.csv$/i, "") : "vlastní a ruční" }))
    .sort((a, b) => (a.zdroj ? 0 : 1) - (b.zdroj ? 0 : 1) || a.nazev.localeCompare(b.nazev, "cs"));
}

/* Přepínač databází. Dokud je databáze jediná, není co přepínat a nic se
   nezobrazuje — objeví se sám, jakmile ve složce přibude druhý soubor. */
/* Nabídka databází. Dostane už zúžený seznam receptur, takže se nabízejí jen
   databáze, které k dané technologii patří — na textilní síto nemá co dělat
   databáze pro tampontisk. Kolik receptur technologie odfiltrovala, se řekne
   nahlas; jinak by čísla nesouhlasila s tím, co je ve složce. */
/* Barevný pruh složení. Stojí na dvou místech — u výběru receptury a pod
   dávkou ve výsledku — a na obou musí vypadat stejně, jinak se nedají porovnat
   pohledem. Proto je to jedna komponenta, ne dvakrát opsaný kus kódu.

   První složka nese odstín receptury, ostatní se jen odliší od sebe, aby šly
   poměry rozeznat; nejsou to skutečné barvy pigmentů, ty aplikace nezná.
   Receptura bez zapsaného složení dostane jeden pruh přes celou šířku — i tak
   je vidět, jaký odstín je vybraný. */
function PruhSlozeni({ recipe, comps }) {
  if (!recipe) return null;
  let slozky = comps;
  if (!slozky) {
    const zdroj = recipe.components || [];
    const suma = zdroj.reduce((s, c) => s + n(c.pct), 0);
    slozky = zdroj.map((c) => Object.assign({}, c, { norm: suma ? n(c.pct) / suma * 100 : 0 }));
  }
  if (!slozky.length) {
    return html`<div className="mixbar" title=${recipe.hex || ""}>
      <span style=${{ width: "100%", background: recipe.hex || "#888" }} />
    </div>`;
  }
  return html`
    <div className="mixbar" title=${slozky.map((c) => c.name + " " + fmt(c.norm) + " %").join(" · ")}>
      ${slozky.map((c, i) => html`<span key=${c.id} style=${{ width: c.norm + "%",
        background: i === 0 ? recipe.hex : "hsl(" + ((i * 67) % 360) + " 25% " + (78 - i * 8) + "%)" }} />`)}
    </div>`;
}

/* `nadpis={false}` skryje vlastní popisek — když prvek stojí pod popiskem
   sloupce, dva nadpisy nad sebou jen matou. `vzdy` ukáže lištu i tehdy, když
   je databáze jediná: v rozdělené kartě má mít každá půlka svůj filtr, i kdyby
   měl jen říct, že se není z čeho vybírat. `vyber` udělá z přepínače rozbalovací
   nabídku — u dlouhých názvů databází zabírají štítky celé dva řádky a rozpadají
   se, kdežto nabídka je vždycky jeden řádek a řady se ukážou až po rozkliknutí. */
function FiltrDatabaze({ recipes, hodnota, setHodnota, popis, tech, skryto, nadpis, vzdy, vyber }) {
  const zdroje = useMemo(() => zdrojeReceptur(recipes), [recipes]);
  // Zvolená databáze, která k téhle technologii nepatří, by tiše ukazovala
  // prázdný seznam — proto se výběr vrátí na "vše".
  useEffect(() => {
    if (!hodnota) return;
    const je = zdroje.some((z) => (z.zdroj || "@vlastni") === hodnota);
    if (!je) setHodnota("");
  }, [hodnota, zdroje]);
  if (!vzdy && zdroje.filter((z) => z.zdroj).length < 2) return null;
  return html`
    <div style=${{ marginBottom: 10 }}>
      ${nadpis !== false && html`<label className="f">Databáze receptur${tech ? " pro " + tech : ""}</label>`}
      ${vyber ? html`
        <select value=${hodnota} onChange=${(e) => setHodnota(e.target.value)}>
          <option value="">Všechny řady (${fmt(recipes.length, 0)})</option>
          ${zdroje.map((z) => html`<option key=${z.zdroj || "-"} value=${z.zdroj || "@vlastni"}>
            ${nazevDb(z.zdroj) || z.nazev} (${fmt(z.pocet, 0)})</option>`)}
        </select>` : html`
      <div className="chips">
        <button className=${"chip" + (hodnota ? "" : " on")} onClick=${() => setHodnota("")}>
          vše (${fmt(recipes.length, 0)})
        </button>
        ${zdroje.map((z) => html`
          <button key=${z.zdroj || "-"} className=${"chip" + (hodnota === (z.zdroj || "@vlastni") ? " on" : "")}
            title=${z.zdroj || "receptury zadané ručně v aplikaci"}
            onClick=${() => setHodnota(z.zdroj || "@vlastni")}>
            ${z.nazev} (${fmt(z.pocet, 0)})
          </button>`)}
      </div>`}
      ${skryto > 0 && html`<p className="note" style=${{ marginTop: 6 }}>
        Skryto ${fmt(skryto, 0)} receptur z databází, které k technologii
        ${tech ? " " + tech : ""} nepatří.
      </p>`}
      ${popis && html`<p className="note" style=${{ marginTop: 6 }}>${popis}</p>`}
    </div>`;
}

/* Vybere receptury z jedné databáze. "" = ze všech, "@vlastni" = jen ty,
   které nepřišly ze souboru. */
function podleDatabaze(recipes, filtr) {
  if (!filtr) return recipes;
  if (filtr === "@vlastni") return recipes.filter((r) => !r.zdroj);
  return recipes.filter((r) => r.zdroj === filtr);
}

/* Řady barev se vážou na technologii — sítotisková barva se do tampontisku
   nehodí. Technologie může být uvedená u receptury (sloupec v CSV), nebo se
   přiřadí celému souboru v Připojení k mostu. Neurčená řada platí všude. */
function techReceptury(r, dbTech) {
  const zRadku = String(r.tech || "").trim();
  if (zRadku) return zRadku.split(/[,;+ ]+/).filter(Boolean);
  const zeSouboru = r.zdroj ? String((dbTech || {})[r.zdroj] || "").trim() : "";
  return zeSouboru ? zeSouboru.split(/[,;+ ]+/).filter(Boolean) : [];
}
function podleTechnologie(recipes, tech, dbTech) {
  if (!tech) return recipes;
  return (recipes || []).filter((r) => {
    const t = techReceptury(r, dbTech);
    return !t.length || t.indexOf(tech) >= 0;
  });
}

function Importer({ setProducts, setRecipes, guardDelete, deletePw, setDeletePw,
                    recipes, materialy, onUlozitCeny, cenyStav, mostOk }) {
  const [text, setText] = useState("");
  const [preview, setPreview] = useState(null);
  const [recPreview, setRecPreview] = useState(null);
  const [msg, setMsg] = useState(null);
  const fileRef = useRef(null);
  const recFileRef = useRef(null);
  const [pwCur, setPwCur] = useState("");
  const [pw1, setPw1] = useState("");
  const [pw2, setPw2] = useState("");
  const [pwMsg, setPwMsg] = useState(null);
  const savePw = () => {
    setPwMsg(null);
    if (deletePw && pwCur !== deletePw) { setPwMsg({ warn: "Současné heslo nesouhlasí." }); return; }
    if (pw1 !== pw2) { setPwMsg({ warn: "Nová hesla se neshodují." }); return; }
    setDeletePw(pw1);
    setPwCur(""); setPw1(""); setPw2("");
    setPwMsg({ ok: pw1 ? "Heslo pro mazání bylo nastaveno." : "Ochrana heslem byla odebrána — mazání teď funguje bez potvrzení." });
  };

  const analyze = (raw) => {
    setMsg(null); setRecPreview(null);
    try {
      let items;
      const t = raw.trim();
      if (!t) { setMsg({ warn: "Vložte data nebo nahrajte soubor." }); return; }
      if (t[0] === "{" || t[0] === "[") items = jsonToItems(JSON.parse(t));
      else items = rowsToItems(parseCsv(t));
      const mapped = items.filter((i) => i.name || i.ref).map((i) => Object.assign({}, i, { tech: mapTech(i.techRaw) }));
      const skipped = mapped.filter((i) => !i.tech);
      const ok = mapped.filter((i) => i.tech && i.w > 0 && i.h > 0);
      setPreview({ ok, skipped, badDim: mapped.filter((i) => i.tech && !(i.w > 0 && i.h > 0)), imgs: ok.filter((i) => i.img).length });
    } catch (e) {
      setMsg({ warn: "Data se nepodařilo přečíst: " + e.message });
      setPreview(null);
    }
  };

  const doImport = () => {
    if (!preview || !preview.ok.length) return;
    setProducts((prev) => {
      const byKey = new Map(prev.map((p) => [(p.ref || p.name).toLowerCase(), p]));
      let added = 0, updated = 0;
      for (const i of preview.ok) {
        const key = (i.ref || i.name).toLowerCase();
        const pos = { id: uid(), name: i.pos, w: i.w, h: i.h, cover: i.cover || 100, tech: i.tech, img: i.img || "" };
