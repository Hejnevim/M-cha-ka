            ${likvidace > 0 ? " Do nebezpečného odpadu ty gramy nepůjdou, a svoz se platí podle váhy." : ""}
            ${naklady.kryto < 1 ? " Ceník je neúplný, skutečná úspora je vyšší." : ""}
          </div>
        </div>`}
    </div>`;
}

/* Odpočet pot life musí běžet sám od sebe — bez tikotu by se čas přepsal až
   při jiné akci a tiskař by u váhy koukal na hodnotu, která už neplatí. */
function useTikot(bezi, ms) {
  const [, setTik] = useState(0);
  useEffect(() => {
    if (!bezi) return;
    const id = setInterval(() => setTik((x) => x + 1), ms || 30000);
    return () => clearInterval(id);
  }, [bezi, ms]);
}

/* Řízení doby zpracovatelnosti u dvousložkových barev.

   Pot life neběží od namíchání báze, ale od chvíle, kdy se do ní přidá
   tužidlo — proto se odpočet spouští tlačítkem, ne sám. Do té doby se
   ukazuje jen navážka tužidla, aby bylo co odměřit.

   Kolik tužidla: poměr je z VÁHY BÁZE, takže z 628 g báze při 10 %
   vznikne 690,8 g směsi. Dávka pro zakázku je báze — tužidlo je navíc. */
function PotlifePruh({ cfg, bazeG, zacatek, onSpustit, onZnovu, onUzavrit, davka, velky }) {
  const st = stavPotlife(zacatek, cfg);
  // dokud odpočet neběží, není co překreslovat; pak stačí půlminuta
  useTikot(st.plati && st.stav !== "prosle", 30000);
  if (!cfg || !cfg.tuzidlo) return null;
  const tuz = davkaTuzidla(cfg, bazeG);
  const velikost = velky ? { fontSize: 15 } : {};

  if (!st.plati) return html`
    <div className="specbar" style=${Object.assign({ marginTop: 10 }, velikost)}>
      <span className="dot" style=${{ background: "var(--cyan)" }}></span>
      <span>Dvousložková barva — po navážení přidejte
        <b> ${fmtG(tuz.tuzidlo)} g tužidla</b> (${fmt(tuz.pomer * 100, 1)} % z ${fmt(tuz.baze)} g báze),
        směsi bude ${fmt(tuz.celkem)} g. Zpracovat ji jde ${dobaText(n(cfg.minut) * MINUTA)}
        ${" "}od přidání tužidla.</span>
      <span style=${{ marginLeft: "auto" }}></span>
      ${onSpustit && html`<button className="btn sm" onClick=${onSpustit}>Tužidlo přidáno — spustit odpočet</button>`}
    </div>`;

  const barva = st.stav === "prosle" ? "var(--danger)"
    : (st.stav === "kriticky" ? "var(--warn)" : "var(--ok)");
  const trida = st.stav === "ok" ? "okbox" : "warnbox";
  return html`
    <div className=${trida} style=${Object.assign({ marginTop: 10 }, velikost)}>
      <div className="rowline" style=${{ marginTop: 0, marginBottom: 0, gap: 8 }}>
        <b style=${{ color: barva }}>
          ${st.stav === "prosle"
            ? "Pot life vypršel — směs už tuhne (" + dobaText(st.zbyva) + " po lhůtě)"
            : (st.stav === "kriticky"
              ? "Pot life končí — zbývá " + dobaText(st.zbyva)
              : "Pot life běží — zbývá " + dobaText(st.zbyva))}
        </b>
        <span className="note">z ${dobaText(st.lhuta)} · uplynulo ${fmt(st.podil * 100, 0)} %</span>
        <span style=${{ marginLeft: "auto" }}></span>
        ${onZnovu && html`<button className="btn sec sm" onClick=${onZnovu}>Nová směs</button>`}
      </div>
      <div className="wbar" style=${{ marginTop: 8 }}>
        <span style=${{ width: Math.min(100, st.podil * 100) + "%", background: barva }} />
      </div>
      <div className="note" style=${{ marginTop: 6 }}>
        ${st.stav === "prosle"
          ? "Vytvrzenou barvu nejde naředit zpátky — namíchejte novou dávku."
          : "Houstne " + cfg.hustnutiPopis + " — " + cfg.hustnutiRada + "."}
        ${" "}V kelímku je ${fmt(tuz.celkem)} g (${fmt(tuz.baze)} g báze + ${fmtG(tuz.tuzidlo)} g tužidla).
      </div>
      ${/* Dávka se uzavírá rukou a právě tady, protože právě tady se na ni
            člověk dívá. Aplikace to sama poznat nemůže: prošlá lhůta neříká,
            jestli se barva stihla vytisknout, nebo skončila v koši. */
        davka && onUzavrit && html`
        <div className="rowline" style=${{ marginTop: 8, marginBottom: 0 }}>
          <span className="note" style=${{ fontFamily: "var(--mono)" }}>${davka.kod}</span>
          <span style=${{ marginLeft: "auto" }}></span>
          <button className="btn sec sm" onClick=${() => onUzavrit("spotrebovana")}>Spotřebováno</button>
          <button className="btn danger sm" onClick=${() => onUzavrit("vyhozena")}>Vyhozeno</button>
        </div>`}
    </div>`;
}

/* Míchací režim — celá obrazovka jen pro míchání.
   U váhy je všechno ostatní na obtíž: katalog, filtry, rozměry potisku. Tiskař
   potřebuje vědět jedinou věc — co míchá, kolik toho má být a co navážit teď.
   Proto se to na jedno tlačítko přepne přes celou obrazovku a velkým písmem.

   Asistent vážení se sem NEPŘESOUVÁ, jen se překreslí jinam: kdyby se odpojil
   od stromu a znovu připojil, React by ho zahodil i s rozpracovaným vážením
   a s otevřeným portem váhy. Přenos přes portál nechává komponentu na místě,
   mění se jen to, kam se vykreslí. */
function MichaciRezim({ aktivni, onZavrit, recipe, calcAkt, rozpis, vyuziti, stav,
                        product, colorSel, position, tech, zak, kodDavky,
                        pokryti, zbytky, stitek, rady, potlife, aditiva, riziko, natisk,
                        children }) {
  useEffect(() => {
    if (!aktivni) return;
    const naKlavesu = (e) => { if (e.key === "Escape") onZavrit(); };
    window.addEventListener("keydown", naKlavesu);
    return () => window.removeEventListener("keydown", naKlavesu);
  }, [aktivni, onZavrit]);

  // Zavřený režim asistenta neschovává ze stromu, jen z očí: kdyby se odpojil,
  // přišel by o rozpracované vážení i o otevřený port váhy.
  if (!aktivni || !recipe || !calcAkt) return html`<div style=${{ display: "none" }}>${children}</div>`;

  const krok = stav ? stav.krok : -1;
  const hotovo = stav ? stav.done : false;
  const davka = stav && stav.davka > 0 ? stav.davka : calcAkt.totalG;
  const kdo = [
    product ? (product.ref || product.name) : "",
    colorSel ? (colorSel.code || colorSel.name || "") : "",
    position ? (position.tech || tech) + " " + position.name : (tech || ""),
    zak && zak.order ? "zakázka " + zak.order : "",
    kodDavky ? "kelímek " + kodDavky : "",
  ].filter(Boolean).join(" · ");
  // kumulativní součet se počítá z toho, co se doopravdy navažuje — je-li
  // v nádobě zbytek, přibývá jen zbývající část
  let kum = 0;

  return ReactDOM.createPortal(html`
    <div className="michbg">
      <div className="michhlav">
        <span className="michvzorek" style=${{ background: recipe.hex || "#888" }}></span>
        <div>
          <div className="nazev">${recipe.name}</div>
          <div className="kde">${kdo || "—"}</div>
        </div>
        <div className="michdavka">
          <b>${fmt(davka)} g</b>
          <span>${calcAkt.zvetseno || Math.abs(davka - calcAkt.totalG) > 0.05
            ? "zakázka potřebuje " + fmt(calcAkt.davkaZakazky || calcAkt.totalG) + " g"
            : "≈ " + fmt(calcAkt.totalMl) + " ml"}</span>
        </div>
        <button className="btn sec" onClick=${onZavrit} title="Zavřít můžete i klávesou Esc">
          ✕ Zpět do kalkulace
        </button>
      </div>

      <div className="michtelo">
        <div>
          ${potlife}
          ${rady}
          ${pokryti}
          ${vyuziti && html`
            <div className="okbox" style=${{ marginTop: 0, marginBottom: 12, fontSize: 15 }}>
              V nádobě už je <b>${fmt(vyuziti.pouzit)} g</b> ${vyuziti.dvojice ? "ze dvou zbytků" : "ze zbytku"}
              <b> ${popisKelimku(vyuziti.zbytek)}</b>
              ${" "}— navažuje se jen sloupec „navážit".
            </div>`}
          ${calcAkt.comps.length ? html`
            <table className="michtab">
              <thead>
                <tr>
                  <th style=${{ width: 34 }}></th>
                  <th>Komponenta</th>
                  ${rozpis && html`<th className="num">ze zbytku</th>`}
                  <th className="num">navážit</th>
                  <th className="num">kumulativně</th>
                </tr>
              </thead>
              <tbody>
                ${calcAkt.comps.map((c, i) => {
                  const r = rozpis ? rozpis[i] : null;
                  const navazit = r ? r.pridat : c.g;
                  kum += navazit;
                  const jeTed = !hotovo && i === krok;
                  const jeHotovo = hotovo || (stav && stav.zbyva && stav.zbyva[i] <= 0.05);
                  return html`
                    <tr key=${c.id || i} className=${jeTed ? "ted" : (jeHotovo ? "hotovo" : "")}>
                      <td><span className="michstav">${jeTed ? "▶" : (jeHotovo ? "✓" : "")}</span></td>
                      <td>${c.name}</td>
                      ${rozpis && html`<td className="num">${r && r.zeZbytku > 0.005 ? fmt(r.zeZbytku) : "—"}</td>`}
                      <td className="num g">${navazit > 0.005 ? fmt(navazit) : "—"}</td>
                      <td className="num">${fmt(kum)}</td>
                    </tr>`;
                })}
                <tr>
                  <td></td>
                  <td style=${{ fontWeight: 700 }}>Navážit celkem</td>
                  ${rozpis && html`<td className="num" style=${{ fontWeight: 700 }}>${fmt(vyuziti ? vyuziti.pouzit : 0)}</td>`}
                  <td className="num g">${fmt(kum)}</td>
                  <td className="num" style=${{ fontWeight: 700 }}>${fmt(kum)}</td>
                </tr>
              </tbody>
            </table>` : html`
            <div className="warnbox" style=${{ marginTop: 0 }}>
              Složení téhle receptury není v aplikaci zadané. Namíchejte
              ${" " + fmt(calcAkt.totalG)} g podle firemní receptury.
            </div>`}
          <p className="note" style=${{ marginTop: 12 }}>
            Váží se kumulativně do jedné nádoby — displej váhy má po každé složce
            ukazovat hodnotu ve sloupci „kumulativně"${vyuziti
              ? " (váhu vytárujte i s kelímkem; v nádobě pak bude " + fmt(calcAkt.totalG) + " g)"
              : ""}. Zavřít můžete klávesou Esc.
          </p>
          ${riziko}
          ${natisk}
          ${aditiva}
          ${zbytky}
          ${stitek}
        </div>
        <div>${children}</div>
      </div>
    </div>`, document.body);
}

function Vazeni({ comps, aditiva, redeni, totalG, recipeName, predem, predemPopis, onHotovo,
                  pigmenty, barvaHex, onStav, potlife, zacatekPotlife, onSpustitPotlife }) {
  const sc = useScale();
  const [baud, setBaud] = useState("9600");
  const [tol, setTol] = useState(0.5);

  /* Ředidlo a zpomalovač se váží jako každá jiná složka — do téže nádoby, na
     tutéž váhu, kumulativně. Vedou se ale ZA komponentami a odděleně, protože
     složky odstínu to nejsou: korekce po nátisku se jich netýká a tužidlo se
     počítá z báze, ne z naředěné směsi. Že jsou v seznamu, má jediný důvod —
     přelití pak řeší tentýž algoritmus jako u barvy, bez druhé jeho kopie. */
  const aditivaRadky = (aditiva || []).filter((a) => n(a.g) > 0.005)
    .map((a) => ({ id: "aditivum-" + a.druh, name: a.popis, g: n(a.g), aditivum: a.druh }));
  const slozky = comps.concat(aditivaRadky);
  const aditivaG = aditivaRadky.reduce((s, a) => s + a.g, 0);
  const davkaCela = totalG + aditivaG;          // co má nakonec být v nádobě
  const prvniAditivum = comps.length;

  // Zbytek z evidence je vlastně předem nalitá část dávky — do nádoby se
  // nalije jako první a asistent pak vede jen dolití zbylých složek.
  // Aditiva zbytek nikdy nepřináší, ta se dolévají vždycky.
  const zacatek = () => slozky.map((c, i) => (predem && predem[i] > 0) ? predem[i] : 0);
  const [nalito, setNalito] = useState(zacatek);
  const [krok, setKrok] = useState(0);          // která složka se váží teď
  const [davka, setDavka] = useState(davkaCela);// celková dávka po případném přepočtu
  // Po korekci odstínu už poměry neodpovídají receptuře — asistent musí vést
  // dolití podle nových podílů, ne podle původních.
  const [korPodil, setKorPodil] = useState(null);
  const [korSlozka, setKorSlozka] = useState(0);
  const [korSila, setKorSila] = useState("mirne");
  const [korSmer, setKorSmer] = useState("mocSvetle");
  const [korHistorie, setKorHistorie] = useState([]);

  const zacniZnovu = () => {
    const z = zacatek();
    setNalito(z);
    setDavka(davkaCela);
    setKorPodil(null);
    setKorHistorie([]);
    const podil0 = slozky.map((c) => (davkaCela > 0 ? c.g / davkaCela : 0));
    const prvni = podil0.findIndex((p, i) => davkaCela * p - z[i] > Math.max(0.05, n(tol, 0.5)) / 2);
    setKrok(prvni >= 0 ? prvni : -1);
  };
  useEffect(zacniZnovu, [totalG, comps.length, recipeName, (predem || []).join(","),
    aditivaRadky.map((a) => a.druh + ":" + fmt(a.g, 2)).join(",")]);

  const podil = korPodil || slozky.map((c) => (davkaCela > 0 ? c.g / davkaCela : 0));
  const cil = podil.map((p) => davka * p);
  // korekce odstínu se počítá z barevné části dávky — přilité ředidlo do ní nepatří
  const bazeCil = cil.slice(0, prvniAditivum).reduce((a, b) => a + b, 0);
  const zbyvaVse = cil.map((c, i) => Math.max(0, c - (nalito[i] || 0)));
  // hotovo = na žádné složce už nic nechybí
  const done = krok < 0 || !zbyvaVse.some((z) => z > Math.max(0.05, n(tol, 0.5)) / 2);
  const cur = done ? null : slozky[krok];

  // Váha ukazuje obsah celé nádoby. Co je v ní mimo právě váženou složku,
  // je pevné — rozdíl oproti tomu je to, co teď přitéká.
  const vPotu = nalito.reduce((a, b) => a + (b || 0), 0);
  /* Tužidlo se počítá z BÁZE, ne z toho, co je v nádobě. Kdyby se do základu
     započítalo ředidlo, vyšlo by tužidla o jeho podíl víc a barva by vytvrdla
     jinak, než má. */
  const bazeVPotu = nalito.slice(0, prvniAditivum).reduce((a, b) => a + (b || 0), 0);
  const aditivaVPotu = nalito.slice(prvniAditivum).reduce((a, b) => a + (b || 0), 0);
  const rozborVahy = redeni
    ? rozborNaredeni({ bazeG: bazeVPotu, cfg: redeni,
        aditiva: aditivaRadky.reduce((o, a, i) => {
          o[a.aditivum] = nalito[prvniAditivum + i] || 0; return o;
        }, {}) })
    : null;
  const zaklad = vPotu - (nalito[krok] || 0);
  const w = sc.weight;
  const naliteTed = Math.max(0, w - zaklad);
  const target = done ? vPotu : zaklad + cil[krok];
  const rem = target - w;
  const tolerance = Math.max(0.05, n(tol, 0.5));
  const inTol = Math.abs(rem) <= tolerance;
  const over = rem < -tolerance;
  const progress = target > 0 ? Math.max(0, Math.min(100, (w / target) * 100)) : 0;

  // Náhled přepočtu se počítá průběžně, ať je hned vidět, co přeliv udělá.
  const naliteSTedka = nalito.map((m, i) => (i === krok ? naliteTed : m || 0));
  const navrh = over ? prepocetDavky(slozky, davkaCela, naliteSTedka) : null;
  const prijmoutPrepocet = () => {
    if (!navrh) return;
    setNalito(naliteSTedka);
    setDavka(navrh.davka);
    // pokračuje se u první komponenty, které něco chybí
    const dalsi = navrh.zbyva.findIndex((z) => z > tolerance / 2);
    setKrok(dalsi >= 0 ? dalsi : -1);
  };
  const dalsiKrok = () => {
    const novy = naliteSTedka.slice();
    setNalito(novy);
    const zbyvaPo = cil.map((c, i) => Math.max(0, c - novy[i]));
    let dalsi = -1;
    for (let i = krok + 1; i < slozky.length; i++) if (zbyvaPo[i] > tolerance / 2) { dalsi = i; break; }
    if (dalsi < 0) for (let i = 0; i <= krok; i++) if (zbyvaPo[i] > tolerance / 2) { dalsi = i; break; }
    setKrok(dalsi);
  };
  const naviceni = davka - davkaCela;

  /* Míchací režim kreslí tutéž práci velkým písmem vedle — potřebuje vědět,
     kde vážení je. Hlásí se jen hodnoty, ne funkce, aby to nikoho nenutilo
     překreslovat víc, než je nutné. */
  useEffect(() => {
    if (onStav) onStav({ krok: krok, done: done, davka: davka, zbyva: zbyvaVse });
  }, [onStav, krok, done, davka, nalito, comps.length]);

  return html`
    <div className="card" style=${{ margin: 0 }}>
      <h2>Asistent navážení</h2>
      <p className="hint">Komponenty se váží kumulativně do jedné nádoby. Váha se připojuje přes USB (virtuální COM port) v prohlížeči Chrome/Edge; bez váhy lze postup vyzkoušet v simulaci.</p>
      ${!comps.length && html`<div className="warnbox" style=${{ marginTop: 0 }}>
        Asistent vede vážení po komponentách — zadejte nejdřív složení receptury.
        Celkovou dávku ${fmt(totalG)} g můžete zatím navážit podle míchacího lístku.
      </div>`}

      <div className="rowline" style=${comps.length ? {} : { display: "none" }}>
        ${sc.mode === "off" && html`
          <${React.Fragment}>
            <button className="btn" onClick=${() => sc.connect(baud)}>Připojit váhu (USB)</button>
            <select style=${{ width: "auto" }} value=${baud} onChange=${(e) => setBaud(e.target.value)} title="Rychlost komunikace (baud)">
              ${["4800", "9600", "19200", "38400", "115200"].map((b) => html`<option key=${b} value=${b}>${b} Bd</option>`)}
            </select>
            <button className="btn sec" onClick=${sc.startSim}>Vyzkoušet v simulaci</button>
          <//>`}
        ${sc.mode !== "off" && html`
          <${React.Fragment}>
            <span className="tag" style=${{ background: "var(--paper)", color: "var(--ok)" }}>
              ${sc.mode === "serial" ? "váha připojena" : "simulace váhy"}
            </span>
            <button className="btn sec sm" onClick=${sc.tare}>Tára (0)</button>
            <button className="btn danger sm" onClick=${sc.disconnect}>Odpojit</button>
          <//>`}
      </div>
      ${sc.err && html`<div className="warnbox">${sc.err}</div>`}

      ${sc.mode !== "off" && html`
        <${React.Fragment}>
          <div className="result-big" style=${{ marginTop: 10 }}>${fmt(w, 1)} g</div>
          <div className="result-sub">na váze · receptura ${recipeName}</div>

          ${sc.mode === "sim" && html`
            <div style=${{ margin: "10px 0" }}>
              <label className="f">Simulace — přidávejte barvu posuvníkem</label>
              <input type="range" min="0" max=${Math.ceil(davka * 1.4)} step="0.1" value=${sc.raw}
                onChange=${(e) => sc.setRaw(n(e.target.value))} />
            </div>`}

          ${predemPopis && (predem || []).some((x) => x > 0) && html`
            <div className="specbar" style=${{ marginTop: 10 }}>
              <span className="dot" style=${{ background: "var(--ok)" }}></span>
              <span>V nádobě už je <b>${fmtG((predem || []).reduce((a, b) => a + b, 0))} g</b>${" "}
                ze zbytku (${predemPopis}) — asistent vede jen dolití zbylých složek.</span>
            </div>`}
          ${naviceni > 0.05 && html`
            <div className="specbar" style=${{ marginTop: 10 }}>
              <span className="dot" style=${{ background: "var(--warn)" }}></span>
              <span>Dávka přepočtena na <b>${fmt(davka)} g</b> (z ${fmt(davkaCela)} g,
                +${fmt(naviceni)} g / +${fmt(naviceni / davkaCela * 100, 0)} %) — poměr složek zůstal stejný.</span>
              <span style=${{ marginLeft: "auto" }}></span>
              <button className="btn sec sm" onClick=${zacniZnovu}>Zrušit a navážit znovu</button>
            </div>`}

          ${!done ? html`
            <div style=${{ marginTop: 12 }}>
              <div style=${{ fontWeight: 800 }}>
                ${cur.name}${(nalito[krok] || 0) > 0.05 ? " — dorovnání" : ""}
              </div>
              <div className="note">
                přidat ${fmtG(zbyvaVse[krok])} g${(nalito[krok] || 0) > 0.05
                  ? " (už nalito " + fmtG(nalito[krok]) + " g z " + fmtG(cil[krok]) + " g)" : ""}
                → navážit celkem do ${fmt(target)} g
              </div>
              <div className="wbar" style=${{ marginTop: 8 }}>
                <span style=${{ width: progress + "%", background: over ? "#B91C1C" : (inTol ? "var(--ok)" : "var(--cyan)") }} />
              </div>
              <div style=${{ fontFamily: "var(--mono)", fontSize: 20, marginTop: 6, color: over ? "#B91C1C" : (inTol ? "var(--ok)" : "inherit") }}>
                ${over ? "přelito o " + fmt(-rem, 1) + " g" : (inTol ? "✓ v toleranci" : "zbývá " + fmt(rem, 1) + " g")}
              </div>
              ${cur.aditivum && html`
                <div className="note" style=${{ marginTop: 6 }}>
                  ${ADITIVA[cur.aditivum].rada}${rozborVahy
                    ? ". V nádobě je barvy " + fmt(bazeVPotu) + " g, doporučené ředění "
                      + fmt(rozborVahy.doporuceno) + " g, strop " + fmt(rozborVahy.strop) + " g."
                    : "."}
                </div>`}
              ${cur.aditivum && rozborVahy && rozborVahy.prilisRidke && html`
                <div className="warnbox" style=${{ marginTop: 8 }}>
                  Aditiv je v nádobě ${fmt(rozborVahy.aditiva)} g, strop receptury je
                  ${" " + fmt(rozborVahy.strop)} g — o ${fmt(rozborVahy.nadStropem)} g víc.
                </div>`}
              <div className="rowline" style=${{ marginTop: 10 }}>
                <button className="btn" style=${inTol ? { background: "var(--ok)" } : {}}
                  disabled=${over} onClick=${dalsiKrok}>
                  ${zbyvaVse.filter((z, i) => i !== krok && z > tolerance / 2).length ? "Další složka →" : "Dokončit"}
                </button>
                <span className="note">tolerance ±</span>
                <input type="number" step="0.1" min="0.05" value=${tol} onChange=${(e) => setTol(e.target.value)} style=${{ width: 70 }} />
                <span className="note">g</span>
              </div>

              ${over && navrh && html`
                <div className="warnbox">
                  <b>Přelito o ${fmt(-rem, 1)} g.</b> Odebrat z nádoby přesně jde těžko — odstín se
                  zachová tím, že se dorovnají ostatní komponenty, tedy že se zvětší celá dávka.
                  <div className="kv" style=${{ marginTop: 8 }}>
                    <div className="k">Nová dávka</div>
                    <div className="v"><b>${fmt(navrh.davka)} g</b>
                      <span className="note"> místo ${fmt(davkaCela)} g · o ${fmt(navrh.davka - davkaCela)} g víc
                        (+${fmt((navrh.davka - davkaCela) / Math.max(davkaCela, 0.01) * 100, 0)} %)</span></div>
                    <div className="k">Ještě přidat</div>
                    <div className="v">
                      ${slozky.map((c, i) => navrh.zbyva[i] > tolerance / 2
                        ? html`<div key=${c.id}>${c.name} — <b>${fmtG(navrh.zbyva[i])} g</b>${
                            i < krok || (i > krok && (nalito[i] || 0) > 0.05) ? " (dorovnat)" : ""}</div>`
                        : null)}
                    </div>
                  </div>
                  <div className="rowline" style=${{ marginTop: 10, marginBottom: 0 }}>
                    <button className="btn" onClick=${prijmoutPrepocet}>
                      Přepočítat dávku na ${fmt(navrh.davka)} g →
                    </button>
                    <span className="note">
                      nebo přebytek odeberte a vraťte váhu na ${fmt(target)} g
                    </span>
                  </div>
                  ${navrh.davka > davkaCela * 2 && html`
                    <div style=${{ marginTop: 8 }}>
                      Přeliv je velký — dávka by narostla na víc než dvojnásobek. Zvažte, jestli
                      není levnější začít znovu.
                    </div>`}
                </div>`}
            </div>` : html`
            <div className="okbox" style=${{ marginTop: 12 }}>
              ✓ Všechny komponenty navaženy (${fmt(vPotu)} g celkem${naviceni > 0.05
                ? ", dávka přepočtena z " + fmt(davkaCela) + " g" : ""}). Barvu důkladně promíchejte.
              <div className="rowline" style=${{ marginTop: 8, marginBottom: 0 }}>
                <button className="btn sec sm" onClick=${zacniZnovu}>Navážit znovu</button>
                ${onHotovo && html`<button className="btn sm" onClick=${onHotovo}>Odepsat zbytek ze skladu</button>`}
              </div>
            </div>`}

          ${/* Tužidlo je poslední krok navážení, ne součást receptury: přidává se
                až do promíchané báze a od té chvíle běží doba zpracovatelnosti.
                Váží se na tutéž váhu, proto se rovnou říká i cílová hodnota. */
            done && potlife && potlife.tuzidlo && !zacatekPotlife && html`
            <div className="warnbox" style=${{ marginTop: 10 }}>
              <b>Zbývá tužidlo — ${fmtG(davkaTuzidla(potlife, bazeVPotu).tuzidlo)} g</b>
              ${" "}(${fmt(potlife.pomer * 100, 1)} % z ${fmt(bazeVPotu)} g báze${
                aditivaVPotu > 0.05 ? ", aditiva se do základu nepočítají" : ""}).
              Na váze ${fmt(vPotu + davkaTuzidla(potlife, bazeVPotu).tuzidlo)} g.
              <div className="note" style=${{ marginTop: 4 }}>
                Přidávejte až do promíchané báze. Od té chvíle běží doba
                zpracovatelnosti ${dobaText(n(potlife.minut) * MINUTA)} — pak už se směs
                nedá zachránit ředěním.
              </div>
              ${onSpustitPotlife && html`
                <div className="rowline" style=${{ marginTop: 8, marginBottom: 0 }}>
                  <button className="btn sm" onClick=${() => onSpustitPotlife(bazeVPotu)}>Tužidlo přidáno — spustit odpočet</button>
                </div>`}
            </div>`}

          ${done && comps.length > 0 && html`
            <div style=${{ marginTop: 14 }}>
              <div className="lbl">Korekce po nátisku</div>
              <p className="note" style=${{ marginTop: 4 }}>
                Nátisk nesedí s etalonem? Z nádoby se ubrat nedá, takže korekce je
                vždycky přídavek a dávka poroste. Přidávejte po malých krocích a mezi
                nimi tiskněte — barvicí síla bází je velmi různá.
              </p>

              ${(() => {
                // Zná-li aplikace odstíny pigmentů, poradí i ČÍM korigovat —
                // stačí popsat, co je na nátisku vidět.
                const maPigmenty = pigmenty && Object.keys(pigmenty).length > 0;
                if (!maPigmenty || !barvaHex) return "";
                const dop = doporucKorekci({ barvaHex: barvaHex, komponenty: comps,
                  pigmenty: pigmenty, smer: korSmer, sila: korSila });
                return html`
                  <div style=${{ marginTop: 8 }}>
                    <div className="rowline" style=${{ marginTop: 0 }}>
                      <span className="note">Nátisk proti etalonu:</span>
                      <select value=${korSmer} onChange=${(e) => setKorSmer(e.target.value)}
                              style=${{ width: "auto" }}>
                        ${Object.entries(SMERY_KOREKCE).map(([k, v]) => html`
                          <option key=${k} value=${k}>${v.popis}</option>`)}
                      </select>
                    </div>
                    ${dop && dop.navrhy.length > 0
                      ? html`<div className="okbox" style=${{ marginTop: 6 }}>
                          Nejlíp tím směrem táhne
                          <b> <span style=${{ display: "inline-block", width: 9, height: 9, borderRadius: 2,
                                    background: dop.navrhy[0].hex, marginRight: 4, verticalAlign: -1 }}></span>${dop.navrhy[0].name}</b>.
                          Začněte s <b>${fmt(dop.navrhy[0].startPct, 2)} %</b> dávky, tedy
                          ${fmtG(davka * dop.navrhy[0].startPct / 100)} g.
                          ${dop.navrhy.length > 1 && html`<div className="note" style=${{ marginTop: 4 }}>
                            Dál v pořadí: ${dop.navrhy.slice(1).map((x) => x.name).join(", ")}.</div>`}
                          <div className="note" style=${{ marginTop: 4 }}>
                            Výpočet předpokládá, že se odstíny průměrují. Míchání barev je ale
                            odečítací a silný pigment posune odstín víc — proto se nabízí
                            jen třetina spočítaného množství. Rozhoduje oko.
                          </div>
                          <button className="btn sec sm" style=${{ marginTop: 6 }} onClick=${() => {
                            const i = comps.findIndex((c) => c.name === dop.navrhy[0].name);
                            if (i >= 0) setKorSlozka(i);
                          }}>Vybrat ${dop.navrhy[0].name} níže</button>
                        </div>`
                      : html`<div className="note" style=${{ marginTop: 6 }}>
                          ${dop ? dop.duvod : ""}</div>`}
                  </div>`;
              })()}
              <div className="rowline" style=${{ marginTop: 8 }}>
                <select value=${korSlozka} onChange=${(e) => setKorSlozka(+e.target.value)}
                        style=${{ width: "auto" }} title="Kterou složkou se koriguje">
                  ${comps.map((c, i) => html`<option key=${c.id || i} value=${i}>${c.name || "složka " + (i + 1)}</option>`)}
                </select>
                <select value=${korSila} onChange=${(e) => setKorSila(e.target.value)}
                        style=${{ width: "auto" }} title="Jak velký krok">
                  ${Object.entries(KROKY_KOREKCE).map(([k, v]) => html`
                    <option key=${k} value=${k}>${v.popis} (${fmt(v.dil * 100, 1)} % dávky)</option>`)}
                </select>
                <button className="btn sec sm" onClick=${() => {
                  const zaklad = comps.map((c, i) => ({ name: c.name, g: cil[i] }));
                  const k = korekceOdstinu({ comps: zaklad, totalG: bazeCil, index: korSlozka, sila: korSila });
                  if (!k) return;
                  // Korekce míchá odstín, ne ředění — aditiva zůstávají v gramech,
                  // v jakých v nádobě jsou, a podíly se přepočtou přes obojí.
                  const noveCile = k.nove.map((x) => x.pct / 100 * k.davka)
                    .concat(cil.slice(prvniAditivum));
                  const novaDavka = noveCile.reduce((a, b) => a + b, 0);
                  setKorPodil(noveCile.map((g) => (novaDavka > 0 ? g / novaDavka : 0)));
                  setDavka(novaDavka);
                  setKrok(korSlozka);
                  setKorHistorie(korHistorie.concat([{ nazev: k.slozka, g: k.pridat, sila: k.sila }]));
                }}>Přidat do dávky</button>
              </div>
              ${(() => {
                const zaklad = comps.map((c, i) => ({ name: c.name, g: cil[i] }));
                const n_ = korekceOdstinu({ comps: zaklad, totalG: bazeCil, index: korSlozka, sila: korSila });
                if (!n_) return "";
                return html`<div className="note" style=${{ marginTop: 4 }}>
                  Přidá se <b>${fmtG(n_.pridat)} g</b> složky ${n_.slozka};
                  dávka naroste z ${fmt(davka)} g na <b>${fmt(n_.davka + davka - bazeCil)} g</b>.
                </div>`;
              })()}
              ${korHistorie.length > 0 && html`
                <div className="okbox" style=${{ marginTop: 8 }}>
                  <b>Provedené korekce:</b>
                  ${korHistorie.map((h, i) => html`<div key=${i} className="note" style=${{ marginTop: 2 }}>
                    ${i + 1}. ${h.sila} — ${h.nazev} +${fmtG(h.g)} g</div>`)}
                  <div className="note" style=${{ marginTop: 6 }}>
                    Dávka je teď ${fmt(davka)} g místo původních ${fmt(davkaCela)} g.
                    Tohle složení už není receptura z databáze — než ho použijete znovu,
                    uložte si ho jako vlastní recepturu k tomuhle produktu a barvě.
                  </div>
                </div>`}
            </div>`}

          <table className="t" style=${{ marginTop: 14 }}>
            <thead><tr><th></th><th>Komponenta</th><th className="num">%</th><th className="num">cíl g</th>
              <th className="num">nalito g</th><th className="num">zbývá g</th></tr></thead>
            <tbody>
              ${slozky.map((c, i) => html`
                <tr key=${c.id} className=${i === krok ? "rowactive" : ""}
                  style=${zbyvaVse[i] <= tolerance / 2 ? { opacity: .55 } : {}}>
                  <td>${zbyvaVse[i] <= tolerance / 2 ? "✓" : (i === krok ? "▶" : "")}</td>
                  <td>${c.name}${c.aditivum
                    ? html`<span className="tag" style=${{ marginLeft: 6 }}>aditivum</span>` : ""}</td>
                  <td className="num">${fmt(podil[i] * 100)}</td>
                  <td className="num">${fmtG(cil[i])}</td>
                  <td className="num">${fmtG(nalito[i] || 0)}</td>
                  <td className="num">${zbyvaVse[i] > tolerance / 2
                    ? fmtG(zbyvaVse[i])
                    : html`<span className="note" title="méně, než váha rozliší — bere se za navážené">${
                        zbyvaVse[i] > 0.004 ? fmtG(zbyvaVse[i]) + " ›pod tol.‹" : "—"}</span>`}</td>
                </tr>`)}
            </tbody>
          </table>
        <//>`}
    </div>`;
}

/* ============================ ZBYTKY BAREV ============================ */
function StitekZbytku({ zbytek, onClose }) {
  const vytiskni = () => {
    const w = window.open("", "_blank", "width=520,height=420");
    if (!w) return;
    const e = (s) => String(s == null ? "" : s).replace(/[&<>"]/g,
      (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    w.document.write('<!doctype html><html lang="cs"><head><meta charset="utf-8">'
      + "<title>Štítek " + e(zbytek.kod) + "</title><style>"
      + "body{font-family:Segoe UI,Arial,sans-serif;margin:8mm;color:#000}"
      + ".s{border:1.5px solid #000;border-radius:6px;padding:6mm;width:80mm}"
      + ".k{font-family:Consolas,monospace;font-size:20px;font-weight:800;letter-spacing:.08em}"
      + ".n{font-size:15px;font-weight:700;margin:2mm 0 1mm}"
      + ".m{font-size:13px}.p{font-size:10px;color:#555;margin-top:2mm}"
      + "img{display:block;margin:3mm 0 1mm}"
      + "@media print{body{margin:0}}</style></head><body>"
      + '<div class="s">'
      + '<img src="' + code128Url(zbytek.kod, 90, 2) + '" alt="' + e(zbytek.kod) + '">'
      + '<div class="k">' + e(zbytek.kod) + "</div>"
      + '<div class="n">' + e(zbytek.nazev || "—") + "</div>"
      + '<div class="m">' + fmt(n(zbytek.gramu)) + " g"
      + (zbytek.hustota ? " · hustota " + fmt(n(zbytek.hustota), 2) + " g/ml" : "") + "</div>"
      + '<div class="m">'
      + (zbytek.expirace ? "spotřebovat do " + e(zbytek.expirace) : "")
      + (n(zbytek.potlifeH) > 0
          ? (zbytek.expirace ? " · " : "") + "pot life " + fmt(n(zbytek.potlifeH), 0) + " h"
            + (zbytek.namichano ? " od " + new Date(zbytek.namichano).toLocaleString("cs-CZ",
                { day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit" }) : "")
          : "")
      + "</div>"
      + '<div class="p">'
      + (zbytek.zakazka ? "zakázka " + e(zbytek.zakazka) + " · " : "")
      + (zbytek.ulozeno ? new Date(zbytek.ulozeno).toLocaleDateString("cs-CZ") : "")
      + (zbytek.viskozita ? " · viskozita " + fmt(n(zbytek.viskozita), 1) + " s"
          + (zbytek.viskPohar ? " (" + e(zbytek.viskPohar) + ")" : "") : "")
      + "</div></div>"
      + '<script>window.addEventListener("load",function(){setTimeout(function(){window.print()},150)})<\/script>'
      + "</body></html>");
    w.document.close();
  };
  return html`
    <div className="modalbg" onClick=${(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modalbox" style=${{ width: "min(420px,100%)" }}>
        <div className="card" style=${{ margin: 0, textAlign: "center" }}>
          <h2 style=${{ margin: 0 }}>Štítek na kelímek</h2>
          <img src=${code128Url(zbytek.kod, 90, 2)} alt=${zbytek.kod}
            style=${{ maxWidth: "100%", margin: "14px auto 6px", display: "block", background: "#fff", padding: 8, borderRadius: 8 }} />
          <div style=${{ fontFamily: "var(--mono)", fontSize: 22, fontWeight: 800, letterSpacing: ".08em" }}>${zbytek.kod}</div>
          <div style=${{ fontWeight: 700, marginTop: 6 }}>${zbytek.nazev || "—"}</div>
          <div className="note">${fmt(n(zbytek.gramu))} g${zbytek.zakazka ? " · zakázka " + zbytek.zakazka : ""}</div>
          <div className="rowline" style=${{ marginTop: 14, marginBottom: 0, justifyContent: "center" }}>
            <button className="btn" onClick=${vytiskni}>Vytisknout štítek</button>
            <button className="btn sec" onClick=${onClose}>Zavřít</button>
          </div>
        </div>
      </div>
    </div>`;
}

function ZbytkyTab({ zbytky, setZbytky, recipes, materialy, guardDelete, otevrenyKod, onOtevreno, onDoplnit }) {
  const [q, setQ] = useState("");
  const [baze, setBaze] = useState("");          // "" | "s" | "bez"
  const [lhuta, setLhuta] = useState("");        // "" | "brzy" | "prosle"
  const [jenSMnozstvim, setJenSMnozstvim] = useState(true);
  const [stitek, setStitek] = useState(null);
  const [zvyraznen, setZvyraznen] = useState("");
  const [novy, setNovy] = useState(null);

  // kód načtený čtečkou — vyhledá a zvýrazní kelímek
  useEffect(() => {
    if (!otevrenyKod) return;
    setQ(otevrenyKod); setJenSMnozstvim(false); setBaze("");
    setZvyraznen(otevrenyKod);
    if (onOtevreno) onOtevreno();
    const t = setTimeout(() => setZvyraznen(""), 4000);
    return () => clearTimeout(t);
  }, [otevrenyKod]);

  const filtr = useMemo(() => {
    const s = q.trim().toLowerCase();
    return (zbytky || []).filter((z) => {
      if (jenSMnozstvim && !(n(z.gramu) > 0)) return false;
      if (baze === "s" && !maBazi(z)) return false;
      if (baze === "bez" && maBazi(z)) return false;
      if (lhuta === "vtisku") { if (z.stav !== "vtisku") return false; }
      else if (lhuta && stavZbytku(z).stav !== lhuta) return false;
      if (!s) return true;
      return (z.kod + " " + z.nazev + " " + (z.zakazka || "") + " " + (z.produkt || "")
        + " " + (z.slozeni || []).map((c) => c.name).join(" ")).toLowerCase().includes(s);
    });
  }, [zbytky, q, baze, lhuta, jenSMnozstvim]);

  const uprav = (kod, zmena) => setZbytky((prev) => prev.map((z) =>
    z.kod === kod ? Object.assign({}, z, zmena, { zmeneno: Date.now() }) : z));
  const smaz = (z) => guardDelete(() => setZbytky((prev) => prev.filter((x) => x.kod !== z.kod)),
    "smazání zbytku " + z.kod + " (" + z.nazev + ")");

  const celkem = filtr.filter((z) => z.stav !== "vtisku").reduce((s, z) => s + n(z.gramu), 0);

  // upozornění na lhůty — počítá se z aktuálního času, ne z uloženého stavu
  const [ted, setTed] = useState(Date.now());
  useEffect(() => {
    const t = setInterval(() => setTed(Date.now()), 60000);
    return () => clearInterval(t);
  }, []);
  const stavy = useMemo(() => {
    const m = {};
    for (const z of (zbytky || [])) m[z.kod] = stavZbytku(z, ted);
    return m;
  }, [zbytky, ted]);
  const vTisku = (zbytky || []).filter((z) => z.stav === "vtisku");
  const hlidane = (zbytky || []).filter((z) => n(z.gramu) > 0 && z.stav !== "vtisku");
  const prosleKs = hlidane.filter((z) => stavy[z.kod] && stavy[z.kod].stav === "prosle");
  const brzyKs = hlidane.filter((z) => stavy[z.kod] && stavy[z.kod].stav === "brzy");
  /* Barva po lhůtě z kelímku nezmizí — půjde do svozu nebezpečného odpadu a ten
     se platí podle váhy. Sazba se bere u každého kelímku zvlášť, protože je-li
     zapsaná za litr, převádí ji na gramy hustota té které barvy. */
  const likvidaceProslych = prosleKs.reduce((s, z) =>
    s + cenaLikvidace(z.gramu, sazbaLikvidace(materialy, n(z.hustota, 1.2))), 0);

  const [merim, setMerim] = useState(null);   // {kod, s, pohar}
  const zapisViskozitu = () => {
    if (!merim || !(n(merim.s) > 0)) return;
    const z = (zbytky || []).find((x) => x.kod === merim.kod);
    if (!z) { setMerim(null); return; }
    const hist = (z.viskHist || []).concat(
      z.viskozita ? [{ s: n(z.viskozita), kdy: n(z.viskKdy) || n(z.ulozeno) }] : []).slice(-9);
    uprav(merim.kod, { viskozita: n(merim.s), viskPohar: merim.pohar || "", viskKdy: Date.now(),
      viskHist: hist });
    setMerim(null);
  };

  const ulozNovy = () => {
    if (!novy || !novy.nazev.trim() || !(n(novy.gramu) > 0)) return;
    const rec = recipes.find((r) => r.id === novy.receptId) || null;
    const kod = novyKodZbytku(zbytky);
    setZbytky((prev) => [{
      id: uid(), kod: kod, nazev: novy.nazev.trim(), gramu: n(novy.gramu), puvodne: n(novy.gramu),
      hustota: rec ? n(rec.density, 1.2) : 1.2, hex: rec ? rec.hex : "#888888",
      zakazka: novy.zakazka || "", produkt: "", barva: "", tech: "", poloha: "",
      ulozeno: Date.now(), zmeneno: Date.now(), namichano: Date.now(),
      expirace: novy.expirace || "",
      potlifeH: novy.potlifeH === "" ? null : n(novy.potlifeH), tuzidlo: !!novy.tuzidlo,
      viskozita: "", viskPohar: "", viskKdy: 0, viskHist: [],
      pozn: novy.pozn || "", zdroj: rec ? (rec.zdroj || "") : "",
      slozeni: rec ? rec.components.map((c) => ({ name: c.name, pct: n(c.pct) })) : [],
    }].concat(prev));
    setNovy(null);
    setStitek(kod);
  };

  return html`
    <${React.Fragment}>
      <div className="card">
        <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12, gap: 10, flexWrap: "wrap" }}>
          <h2 style=${{ margin: 0 }}>Zbytky barev (${fmt(filtr.length, 0)}${filtr.length !== (zbytky || []).length ? " z " + fmt((zbytky || []).length, 0) : ""})</h2>
          <button className="btn" onClick=${() => setNovy({ nazev: "", gramu: "", receptId: "", zakazka: "",
            expirace: "", potlifeH: "", tuzidlo: false, pozn: "" })}>
            + Uložit zbytek
          </button>
        </div>
        <p className="hint">
          Nespotřebovaná barva z minulé zakázky. Kelímek dostane kód na štítek; při další
          zakázce aplikace sama napíše, kolik z něj jde použít a kolik už stačí domíchat.
        </p>

        ${vTisku.length > 0 && html`
          <div className="specbar" style=${{ marginTop: 0 }}>
            <span className="dot" style=${{ background: "var(--key)" }}></span>
            <span><b>${fmt(vTisku.length, 0)} ${vTisku.length === 1 ? "dávka je označená" : "dávek je označených"} v tisku</b>
              ${" — " + vTisku.slice(0, 3).map((z) => z.kod).join(", ")}${vTisku.length > 3 ? " a další" : ""}.
              Po zakázce načtěte štítek čtečkou, nebo zapište zbytek tlačítkem u řádku.</span>
          </div>`}
        ${(prosleKs.length > 0 || brzyKs.length > 0) && html`
          <div className=${prosleKs.length ? "warnbox" : "okbox"} style=${{ marginTop: 0 }}>
            ${prosleKs.length > 0 && html`<${React.Fragment}>
              <b>${fmt(prosleKs.length, 0)} ${prosleKs.length === 1 ? "kelímek má" : "kelímků má"} po lhůtě</b>
              ${" (" + fmt(prosleKs.reduce((s, z) => s + n(z.gramu), 0)) + " g) — barva už není použitelná, aplikace ji nenabízí."}
              ${likvidaceProslych > 0
                ? " Svoz do nebezpečného odpadu vyjde na "
                  + cenaText(likvidaceProslych, menaDilny(materialy)) + "."
                : ""}
              <br /><//>`}
            ${brzyKs.length > 0 && html`<${React.Fragment}>
              <b>${fmt(brzyKs.length, 0)} ${brzyKs.length === 1 ? "kelímku" : "kelímkům"} končí lhůta:</b>
              ${" "}${brzyKs.slice(0, 4).map((z) => z.kod + " (" + zbyvaText(stavy[z.kod].zbyva) + ")").join(", ")}
              ${brzyKs.length > 4 ? " a další" : ""} — spotřebovat přednostně.<//>`}
          </div>`}

        <label className="f">Filtr</label>
        <div className="chips" style=${{ marginBottom: 8 }}>
          <button className=${"chip" + (baze ? "" : " on")} onClick=${() => setBaze("")}>všechny</button>
          <button className=${"chip" + (baze === "bez" ? " on" : "")} onClick=${() => setBaze("bez")}
            title="čisté barvy bez transparentní báze">bez báze</button>
          <button className=${"chip" + (baze === "s" ? " on" : "")} onClick=${() => setBaze("s")}
            title="barvy ředěné transparentní bází nebo mediem">s bází</button>
          <span style=${{ width: 12 }}></span>
          <button className=${"chip" + (lhuta === "brzy" ? " on" : "")} onClick=${() => setLhuta(lhuta === "brzy" ? "" : "brzy")}
            title="kelímky, kterým brzy končí lhůta">končí lhůta ${brzyKs.length ? "(" + brzyKs.length + ")" : ""}</button>
          <button className=${"chip" + (lhuta === "prosle" ? " on" : "")} onClick=${() => setLhuta(lhuta === "prosle" ? "" : "prosle")}
            title="kelímky po lhůtě">po lhůtě ${prosleKs.length ? "(" + prosleKs.length + ")" : ""}</button>
          <span style=${{ width: 12 }}></span>
          <button className=${"chip" + (jenSMnozstvim ? " on" : "")} onClick=${() => setJenSMnozstvim((v) => !v)}
            title="skrýt kelímky, které už jsou dobrané">jen s množstvím</button>
          ${vTisku.length > 0 && html`<button className=${"chip" + (lhuta === "vtisku" ? " on" : "")}
            onClick=${() => setLhuta(lhuta === "vtisku" ? "" : "vtisku")}
            title="dávky označené při míchání, u kterých se ještě nezapsal zbytek">v tisku (${vTisku.length})</button>`}
        </div>
        <input className="search" value=${q} onChange=${(e) => setQ(e.target.value)}
          placeholder="Hledat podle kódu, barvy, zakázky nebo složky…" style=${{ marginBottom: 12 }} />

        ${!filtr.length ? html`
          <div className="empty">
            ${(zbytky || []).length ? "Filtru nic neodpovídá." : "Zatím žádné zbytky. Uložit je můžete i rovnou z kalkulace po namíchání."}
          </div>` : html`
          <${React.Fragment}>
            <p className="note">Celkem ve filtru <b>${fmt(celkem)} g</b> barvy${
              vTisku.length ? " (dávky v tisku se nepočítají — ještě se z nich tiskne)" : ""}.</p>
            <table className="t">
              <thead><tr><th /><th>Kód</th><th>Barva</th><th className="num">g</th>
                <th>Báze</th><th>Lhůta</th><th>Viskozita</th><th>Zakázka</th><th /></tr></thead>
              <tbody>
                ${filtr.slice(0, 200).map((z) => {
                  const st = stavy[z.kod] || stavZbytku(z, ted);
                  const barvaStavu = st.stav === "prosle" ? "#B23B2A"
                    : (st.stav === "brzy" ? "var(--warn)" : "var(--ink-2)");
                  const predchozi = (z.viskHist || [])[(z.viskHist || []).length - 1];
                  return html`
                  <tr key=${z.kod} className=${zvyraznen === z.kod ? "rowactive" : ""}
                    style=${n(z.gramu) > 0 ? {} : { opacity: .5 }}>
                    <td><span className="swatch" style=${{ background: z.hex }} /></td>
                    <td style=${{ fontFamily: "var(--mono)", fontWeight: 700 }}>${z.kod}</td>
                    <td>
                      <div style=${{ fontWeight: 700 }}>${z.nazev}
                        ${z.stav === "vtisku" && html`<span className="tag" style=${{ marginLeft: 6, background: "var(--key)", color: "#fff", boxShadow: "none" }}
                          title="označeno při míchání, zbytek se teprve zapíše">v tisku</span>`}
                        ${z.tuzidlo && html`<span className="tag" style=${{ marginLeft: 6 }}>s tužidlem</span>`}</div>
                      <div className="note">${(z.slozeni || []).map((c) => c.name + " " + fmt(n(c.pct)) + " %").join(" · ") || "složení neuvedeno"}</div>
                    </td>
                    <td className="num">
                      <input type="number" step="1" min="0" value=${z.gramu} style=${{ width: 78, textAlign: "right" }}
                        onChange=${(e) => uprav(z.kod, { gramu: n(e.target.value) })} />
                    </td>
                    <td><span className="tag">${maBazi(z) ? "s bází" : "bez báze"}</span></td>
                    <td style=${{ minWidth: 150 }}>
                      ${st.doKdy
                        ? html`<div style=${{ color: barvaStavu, fontWeight: st.stav === "ok" ? 400 : 700 }}>
                            ${st.stav === "prosle" ? "po lhůtě " + zbyvaText(st.zbyva)
                              : (st.stav === "brzy" ? "končí " + zbyvaText(st.zbyva) : zbyvaText(st.zbyva))}
                          </div>
                          <div className="note">${st.duvod}</div>`
                        : html`<span className="note">bez lhůty</span>`}
                      <div className="rowline" style=${{ gap: 4, marginTop: 4, marginBottom: 0 }}>
                        <input type="date" value=${z.expirace || ""} style=${{ width: 132, padding: "4px 6px", fontSize: 12 }}
                          title="spotřebovat do" onChange=${(e) => uprav(z.kod, { expirace: e.target.value })} />
                      </div>
                      <div className="rowline" style=${{ gap: 4, marginTop: 4, marginBottom: 0 }}>
                        <input type="number" step="0.5" min="0" placeholder="pot life h"
                          value=${z.potlifeH == null ? "" : z.potlifeH} style=${{ width: 74, padding: "4px 6px", fontSize: 12 }}
                          title="čas použitelnosti po namíchání (hodin)"
                          onChange=${(e) => uprav(z.kod, { potlifeH: e.target.value === "" ? null : n(e.target.value),
                            namichano: n(z.namichano) || n(z.ulozeno) || Date.now() })} />
                        <label className="note" style=${{ display: "flex", alignItems: "center", gap: 4, cursor: "pointer" }}
                          title="dvousložková barva — pot life se počítá od namíchání">
                          <input type="checkbox" checked=${!!z.tuzidlo} style=${{ width: "auto" }}
                            onChange=${(e) => uprav(z.kod, { tuzidlo: e.target.checked,
                              potlifeH: e.target.checked && z.potlifeH == null ? POTLIFE_VYCHOZI : z.potlifeH,
                              namichano: n(z.namichano) || n(z.ulozeno) || Date.now() })} />
                          tužidlo
                        </label>
                      </div>
                    </td>
                    <td style=${{ minWidth: 130 }}>
                      ${z.viskozita
                        ? html`<${React.Fragment}>
                            <div><b>${fmt(n(z.viskozita), 1)} s</b>${z.viskPohar ? " · " + z.viskPohar : ""}</div>
                            <div className="note">měřeno ${z.viskKdy ? new Date(z.viskKdy).toLocaleDateString("cs-CZ") : "—"}
                              ${predchozi ? " · dřív " + fmt(predchozi.s, 1) + " s"
                                + (n(z.viskozita) > predchozi.s ? " (zhoustla)" : "") : ""}</div>
                          <//>`
                        : html`<span className="note">neměřeno</span>`}
                      <button className="btn sec sm" style=${{ marginTop: 4 }}
                        onClick=${() => setMerim({ kod: z.kod, s: "", pohar: z.viskPohar || POHARKY[0] })}>Změřit</button>
                    </td>
                    <td className="note">${z.zakazka || "—"}<br />${z.ulozeno ? new Date(z.ulozeno).toLocaleDateString("cs-CZ") : ""}</td>
                    <td style=${{ whiteSpace: "nowrap" }}>
                      ${z.stav === "vtisku" && html`<${React.Fragment}>
                        <button className="btn sm" onClick=${() => onDoplnit && onDoplnit(z.kod)}
                          title="zapsat, kolik z dávky zbylo">Zadat zbytek</button>${" "}<//>`}
                      <button className="btn sec sm" onClick=${() => setStitek(z.kod)}>Štítek</button>
                      ${" "}
                      <button className="btn danger sm" onClick=${() => smaz(z)}>Smazat</button>
                    </td>
                  </tr>`; })}
              </tbody>
            </table>
          <//>`}
      </div>

      ${novy && html`
        <div className="modalbg" onClick=${(e) => { if (e.target === e.currentTarget) setNovy(null); }}>
          <div className="modalbox" style=${{ width: "min(560px,100%)" }}>
            <div className="card" style=${{ margin: 0 }}>
              <h2 style=${{ margin: 0 }}>Uložit zbytek do evidence</h2>
              <p className="hint">Složení se převezme z vybrané receptury — podle něj se pak pozná, na jakou zakázku zbytek sedí.</p>
              <div className="frow c2">
                <div>
                  <label className="f">Receptura</label>
                  <select value=${novy.receptId} onChange=${(e) => {
                    const r = recipes.find((x) => x.id === e.target.value);
                    setNovy(Object.assign({}, novy, { receptId: e.target.value,
                      nazev: r ? r.name : novy.nazev }));
                  }}>
                    <option value="">— bez receptury (jen název) —</option>
                    ${recipes.slice(0, 400).map((r) => html`<option key=${r.id} value=${r.id}>${r.name}${r.series ? " · " + r.series : ""}</option>`)}
                  </select>
                </div>
                <div>
                  <label className="f">Název barvy</label>
                  <input value=${novy.nazev} onChange=${(e) => setNovy(Object.assign({}, novy, { nazev: e.target.value }))}
                    placeholder="např. PANTONE 485 C" />
                </div>
              </div>
              <div className="frow c3">
                <div>
                  <label className="f">Množství (g)</label>
                  <input type="number" step="1" min="0" value=${novy.gramu}
                    onChange=${(e) => setNovy(Object.assign({}, novy, { gramu: e.target.value }))} />
                </div>
                <div>
                  <label className="f">Ze zakázky</label>
                  <input value=${novy.zakazka} onChange=${(e) => setNovy(Object.assign({}, novy, { zakazka: e.target.value }))} />
                </div>
                <div>
                  <label className="f">Spotřebovat do</label>
                  <input type="date" value=${novy.expirace}
                    onChange=${(e) => setNovy(Object.assign({}, novy, { expirace: e.target.value }))} />
                </div>
              </div>
              <label className="f">Poznámka</label>
              <input value=${novy.pozn} onChange=${(e) => setNovy(Object.assign({}, novy, { pozn: e.target.value }))} />
              <div className="rowline" style=${{ marginTop: 14, marginBottom: 0 }}>
                <button className="btn" disabled=${!novy.nazev.trim() || !(n(novy.gramu) > 0)} onClick=${ulozNovy}>
                  Uložit a vytisknout štítek
                </button>
                <button className="btn sec" onClick=${() => setNovy(null)}>Zrušit</button>
              </div>
            </div>
          </div>
        </div>`}

      ${merim && html`
        <div className="modalbg" onClick=${(e) => { if (e.target === e.currentTarget) setMerim(null); }}>
          <div className="modalbox" style=${{ width: "min(440px,100%)" }}>
            <div className="card" style=${{ margin: 0 }}>
              <h2 style=${{ margin: 0 }}>Změřit viskozitu</h2>
              <p className="hint">
                Výtokový čas z pohárku v sekundách. Barva časem houstne — předchozí měření
                zůstane uložené, takže je posun vidět.
              </p>
              <div className="frow c2">
                <div>
                  <label className="f">Výtokový čas (s)</label>
                  <input type="number" step="0.1" min="0" autoFocus value=${merim.s}
                    onChange=${(e) => setMerim(Object.assign({}, merim, { s: e.target.value }))} />
                </div>
                <div>
                  <label className="f">Pohárek</label>
                  <select value=${merim.pohar} onChange=${(e) => setMerim(Object.assign({}, merim, { pohar: e.target.value }))}>
                    ${POHARKY.map((p) => html`<option key=${p} value=${p}>${p}</option>`)}
                  </select>
                </div>
              </div>
              ${(() => {
                const z = (zbytky || []).find((x) => x.kod === merim.kod);
                const h = z ? (z.viskHist || []).concat(z.viskozita ? [{ s: n(z.viskozita), kdy: n(z.viskKdy) }] : []) : [];
                return h.length ? html`
                  <${React.Fragment}>
                    <label className="f" style=${{ marginTop: 10 }}>Dosavadní měření</label>
                    <div className="note">
                      ${h.map((m, i) => html`<span key=${i}>${i ? " → " : ""}${fmt(m.s, 1)} s
                        (${m.kdy ? new Date(m.kdy).toLocaleDateString("cs-CZ") : "?"})</span>`)}
                    </div>
                  <//>` : null;
              })()}
              <div className="rowline" style=${{ marginTop: 14, marginBottom: 0 }}>
                <button className="btn" disabled=${!(n(merim.s) > 0)} onClick=${zapisViskozitu}>Zapsat měření</button>
                <button className="btn sec" onClick=${() => setMerim(null)}>Zrušit</button>
              </div>
            </div>
          </div>
        </div>`}

      ${stitek && (zbytky || []).some((z) => z.kod === stitek) && html`
        <${StitekZbytku} zbytek=${(zbytky || []).find((z) => z.kod === stitek)}
          onClose=${() => setStitek(null)} />`}
    <//>`;
}

/* ============================ FRONTA MÍCHÁNÍ ============================ */
/* Seznam toho, co se dnes namíchá, a k němu pořadí, ve kterém z fronty vyjde
   nejvíc zbytků. Tabulka ukazuje frontu tak, jak ji dílna zadala, a u každé
   položky to, z čeho se v tom pořadí začne — návrh stojí vedle jako nabídka,
   ne jako přerovnaná fronta. Kdo míchá, musí vidět obojí: co platí teď a co by
   platilo po přerovnání. */
function FrontaTab({ fronta, setFronta, zbytky, materialy }) {
  const cekaji = useMemo(() => frontaKMichani(fronta), [fronta]);
  const vysledek = useMemo(() => cekaji.length
    ? nejlepsiPoradiFronty({ polozky: cekaji, zbytky: zbytky, materialy: materialy })
    : null, [cekaji, zbytky, materialy]);
  // pořadí, ve kterém se míchá teď — z něj jsou čísla i zdroje u řádků tabulky
  const dnes = vysledek ? vysledek.dnes : null;

  const celkemG = cekaji.reduce((s, p) => s + n(p.davkaG), 0);
  const cislaPolozek = useMemo(() => {
    const m = new Map();
    cekaji.forEach((p, i) => m.set(p.kod, i + 1));
    return m;
  }, [cekaji]);
  const odRana = new Date().setHours(0, 0, 0, 0);
  const hotovoDnes = (fronta || []).filter((p) => p.stav === "namichano"
    && n(p.zmeneno) >= odRana).length;

  /* Pořadí se zapisuje do položek jako čísla 1…N. Ukládá se do souboru: co se
     dnes míchá a v jakém pořadí, musí vidět i druhá míchačka. */
  const prerovnej = (kody) => setFronta((prev) => (prev || []).map((p) => {
    const i = kody.indexOf(p.kod);
    return i < 0 ? p : Object.assign({}, p, { poradi: i + 1, zmeneno: Date.now() });
  }));
  const presun = (kod, kam) => {
    const kody = cekaji.map((p) => p.kod);
    const i = kody.indexOf(kod), j = i + kam;
    if (i < 0 || j < 0 || j >= kody.length) return;
    kody[i] = kody[j]; kody[j] = kod;
    prerovnej(kody);
  };
  const uzavri = (kod, jak) => setFronta((prev) => (prev || []).map((p) => p.kod === kod
    ? Object.assign({}, p, { stav: jak, zmeneno: Date.now() }) : p));

  /* Z čeho se položka začne míchat. Kelímek ze skladu má kód na štítku,
     předpověď ho mít nemůže — u té se říká, po které položce fronty vznikne. */
  const zdrojText = (k) => {
    if (!k || !k.zdroj) return "";
    if (!k.zPredpovedi) return "kelímek " + popisKelimku(k.zdroj);
    const c = cislaPolozek.get(k.zdroj.kod);
    return "zbytek po " + (c ? c + ". " : "") + (k.zdroj.nazev || "položce");
  };
  const zpusobText = (k) => k.druh === "presna" ? "přímá shoda"
    : "dopočet, složení sedí na " + fmt(k.shoda * 100, 0) + " %";

  return html`
    <${React.Fragment}>
      <div className="card">
        <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center",
          marginBottom: 12, gap: 10, flexWrap: "wrap" }}>
          <h2 style=${{ margin: 0 }}>Fronta míchání (${fmt(cekaji.length, 0)})</h2>
          ${hotovoDnes > 0 && html`<span className="note">Dnes namícháno ${fmt(hotovoDnes, 0)}
            ${hotovoDnes === 1 ? " položka" : (hotovoDnes < 5 ? " položky" : " položek")}.</span>`}
        </div>

        ${!cekaji.length ? html`
          <div className="empty">
            Ve frontě nic nečeká. Položka se do ní přidá v kalkulaci tlačítkem
            <b> ＋ Do fronty</b> — jakmile je u zakázky vybraná receptura a spočítaná dávka.
          </div>` : html`
        <${React.Fragment}>
          <p className="note" style=${{ marginTop: 0 }}>
            Celkem se má namíchat <b>${fmt(celkemG)} g</b> barvy${dnes && dnes.gramu > 0
              ? ", z toho " + fmt(dnes.gramu) + " g v tomhle pořadí vyjde ze zbytků" : ""}.
            ${dnes && dnes.usporaLikvidace > 0
              ? "Za jejich svoz do nebezpečného odpadu se nezaplatí "
                + cenaText(dnes.usporaLikvidace, vysledek.mena) + "." : ""}
          </p>

          ${vysledek && vysledek.prerovnat && html`
            <div className="okbox" style=${{ marginTop: 0 }}>
              <div className="rowline" style=${{ marginBottom: 6 }}>
                <span><b>Jiné pořadí ušetří o ${fmt(vysledek.zisk.gramu)} g čerstvé barvy víc</b>${
                  vysledek.zisk.uspora > 0
                    ? " — " + cenaText(vysledek.zisk.uspora, vysledek.mena) : ""}.
                  ${" "}Ze zbytků by vyšlo ${fmt(vysledek.plan.gramu)} g místo ${fmt(dnes.gramu)} g.</span>
                <span style=${{ marginLeft: "auto" }}></span>
                <button className="btn sm" onClick=${() => prerovnej(
                  vysledek.plan.poradi.map((i) => cekaji[i].kod))}>Přerovnat frontu</button>
              </div>
              ${vysledek.plan.kroky.map((k, i) => html`
                <div key=${k.polozka.kod} className="note" style=${{ marginTop: 2 }}>
                  ${(i + 1) + ". " + (k.polozka.nazev || "bez názvu") + " · " + fmt(k.davkaG) + " g"}
                  ${k.zdroj
                    ? " ← " + zdrojText(k) + " (" + fmt(k.pouzit) + " g), domíchat "
                      + fmt(k.domichat) + " g"
                    : " ← čerstvě"}
                </div>`)}
            </div>`}
          ${vysledek && !vysledek.prerovnat && html`
            <div className="specbar" style=${{ marginTop: 0 }}>
              <span className="dot" style=${{ background: "var(--ok)" }}></span>
              <span>Zadané pořadí je z téhle fronty to nejlepší${vysledek.vsechna
                ? " — vyzkoušeno všech " + fmt(vysledek.zkouseno, 0) + " pořadí"
                : " z " + fmt(vysledek.zkouseno, 0) + " zkoušených"}.</span>
            </div>`}

          <table className="t">
            <thead><tr><th className="num">#</th><th /><th>Barva</th><th className="num">Dávka</th>
              <th>Zakázka</th><th>Začne se z</th><th className="num">Domíchat</th>
              <th className="num">Ušetří</th><th /></tr></thead>
            <tbody>
              ${cekaji.map((p, i) => {
                const k = dnes && dnes.kroky[i];
                return html`
                <tr key=${p.kod}>
                  <td className="num" style=${{ fontFamily: "var(--mono)", fontWeight: 700 }}>${i + 1}</td>
                  <td><span className="swatch" style=${{ background: p.hex || "#888888" }} /></td>
                  <td>
                    <div style=${{ fontWeight: 700 }}>${p.nazev || "bez názvu"}
                      ${p.tuzidlo && html`<span className="tag" style=${{ marginLeft: 6 }}>s tužidlem</span>`}</div>
                    <div className="note">${p.kod}${p.poloha ? " · " + p.poloha : ""}${
                      p.tech ? " · " + p.tech : ""}</div>
                  </td>
                  <td className="num"><b>${fmt(n(p.davkaG))} g</b>
                    ${p.ks ? html`<div className="note">${fmt(n(p.ks), 0)} ks</div>` : ""}</td>
                  <td>${p.zakazka || html`<span className="note">—</span>`}
                    ${p.produkt && html`<div className="note">${p.produkt}</div>`}</td>
                  <td>${k && k.zdroj
                    ? html`<div>${zdrojText(k)}</div>
                        <div className="note">${fmt(k.pouzit)} g · ${zpusobText(k)}</div>`
                    : html`<span className="note">čerstvě</span>`}</td>
                  <td className="num">${k ? fmt(k.domichat) + " g" : ""}</td>
                  <td className="num">${k && k.uspora != null && k.uspora > 0
                    ? cenaText(k.uspora, vysledek ? vysledek.mena : "")
                    : html`<span className="note">—</span>`}</td>
                  <td>
                    <div className="rowline" style=${{ gap: 4, marginBottom: 0 }}>
                      <button className="btn sec sm" disabled=${i === 0}
                        title="posunout ve frontě dopředu" onClick=${() => presun(p.kod, -1)}>↑</button>
                      <button className="btn sec sm" disabled=${i === cekaji.length - 1}
                        title="posunout ve frontě dozadu" onClick=${() => presun(p.kod, 1)}>↓</button>
                      <button className="btn sm" title="odškrtnout jako namíchané"
                        onClick=${() => uzavri(p.kod, "namichano")}>Namícháno</button>
                      <button className="btn sec sm" title="z fronty pryč, do souboru se zapíše jako zrušená"
                        onClick=${() => uzavri(p.kod, "zruseno")}>✕</button>
                    </div>
                  </td>
                </tr>`;
              })}
            </tbody>
          </table>

          ${vysledek && vysledek.bezPredpovedi.length > 0 && html`
            <p className="note">
              ${vysledek.bezPredpovedi.length === 1
                ? "U položky " + vysledek.bezPredpovedi[0].nazev + " nemá evidence dost minulých"
                  + " dávek téže barvy (potřebuje aspoň " + NEJMIN_VZORKU_ZBYTKU
                  + "), takže s jejím zbytkem pořadí nepočítá."
                : "U " + fmt(vysledek.bezPredpovedi.length, 0) + " položek nemá evidence dost"
                  + " minulých dávek téže barvy (potřebuje aspoň " + NEJMIN_VZORKU_ZBYTKU
                  + "), takže s jejich zbytkem pořadí nepočítá: "
                  + vysledek.bezPredpovedi.slice(0, 4).map((p) => p.nazev).join(", ")
                  + (vysledek.bezPredpovedi.length > 4 ? " a další." : ".")}
            </p>`}
          ${vysledek && !vysledek.cenyUplne && html`
            <p className="note">
              Ceník nemá cenu všech složek u ${vysledek.bezCeny.length === 1
                ? "jedné položky" : fmt(vysledek.bezCeny.length, 0) + " položek"} — pořadí se
              proto vybírá podle gramů čerstvé barvy a koruny se sčítají jen tam, kde je cena známá.
            </p>`}
          ${vysledek && vysledek.plan.kroky.some((k) => k.zdroj && k.zdroj.tuzidlo) && html`
            <p className="note">
              Plán bere i kelímek s tužidlem — ten tuhne a na svou položku musí přijít
              v rámci své lhůty, jinak z pořadí nezbude nic než přehozený den.
            </p>`}
          ${vysledek && !vysledek.vsechna && html`
            <p className="note">
              Fronta má víc než ${FRONTA_PRESNE_DO} položek, takže se pořadí skládalo postupně
              a pak zlepšovalo — vyzkoušeno ${fmt(vysledek.zkouseno, 0)} pořadí. Že lepší
              neexistuje, se u téhle velikosti netvrdí.
            </p>`}
        <//>`}
      </div>
    <//>`;
}

/* ============================ CO PROPADNE ============================ */
/* Přehled dopředu: co dnes, zítra a do konce týdne propadne, kolik je to
   gramů a korun, a na kterou položku fronty to ještě sedne. Řádky jsou
   seskupené po dnech, protože podle dnů se plánuje — odpočet „za 53 hodin"
   se na kalendář okem nepřevádí.

   Lhůty běží samy, i když se nikdo nedívá, takže se tabulka po minutě
   překresluje: dávce s pot life by se jinak ukazoval čas, který už neplatí. */
function PropadTab({ zbytky, davky, fronta, materialy, setDavky,
                     onOtevritKelimek, onOtevritFrontu }) {
  const [ted, setTed] = useState(Date.now());
  useEffect(() => {
    const t = setInterval(() => setTed(Date.now()), 60000);
    return () => clearInterval(t);
  }, []);

  const prehled = useMemo(() => prehledPropadu({ zbytky: zbytky, davky: davky,
    fronta: fronta, materialy: materialy, ted: ted }),
    [zbytky, davky, fronta, materialy, ted]);

  /* Uzavření dávky je jediné, co tahle obrazovka mění — a mění to týmž
     výpočtem jako míchací režim, aby vyhozená dávka znamenala v souboru
     pokaždé totéž. */
  const uzavri = (kodDavky, jak) => setDavky((prev) => (prev || []).map((d) =>
    d.kod === kodDavky ? davkaUzavrena(d, jak) : d));

  // 1 kelímek, 2–4 kelímky, 5 a víc kelímků — opakuje se to na čtyřech místech
  const kusy = (k, a, b, c) => k === 1 ? a : (k < 5 ? b : c);

  // řádky po dnech; všechno prošlé je jeden oddíl, viz nazevDnePropadu
  const dny = [];
  for (const x of prehled.radky) {
    const klic = x.den < 0 ? -1 : x.den;
    const posledni = dny[dny.length - 1];
    if (posledni && posledni.klic === klic) posledni.radky.push(x);
    else dny.push({ klic: klic, doKdy: x.doKdy, radky: [x] });
  }

  const hodnotaText = (h) => (h && h.znama && h.celkem > 0)
    ? cenaText(h.celkem, h.mena) : "";

  return html`
    <${React.Fragment}>
      <div className="card">
        <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center",
          marginBottom: 12, gap: 10, flexWrap: "wrap" }}>
          <h2 style=${{ margin: 0 }}>Co propadne (${fmt(prehled.celkem.ks, 0)})</h2>
          <span className="note">${prehled.frontaKs > 0
            ? "Ve frontě čeká " + fmt(prehled.frontaKs, 0) + " "
              + kusy(prehled.frontaKs, "položka", "položky", "položek") + " k namíchání."
            : "Fronta je prázdná, takže není kam sáhnout."}</span>
        </div>

        <div className="specbar" style=${{ marginTop: 0 }}>
          <span className="dot" style=${{ background: prehled.prosle.ks ? "#B23B2A"
            : (prehled.dnes.ks ? "var(--warn)" : "var(--ok)") }}></span>
          <span>Dnes <b>${fmt(prehled.dnes.gramu)} g</b>${prehled.dnes.hodnota > 0
            ? " · " + cenaText(prehled.dnes.hodnota, prehled.mena) : ""}</span>
          <span>Do ${fmt(prehled.horizont, 0)} dnů <b>${fmt(prehled.celkem.gramu)} g</b>${
            prehled.celkem.hodnota > 0 ? " · " + cenaText(prehled.celkem.hodnota, prehled.mena) : ""}</span>
          ${prehled.celkem.likvidace > 0 && html`
            <span>Svoz do odpadu <b>${cenaText(prehled.celkem.likvidace, prehled.mena)}</b></span>`}
          ${prehled.zachranitelne.ks > 0
            ? html`<span>Do fronty se z toho vejde <b>${fmt(prehled.zachranitelne.gramu)} g</b>${
                prehled.zachranitelne.uspora > 0
                  ? " · ušetří " + cenaText(prehled.zachranitelne.uspora, prehled.mena) : ""}</span>`
            : html`<span className="note">Do fronty se nevejde nic.</span>`}
        </div>

        ${!prehled.radky.length ? html`
          <div className="empty">
            Do ${fmt(prehled.horizont, 0)} dnů nepropadá nic. Sledují se kelímky s datem
            spotřeby nebo s pot life a rozpracované dávky, ve kterých už je tužidlo.
          </div>` : html`
          <${React.Fragment}>
            <table className="t">
              <thead><tr><th /><th>Kód</th><th>Barva</th><th className="num">g</th>
                <th>Lhůta</th><th>Kam to ještě sedne</th><th className="num">Hodnota</th>
                <th /></tr></thead>
              <tbody>
                ${dny.map((d) => html`
                  <${React.Fragment} key=${d.klic}>
                    <tr>
                      <td colSpan="8" style=${{ paddingTop: 16, paddingBottom: 4,
                        borderBottom: "1.5px solid var(--ink)" }}>
                        <b style=${{ textTransform: "uppercase", letterSpacing: "var(--prostrkani)",
                          fontSize: "var(--pismo-popisek)" }}>${nazevDnePropadu(d.klic, d.doKdy)}</b>
                        <span className="note" style=${{ marginLeft: 10 }}>
                          ${fmt(d.radky.reduce((s, x) => s + x.gramu, 0))} g ·
                          ${" " + fmt(d.radky.length, 0) + " "}
                          ${kusy(d.radky.length, "nádoba", "nádoby", "nádob")}</span>
                      </td>
                    </tr>
                    ${d.radky.map((x) => {
                      const barvaStavu = x.den < 0 ? "#B23B2A"
                        : (x.den === 0 ? "var(--warn)" : "var(--ink-2)");
                      return html`
                      <tr key=${x.druh + "-" + x.kod}>
                        <td><span className="swatch" style=${{ background: x.hex }} /></td>
                        <td style=${{ fontFamily: "var(--mono)", fontWeight: 700 }}>${x.kod}
                          ${x.kodDavky && x.kodDavky !== x.kod
                            && html`<div className="note">${x.kodDavky}</div>`}</td>
                        <td>
                          <div style=${{ fontWeight: 700 }}>${x.nazev || "bez názvu"}
                            ${x.naStroji && html`<span className="tag" style=${{ marginLeft: 6,
                              background: "var(--key)", color: "#fff", boxShadow: "none" }}
                              title="nádoba je na stroji — tiskne se z ní">${x.stavPopis}</span>`}</div>
                          <div className="note">${(x.slozeni || []).map((c) => c.name).join(" · ")
                            || "složení neuvedeno"}</div>
                        </td>
                        <td className="num"><b>${fmt(x.gramu)} g</b></td>
                        <td style=${{ minWidth: 130 }}>
                          <div style=${{ color: barvaStavu, fontWeight: x.den > 0 ? 400 : 700 }}>
                            ${x.den < 0 ? "po lhůtě " + zbyvaText(x.zbyva) : zbyvaText(x.zbyva)}</div>
                          <div className="note">${x.duvod}</div>
                        </td>
                        <td style=${{ minWidth: 180 }}>
                          ${x.naStroji
                            ? html`<div className="note">Tiskne se${x.zakazka
                                ? " — zakázka " + x.zakazka : ""}. Dotisknout do lhůty,
                                jinak je to vyhozená dávka.</div>`
                            : (x.navrh
                              ? html`<div><b>${fmt(x.navrh.poradi, 0)}. ${x.navrh.polozka.nazev
                                    || "bez názvu"}</b>${x.navrh.polozka.zakazka
                                    ? " · " + x.navrh.polozka.zakazka : ""}</div>
                                  <div className="note">Vejde se ${fmt(x.navrh.pouzit)} g${
                                    x.navrh.cely ? " — celý kelímek" : ""}, domíchat
                                    ${" " + fmt(x.navrh.domichat)} g · ${x.navrh.presna
                                      ? "přímá shoda"
                                      : "dopočet, složení sedí na " + fmt(x.navrh.shoda * 100, 0) + " %"}</div>`
                              : (x.kam.length
                                ? html`<span className="note">Sedne na
                                    ${" " + fmt(x.kam.length, 0) + " "}
                                    ${kusy(x.kam.length, "položku", "položky", "položek")} fronty,
                                    ale každou z nich si bere kelímek s bližší lhůtou.</span>`
                                : html`<span className="note">Ve frontě nesedne na nic.</span>`))}
                        </td>
                        <td className="num">${hodnotaText(x.hodnota)
                          || html`<span className="note">—</span>`}
                          ${x.hodnota && x.hodnota.znama && !x.hodnota.uplna
                            && html`<div className="note" title="ceník nezná cenu všech složek">a víc</div>`}</td>
                        <td style=${{ whiteSpace: "nowrap" }}>
                          ${x.druh === "davka"
                            ? html`<${React.Fragment}>
                                <button className="btn sm" title="doběhla do tisku"
                                  onClick=${() => uzavri(x.kodDavky, "spotrebovana")}>Spotřebovaná</button>${" "}
                                <button className="btn danger sm"
                                  title="ztuhla nebo se nepovedla — zapíše se jako ztráta"
                                  onClick=${() => uzavri(x.kodDavky, "vyhozena")}>Vyhozená</button>
                              <//>`
                            : html`<button className="btn sec sm"
                                onClick=${() => onOtevritKelimek && onOtevritKelimek(x.kod)}>Kelímek</button>`}
                          ${x.navrh && html`<${React.Fragment}>${" "}
                            <button className="btn sec sm" title="otevřít frontu míchání"
                              onClick=${() => onOtevritFrontu && onOtevritFrontu()}>Fronta</button><//>`}
                        </td>
                      </tr>`;
                    })}
                  <//>`)}
              </tbody>
            </table>

            ${prehled.nikam.length > 0 && html`
              <div className="warnbox">
                <b>${fmt(prehled.nikam.length, 0)}
                  ${" " + kusy(prehled.nikam.length, "kelímek", "kelímky", "kelímků")} nesedne
                  ve frontě na nic</b>${" (" + fmt(prehled.nikam.reduce((s, x) => s + x.gramu, 0)) + " g)"}
                — bez další zakázky s tímhle odstínem se vyhodí${prehled.nikamLikvidace > 0
                  ? " a svoz do nebezpečného odpadu k tomu stojí "
                    + cenaText(prehled.nikamLikvidace, prehled.mena) : ""}. Přidejte položku
                v kalkulaci, nebo kelímek dolijte do zásoby na příští zakázku.
              </div>`}
            ${prehled.zachranitelne.ks > 0 && html`
              <div className="okbox">
                <div className="rowline" style=${{ marginBottom: 0 }}>
                  <span><b>${fmt(prehled.zachranitelne.gramu)} g se dá uplatnit hned</b>${
                    prehled.zachranitelne.uspora > 0
                      ? " — ušetří " + cenaText(prehled.zachranitelne.uspora, prehled.mena) : ""}${
                    prehled.zachranitelne.likvidace > 0
                      ? (prehled.zachranitelne.uspora > 0 ? " a " : " — ušetří ")
                        + cenaText(prehled.zachranitelne.likvidace, prehled.mena)
                        + " na svozu odpadu" : ""}
                    ${" na "}${fmt(prehled.zachranitelne.ks, 0)}
                    ${" " + kusy(prehled.zachranitelne.ks, "položce", "položkách", "položkách")} fronty.
                    Pořadí, ve kterém z fronty vyjde nejvíc zbytků, spočítá Fronta míchání.</span>
                  <span style=${{ marginLeft: "auto" }}></span>
                  <button className="btn sm" onClick=${() => onOtevritFrontu && onOtevritFrontu()}>
                    Fronta míchání</button>
                </div>
              </div>`}
            ${!prehled.celkem.uplne && html`
              <p className="note">
                Ceník nezná cenu všech složek, takže sečtené koruny jsou jen ta část, která
                cenu má — skutečná ztráta je <b>vyšší</b>. Ceny se doplňují v Recepturách.
              </p>`}
            ${prehled.bezSlozeni.length > 0 && html`
              <p className="note">
                U ${fmt(prehled.bezSlozeni.length, 0)}
                ${" " + kusy(prehled.bezSlozeni.length, "dávky", "dávek", "dávek")} se ještě
                netiskl štítek na kelímek, takže evidence nezná jejich složení: lhůta se hlídá,
                hodnota ani uplatnění se nepočítá.
              </p>`}
            ${prehled.starsiProsle.ks > 0 && html`
              <p className="note">
                Starší než ${fmt(prehled.horizont, 0)} dnů po lhůtě je ještě
                ${" " + fmt(prehled.starsiProsle.ks, 0) + " "}
                ${kusy(prehled.starsiProsle.ks, "nádoba", "nádoby", "nádob")}
