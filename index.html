<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ink Recipe Manager — Printcolor</title>
<style>
:root{
  --bg:#D9D8D3; --paper:#D9D8D3; --ink:#18170F; --ink-2:#78766C; --line:#CCCAC1; --line-2:#BDB9AC;
  --cyan:#3E5C8A; --magenta:#C97B63; --yellow:#D9B44A; --key:#5B5952;
  --ok:#2F7D53; --warn:#B5701C;
  --radius:18px;
  --neu:-20px -20px 40px rgba(255,255,255,.8), 20px 20px 40px rgba(24,23,15,.18);
  --neu-sm:-6px -6px 14px rgba(255,255,255,.75), 6px 6px 14px rgba(24,23,15,.20);
  --neu-in:inset 6px 6px 12px rgba(24,23,15,.15), inset -6px -6px 12px rgba(255,255,255,.7);
  --neu-in-lg:inset 8px 8px 18px rgba(24,23,15,.16), inset -8px -8px 18px rgba(255,255,255,.75);
  --modal-shadow:0 24px 70px rgba(24,23,15,.28);
  --logo-shadow:-4px -4px 8px rgba(255,255,255,.85), 4px 4px 8px rgba(24,23,15,.30);
  --mono:ui-monospace,'Cascadia Mono',Consolas,monospace;
  --sans:'Segoe UI',system-ui,Arial,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#232220; --paper:#232220; --ink:#EDEBE4; --ink-2:#9C9990; --line:#38372F; --line-2:#46453B;
  --cyan:#7FA3D9; --magenta:#C97B63; --yellow:#D9B44A; --key:#84817A;
  --ok:#4FAE7C; --warn:#D69340;
  --neu:-20px -20px 40px rgba(255,255,255,.045), 20px 20px 40px rgba(0,0,0,.55);
  --neu-sm:-6px -6px 14px rgba(255,255,255,.05), 6px 6px 14px rgba(0,0,0,.5);
  --neu-in:inset 6px 6px 12px rgba(0,0,0,.45), inset -6px -6px 12px rgba(255,255,255,.045);
  --neu-in-lg:inset 8px 8px 18px rgba(0,0,0,.5), inset -8px -8px 18px rgba(255,255,255,.05);
  --modal-shadow:0 24px 70px rgba(0,0,0,.7);
  --logo-shadow:-4px -4px 8px rgba(255,255,255,.06), 4px 4px 8px rgba(0,0,0,.65);
}
:root[data-theme="dark"] .warnbox,:root[data-theme="dark"] #chyba{background:#3A2F1C;border-color:#5C4A26;color:#E8B168}
:root[data-theme="dark"] .okbox{background:#1E3327;border-color:#2E4F3B;color:#7FD9A8}
:root[data-theme="dark"] .imgwarn{background:#3A2F1C !important;color:#E8B168 !important}
:root[data-theme="dark"] .rowactive td{background:rgba(127,163,217,.16)}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
input,select,button,textarea{font-family:inherit;font-size:14px}
input,select,textarea{border:none;border-radius:10px;padding:9px 12px;background:var(--bg);color:var(--ink);width:100%;box-shadow:var(--neu-in);transition:box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;box-shadow:var(--neu-in),0 0 0 3px rgba(62,92,138,.18)}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
input[type=number]{font-family:var(--mono);appearance:textfield;-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
select{appearance:none;-webkit-appearance:none;-moz-appearance:none;
  background-image:linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(135deg, var(--ink-2) 50%, transparent 50%);
  background-position: calc(100% - 20px) calc(50% - 3px), calc(100% - 14px) calc(50% - 3px);
  background-size:6px 6px, 6px 6px; background-repeat:no-repeat; padding-right:36px}
input[type=color]{padding:4px;height:40px;cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:none;border-radius:7px}
input[type=color]::-moz-color-swatch{border:none;border-radius:7px}
textarea{font-family:var(--mono);font-size:12.5px;min-height:160px;resize:vertical;line-height:1.5}
.hdr{background:var(--paper);color:var(--ink);padding:9px clamp(16px,3vw,40px);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
.themebtn{grid-column:3;justify-self:end;flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:none;background:var(--paper);box-shadow:var(--neu-sm);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;line-height:1;transition:opacity .15s;color:var(--ink)}
.themebtn:hover{opacity:.8}
.hdr h1{grid-column:2;margin:0;font-size:clamp(66px,8.4vw,90px);font-weight:800;letter-spacing:.04em;text-align:center;color:var(--paper);text-shadow:var(--logo-shadow);cursor:pointer;transition:opacity .15s}
.hdr h1:hover{opacity:.85}
.menuwrap{grid-column:1;justify-self:start;position:relative}
.navbtn{width:42px;height:42px;border-radius:50%;border:none;background:var(--paper);box-shadow:var(--neu-sm);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink);transition:opacity .15s}
.navbtn:hover{opacity:.8}
.navdrop{position:absolute;top:calc(100% + 10px);left:0;background:var(--paper);border-radius:14px;box-shadow:var(--neu);padding:6px;z-index:45;min-width:180px;display:flex;flex-direction:column;gap:2px}
.navdrop button{background:none;border:none;text-align:left;padding:10px 14px;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--ink);cursor:pointer;transition:background .15s}
.navdrop button:hover{background:rgba(62,92,138,.10)}
.navdrop button.on{color:var(--cyan);font-weight:800}
:root[data-theme="dark"] .navdrop button:hover{background:rgba(127,163,217,.16)}
.wrap{max-width:none;margin:0;padding:20px clamp(16px,3vw,40px) 56px}
.grid{display:grid;gap:16px}
@media(min-width:960px){.grid.calc{grid-template-columns:minmax(0,1fr) minmax(425px,32.5%);column-gap:48px}}
@media(min-width:1600px){.grid.calc{grid-template-columns:minmax(0,1fr) minmax(475px,30%);column-gap:48px}}
.bigpanel .card{padding:25px 28px;margin-bottom:20px}
.bigpanel .card h2{font-size:17.5px}
.bigpanel .card .hint{font-size:15.5px}
.bigpanel .result-big{font-size:42px}
.bigpanel .result-sub{font-size:16px}
.bigpanel .mixbar{height:25px}
.bigpanel table.t{font-size:17px}
.bigpanel table.t th{padding:10px}
.bigpanel table.t td{padding:11px 10px}
.bigpanel .note{font-size:15px}
.bigpanel .btn{font-size:16px;padding:12px 22px}
.bigpanel .swatch{width:32px;height:32px}
.bigpanel .tag{font-size:14px;padding:4px 11px}
.bigpanel .wbar{height:17px}
.bigform label.f{font-size:13.5px;margin-bottom:8px}
.bigform select,.bigform input{font-size:16px;padding:12px 14px;border-radius:12px;box-shadow:var(--neu-sm)}
.bigform select{padding-right:40px}
.bigform select:focus,.bigform input:focus{box-shadow:var(--neu-sm),0 0 0 3px rgba(62,92,138,.18)}
.bigform .frow{gap:16px;margin-bottom:16px}
.bigform .note{font-size:13.5px}
.bigform .swatch{width:36px;height:36px;border-radius:10px}
.bigform .tgl{font-size:15.5px;gap:12px}
.bigform .tglt{width:50px;height:27px;border-radius:14px}
.bigform .tglt::after{width:23px;height:23px}
.bigform .tgl input:checked + .tglt::after{transform:translateX(23px)}
.bigform .flags{gap:28px}
.card{background:var(--paper);border-radius:var(--radius);padding:20px 22px;margin-bottom:16px;box-shadow:var(--neu)}
.card h2{margin:0 0 4px;font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ink)}
.card .hint{color:var(--ink-2);font-size:12.5px;margin:0 0 14px}
.frow{display:grid;gap:12px;margin-bottom:12px}
@media(min-width:640px){.frow.c2{grid-template-columns:1fr 1fr}.frow.c3{grid-template-columns:1fr 1fr 1fr}.frow.c4{grid-template-columns:1fr 1fr 1fr 1fr}}
label.f{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-bottom:5px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:none;background:var(--paper);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;transition:box-shadow .15s,background .15s,color .15s;box-shadow:var(--neu-sm)}
.chip.on{background:var(--key);color:#fff}
.btn{border:none;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--key);color:#fff;transition:opacity .15s;box-shadow:var(--neu-sm)}
.btn:hover{opacity:.82}
.btn.sec{background:var(--paper);color:var(--ink)}
.btn.sec:hover{opacity:1}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.danger{background:var(--paper);color:#B23B2A}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);border-bottom:1.5px solid var(--ink);padding:8px}
table.t td{border-bottom:1px solid var(--line);padding:9px 8px;vertical-align:top}
td.num,th.num{text-align:right;font-family:var(--mono)}
.swatch{width:26px;height:26px;border-radius:7px;border:1px solid rgba(0,0,0,.12);display:inline-block;vertical-align:middle}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:999px;background:var(--bg);box-shadow:var(--neu-in);color:var(--ink-2)}
.tag.tech{background:var(--key);color:#fff;box-shadow:var(--neu-sm)}
.result-big{font-family:var(--mono);font-size:34px;font-weight:600;line-height:1.05;color:var(--ink)}
.result-sub{font-family:var(--mono);color:var(--ink-2);font-size:13px}
.mixbar{display:flex;height:20px;border-radius:8px;overflow:hidden;box-shadow:var(--neu-in);margin:10px 0 4px}
.warnbox{background:#FBF1E4;border:1px solid #EFD2A0;color:#8A5A1E;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px}
.imgwarn{background:#FBF1E4 !important;color:#8A5A1E !important}
.rowactive td{background:rgba(62,92,138,.10)}
.okbox{background:#EAF3EC;border:1px solid #BCDCC7;color:#1E6B44;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px}
.empty{color:var(--ink-2);font-size:13.5px;padding:20px;text-align:center;border-radius:var(--radius);box-shadow:var(--neu-in)}
.rowline{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.note{font-size:12px;color:var(--ink-2)}
.search{max-width:340px}
pre.tpl{background:var(--bg);border-radius:10px;padding:12px;font-size:12px;overflow:auto;font-family:var(--mono);box-shadow:var(--neu-in)}
.prodphoto{width:128px;height:128px;object-fit:contain;border-radius:12px;background:var(--paper);flex:0 0 auto;box-shadow:var(--neu-sm)}
.poscards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:8px 0 6px}
.poscard{border:none;border-radius:12px;background:var(--paper);padding:8px;cursor:pointer;text-align:center;transition:box-shadow .15s;box-shadow:var(--neu)}
.poscard.on{box-shadow:0 0 0 3px rgba(62,92,138,.25),var(--neu)}
.poscard img{width:100%;height:92px;object-fit:contain;background:transparent}
.poscard .nm{font-size:12px;font-weight:700;margin-top:6px;line-height:1.25}
.poscard .dm{font-family:var(--mono);font-size:11px;color:var(--ink-2);margin-top:3px}
.noimg{width:100%;height:92px;display:flex;align-items:center;justify-content:center;color:var(--ink-2);font-size:11px;background:transparent;border-radius:8px;text-align:center;padding:4px}
.thumb{width:46px;height:46px;object-fit:contain;border-radius:8px;background:var(--paper);box-shadow:var(--neu-sm)}
.wbar{height:14px;background:var(--bg);border-radius:7px;overflow:hidden;box-shadow:var(--neu-in)}
.wbar>span{display:block;height:100%;transition:width .15s}
.cdot{display:inline-block;width:13px;height:13px;border-radius:4px;margin-right:4px;vertical-align:-2px;border:1px solid rgba(0,0,0,.18)}
.modalbg{position:fixed;inset:0;background:rgba(24,23,15,.4);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto}
.modalbox{width:min(860px,100%)}
.modalbox .card{margin:0;box-shadow:var(--modal-shadow)}
.linkbox{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.pickbox{border:none;border-radius:12px;padding:12px;margin-top:10px;background:var(--paper);box-shadow:var(--neu-in)}
.flags{display:flex;gap:20px;flex-wrap:wrap;align-items:center;margin-top:10px}
.tgl{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--ink);user-select:none}
.tgl input{position:absolute;opacity:0;width:0;height:0}
.tglt{width:38px;height:20px;border-radius:11px;background:var(--bg);box-shadow:var(--neu-in);position:relative;transition:background .15s;flex:0 0 auto}
.tglt::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(24,23,15,.3);transition:transform .15s}
.tgl input:checked + .tglt{background:var(--cyan);box-shadow:none}
.tgl input:checked + .tglt::after{transform:translateX(18px)}
#chyba{max-width:700px;margin:60px auto;background:var(--paper);color:#8A5A1E;border-radius:12px;padding:24px;font-size:15px;display:none;box-shadow:var(--neu)}
.searchwrap{position:relative;margin-bottom:20px}
.searchbar{background:var(--paper);border-radius:var(--radius);padding:12px 18px;display:flex;align-items:center;gap:12px;box-shadow:var(--neu)}
.searchbar .ic{flex:0 0 auto;font-size:16px;opacity:.6}
.searchbar input{border:none;background:transparent;padding:6px 0;font-size:15px;box-shadow:none !important}
.searchbar input:focus{border:none;box-shadow:none !important}
.searchbar .count{white-space:nowrap;color:var(--ink-2);font-size:12.5px}
.searchdrop{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--paper);border-radius:12px;box-shadow:var(--neu);z-index:40;max-height:400px;overflow:auto}
.searchitem{display:flex;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.searchitem:hover,.searchitem.hi{background:var(--bg)}
.searchitem-img{width:40px;height:40px;flex:0 0 auto;object-fit:contain;border-radius:8px;background:var(--paper);box-shadow:var(--neu-sm)}
.searchitem-nm{font-size:13px;font-weight:700;line-height:1.3}
.searchitem-dm{font-family:var(--mono);font-size:11px;color:var(--ink-2);margin-top:2px}
.viewtoggle{display:flex;gap:2px;background:var(--paper);border-radius:999px;padding:4px;box-shadow:var(--neu-in)}
.viewtoggle button{border:none;background:none;padding:7px 13px;border-radius:999px;cursor:pointer;color:var(--ink-2);font-size:15px;line-height:1;transition:background .15s,color .15s}
.viewtoggle button.on{background:var(--key);color:#fff}
.pgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-top:4px}
@media(max-width:1500px){.pgrid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:1150px){.pgrid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:800px){.pgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.pgrid{grid-template-columns:1fr}}
.pgcard{background:var(--paper);border-radius:var(--radius);box-shadow:var(--neu);padding:14px;display:flex;flex-direction:column;gap:8px}
.pgcard-img{aspect-ratio:1/1;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:var(--neu-in)}
.pgcard-img img{width:100%;height:100%;object-fit:contain;padding:14px}
.pgcard-nm{font-weight:700;font-size:13.5px;line-height:1.3}
.pgcard-ref{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.pgcard-mat{font-size:12px;color:var(--ink-2);margin-top:2px}
.pgcard-dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px;align-items:center}
.pgcard-actions{display:flex;gap:6px;margin-top:auto;padding-top:4px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--paper);box-shadow:var(--neu);border-radius:14px;padding:12px 20px;z-index:60;font-size:14px;font-weight:600;display:flex;gap:10px;align-items:center;max-width:min(620px,92vw)}
.toast.bad{color:#B23B2A}
:root[data-theme="dark"] .toast.bad{color:#E8837A}
.scanrow{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.scanrow:last-child{border-bottom:none}
.scanraw{font-family:var(--mono);font-size:12px;word-break:break-all;flex:1;min-width:0}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;align-self:center}
.cam{width:100%;max-width:420px;border-radius:12px;background:#000;box-shadow:var(--neu-in);display:block;margin-top:10px}
.specbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-radius:12px;padding:10px 14px;box-shadow:var(--neu-in);margin-bottom:16px;font-size:13px}
.specbar b{font-family:var(--mono)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;margin-top:8px}
.kv .k{color:var(--ink-2);font-size:11px;text-transform:uppercase;letter-spacing:.06em;align-self:center}
.kv .v{font-weight:700}
</style>
</head>
<body>
<div id="chyba">
  <b>Aplikaci se nepodařilo spustit.</b><br><br>
  Nejčastější příčina: ještě nebyl spuštěn skript <code>stahni_obrazky.py</code>, který stáhne
  potřebné knihovny do složky <code>lib/</code>. Otevřete příkazový řádek ve složce aplikace a spusťte:
  <pre>python stahni_obrazky.py</pre>
  Poté tuto stránku načtěte znovu (F5).
</div>
<div id="root"></div>

<script src="data.js"></script>
<script src="lib/react.production.min.js"></script>
<script>if (!window.React) document.write('<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"><\/script>');</script>
<script src="lib/react-dom.production.min.js"></script>
<script>if (!window.ReactDOM) document.write('<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"><\/script>');</script>
<script src="lib/htm.js"></script>
<script>if (!window.htm) document.write('<script src="https://unpkg.com/htm@3.1.1/dist/htm.js"><\/script>');</script>
<script>
if (!window.React || !window.ReactDOM || !window.htm) {
  document.getElementById('chyba').style.display = 'block';
} else {
(function () {
"use strict";
const { useState, useEffect, useMemo, useRef } = React;
const html = htm.bind(React.createElement);

/* ---------- technologie a výchozí spotřeby (g/m², editovatelné) ---------- */
const TECHS = {
  SCR: { name: "Sítotisk (plast, papír) / rotační", gm2: 6.0 },
  PDP: { name: "Tampontisk", gm2: 2.5 },
  TXP: { name: "Sítotisk (textil)", gm2: 14.0 },
  TRS: { name: "Transfer", gm2: 18.0 },
  FIR: { name: "Firing — Low Temperature", gm2: 8.0 },
};
// Standardní sítotisková síta (nití/cm – průměr vlákna µm), řada Sefar/Saati dle DF06.
const SITA = [
  "32-100","36-100","43-80","48-70","54-64","61-64","68-55","68-64",
  "77-48","77-55","77-64","90-40","90-48","95-40","100-40","110-40",
  "120-31","120-34","120-40","130-34","140-31","140-34","150-31","150-34",
  "165-31","180-31",
];
const KRYVOSTI = ["Vysoce krycí", "Standard", "Transparentní"];
const POVRCHY = [
  "Aluminium Foil mat","Bílé","Mléčně bílá / přírodní","Stupeň",
  "Stříbro","transparentní","Černé",
];

const TECH_MAP = [
  { match: /tampon/i, code: "PDP" },
  { match: /rota.n.\s*s.totisk|rotary\s*screen/i, code: "SCR" },
  { match: /s.totisk.*textil|screen.*textil|textil.*s.totisk/i, code: "TXP" },
  { match: /s.totisk|screen\s*print/i, code: "SCR" },
  { match: /^trf$/i, code: "TRS" },
  { match: /digit.ln.\s*transfer/i, code: "TRS" },
  { match: /transfer/i, code: "TRS" },
  { match: /firing|vypalov/i, code: "FIR" },
];
const mapTech = (s) => {
  if (!s) return null;
  const t = String(s).trim();
  if (TECHS[t.toUpperCase()]) return t.toUpperCase();
  for (const m of TECH_MAP) if (m.match.test(t)) return m.code;
  return null;
};
const REMOTE_BASE = "https://www.stricker-europe.com/fotos/produtos/";
const toLocalImg = (u) => (u && u.startsWith(REMOTE_BASE)) ? "obrazky/" + u.slice(REMOTE_BASE.length) : (u || "");

];

const uid = () => Math.random().toString(36).slice(2, 9);
const n = (v, d = 0) => { const x = parseFloat(String(v).replace(",", ".")); return isNaN(x) ? d : x; };
const fmt = (v, dec = 1) => v.toLocaleString("cs-CZ", { minimumFractionDigits: dec, maximumFractionDigits: dec });

function loadLS(key, fallback) {
  try { const s = localStorage.getItem(key); if (s) return JSON.parse(s); } catch (e) {}
  return fallback;
}
function saveLS(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); }
  catch (e) { console.error("Uložení selhalo:", e); }
}

function Img({ src, srcs, alt, className, fallback = null, errFallback = null }) {
  const list = (srcs && srcs.length ? srcs : (src ? [src] : [])).filter(Boolean);
  const key = list.join("|");
  const [idx, setIdx] = useState(0);
  useEffect(() => { setIdx(0); }, [key]);
  if (!list.length) return fallback;
  if (idx >= list.length) return errFallback != null ? errFallback : fallback;
  return html`<img className=${className} src=${list[idx]} alt=${alt || ""} loading="lazy" onError=${() => setIdx((i) => i + 1)} />`;
}

const fixTech = (ps) => (ps || []).map((p) => Object.assign({}, p, {
  positions: (p.positions || []).map((x) => Object.assign({}, x, { tech: x.tech === "TRF" ? "TRS" : x.tech })),
}));

/* ==================== SPECIFIKACE ZAKÁZKY Z ČÁROVÉHO / QR KÓDU ====================
   Kód může nést buď samotné ref. číslo produktu ("11101"), nebo celou zakázku
   jako dvojice klíč=hodnota oddělené | ; nebo tabulátorem, případně JSON:
     IRM1|ref=11101|ks=500|poz=2|barva=105|rec=PANTONE 485 C|ztraty=15|obj=2026-114
   Neznámé klíče se ignorují, chybějící hodnoty zůstanou beze změny.          */
const SPEC_ALIAS = {
  ref:      /^(ref|kod|k.d|code|produkt|product|sku|art|artikl)$/i,
  qty:      /^(ks|mn|mnozstvi|mno.stv.|qty|pocet|po.et|quantity|amount)$/i,
  pos:      /^(poz|pos|poloha|pozice|position|misto|m.sto)$/i,
  color:    /^(barva|color|col|odstin|odst.n)$/i,
  recipe:   /^(rec|receptura|recipe|pantone|formule)$/i,
  series:   /^(rada|r.da|serie|s.rie|series)$/i,
  tech:     /^(tech|technologie|technika|technique)$/i,
  size:     /^(rozmer|rozm.r|velikost|size)$/i,
  component: /^(komponenta|component|dil|d.l)$/i,
  poscode:  /^(poskod|kodpolohy|kod_polohy|k.dpolohy|poscode)$/i,
  gm2:      /^(gm2|g_m2|spotreba|spot.eba)$/i,
  loss:     /^(ztraty|ztr.ty|loss|odpad)$/i,
  minBatch: /^(min|mindavka|min_davka|minbatch)$/i,
  order:    /^(obj|objednavka|objedn.vka|zakazka|zak.zka|order|po)$/i,
  customer: /^(zakaznik|z.kazn.k|customer|objednavatel|odberatel|odb.ratel)$/i,
  mesh:     /^(sito|s.to|mesh)$/i,
  opacity:  /^(kryvost|opacity)$/i,
  surface:  /^(povrch|surface)$/i,
  note:     /^(pozn|poznamka|pozn.mka|note|text)$/i,
};
const SPEC_LABEL = {
  ref: "Produkt (ref.)", qty: "Počet kusů", pos: "Poloha", color: "Barva produktu",
  recipe: "Receptura", series: "Řada barvy", tech: "Technologie",
  size: "Rozměr motivu", component: "Komponenta", poscode: "Kód potisku",
  gm2: "Spotřeba g/m²", loss: "Ztráty %", minBatch: "Min. dávka g",
  order: "Zakázka", customer: "Objednavatel", mesh: "Síto", opacity: "Kryvost",
  surface: "Povrch", note: "Poznámka",
};

/* Zakázkové listy pojmenovávají polohy anglicky („306 - Pouch" / „66 - Front"),
   katalog je má česky („Taška / Přední“) — tohle je most mezi nimi. */
const POS_SLOVNIK = {
  pouch: "taška", bag: "taška", tote: "taška", backpack: "batoh", pen: "propiska",
  umbrella: "deštník", notebook: "blok", notepad: "blok", mug: "hrnek", cup: "šálek",
  bottle: "láhev", box: "krabice", case: "pouzdro", lid: "víčko", cap: "víčko",
  handle: "ucho", strap: "páska", pocket: "kapsa", front: "přední", back: "zadní",
  rear: "zadní", chest: "hrudník", body: "tělo", side: "boční", top: "horní",
  bottom: "spodní", base: "dno", left: "levý", right: "pravý", center: "střed",
  centre: "střed", middle: "střed", interior: "interiér", inside: "interiér",
  sleeve: "rukáv", shirt: "tričko", polo: "polo", towel: "ručník", apron: "zástěra",
  cover: "obal", flap: "chlopeň", keyring: "klíče", charger: "nabíječka",
  thermos: "termoska", jacket: "bunda", hood: "kapuce",
};
const bezDiakritiky = (s) => String(s == null ? "" : s).toLowerCase()
  .normalize("NFD").replace(/[̀-ͯ]/g, "");

/* Kód potisku ze zakázkového listu („92734.5.4.SCR1-01-01", čárově
   „…SCR1X01Y01") určuje polohu přesně: technologie, číslo potisku a dvojice
   indexů, kterou nese i název náhledu v katalogu ({ref}_{potisk}_{X}_{Y}.png). */
function rozborKoduPolohy(kod) {
  const m = String(kod || "").match(/([A-Za-z]{2,4})(\d+)(?:-|[Xx])(\d+)(?:-|[Yy])(\d+)/);
  if (!m) return null;
  return { tech: mapTech(m[1]) || m[1].toUpperCase(),
    potisk: parseInt(m[2], 10), x: parseInt(m[3], 10), y: parseInt(m[4], 10) };
}
const polohaDleKodu = (poss, kod) => {
  const k = rozborKoduPolohy(kod);
  if (!k) return null;
  const pripona = new RegExp("_" + k.potisk + "_" + k.x + "_" + k.y + "\\.[a-z]+$", "i");
  return (poss || []).find((p) => pripona.test(String(p.img || ""))) || null;
};
const posTokeny = (s) => bezDiakritiky(String(s).replace(/\b\d+\s*[-–]\s*/g, " "))
  .split(/[^a-z0-9]+/).filter((w) => w.length >= 3)
  .map((w) => bezDiakritiky(POS_SLOVNIK[w] || w));

function parseSpec(text) {
  const raw = String(text == null ? "" : text).trim();
  const out = { raw, fields: {}, unknown: [] };
  if (!raw) return out;
  const put = (k, v) => {
    const key = String(k).trim();
    for (const f of Object.keys(SPEC_ALIAS)) if (SPEC_ALIAS[f].test(key)) { out.fields[f] = String(v == null ? "" : v).trim(); return; }
    if (key) out.unknown.push(key);
  };
  if (raw[0] === "{") {
    try {
      const o = JSON.parse(raw);
      for (const k of Object.keys(o)) put(k, o[k]);
      return out;
    } catch (e) { /* není JSON — zkusíme dál jako klíč=hodnota */ }
  }
  const body = raw.replace(/^IRM\d*\s*[|;]\s*/i, "");
  let any = false;
  for (const part of body.split(/[|;\n\r\t]+/)) {
    const p = part.trim(); if (!p) continue;
    const m = p.match(/^([^=:]{1,24})[=:]([\s\S]*)$/);
    if (m) { any = true; put(m[1], m[2]); }
  }
  // holý kód (nebo kód, z něhož nešlo nic rozpoznat) bereme jako ref. číslo produktu
  if (!any || Object.keys(out.fields).length === 0) { out.fields.ref = raw; out.unknown.length = 0; }
  return out;
}

/* Namapuje přečtené hodnoty na konkrétní produkt / polohu / barvu / recepturu. */
function resolveSpec(parsed, products, recipes) {
  const f = parsed.fields;
  const r = { parsed: parsed, fields: f, product: null, position: null, colorIdx: -1,
    recipe: null, qty: null, gm2: null, loss: null, minBatch: null, warn: [], ok: [] };
  const num = (key, min) => {
    if (f[key] == null || f[key] === "") return null;
    const v = n(f[key], NaN);
    if (isNaN(v) || v < min) { r.warn.push(SPEC_LABEL[key] + ": „" + f[key] + "“ není platné číslo."); return null; }
    return v;
  };

  if (f.ref) {
    const s = f.ref.toLowerCase();
    r.product = products.find((p) => String(p.ref || "").toLowerCase() === s)
      || products.find((p) => String(p.id || "").toLowerCase() === s)
      || products.find((p) => (String(p.ref || "") + " " + p.name).toLowerCase().includes(s))
      || null;
    if (r.product) r.ok.push("Produkt: " + (r.product.ref ? r.product.ref + " · " : "") + r.product.name);
    else r.warn.push("Produkt „" + f.ref + "“ není v katalogu.");
  } else {
    r.warn.push("Kód neobsahuje referenci produktu.");
  }

  // technologie ze specu ("Tampontisk" i holé "PDP") — rozliší polohy stejného jména;
  // kód potisku ji nese také, takže poslouží i když je kolonka Technologie prázdná
  const zKodu = rozborKoduPolohy(f.poscode);
  const techKod = (f.tech ? mapTech(f.tech) : null) || (zKodu ? mapTech(zKodu.tech) : null);
  if (f.tech && !techKod) r.warn.push("Technologii „" + f.tech + "“ neznám — poloha se vybere bez ní.");

  if (r.product) {
    let poss = r.product.positions || [];
    // kód potisku je nejpřesnější — určuje polohu jednoznačně a nezávisle na jazyku
    const dlePresnehoKodu = polohaDleKodu(poss, f.poscode);
    if (dlePresnehoKodu) {
      r.position = dlePresnehoKodu;
      r.ok.push("Poloha dle kódu " + f.poscode + ": " + r.position.name
        + " · " + r.position.w + "×" + r.position.h + " mm · " + r.position.tech);
    } else if (f.poscode && zKodu) {
      r.warn.push("Kód potisku „" + f.poscode + "“ neodpovídá žádné poloze v katalogu — poloha se hledá podle názvu.");
    }
    if (!r.position && f.pos) {
      const vyber = (seznam) => {
        const s = f.pos.toLowerCase();
        const i = parseInt(f.pos, 10);
        if (/^\d+$/.test(f.pos.trim()) && i >= 1 && i <= seznam.length) return seznam[i - 1];
        return seznam.find((p) => String(p.name || "").toLowerCase() === s)
          || seznam.find((p) => String(p.name || "").toLowerCase().includes(s))
          || seznam.find((p) => String(p.tech || "").toLowerCase() === s)
          || null;
      };
      // poslední záchrana: shoda přes slova (angličtina z listu vs. čeština katalogu)
      const dleSlov = (seznam) => {
        const hledane = posTokeny((f.component || "") + " " + f.pos);
        if (!hledane.length) return null;
        let nej = null;
        for (const p of seznam) {
          const slova = posTokeny(p.name || "");
          const bodu = hledane.filter((h) => slova.some((s) => s.includes(h) || h.includes(s))).length;
          if (bodu && (!nej || bodu > nej.bodu)) nej = { p: p, bodu: bodu };
        }
        return nej ? nej.p : null;
      };
      const dleTech = techKod ? poss.filter((p) => p.tech === techKod) : [];
      r.position = (dleTech.length ? (vyber(dleTech) || dleSlov(dleTech)) : null)
        || vyber(poss) || dleSlov(poss);
      if (r.position) {
        r.ok.push("Poloha: " + r.position.name + " · " + r.position.w + "×" + r.position.h
          + " mm · " + r.position.tech
          + (dleTech.length > 1 ? " (z " + dleTech.length + " poloh dle technologie)" : ""));
      } else {
        r.warn.push("Poloha „" + f.pos + "“ u tohoto produktu neexistuje — ponechána stávající.");
      }
    } else if (!r.position && techKod) {
      const dleTech = poss.filter((p) => p.tech === techKod);
      if (dleTech.length === 1) { r.position = dleTech[0]; r.ok.push("Poloha dle technologie: " + r.position.name); }
      else if (dleTech.length > 1) r.warn.push("Technologie " + techKod + " má " + dleTech.length + " poloh — vyberte ručně.");
      else r.warn.push("Produkt nemá polohu pro technologii " + techKod + ".");
    }
    if (f.color) {
      // hodnota bývá složená („105 — Červená", „105 / cervena") — zkoušíme
      // nejdřív celek, pak jednotlivé části jako kód i jako název
      const cs = r.product.colors || [];
      const cil = f.color.toLowerCase().trim();
      const casti = cil.split(/[\s—–\-/|·:,]+/).filter(Boolean);
      const presne = (s) => {
        let i = cs.findIndex((c) => String(c.code || "").toLowerCase() === s);
        if (i < 0) i = cs.findIndex((c) => String(c.name || "").toLowerCase() === s);
        if (i < 0) i = cs.findIndex((c) => String(c.hex || "").toLowerCase().replace("#", "") === s.replace("#", ""));
        return i;
      };
      let i = presne(cil);
      if (i < 0) for (const k of casti) { i = presne(k); if (i >= 0) break; }
      if (i < 0) i = cs.findIndex((c) => String(c.name || "").toLowerCase().includes(cil));
      if (i < 0) for (const k of casti) {
        if (k.length < 3) continue;
        i = cs.findIndex((c) => String(c.name || "").toLowerCase().includes(k));
        if (i >= 0) break;
      }
      r.colorIdx = i;
      if (i >= 0) r.ok.push("Barva: " + (cs[i].code || "") + (cs[i].name ? " — " + cs[i].name : ""));
      else r.warn.push("Barva „" + f.color + "“ u tohoto produktu neexistuje — ponechána stávající.");
    }
  }

  if (f.recipe) {
    const s = f.recipe.toLowerCase();
    // je-li známa řada barvy, hledá se nejdřív v ní — stejný Pantone kód
    // bývá v databázi vícekrát, pokaždé pro jinou řadu
    const rada = (f.series || "").trim().toLowerCase();
    const vRade = rada ? recipes.filter((x) => String(x.series || "").toLowerCase().includes(rada)) : [];
    const najdi = (seznam) => seznam.find((x) => x.name.toLowerCase() === s)
      || seznam.find((x) => x.name.toLowerCase().includes(s))
      || (/^\d{2,4}\s*[a-z]?$/i.test(f.recipe.trim())
          ? seznam.find((x) => new RegExp("\\b" + f.recipe.trim().replace(/\s+/g, "\\s*") + "\\b", "i").test(x.name))
          : null)
      || null;
    r.recipe = (vRade.length ? najdi(vRade) : null) || najdi(recipes);
    if (r.recipe) {
      r.ok.push("Receptura: " + r.recipe.name + (r.recipe.series ? " · " + r.recipe.series : ""));
      if (rada && !String(r.recipe.series || "").toLowerCase().includes(rada))
        r.warn.push("Řada „" + f.series + "“ se neshoduje s řadou receptury („" + (r.recipe.series || "—") + "“) — ověřte.");
    } else if (rada && recipes.length && !vRade.length) {
      r.warn.push("Řada „" + f.series + "“ není v databázi receptur — receptura nenalezena.");
    } else {
      r.warn.push("Receptura „" + f.recipe + "“ nebyla nalezena — nahrajte databázi v Import / data.");
    }
  }

  // Skutečný rozměr motivu ze zakázkového listu. Katalog nese jen největší
  // možnou tiskovou plochu, takže bez tohohle údaje vychází spotřeba barvy
  // klidně několikanásobně vyšší, než jaká doopravdy je.
  if (f.size) {
    const m = String(f.size).match(/(\d+(?:[.,]\d+)?)\s*[x×*]\s*(\d+(?:[.,]\d+)?)/i);
    if (m) {
      r.w = n(m[1]); r.h = n(m[2]);
      r.ok.push("Rozměr motivu: " + fmt(r.w, 1) + "×" + fmt(r.h, 1) + " mm"
        + (r.position ? " (katalog uvádí max. " + fmt(n(r.position.w), 0) + "×" + fmt(n(r.position.h), 0) + " mm)" : ""));
    } else {
      r.warn.push("Rozměr „" + f.size + "“ se nepodařilo přečíst — použije se rozměr z katalogu.");
    }
  }

  r.qty = num("qty", 1);
  r.gm2 = num("gm2", 0.01);
  r.loss = num("loss", 0);
  r.minBatch = num("minBatch", 0);
  if (r.qty != null) r.ok.push("Počet kusů: " + fmt(r.qty, 0));
  return r;
}

/* ======================= NAPOJENÍ NA SGPS (přes lokální most) =======================
   Aplikace nikdy nemluví se SGPS přímo — z prohlížeče to z bezpečnostních důvodů
   nejde. Data poskytuje skript most.py běžící na tomto počítači.
   Je-li aplikace otevřená z mostu (http://localhost:…), použije se stejný původ;
   při otevření dvojklikem (file://) se most zkusí na uloženém portu.            */
/* Most běží vždy na tomhle počítači. Vlastní adresu použijeme jen tehdy,
   když z něj aplikace přímo běží; je-li stránka odjinud (třeba z GitHubu),
   míříme na localhost — jinak bychom API hledali na cizím serveru. */
const MOST_VYCHOZI = "http://localhost:8765";
let MOST_NALEZENY = "";     // adresa, na které se most naposledy ozval

/* Adresy, na kterých se most zkusí najít. Ručně zadaná má přednost; jinak
   nejdřív vlastní původ (aplikace může běžet přímo z mostu) a pak tenhle
   počítač. Že stránka běží z localhostu ještě neznamená, že je most na témž
   portu — proto se adresy opravdu zkoušejí, ne jen odhadují. */
function sgpsKandidati() {
  const ulozena = String(loadLS("irm-most-adresa", "") || "").trim().replace(/\/+$/, "");
  if (ulozena) return [ulozena];
  const port = n(loadLS("irm-sgps-port", 8765), 8765);
  const list = [];
  if (MOST_NALEZENY) list.push(MOST_NALEZENY);
  if (location.protocol === "http:" || location.protocol === "https:") list.push(location.origin);
  list.push("http://localhost:" + port);
  list.push("http://127.0.0.1:" + port);
  return list.filter((a, i) => a && list.indexOf(a) === i);
}
const sgpsAdresa = () => MOST_NALEZENY || sgpsKandidati()[0];
const sgpsBase = () => sgpsAdresa() + "/api";

/* Ověří, že na dané adrese opravdu odpovídá most (a ne třeba jiný web). */
async function zkusMost(adresa) {
  const r = await fetch(adresa + "/api/stav", { cache: "no-store" });
  if (!r.ok) throw new Error("odpověď " + r.status);
  const d = await r.json();
  if (!d || d.ok !== true || d.verze === undefined) throw new Error("na téhle adrese neodpovídá most");
  return d;
}

async function sgpsGet(cesta) {
  const r = await fetch(sgpsBase() + cesta, { cache: "no-store" });
  let data = null;
  try { data = await r.json(); } catch (e) {}
  if (!r.ok || (data && data.ok === false)) {
    throw new Error((data && data.chyba) || ("most odpověděl " + r.status));
  }
  return data;
}

/* Zakázku ze SGPS převede na tentýž tvar, jaký vzniká čtením čárového kódu —
   dál už se použije stejné dohledání produktu, polohy, barvy a receptury. */
function zakazkaNaSpec(z) {
  const f = {};
  const put = (k, v) => { if (v != null && String(v).trim() !== "") f[k] = String(v).trim(); };
  put("ref", z.ref); put("qty", z.ks); put("pos", z.poloha); put("color", z.barva);
  put("recipe", z.receptura); put("gm2", z.gm2); put("loss", z.ztraty); put("minBatch", z.min);
  put("order", z.cislo); put("customer", z.zakaznik);
  put("mesh", z.sito); put("opacity", z.kryvost); put("surface", z.povrch);
  put("note", [z.pozn, z.termin ? "termín " + z.termin : ""].filter(Boolean).join(" · "));
  return { raw: "SGPS · zakázka " + (z.cislo || "?"), fields: f, unknown: [], sgps: z };
}

function useSgps() {
  const [stav, setStav] = useState({ stav: "hleda" });   // hleda | ok | chyba
  const pokusu = useRef(0);
  const zjisti = async (tise) => {
    if (!tise) setStav({ stav: "hleda" });
    let posledni = "";
    for (const adresa of sgpsKandidati()) {
      try {
        const s = await zkusMost(adresa);
        MOST_NALEZENY = adresa;
        pokusu.current = 0;
        setStav(Object.assign({ stav: s.chyba ? "chyba" : "ok", adresa: adresa }, s));
        return;
      } catch (e) { posledni = String((e && e.message) || e); }
    }
    MOST_NALEZENY = "";
    setStav({ stav: "chyba", chyba: posledni || "most se neozval", most: false });
  };
  useEffect(() => { zjisti(); }, []);
  // Dokud most neběží, zkoušíme to dál — spustí-li se kdykoli později,
  // aplikace si ho najde sama a není potřeba ji načítat znovu.
  useEffect(() => {
    if (stav.stav === "ok") return;
    pokusu.current += 1;
    const cekat = Math.min(3000 + pokusu.current * 1000, 15000);
    const t = setTimeout(() => zjisti(true), cekat);
    return () => clearTimeout(t);
  }, [stav]);
  return { stav, zjisti };
}

/* ========================= NAČTENÍ SPECIFIKACE Z PDF =========================
   PDF rozebírá most (most.py + pdf_spec.py) — prohlížeč to sám neumí.
   Rozpoznaná pole jdou před použitím ručně opravit, takže list se
   zvládne zpracovat i dřív, než je rozpoznávání doladěné na váš formulář. */
const PDF_NA_SPEC = {
  ref: "ref", ks: "qty", poloha: "pos", barva: "color", receptura: "recipe",
  rada: "series", technologie: "tech", gm2: "gm2", ztraty: "loss", min: "minBatch",
  kod_polohy: "poscode",
  zakazka: "order", zakaznik: "customer", sito: "mesh", kryvost: "opacity",
  povrch: "surface", pozn: "note", rozmer: "size", komponenta: "component",
};
const PDF_PORADI = ["zakazka", "zakaznik", "ref", "nazev", "barva", "ks",
  "kod_polohy", "komponenta", "poloha", "rozmer", "technologie", "receptura", "rada", "sito",
  "stroj", "kryvost", "povrch", "material", "preduprava",
  "gm2", "ztraty", "min", "termin", "pozn"];
const PDF_POPIS = {
  ref: "Ref. produktu", nazev: "Název produktu", ks: "Počet kusů", poloha: "Umístění",
  barva: "Barva produktu", receptura: "Tisková barva", rada: "Řada barvy",
  sito: "Síto", stroj: "Stroj", kryvost: "Kryvost", povrch: "Povrch",
  technologie: "Technologie", gm2: "Spotřeba g/m²", ztraty: "Ztráty %",
  min: "Min. dávka g", zakazka: "Zakázka", zakaznik: "Zákazník",
  termin: "Termín", pozn: "Poznámka", rozmer: "Rozměr potisku",
  komponenta: "Komponenta", material: "Materiál", preduprava: "Předúprava",
  kod_polohy: "Kód potisku",
};

function poleNaSpec(pole) {
  const f = {};
  const put = (k, v) => { if (v != null && String(v).trim() !== "") f[k] = String(v).trim(); };
  for (const [zdroj, cil] of Object.entries(PDF_NA_SPEC)) put(cil, pole[zdroj]);
  const doPozn = [pole.pozn, pole.stroj ? "stroj " + pole.stroj : "",
    pole.material ? "materiál " + pole.material : "",
    pole.preduprava ? "předúprava " + pole.preduprava : "",
    pole.termin ? "termín " + pole.termin : ""].filter(Boolean).join(" · ");
  if (doPozn) f.note = doPozn;
  return { raw: "PDF · " + (pole.zakazka || pole.ref || "zakázkový list"), fields: f, unknown: [] };
}

/* Odeslání PDF mostu — sdílené pro záložku i pro okno v kalkulaci. */
async function precistPdf(f) {
  const adresa = sgpsBase() + "/pdf";
  try {
    // Soubor posíláme jako "text/plain", aby šlo o jednoduchý požadavek.
    // S typem application/pdf by si prohlížeč vyžádal ještě předběžný dotaz
    // navíc, který v některých nastaveních (zvlášť při otevření dvojklikem)
    // neprojde. Most čte tělo požadavku po bajtech, na typu mu nezáleží.
    const r = await fetch(adresa, { method: "POST", body: new Blob([f], { type: "text/plain" }) });
    const d = await r.json();
    if (!d.ok) throw new Error(d.chyba || "PDF se nepodařilo přečíst.");
    return { pole: d.pole || {}, zdroj: d.zdroj || {}, text: d.text || "",
      obrazky: d.obrazky || [], stranky: d.stranky || [] };
  } catch (e) {
    // "Failed to fetch" znamená, že se požadavek vůbec neodeslal. Zjistíme
    // proto rovnou, jestli most ještě odpovídá, ať se nehádá naslepo.
    let popis = String((e && e.message) || e);
    if (/fetch|network|načíst|load failed/i.test(popis)) {
      let zije = false;
      try { await sgpsGet("/stav"); zije = true; } catch (e2) {}
      popis = zije
        ? "Most odpovídá, ale soubor se k němu nedostal (" + popis + "). "
          + "Bývá to blokace ochranou prohlížeče nebo antivirem — zkuste aplikaci "
          + "otevřít přímo z adresy " + sgpsBase().replace("/api", "") + "."
        : "Most přestal odpovídat na " + adresa + ". Zkontrolujte okno, ve kterém "
          + "běží python most.py — nesmí být zavřené a nemá v něm být chybový výpis.";
    }
    const chyba = new Error(popis);
    chyba.mostZije = !/přestal odpovídat/.test(popis);
    throw chyba;
  }
}

/* Mřížka upravitelných polí ze zakázkového listu + náhled syrového textu. */

/* Vyhodnocení specu proti katalogu — co se povedlo napárovat a co ne. */
function SpecVysledek({ res }) {

  return html`
    <${React.Fragment}>
      ${res.ok.map((t, i) => html`<div key=${i} className="okbox" style=${{ marginTop: 6 }}>✓ ${t}</div>`)}

}

function PdfTab({ sgps, products, recipes, onApply, ulozeny, setUlozeny }) {
  // rozpracovaný spec drží aplikace, aby se dal kdykoli otevřít a upravit znovu
  const stav = ulozeny.stav, pole = ulozeny.pole, zdroj = ulozeny.zdroj;
  const text = ulozeny.text, jmeno = ulozeny.jmeno, chyba = ulozeny.chyba;
  const uprav = (zmena) => setUlozeny(Object.assign({}, ulozeny, zmena));
  const setPole = (p) => uprav({ pole: p });
  const [nadHranici, setNadHranici] = useState(false);
  const souborRef = useRef(null);

  const posli = async (f) => {
    if (!f) return;
    setUlozeny({ stav: "cte", pole: {}, zdroj: {}, text: "", jmeno: f.name, chyba: "" });
    try {
      const d = await precistPdf(f);
      setUlozeny({ stav: "hotovo", pole: d.pole, zdroj: d.zdroj, text: d.text,
        obrazky: d.obrazky, stranky: d.stranky, jmeno: f.name, chyba: "" });
    } catch (e) {
      if (e && e.mostZije === false) sgps.zjisti();
      setUlozeny({ stav: "chyba", pole: {}, zdroj: {}, text: "", obrazky: [], jmeno: f.name,
        chyba: String((e && e.message) || e) });
    }
  };
  const naSoubor = (e) => { const f = e.target.files && e.target.files[0]; e.target.value = ""; posli(f); };
  const naPusteni = (e) => {
    e.preventDefault(); setNadHranici(false);
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) posli(f);
  };

  const res = useMemo(() => (stav === "hotovo" && Object.keys(pole).length)
    ? resolveSpec(poleNaSpec(pole), products, recipes) : null, [pole, stav, products, recipes]);

  if (sgps.stav.stav !== "ok") return html`
    <div className="card">
      <h2>Načtení specifikace z PDF</h2>
      <div className="warnbox" style=${{ marginTop: 0 }}>
        <b>Most neběží.</b> PDF čte pomocný program — prohlížeč to sám neumí.
      </div>
      <p className="hint" style=${{ marginTop: 12 }}>Ve složce aplikace spusťte:</p>
      <pre className="tpl">python most.py</pre>
      <p className="note">Most se sám otevře na http://localhost:8765 a nechá se běžet po celou dobu práce.</p>
      <button className="btn" style=${{ marginTop: 10 }} onClick=${sgps.zjisti}>Zkusit znovu</button>
    </div>`;

  return html`
    <${React.Fragment}>
      <div className="card">
        <h2>Načtení specifikace z PDF</h2>
        <p className="hint">Přetáhněte sem zakázkový list v PDF. Rozpoznané údaje si před použitím zkontrolujte — každé pole jde přepsat.</p>
        <div onDragOver=${(e) => { e.preventDefault(); setNadHranici(true); }}
          onDragLeave=${() => setNadHranici(false)} onDrop=${naPusteni}
          onClick=${() => souborRef.current && souborRef.current.click()}
          style=${{ borderRadius: 14, padding: "34px 20px", textAlign: "center", cursor: "pointer",
            boxShadow: nadHranici ? "var(--neu-in),0 0 0 3px rgba(62,92,138,.25)" : "var(--neu-in)" }}>
          <div style=${{ fontSize: 30, opacity: .5 }}>⇩</div>
          <div style=${{ fontWeight: 700, marginTop: 6 }}>
            ${stav === "cte" ? "Čtu PDF…" : "Přetáhněte PDF sem, nebo klikněte a vyberte soubor"}
          </div>
          ${jmeno && html`<div className="note" style=${{ marginTop: 4 }}>${jmeno}</div>`}
        </div>
        <input ref=${souborRef} type="file" accept=".pdf,application/pdf" style=${{ display: "none" }} onChange=${naSoubor} />
        ${stav === "chyba" && html`
          <${React.Fragment}>
            <div className="warnbox">${chyba}</div>
            <div className="rowline" style=${{ marginTop: 10, marginBottom: 0 }}>
              <button className="btn sec sm" onClick=${async () => {
                const t0 = Date.now();
                try {
                  const d = await sgpsGet("/stav");
                  uprav({ chyba: "Most odpovídá za " + (Date.now() - t0) + " ms — režim „" + d.rezim
                    + "“, čtení PDF " + (d.pdf ? "připravené" : "NEDOSTUPNÉ (chybí pdf_spec.py)")
                    + ", adresa " + sgpsBase() + "." });
                } catch (e2) {
                  uprav({ chyba: "Most se neozval na " + sgpsBase() + " — " + String((e2 && e2.message) || e2) });
                }
              }}>Ověřit spojení s mostem</button>
              <span className="note">vypíše, na jaké adrese se aplikace mostu ptá a co odpověděl</span>
            </div>
          <//>`}
      </div>

      ${stav === "hotovo" && html`
        <div className="card">
          <h2>Rozpoznané údaje (${Object.keys(pole).length})</h2>
          <${SpecPole} pole=${pole} setPole=${setPole} zdroj=${zdroj} text=${text} />
        </div>

        <div className="card">
          <h2>Co z toho aplikace poznala</h2>
          <${SpecVysledek} res=${res} />
          ${res && html`
            <div className="rowline" style=${{ marginTop: 14, marginBottom: 0 }}>
              <button className="btn" disabled=${!res.product} onClick=${() => onApply(res)}>Použít v kalkulaci →</button>
              ${!res.product && html`<span className="note">bez rozpoznaného produktu nelze pokračovat — doplňte ref. číslo výše</span>`}
            </div>`}
        </div>`}
    <//>`;
}

/* ====================== SKUTEČNÉ POKRYTÍ MOTIVU ======================
   Rozměr potisku je obdélník, do kterého se motiv vejde — jenže logo v něm
   nechává spoustu volného místa. Tenhle rozbor spočítá, jakou část plochy
   barva doopravdy pokryje, a tím i kolik jí bude potřeba. */
/* Vzdálenost každého bodu k nejbližší barvě (dvouprůchodový chamfer 3/4).
   Slouží k rozšíření motivu o zadané odsazení — barva se kolem každého
   objektu rozpíjí, takže potištěná plocha je vždycky o kus větší než motiv. */
function vzdalenostOdBarvy(maska, w, h) {
  const NEKONECNO = 1 << 28;
  const d = new Int32Array(w * h);
  for (let i = 0; i < w * h; i++) d[i] = maska[i] ? 0 : NEKONECNO;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x;
    if (!d[i]) continue;
    let v = d[i];
    if (x > 0) v = Math.min(v, d[i - 1] + 3);
    if (y > 0) {
      v = Math.min(v, d[i - w] + 3);
      if (x > 0) v = Math.min(v, d[i - w - 1] + 4);
      if (x < w - 1) v = Math.min(v, d[i - w + 1] + 4);
    }
    d[i] = v;
  }
  for (let y = h - 1; y >= 0; y--) for (let x = w - 1; x >= 0; x--) {
    const i = y * w + x;
    if (!d[i]) continue;
    let v = d[i];
    if (x < w - 1) v = Math.min(v, d[i + 1] + 3);
    if (y < h - 1) {
      v = Math.min(v, d[i + w] + 3);
      if (x < w - 1) v = Math.min(v, d[i + w + 1] + 4);
      if (x > 0) v = Math.min(v, d[i + w - 1] + 4);
    }
    d[i] = v;
  }
  return d;
}

/* Najde na stránce souvislé bloky kresby — kandidáty na náhled potisku.
   Je-li znám rozměr potisku, seřadí je podle shody poměru stran: náhled
   potisku má stejný tvar jako plocha, na kterou se tiskne. */
function najdiBloky(img, prah, rozmerMm) {
  const MAX = 500;
  const m = Math.min(1, MAX / Math.max(img.width, img.height, 1));
  const w = Math.max(1, Math.round(img.width * m)), h = Math.max(1, Math.round(img.height * m));
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(img, 0, 0, w, h);
  const d = ctx.getImageData(0, 0, w, h).data;
  const maska = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) {
    const j = i * 4;
    if (d[j + 3] > 40 && (765 - d[j] - d[j + 1] - d[j + 2]) / 3 > prah) maska[i] = 1;
  }
  // spojíme, co je blízko u sebe, aby písmena a značky tvořily jeden blok
  const dist = vzdalenostOdBarvy(maska, w, h);
  const slepeno = new Uint8Array(w * h);
  const dosah = Math.max(3, Math.round(w * 0.018)) * 3;
  for (let i = 0; i < w * h; i++) if (dist[i] <= dosah) slepeno[i] = 1;

  const znacka = new Int32Array(w * h);
  const bloky = [];
  const fronta = new Int32Array(w * h);
  for (let s = 0; s < w * h; s++) {
    if (!slepeno[s] || znacka[s]) continue;
    let zac = 0, kon = 0;
    fronta[kon++] = s; znacka[s] = bloky.length + 1;
    let x0 = s % w, x1 = x0, y0 = (s / w) | 0, y1 = y0, kolik = 0, barvy = 0;
    while (zac < kon) {
      const i = fronta[zac++], x = i % w, y = (i / w) | 0;
      kolik++; if (maska[i]) barvy++;
      if (x < x0) x0 = x; if (x > x1) x1 = x;
      if (y < y0) y0 = y; if (y > y1) y1 = y;
      const sousedi = [x > 0 ? i - 1 : -1, x < w - 1 ? i + 1 : -1, y > 0 ? i - w : -1, y < h - 1 ? i + w : -1];
      for (const k of sousedi) if (k >= 0 && slepeno[k] && !znacka[k]) { znacka[k] = bloky.length + 1; fronta[kon++] = k; }
    }
    if (barvy < 40) continue;
    bloky.push({ x: x0 / m, y: y0 / m, w: (x1 - x0 + 1) / m, h: (y1 - y0 + 1) / m, vaha: barvy });
  }

  // Bloky nad sebou, které se z větší části překrývají do stran, patří k sobě
  // (nadpis a pod ním značky tvoří jeden náhled potisku).
  const mezera = (h / m) * 0.05;
  for (let kolo = 0; kolo < 4; kolo++) {
    let spojeno = false;
    for (let i = 0; i < bloky.length && !spojeno; i++) {
      for (let j = i + 1; j < bloky.length && !spojeno; j++) {
        const a = bloky[i], b = bloky[j];
        const prekryv = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
        const uzsi = Math.min(a.w, b.w);
        const svisle = Math.max(a.y, b.y) - Math.min(a.y + a.h, b.y + b.h);
        if (prekryv > uzsi * 0.5 && svisle < mezera) {
          const x0 = Math.min(a.x, b.x), y0 = Math.min(a.y, b.y);
          bloky[i] = { x: x0, y: y0,
            w: Math.max(a.x + a.w, b.x + b.w) - x0, h: Math.max(a.y + a.h, b.y + b.h) - y0,
            vaha: a.vaha + b.vaha };
          bloky.splice(j, 1);
          spojeno = true;
        }
      }
    }
    if (!spojeno) break;
  }

  const cilovy = (rozmerMm && rozmerMm.w > 0 && rozmerMm.h > 0) ? rozmerMm.w / rozmerMm.h : 0;
  for (const b of bloky) {
    b.pomer = b.h > 0 ? b.w / b.h : 0;
    b.shoda = cilovy && b.pomer ? Math.abs(Math.log(b.pomer / cilovy)) : null;
  }
  // Poměr stran rozhoduje jen hrubě — mezi tvarově srovnatelnými bloky vyhraje
  // ten největší, protože z něj vyjde pokrytí přesněji (týž motiv bývá na listu
  // i zmenšený na fotce produktu).
  if (cilovy) bloky.sort((a, b) =>
    (Math.floor(a.shoda / 0.5) - Math.floor(b.shoda / 0.5)) || (b.w * b.h - a.w * a.h));
  else bloky.sort((a, b) => b.vaha - a.vaha);
  return bloky.slice(0, 6);
}

/* Vytáhne z výřezu barvy, které v něm jsou — kandidáty na barvu potisku.
   Pozadí (nejčastější barvu) vynechá. */
function najdiBarvy(img, vyrez, limit) {
  const zx = vyrez ? Math.max(0, Math.round(vyrez.x)) : 0;
  const zy = vyrez ? Math.max(0, Math.round(vyrez.y)) : 0;
  const zw = vyrez ? Math.max(1, Math.round(vyrez.w)) : img.width;
  const zh = vyrez ? Math.max(1, Math.round(vyrez.h)) : img.height;
  const m = Math.min(1, 400 / Math.max(zw, zh, 1));
  const w = Math.max(1, Math.round(zw * m)), h = Math.max(1, Math.round(zh * m));
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(img, zx, zy, zw, zh, 0, 0, w, h);
  const d = ctx.getImageData(0, 0, w, h).data;
  const kose = new Map();
  for (let i = 0; i < w * h; i++) {
    const j = i * 4;
    if (d[j + 3] < 40) continue;
    const k = ((d[j] >> 5) << 10) | ((d[j + 1] >> 5) << 5) | (d[j + 2] >> 5);
    let z = kose.get(k);
    if (!z) { z = { n: 0, r: 0, g: 0, b: 0 }; kose.set(k, z); }
    z.n++; z.r += d[j]; z.g += d[j + 1]; z.b += d[j + 2];
  }
  const seznam = [];
  kose.forEach((z) => seznam.push({ n: z.n, r: Math.round(z.r / z.n), g: Math.round(z.g / z.n), b: Math.round(z.b / z.n) }));
  seznam.sort((a, b) => b.n - a.n);
  const celkem = w * h;
  const pozadi = seznam[0];
  return seznam.slice(1, limit + 1)
    .filter((z) => z.n / celkem > 0.002)
    .map((z) => ({ r: z.r, g: z.g, b: z.b, podil: z.n / celkem * 100 }))
    .concat([]).slice(0, limit)
    .map((z) => Object.assign(z, { pozadi: pozadi }));
}

function analyzujPokryti(img, prah, orezat, vyrez, odsazeniMm, rozmerMm, barvaPotisku) {
  const zx = vyrez ? Math.max(0, Math.round(vyrez.x)) : 0;
  const zy = vyrez ? Math.max(0, Math.round(vyrez.y)) : 0;
  const zw = vyrez ? Math.max(1, Math.round(vyrez.w)) : img.width;
  const zh = vyrez ? Math.max(1, Math.round(vyrez.h)) : img.height;
  const MAX = 1000;
  const m = Math.min(1, MAX / Math.max(zw, zh, 1));
  const w = Math.max(1, Math.round(zw * m));
  const h = Math.max(1, Math.round(zh * m));
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.clearRect(0, 0, w, h);
  ctx.drawImage(img, zx, zy, zw, zh, 0, 0, w, h);
  const d = ctx.getImageData(0, 0, w, h).data;
  const px = (x, y) => (y * w + x) * 4;

  // Pozadí je NEJČASTĚJŠÍ barva okraje, ne průměrná — motiv se okraje často
  // dotýká a průměr by pak vyšel někde mezi motivem a pozadím, takže by se
  // jako barva počítalo úplně všechno.
  const secti = (indexy) => {
    const kose = new Map();
    for (const i of indexy) {
      const klic = d[i + 3] < 40 ? "pruhledne"
        : ((d[i] >> 4) + "," + ((d[i + 1] >> 4)) + "," + ((d[i + 2] >> 4)));
      kose.set(klic, (kose.get(klic) || 0) + 1);
    }
    let nej = null, kolik = 0;
    kose.forEach((v, k) => { if (v > kolik) { kolik = v; nej = k; } });
    return { klic: nej, podil: indexy.length ? kolik / indexy.length : 0 };
  };
  const okraj = [];
  for (let x = 0; x < w; x++) { okraj.push(px(x, 0)); okraj.push(px(x, h - 1)); }
  for (let y = 0; y < h; y++) { okraj.push(px(0, y)); okraj.push(px(w - 1, y)); }
  let vysledek = secti(okraj);
  if (vysledek.podil < 0.4) {          // okraj je nejednoznačný — vezmeme celý obrázek
    const vzorek = [];
    for (let k = 0; k < w * h; k += 4) vzorek.push(k * 4);
    vysledek = secti(vzorek);
  }
  const pruhledne = vysledek.klic === "pruhledne";
  const casti = pruhledne ? [15, 15, 15] : String(vysledek.klic).split(",").map(Number);
  const pozadi = { r: casti[0] * 16 + 8, g: casti[1] * 16 + 8, b: casti[2] * 16 + 8 };

  let barvy = 0, x0 = w, y0 = h, x1 = -1, y1 = -1;
  const maska = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = px(x, y);
    const a = d[i + 3];
    let jeBarva;
    if (barvaPotisku) {
      // Počítá se jen barva potisku — pomocné čáry, rámečky a popisky
      // v jiné barvě se tím z výpočtu vyřadí.
      jeBarva = a > 40 && (Math.abs(d[i] - barvaPotisku.r) + Math.abs(d[i + 1] - barvaPotisku.g)
        + Math.abs(d[i + 2] - barvaPotisku.b)) / 3 <= prah;
    } else if (pruhledne) {
      jeBarva = a > 40;
    } else {
      jeBarva = a > 40 && (Math.abs(d[i] - pozadi.r) + Math.abs(d[i + 1] - pozadi.g)
        + Math.abs(d[i + 2] - pozadi.b)) / 3 > prah;
    }
    if (!jeBarva) continue;
    maska[y * w + x] = 1; barvy++;
    if (x < x0) x0 = x; if (x > x1) x1 = x;
    if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  if (x1 < 0) return { pct: 0, barvy: 0, kryciPocet: 0, mm2: 0, pxNaMm: 0,
    w: w, h: h, bw: 0, bh: 0, bwMotiv: 0, bhMotiv: 0, prazdne: true, nahled: c.toDataURL() };

  const bw = x1 - x0 + 1, bh = y1 - y0 + 1;

  // Rozšíření o vnější odsazení: krycí plocha je motiv "nafouknutý" o zadaný
  // počet milimetrů kolem každého objektu. Měřítko bereme z toho, že šířka
  // motivu odpovídá rozměru potisku ze zakázkového listu.
  const pxNaMm = (rozmerMm && rozmerMm.w > 0) ? bw / rozmerMm.w : 0;
  const polomer = (odsazeniMm > 0 && pxNaMm > 0) ? odsazeniMm * pxNaMm : 0;
  let kryci = maska, kryciPocet = barvy;
  let kx0 = x0, ky0 = y0, kx1 = x1, ky1 = y1;
  if (polomer >= 0.5) {
    const dist = vzdalenostOdBarvy(maska, w, h);
    const mez = polomer * 3;
    kryci = new Uint8Array(w * h); kryciPocet = 0;
    kx0 = w; ky0 = h; kx1 = -1; ky1 = -1;
    for (let k = 0; k < w * h; k++) {
      if (dist[k] > mez) continue;
      kryci[k] = 1; kryciPocet++;
      const x = k % w, y = (k / w) | 0;
      if (x < kx0) kx0 = x; if (x > kx1) kx1 = x;
      if (y < ky0) ky0 = y; if (y > ky1) ky1 = y;
    }
  }
  const kbw = kx1 - kx0 + 1, kbh = ky1 - ky0 + 1;
  // Procento se počítá z obdélníku MOTIVU, protože přesně ten je v aplikaci
  // "rozměr potisku" a tou plochou se pak procento násobí. S odsazením může
  // krycí plocha ten obdélník i přesáhnout — pak vyjde přes 100 %, což je
  // fyzikálně správně: barva se rozpíjí i za hranici motivu.
  const zaklad = orezat ? bw * bh : w * h;
  const pct = zaklad ? (kryciPocet / zaklad) * 100 : 0;
  // plocha v mm² — přímo z ní se dá spočítat gramáž
  const mm2 = pxNaMm > 0 ? kryciPocet / (pxNaMm * pxNaMm) : 0;

  // náhled: motiv tmavě, přidané odsazení světleji, ohraničení oranžově
  const nc = document.createElement("canvas");
  nc.width = w; nc.height = h;
  const nctx = nc.getContext("2d");
  const obr = nctx.createImageData(w, h);
  for (let k = 0; k < w * h; k++) {
    const j = k * 4;
    const uvnitr = !orezat || ((k % w) >= kx0 && (k % w) <= kx1
      && Math.floor(k / w) >= ky0 && Math.floor(k / w) <= ky1);
    if (maska[k]) { obr.data[j] = 24; obr.data[j + 1] = 23; obr.data[j + 2] = 15; obr.data[j + 3] = 255; }
    else if (kryci[k]) { obr.data[j] = 108; obr.data[j + 1] = 143; obr.data[j + 2] = 194; obr.data[j + 3] = 255; }
    else { const s = uvnitr ? 226 : 244; obr.data[j] = s; obr.data[j + 1] = s; obr.data[j + 2] = s; obr.data[j + 3] = 255; }
  }
  nctx.putImageData(obr, 0, 0);
  nctx.strokeStyle = "#C97B63"; nctx.lineWidth = Math.max(1, Math.round(w / 300));
  nctx.strokeRect(kx0 + .5, ky0 + .5, kbw, kbh);
  return { pct: pct, barvy: barvy, kryciPocet: kryciPocet, mm2: mm2, pxNaMm: pxNaMm,
    w: w, h: h, bw: kbw, bh: kbh, bwMotiv: bw, bhMotiv: bh, nahled: nc.toDataURL() };
}

function PokrytiModal({ obrazky, stranky, sirka, vyska, gm2, qty, hustota,
                        odsazeniVychozi, onPouzit, onClose }) {
  const [zdroj, setZdroj] = useState(null);     // {url, popis, vyrezat}
  const [prah, setPrah] = useState(28);
  const [orezat, setOrezat] = useState(true);
  const [vysl, setVysl] = useState(null);
  const [chyba, setChyba] = useState("");
  const [nadHranici, setNadHranici] = useState(false);
  const [vyrez, setVyrez] = useState(null);     // {x,y,w,h} v obrazových bodech
  const [tah, setTah] = useState(null);
  const [odsazeni, setOdsazeni] = useState(odsazeniVychozi != null ? odsazeniVychozi : 0);
  const [bloky, setBloky] = useState([]);
  const [barvy, setBarvy] = useState([]);       // barvy nalezené ve výřezu
  const [barva, setBarva] = useState(null);     // vybraná barva potisku (null = vše kromě pozadí)
  const souborRef = useRef(null);
  const platnoRef = useRef(null);
  const tahRef = useRef(null);

  useEffect(() => {
    if (!zdroj) { setVysl(null); return; }
    if (zdroj.vyrezat && !vyrez) { setVysl(null); return; }   // čeká se na označení oblasti
    let zrusen = false;
    const img = new Image();
    img.onload = () => {
      if (zrusen) return;
      try {
        setVysl(analyzujPokryti(img, prah, orezat, vyrez, n(odsazeni, 0), { w: sirka, h: vyska }, barva));
        setChyba("");
      } catch (e) { setChyba(String(e.message || e)); }
    };
    img.onerror = () => { if (!zrusen) setChyba("Obrázek se nepodařilo načíst."); };
    img.src = zdroj.url;
    return () => { zrusen = true; };
  }, [zdroj, prah, orezat, vyrez, odsazeni, sirka, vyska, barva]);

  // barvy ve výřezu — nabídka, ze které se vybere barva potisku
  useEffect(() => {
    if (!zdroj) { setBarvy([]); setBarva(null); return; }
    let zrusen = false;
    const img = new Image();
    img.onload = () => {
      if (zrusen) return;
      try {
        const b = najdiBarvy(img, vyrez, 6);
        setBarvy(b);
        // Potisk je typicky nejsytější barva ve výřezu — pomocné čáry
        // a popisky bývají světlejší nebo barevné.
        const nej = b.slice().sort((x, y) => (x.r + x.g + x.b) - (y.r + y.g + y.b))[0];
        setBarva(nej && (nej.r + nej.g + nej.b) / 3 < 140 ? nej : null);
        setPrah(nej ? 60 : 28);
      } catch (e) { setBarvy([]); }
    };
    img.src = zdroj.url;
    return () => { zrusen = true; };
  }, [zdroj, vyrez]);

  // automatické nalezení bloků kresby po výběru strany
  useEffect(() => {
    if (!zdroj || !zdroj.vyrezat) { setBloky([]); return; }
    let zrusen = false;
    const img = new Image();
    img.onload = () => {
      if (zrusen) return;
      try {
        const b = najdiBloky(img, prah, { w: sirka, h: vyska });
        setBloky(b);
        // předvybereme jen tehdy, když tvar bloku opravdu odpovídá rozměru potisku
        if (!vyrez && b.length && (b[0].shoda == null || b[0].shoda < 0.6)) setVyrez(b[0]);
      } catch (e) { setBloky([]); }
    };
    img.src = zdroj.url;
    return () => { zrusen = true; };
  }, [zdroj]);

  // označení oblasti tažením myší nad vykreslenou stránkou
  const naBod = (e) => {
    const el = platnoRef.current;
    if (!el) return null;
    const r = el.getBoundingClientRect();
    const pomer = el.naturalWidth / r.width;
    return { x: (e.clientX - r.left) * pomer, y: (e.clientY - r.top) * pomer };
  };
  // tažení držíme v ref, aby nezáviselo na tom, kdy React stihne překreslit
  const tahStart = (e) => {
    const p = naBod(e);
    if (!p) return;
    e.preventDefault();
    tahRef.current = { a: p, b: p };
    setTah({ a: p, b: p });
  };
  const tahPohyb = (e) => {
    if (!tahRef.current) return;
    const p = naBod(e);
    if (!p) return;
    tahRef.current.b = p;
    setTah({ a: tahRef.current.a, b: p });
  };
  const tahKonec = () => {
    const t = tahRef.current;
    if (!t) return;
    tahRef.current = null;
    setTah(null);
    const x = Math.min(t.a.x, t.b.x), y = Math.min(t.a.y, t.b.y);
    const w = Math.abs(t.a.x - t.b.x), h = Math.abs(t.a.y - t.b.y);
    if (w > 8 && h > 8) setVyrez({ x: x, y: y, w: w, h: h });
  };
  const ramecek = () => {
    const el = platnoRef.current;
    const zdrojR = tah ? { x: Math.min(tah.a.x, tah.b.x), y: Math.min(tah.a.y, tah.b.y),
      w: Math.abs(tah.a.x - tah.b.x), h: Math.abs(tah.a.y - tah.b.y) } : vyrez;
    if (!el || !zdrojR) return null;
    const p = el.getBoundingClientRect().width / (el.naturalWidth || 1);
    return { left: zdrojR.x * p, top: zdrojR.y * p, width: zdrojR.w * p, height: zdrojR.h * p };
  };

  const zeSouboru = (f) => {
    if (!f) return;
    if (!/^image\//.test(f.type)) { setChyba("Vyberte obrázek (PNG, JPG…). Vektorové PDF takto rozebrat nelze."); return; }
    const rd = new FileReader();
    rd.onload = () => setZdroj({ url: String(rd.result), popis: f.name });
    rd.readAsDataURL(f);
  };
  const mmText = (vysl && sirka > 0 && vysl.bw)
    ? " · motiv v poměru " + fmt(vysl.bw / vysl.bh, 2) + " : 1"
    : "";

  return html`
    <div className="modalbg" onClick=${(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modalbox" style=${{ width: "min(900px,100%)" }}>
        <div className="card" style=${{ margin: 0 }}>
          <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>
            <div>
              <h2 style=${{ margin: 0 }}>Skutečné pokrytí motivu</h2>
              <p className="hint" style=${{ margin: "4px 0 0" }}>
                Rozměr potisku je obdélník, do kterého se motiv vejde. Logo v něm ale nechává volné
                místo — spotřeba barvy odpovídá jen skutečně potištěné ploše.
              </p>
            </div>
            <button className="btn sec sm" onClick=${onClose}>✕</button>
          </div>

          <label className="f" style=${{ marginTop: 14 }}>Předloha</label>
          ${((stranky && stranky.length) || (obrazky && obrazky.length)) > 0 && html`
            <div className="chips" style=${{ marginBottom: 10 }}>
              ${(stranky || []).map((s, i) => html`
                <button key=${"s" + i} className=${"chip" + (zdroj && zdroj.url === s.url ? " on" : "")}
                  onClick=${() => { setVyrez(null); setZdroj({ url: s.url, vyrezat: true,
                    popis: "strana " + s.strana + " zakázkového listu · " + s.sirka + "×" + s.vyska + " px" }); }}>
                  ⃞ Strana ${s.strana} listu
                </button>`)}
              ${(obrazky || []).map((o, i) => html`
                <button key=${"o" + i} className=${"chip" + (zdroj && zdroj.url === o.url ? " on" : "")}
                  onClick=${() => { setVyrez(null); setZdroj({ url: o.url,
                    popis: "obrázek z PDF · " + o.sirka + "×" + o.vyska + " px" }); }}>
                  Obrázek ${o.sirka}×${o.vyska}${o.maska ? " (maska)" : ""}
                </button>`)}
            </div>`}

          ${zdroj && zdroj.vyrezat && html`
            <div style=${{ marginBottom: 12 }}>
              <p className="note" style=${{ marginBottom: 6 }}>
                ${bloky.length
                  ? html`<${React.Fragment}>${vyrez ? "Motiv byl vybrán automaticky podle tvaru rozměru potisku" : "Vyberte motiv"}${sirka > 0 && vyska > 0 ? " (hledá se poměr " + fmt(sirka / Math.max(vyska, 0.01), 1) + ":1)" : ""}. Jiný zvolíte tlačítkem níže, nebo ho <b>označte tažením myši</b>.<//>`
                  : html`<${React.Fragment}><b>Tažením myši označte náhled potisku</b> — pokrytí se spočítá jen uvnitř označené oblasti.<//>`}
              </p>
              ${bloky.length > 1 && html`
                <div className="chips" style=${{ marginBottom: 8 }}>
                  ${bloky.map((b, i) => html`
                    <button key=${i} className=${"chip" + (vyrez && Math.abs(vyrez.x - b.x) < 2 && Math.abs(vyrez.y - b.y) < 2 ? " on" : "")}
                      onClick=${() => setVyrez(b)}>
                      Motiv ${i + 1} · ${Math.round(b.w)}×${Math.round(b.h)} px${b.pomer ? " · " + fmt(b.pomer, 1) + ":1" : ""}
                    </button>`)}
                </div>`}
              <div style=${{ position: "relative", display: "inline-block", maxWidth: "100%", cursor: "crosshair" }}
                onMouseDown=${tahStart} onMouseMove=${tahPohyb} onMouseUp=${tahKonec} onMouseLeave=${tahKonec}>
                <img ref=${platnoRef} src=${zdroj.url} alt="stránka listu" draggable="false"
                  style=${{ maxWidth: "100%", display: "block", borderRadius: 10, background: "#fff", boxShadow: "var(--neu-in)" }} />
                ${ramecek() && html`<div style=${Object.assign({ position: "absolute", border: "2px solid var(--cyan)",
                  background: "rgba(62,92,138,.16)", pointerEvents: "none" }, ramecek())}></div>`}
              </div>
            </div>`}
          <div onDragOver=${(e) => { e.preventDefault(); setNadHranici(true); }}
            onDragLeave=${() => setNadHranici(false)}
            onDrop=${(e) => { e.preventDefault(); setNadHranici(false); zeSouboru(e.dataTransfer.files && e.dataTransfer.files[0]); }}
            onClick=${() => souborRef.current && souborRef.current.click()}
            style=${{ borderRadius: 12, padding: "18px 14px", textAlign: "center", cursor: "pointer",
              boxShadow: nadHranici ? "var(--neu-in),0 0 0 3px rgba(62,92,138,.25)" : "var(--neu-in)" }}>
            <div style=${{ fontWeight: 700, fontSize: 13 }}>Přetáhněte sem tiskové podklady (PNG, JPG)</div>
            <div className="note" style=${{ marginTop: 3 }}>
              nejpřesnější je soubor, ze kterého se dělá síto — na bílém nebo průhledném pozadí
            </div>
          </div>
          <input ref=${souborRef} type="file" accept="image/*" style=${{ display: "none" }}
            onChange=${(e) => { const f = e.target.files && e.target.files[0]; e.target.value = ""; zeSouboru(f); }} />
          ${chyba && html`<div className="warnbox">${chyba}</div>`}

          ${vysl && html`
            <div style=${{ marginTop: 16 }}>
              <div className="frow c2" style=${{ alignItems: "start" }}>
                <div>
                  <label className="f">Náhled — modře to, co se počítá jako barva</label>
                  <img src=${vysl.nahled} alt="rozbor pokrytí"
                    style=${{ width: "100%", borderRadius: 10, boxShadow: "var(--neu-in)", background: "#fff" }} />
                  <div className="note" style=${{ marginTop: 4 }}>${zdroj ? zdroj.popis : ""}</div>
                </div>
                <div>
                  <div className="result-big">${fmt(vysl.pct, 1)} %</div>
                  <div className="result-sub">krycí plocha z rozměru potisku${mmText}</div>
                  ${sirka > 0 && vyska > 0 && html`
                    <div className="kv" style=${{ marginTop: 10 }}>
                      <div className="k">Krycí plocha</div>
                      <div className="v">${fmt(sirka * vyska * vysl.pct / 100 / 100, 2)} cm²
                        <span className="note"> z ${fmt(sirka * vyska / 100, 2)} cm² obdélníku</span></div>
                      ${gm2 > 0 && qty > 0 && html`
                        <${React.Fragment}>
                          <div className="k">Barvy na zakázku</div>
                          <div className="v">${fmt(sirka * vyska * vysl.pct / 100 / 1000000 * qty * gm2, 1)} g
                            <span className="note"> netto při ${fmt(gm2, 1)} g/m² a ${fmt(qty, 0)} ks</span></div>
                        <//>`}
                    </div>`}

                  <label className="f" style=${{ marginTop: 14 }}>Vnější odsazení kolem objektů (mm)</label>
                  <div className="rowline" style=${{ marginBottom: 4 }}>
                    <input type="range" style=${{ flex: 1 }} min="0" max="5" step="0.1" value=${odsazeni}
                      onChange=${(e) => setOdsazeni(n(e.target.value, 0))} />
                    <input type="number" style=${{ width: 84 }} step="0.1" min="0" value=${odsazeni}
                      onChange=${(e) => setOdsazeni(n(e.target.value, 0))} />
                  </div>
                  <p className="note">
                    Barva se kolem každého objektu rozpíjí — odsazení tenhle přesah přidá.
                    ${vysl.pxNaMm > 0 ? " Měřítko " + fmt(vysl.pxNaMm, 1) + " bodů na mm." : ""}
                    ${odsazeni > 0 ? " Samotný motiv bez odsazení má "
                      + fmt(vysl.barvy / Math.max(1, vysl.kryciPocet) * vysl.pct, 1) + " %." : ""}
                  </p>

                  <label className="f" style=${{ marginTop: 14 }}>Barva potisku — počítá se jen ona</label>
                  <div className="chips" style=${{ marginBottom: 6 }}>
                    ${barvy.map((b, i) => html`
                      <button key=${i} className=${"chip" + (barva && barva.r === b.r && barva.g === b.g && barva.b === b.b ? " on" : "")}
                        onClick=${() => setBarva(b)} title=${"podíl ve výřezu " + fmt(b.podil, 1) + " %"}>
                        <span className="cdot" style=${{ background: "rgb(" + b.r + "," + b.g + "," + b.b + ")" }}></span>
                        ${fmt(b.podil, 1)} %
                      </button>`)}
                    <button className=${"chip" + (barva ? "" : " on")} onClick=${() => setBarva(null)}>
                      vše kromě pozadí
                    </button>
                  </div>
                  <p className="note">
                    ${barva
                      ? "Rámečky, vodicí čáry a popisky v jiné barvě se do výpočtu nezapočítají."
                      : "Počítá se všechno, co není pozadí — včetně rámečků a popisků, pokud jsou ve výřezu."}
                  </p>

                  <label className="f" style=${{ marginTop: 12 }}>
                    ${barva ? "Tolerance odstínu" : "Citlivost — co ještě je barva"}
                  </label>
                  <input type="range" min="4" max="120" step="2" value=${prah}
                    onChange=${(e) => setPrah(n(e.target.value, 28))} />
                  <div className="note">práh ${prah} — ${barva
                    ? "zvyšte, pokud vypadávají okraje písma; snižte, pokud se chytá i jiná barva"

  const souborRef = useRef(null);
  const mostOk = sgps && sgps.stav.stav === "ok";

  const posli = async (f) => {
    if (!f) return;
    setStav("cte"); setChyba("");
    try {
      const d = await precistPdf(f);
      setData({ pole: d.pole, zdroj: d.zdroj, text: d.text, obrazky: d.obrazky,
        stranky: d.stranky, jmeno: f.name });
      setStav("okno");
      if (onNacteno) onNacteno({ stav: "hotovo", pole: d.pole, zdroj: d.zdroj, text: d.text,
        obrazky: d.obrazky, stranky: d.stranky, jmeno: f.name, chyba: "" });

      if (e && e.mostZije === false && sgps) sgps.zjisti();

  const setPole = (p) => {

      obrazky: nova.obrazky, stranky: nova.stranky, jmeno: nova.jmeno, chyba: "" });

/* ---------- čtečka na sériovém portu (USB / RS-232), Chrome/Edge ---------- */
function useSerialScanner(onCode) {
  const [on, setOn] = useState(false);
  const [err, setErr] = useState("");
  const [baud, setBaud] = useState("9600");
  const portRef = useRef(null), readerRef = useRef(null);
  const cb = useRef(onCode); cb.current = onCode;

  const disconnect = async () => {
    try { if (readerRef.current) await readerRef.current.cancel(); } catch (e) {}
    try { if (portRef.current) await portRef.current.close(); } catch (e) {}
    readerRef.current = null; portRef.current = null;
    setOn(false);
  };
  const connect = async () => {
    setErr("");
    if (!("serial" in navigator)) { setErr("Tento prohlížeč nepodporuje sériové připojení (Web Serial). Použijte Chrome nebo Edge, nebo režim klávesnice."); return; }
    try {
      const port = await navigator.serial.requestPort();
      await port.open({ baudRate: n(baud, 9600) });
      portRef.current = port;
      const dec = new TextDecoderStream();
      port.readable.pipeTo(dec.writable).catch(() => {});
      const reader = dec.readable.getReader();
      readerRef.current = reader;
      setOn(true);
      let buf = "";
      (async () => {
        try {
          for (;;) {
            const res = await reader.read();
            if (res.done) break;
            buf += res.value;
            const lines = buf.split(/[\r\n]+/);
            buf = lines.pop();
            for (const l of lines) if (l.trim()) cb.current(l.trim());
          }
        } catch (e) { setErr("Čtení ze čtečky selhalo: " + e); }
      })();
    } catch (e) {
      setErr("Připojení se nezdařilo: " + (e && e.message ? e.message : e));
    }
  };
  useEffect(() => () => { disconnect(); }, []);
  return { on, err, baud, setBaud, connect, disconnect };
}

/* ---------- čtení kódu kamerou (BarcodeDetector, Chrome/Edge) ---------- */
function useCamScanner(onCode) {
  const [on, setOn] = useState(false);
  const [err, setErr] = useState("");
  const videoRef = useRef(null), timerRef = useRef(null), streamRef = useRef(null);
  const lastRef = useRef({ code: "", t: 0 });
  const cb = useRef(onCode); cb.current = onCode;
  const supported = typeof window !== "undefined" && "BarcodeDetector" in window;

  const stop = () => {
    if (timerRef.current) { clearInterval(timerRef.current); timerRef.current = null; }
    if (streamRef.current) { streamRef.current.getTracks().forEach((t) => t.stop()); streamRef.current = null; }
    setOn(false);
  };
  useEffect(() => {
    if (!on) return;
    let zrusen = false;
    (async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } } });
        if (zrusen) { stream.getTracks().forEach((t) => t.stop()); return; }
        streamRef.current = stream;
        const v = videoRef.current;
        if (!v) return;
        v.srcObject = stream;
        await v.play();
        const det = new window.BarcodeDetector();
        timerRef.current = setInterval(async () => {
          try {
            const found = await det.detect(v);
            if (!found || !found.length) return;
            const code = String(found[0].rawValue || "").trim();
            const now = Date.now();
            if (!code || (code === lastRef.current.code && now - lastRef.current.t < 2500)) return;
            lastRef.current = { code: code, t: now };
            cb.current(code);
          } catch (e) { /* jednotlivé snímky mohou selhat — pokračujeme */ }
        }, 250);
      } catch (e) {
        setErr("Kameru se nepodařilo spustit: " + (e && e.message ? e.message : e));
        setOn(false);
      }
    })();
    return () => { zrusen = true; };
  }, [on]);
  useEffect(() => () => { stop(); }, []);
  return { on, err, supported, videoRef, start: () => { setErr(""); setOn(true); }, stop };
}
