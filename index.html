/* ============================ IMPORT / DATA ============================ */
function parseCsv(text) {
  // Excel ukládá CSV se značkou pořadí bajtů (BOM). Bez odstranění by první
  // sloupec hlavičky vyšel jako "﻿druh", hledání sloupců by selhalo
  // a soubor by se tvářil jako špatně vyplněný, ačkoli je v pořádku.
  text = String(text || "").replace(/^﻿/, "");
  const delim = ((text.match(/;/g) || []).length >= (text.match(/,/g) || []).length) ? ";" : ",";
  const lines = text.split(/\r?\n/).filter((l) => l.trim());
  return lines.map((l) => {
    const out = []; let cur = ""; let inQ = false;
    for (let i = 0; i < l.length; i++) {
      const ch = l[i];
      if (inQ) {
        if (ch === '"' && l[i + 1] === '"') { cur += '"'; i++; }
        else if (ch === '"') inQ = false;
        else cur += ch;
      } else if (ch === '"') inQ = true;
      else if (ch === delim) { out.push(cur); cur = ""; }
      else cur += ch;
    }
    out.push(cur);
    return out.map((c) => c.trim());
  });
}

const HDR = {
  ref: /^(ref|reference|kod|k.d|sku|cod)/i,
  name: /^(n.zev|name|produkt|product|nome)/i,
  material: /^(materi.l|material)/i,
  pos: /^(poloha|pozice|location|position|area|m.sto)/i,
  tech: /^(tech|technologie|technika|technique)/i,
  w: /^(sirka|.{0,2}rka|width|max.?w|w$|w_)/i,
  h: /^(vyska|v..ka|height|max.?h|h$|h_)/i,
  cover: /^(pokryti|pokryt.|cover)/i,
};

function rowsToItems(rows) {
  const head = rows[0].map((h) => h.toLowerCase());
  const col = {};
  for (const k of Object.keys(HDR)) col[k] = head.findIndex((h) => HDR[k].test(h));
  const items = [];
  for (const r of rows.slice(1)) {
    items.push({
      ref: col.ref >= 0 ? r[col.ref] : "",
      name: col.name >= 0 ? r[col.name] : "",
      material: col.material >= 0 ? r[col.material] : "",
      pimg: "", img: "",
      pos: col.pos >= 0 ? r[col.pos] : "Tisková plocha",
      techRaw: col.tech >= 0 ? r[col.tech] : "",
      w: col.w >= 0 ? n(r[col.w]) : 0,
      h: col.h >= 0 ? n(r[col.h]) : 0,
      cover: col.cover >= 0 ? n(r[col.cover], 100) : 100,
    });
  }
  return items;
}

function jsonToItems(data) {
  const arr = Array.isArray(data) ? data : (data.products || data.items || []);
  const items = [];
  for (const p of arr) {
    const ref = p.ref || p.reference || p.sku || p.code || "";
    const name = p.name || p.title || "";
    const material = p.material || p.materials || "";
    const pimg = toLocalImg(p.image || p.img || "");
    const colors = (p.colors || []).map((c) => ({
      code: String(c.code || ""), name: c.name || "", hex: c.hex || "", stock: c.stock || c.sklad || "",
      img: toLocalImg(c.img || c.image || "") }));
    const cust = p.positions || p.customizations || p.printing_areas || [];
    for (const c of cust) {
      items.push({
        ref: String(ref), name: String(name), material: String(material),
        colors: colors,
        pimg: pimg, img: toLocalImg(c.image || c.img || ""),
        pos: c.name || c.location || c.position || "Tisková plocha",
        techRaw: c.tech || c.technique || "",
        w: n(c.w != null ? c.w : (c.width != null ? c.width : (c.maxW != null ? c.maxW : c.max_width))),
        h: n(c.h != null ? c.h : (c.height != null ? c.height : (c.maxH != null ? c.maxH : c.max_height))),
        cover: n(c.cover, 100),
      });
    }
  }
  return items;
}

/* Receptury CSV: nazev;typ;rada;hustota;hex;komponenta;procento (řádek = komponenta)
   zdroj = ze kterého souboru databáze receptura je; podle něj se dá filtrovat,
   aby se dvě databáze nemíchaly dohromady */
function csvToRecipes(text, zdroj) {
  const rows = parseCsv(text);
  if (!rows.length) throw new Error("Soubor je prázdný — chybí i hlavička sloupců.");
  const head = rows[0].map((h) => h.toLowerCase());
  const idx = (re) => head.findIndex((h) => re.test(h));
  const ci = {
    name: idx(/^(n.zev|name|pantone)/), type: idx(/^typ/), series: idx(/^(.ada|rada|series)/),
    density: idx(/^hustota|density/), hex: idx(/^hex|barva|color/),
    comp: idx(/^komponent|component|slozka|složka/), pct: idx(/^(procent|pct|%|pod.l)/),
    mesh: idx(/^(s.to|sito|mesh)/), opacity: idx(/^(kryvost|opacity)/), surface: idx(/^(povrch|surface)/),
    customer: idx(/^(objednavatel|customer|z.kazn.k)/), tested: idx(/^(otestovan|tested)/), fade: idx(/^(vyblednut|odolnost|fade)/),
    zaklad: idx(/^(zaklad|z.klad|odvozeno|base)/), vazby: idx(/^(vazby|vazba|produkty|links)/),
    tech: idx(/^(technologie|tech|technika)/), visk: idx(/^(viskozita|viscosity)/),
  };
  if (ci.name < 0 || ci.comp < 0 || ci.pct < 0)
    throw new Error("CSV musí obsahovat sloupce: nazev, komponenta, procento (volitelně typ, rada, hustota, hex).");
  const map = new Map();
  for (const r of rows.slice(1)) {
    const name = r[ci.name]; if (!name) continue;
    if (!map.has(name)) {
      map.set(name, {
        id: uid(), name: name, zdroj: zdroj || "",
        type: ci.type >= 0 && /cust/i.test(r[ci.type] || "") ? "Custom" : "Pantone",
        series: ci.series >= 0 ? (r[ci.series] || "") : "",
        density: ci.density >= 0 ? n(r[ci.density], 1.2) : 1.2,
        hex: ci.hex >= 0 && /^#?[0-9a-f]{6}$/i.test(r[ci.hex] || "") ? (r[ci.hex][0] === "#" ? r[ci.hex] : "#" + r[ci.hex]) : "#888888",
        mesh: ci.mesh >= 0 ? (r[ci.mesh] || "") : "",
        opacity: ci.opacity >= 0 ? (r[ci.opacity] || "") : "",
        surface: ci.surface >= 0 ? (r[ci.surface] || "") : "",
        customer: ci.customer >= 0 ? (r[ci.customer] || "") : "",
        tested: ci.tested >= 0 ? /^(1|ano|yes|true|x)$/i.test((r[ci.tested] || "").trim()) : false,
        fade: ci.fade >= 0 ? /^(1|ano|yes|true|x)$/i.test((r[ci.fade] || "").trim()) : false,
        zaklad: ci.zaklad >= 0 ? (r[ci.zaklad] || "") : "",
        // technologie, pro které řada platí; prázdné = pro všechny
        tech: ci.tech >= 0 ? String(r[ci.tech] || "").toUpperCase().replace(/\s+/g, "") : "",
        viskozita: ci.visk >= 0 && r[ci.visk] !== "" ? n(r[ci.visk]) : null,
        // na které kombinace produkt+barva+technologie+poloha byla receptura použita
        vazby: ci.vazby >= 0
          ? String(r[ci.vazby] || "").split("~").map((s) => s.trim()).filter(Boolean) : [],
        components: [],
      });
    }
    // řádek bez komponenty je receptura, u které se složení teprve dopisuje
    if (String(r[ci.comp] || "").trim())
      map.get(name).components.push({ id: uid(), name: r[ci.comp], pct: n(r[ci.pct]) });
  }
  return Array.from(map.values());
}

/* Přidá načtené receptury k těm stávajícím. Táž receptura ze stejné databáze
   se obnoví obsahem ze souboru, ale ponechá si id a co k ní nastavil technolog
   — na id visí vazby na produkt a polohu a v CSV žádné síto ani kryvost nejsou.

   Klíč je jméno VČETNĚ databáze, ze které receptura pochází: dvě databáze
   klidně mají PANTONE 485 C každá s jiným složením a nesmí si přepsat jedna
   druhou. Rozlišit je pak jde filtrem podle databáze. */
const klicReceptury = (r) => (r.zdroj ? r.zdroj + "|" : "") + String(r.name || "").toLowerCase();

function sloucReceptury(prev, nove, adopce) {
  const mapa = new Map(prev.map((r) => [klicReceptury(r), r]));
  // Receptury z dřívějška zdroj uvedený nemají. Při jednorázovém přeznačení
  // (adopce) si je databáze převezme, aby z jedné receptury nevznikly dvě.
  // Jindy se nikdy nesahá na receptury bez zdroje — jsou to ty ručně zadané.
  const kAdopci = new Map();
  if (adopce) {
    for (const r of prev) {
      if (!r.zdroj && r.type !== "Custom") kAdopci.set(String(r.name || "").toLowerCase(), r);
    }
  }
  let pridano = 0, obnoveno = 0;
  for (const r of nove) {
    if (!String(r.name || "").trim()) continue;
    const klic = klicReceptury(r);
    let stary = mapa.get(klic);
    if (!stary && r.zdroj) {
      const prevzaty = kAdopci.get(String(r.name).toLowerCase());
      if (prevzaty) {
        stary = prevzaty;
        mapa.delete(klicReceptury(prevzaty));
        kAdopci.delete(String(r.name).toLowerCase());
      }
    }
    if (stary) {
      obnoveno++;
      mapa.set(klic, Object.assign({}, r, {
        id: stary.id,
        mesh: r.mesh || stary.mesh || "", opacity: r.opacity || stary.opacity || "",
        surface: r.surface || stary.surface || "", customer: r.customer || stary.customer || "",
        tested: r.tested || !!stary.tested, fade: r.fade || !!stary.fade,
      }));
    } else {
      pridano++;
      mapa.set(klic, r);
    }
  }
  return { seznam: Array.from(mapa.values()), pridano: pridano, obnoveno: obnoveno };
}

/* ================== VLASTNÍ RECEPTURY JAKO DATABÁZE V SOUBORU ==================
   Custom receptury vznikají odvozením z receptur, které už v databázích jsou,
   a váží se na kombinaci produkt + barva produktu + technologie + poloha.
   Dokud žijí jen v prohlížeči, zmizí s vymazáním úložiště a nikdo jiný je
   neuvidí. Proto se odkládají do vlastního CSV ve složce databází — včetně
   toho, na které produkty a barvy byly použité (sloupec "vazby"). */
const SOUBOR_VLASTNI = "receptury_vlastni.csv";

/* Vazby jedné receptury: klíče "ref|barva|technologie|poloha" oddělené ~ */
function vazbyReceptury(links, id) {
  const out = [];
  for (const k of Object.keys(links || {})) if (links[k] === id) out.push(k);
  return out.sort();
}

/* Které receptury patří do vlastního souboru: ty vlastní, co vznikly
   v aplikaci, plus ty, které už z tohoto souboru jsou. */
const jeVlastni = (r) => r.type === "Custom" && (!r.zdroj || r.zdroj === SOUBOR_VLASTNI);

function vlastniDoCsv(recipes, links) {
  const hlavicka = ["nazev", "typ", "rada", "hustota", "hex", "komponenta", "procento",
    "sito", "kryvost", "povrch", "objednavatel", "otestovany", "vyblednuti", "viskozita",
    "zaklad", "vazby"];
  const radky = [hlavicka];
  for (const r of recipes.filter(jeVlastni)) {
    const vazby = vazbyReceptury(links, r.id).join("~");
    const slozky = r.components && r.components.length ? r.components : [{ name: "", pct: "" }];
    for (const c of slozky) {
      radky.push([r.name, "Custom", r.series || "", r.density, (r.hex || "").replace(/^#/, ""),
        c.name || "", c.pct === "" ? "" : c.pct,
        r.mesh || "", r.opacity || "", r.surface || "", r.customer || "",
        r.tested ? "ano" : "", r.fade ? "ano" : "",
        r.viskozita == null ? "" : cislo(r.viskozita, 1), r.zaklad || "", vazby]);
    }
  }
  return radky.map((r) => r.map((c) => '"' + String(c == null ? "" : c).replace(/"/g, '""') + '"')
    .join(";")).join("\r\n") + "\r\n";
}

/* ==================== SÍTA A VÝPOČET SPOTŘEBY BARVY ====================
   Kolik barvy projde sítem, je dané geometrií tkaniny. Teoretický objem
   nánosu se počítá takto:

       V [cm³/m²] = otevřená plocha [díl] × tloušťka tkaniny [µm]

   (metr čtvereční o tloušťce jednoho mikrometru je přesně 1 cm³, takže
   se čísla nemusí nijak převádět). Skutečný nános je menší — část barvy
   zůstane v sítu; tomu se říká faktor přenosu. Gramáž pak vyjde:

       g/m² = V × faktor přenosu × hustota barvy × koeficienty

   Koeficienty pokrývají to, co geometrie neví: krycí barva jde nanést
   silněji, savý textil bere víc než hladký plast a světlá barva na tmavém
   podkladu se často tiskne dvakrát.

   Parametry sít i koeficienty se načítají ze složky "parametry" — jsou to
   údaje výrobce tkaniny a zkušenost dílny, ne něco, co by aplikace mohla
   uhodnout. Dokud tam nic není, počítá se jako dosud dle technologie. */
const SLOZKA_PARAMETRY = "parametry";
const SOUBOR_SITA = "sita.csv";
const SOUBOR_KOEF = "koeficienty.csv";
const PRENOS_VYCHOZI = 0.7;      // kolik z teoretického objemu se opravdu přenese

/* Není-li otevřená plocha v datech, spočítá se z geometrie tkaniny:
   n nití na cm, průměr vlákna d µm → oko o = 10000/n − d [µm]
   otevřená plocha = (o / (o + d))², tloušťka = 1,6 × d

   Koeficient 1,6 není odhad — vyšel ze srovnání se čtyřmi skutečnými
   tkaninami (43-80, 77-55, 120-34, 150-31), kde poměr tloušťky k průměru
   vlákna vychází 1,61 až 1,64. S ním sedí teoretický objem u jemných sít
   na jednotky procent, u hrubých je asi o pětinu vyšší — dopočet je proto
   jen náhrada, dokud se nenačtou údaje výrobce tkaniny. */
function dopocitejSito(s) {
  const n_ = n(s.nitky), d = n(s.vlakno);
  const out = Object.assign({}, s);
  if (!(out.otevrena > 0) && n_ > 0 && d > 0) {
    const oko = 10000 / n_ - d;
    if (oko > 0) out.otevrena = Math.pow(oko / (oko + d), 2) * 100;
  }
  if (!(out.tloustka > 0) && d > 0) out.tloustka = d * 1.6;
  if (!(out.vth > 0) && out.otevrena > 0 && out.tloustka > 0) {
    out.vth = (out.otevrena / 100) * out.tloustka;
    out.dopocteno = true;
  }
  return out;
}

function csvNaSita(text) {
  const rows = parseCsv(text);
  if (!rows.length) throw new Error("Soubor sít je prázdný.");
  const head = rows[0].map((h) => h.toLowerCase().trim());
  const i = (re) => head.findIndex((h) => re.test(h));
  const ci = {
    tech: i(/^(technologie|tech)/), sito: i(/^(sito|s.to|mesh)/),
    nitky: i(/^(nitky|nit._cm|mesh_count|po.et_nit)/), vlakno: i(/^(vlakno|vl.kno|thread|prumer)/),
    otevrena: i(/^(otevrena|otev.en|open)/), tloustka: i(/^(tloustka|tlou..ka|thickness)/),
    vth: i(/^(vth|objem|volume|teoreticky)/), prenos: i(/^(prenos|p.enos|transfer)/),
    hloubka: i(/^(hloubka|depth|lept)/),
    viskOd: i(/^(viskozita_od|visk_od)/), viskDo: i(/^(viskozita_do|visk_do)/),
    poharek: i(/^(poharek|poh.rek|cup)/),
    pozn: i(/^(pozn|note)/),
  };
  if (ci.sito < 0) throw new Error("CSV sít musí mít sloupec sito.");
  return rows.slice(1).map((r) => {
    const zaznam = {
      tech: ci.tech >= 0 ? String(r[ci.tech] || "").toUpperCase().trim() : "",
      sito: String(r[ci.sito] || "").trim(),
      nitky: ci.nitky >= 0 ? n(r[ci.nitky]) : 0,
      vlakno: ci.vlakno >= 0 ? n(r[ci.vlakno]) : 0,
      otevrena: ci.otevrena >= 0 ? n(r[ci.otevrena]) : 0,
      tloustka: ci.tloustka >= 0 ? n(r[ci.tloustka]) : 0,
      vth: ci.vth >= 0 ? n(r[ci.vth]) : 0,
      prenos: ci.prenos >= 0 && r[ci.prenos] !== "" ? n(r[ci.prenos]) : null,
      // tampontisk nemá tkaninu — objem dává hloubka leptu klišé, a protože
      // metr čtvereční o hloubce 1 µm je 1 cm³, jde hloubka rovnou do Vth
      hloubka: ci.hloubka >= 0 ? n(r[ci.hloubka]) : 0,
      viskOd: ci.viskOd >= 0 ? n(r[ci.viskOd]) : 0,
      viskDo: ci.viskDo >= 0 ? n(r[ci.viskDo]) : 0,
      poharek: ci.poharek >= 0 ? (r[ci.poharek] || "") : "",
      pozn: ci.pozn >= 0 ? (r[ci.pozn] || "") : "",
    };
    if (!zaznam.vth && zaznam.hloubka > 0) { zaznam.vth = zaznam.hloubka; zaznam.klise = true; }
    // "120-34" v názvu síta nese nitky i vlákno, když sloupce chybí
    if ((!zaznam.nitky || !zaznam.vlakno) && /^(\d+)\s*[-/]\s*(\d+)/.test(zaznam.sito)) {
      const m = /^(\d+)\s*[-/]\s*(\d+)/.exec(zaznam.sito);
      if (!zaznam.nitky) zaznam.nitky = n(m[1]);
      if (!zaznam.vlakno) zaznam.vlakno = n(m[2]);
    }
    return dopocitejSito(zaznam);
  }).filter((s) => s.sito);
}

/* Klíč koeficientu může být i rozsah — u viskozity se nedá vypsat každá
   sekunda zvlášť. Přijímá se "18-22", "<18", ">22" i prosté číslo. */
function koefProHodnotu(tabulka, hodnota) {
  if (!tabulka || hodnota == null || hodnota === "") return null;
  const v = n(hodnota);
  for (const klic of Object.keys(tabulka)) {
    const k = String(klic).replace(/\s|s$/g, "");
    let m;
    if ((m = /^(-?[\d.]+)-(-?[\d.]+)$/.exec(k))) {
      if (v >= n(m[1]) && v <= n(m[2])) return tabulka[klic];
    } else if ((m = /^[<≤]=?(-?[\d.]+)$/.exec(k))) {
      if (v < n(m[1])) return tabulka[klic];
    } else if ((m = /^[>≥]=?(-?[\d.]+)$/.exec(k))) {
      if (v > n(m[1])) return tabulka[klic];
    } else if (/^-?[\d.]+$/.test(k) && Math.abs(v - n(k)) < 0.001) {
      return tabulka[klic];
    }
  }
  return null;
}

function csvNaKoeficienty(text) {
  const rows = parseCsv(text);
  if (!rows.length) throw new Error("Soubor koeficientů je prázdný.");
  const head = rows[0].map((h) => h.toLowerCase().trim());
  const i = (re) => head.findIndex((h) => re.test(h));
  const ci = { druh: i(/^(druh|typ|kategorie)/), klic: i(/^(klic|kl..|hodnota|nazev|n.zev)/),
    koef: i(/^(koef|nasobek|n.sobek|factor)/) };
  if (ci.druh < 0 || ci.klic < 0 || ci.koef < 0)
    throw new Error("CSV koeficientů musí mít sloupce druh, klic, koef.");
  const out = { kryvost: {}, material: {}, podklad: {}, viskozita: {} };
  for (const r of rows.slice(1)) {
    const druh = String(r[ci.druh] || "").toLowerCase().trim();
    const klic = String(r[ci.klic] || "").trim();
    const k = n(r[ci.koef]);
    if (!out[druh] || !klic || !(k > 0)) continue;
    out[druh][klic.toLowerCase()] = k;
  }
  return out;
}

/* Síta, která patří k dané technologii. Řádek bez uvedené technologie platí
   všude. Nejsou-li v parametrech žádná, vrátí se standardní řada — ať je
   z čeho vybírat, dokud dílna svoje síta nezapíše. */
function sitaPro(sita, tech, jenKlise) {
  const vsechna = (sita || []).filter((s) => !!s.klise === !!jenKlise);
  const moje = vsechna.filter((s) => s.tech === tech);
  const obecna = vsechna.filter((s) => !s.tech);
  const vybrana = moje.length ? moje.concat(obecna) : obecna;
  if (vybrana.length) return vybrana;
  return jenKlise ? [] : SITA.map((m) => ({ sito: m, tech: "", vychozi: true }));
}

/* Podklad se dělí jen na světlý / střední / tmavý — na 4 218 barevných
   variant by koeficienty nikdo neudržoval. Třída se pozná z odstínu. */
function tridaPodkladu(hex) {
  const rgb = hexNaRgb(hex);
  if (!rgb) return "";
  const jas = rgbNaLab(rgb)[0];      // L* v Lab, 0 = černá, 100 = bílá
  return jas >= 70 ? "světlý" : (jas >= 35 ? "střední" : "tmavý");
}

/* ===================== PODKLAD, KRYVOST A PROSVÍTÁNÍ =====================
   Podklad dosud vstupoval jen do spotřeby. Jenže barva na modrém tričku
   vypadá jinak než na bílém papíře, a světlý odstín na tmavém podkladu se
   bez podtisku bílou nedá vytisknout vůbec. Tohle je posouzení, ne měření:
   pracuje se s odstínem barvy a odstínem materiálu, oba aplikace zná.

   Meze níže jsou v jednotkách L* (0 = černá, 100 = bílá) a jsou to výchozí
   hodnoty, ne fyzikální konstanty — dílna si je časem upraví podle toho, co
   jí skutečně prosvítá. */
const MEZ_PODTISK = 20;   // barva o tolik světlejší než podklad -> podtisk bílou
const MEZ_RIZIKO = 8;     // ...o tolik -> hraniční, nejdřív zkouška
const MEZ_SYTOST_PODKLADU = 15;  // barevnost podkladu, od které táhne odstín

/* Název odstínu z polohy v Lab — aby se dalo napsat "podklad táhne do žluté"
   a ne "podklad má b* = 42".

   Hranice nejsou odhad: jsou to středy mezi skutečnými úhly čistých barev
   převedených do Lab. Pro kontrolu, kam co padá —
     červená 40°, oranžová 60°, žlutá 103°, zelená 136°,
     azurová 196°, modrá 306°, purpurová 328°.
   Odhad od oka tu selhal: žlutý podklad #F0D000 leží na 93°, což při dřívější
   hranici 75° vycházelo jako "zelená". */
const PASMA_ODSTINU = [
  [50, "červené"], [80, "oranžové"], [120, "žluté"], [165, "zelené"],
  [240, "tyrkysové"], [320, "modré"], [345, "purpurové"], [360, "červené"],
];
function odstinNazev(lab) {
  const [, a, b] = lab;
  const sytost = Math.sqrt(a * a + b * b);
  if (sytost < MEZ_SYTOST_PODKLADU) return "";
  const uhel = (Math.atan2(b, a) * 180 / Math.PI + 360) % 360;
  for (const [mez, jm] of PASMA_ODSTINU) if (uhel < mez) return jm;
  return "";
}

/* Posouzení dvojice barva + podklad. Vrací i důvody, ať je z čeho vyjít při
   sporu — technolog musí vidět, proč mu aplikace radí podtisk. */
function analyzaPodkladu({ barvaHex, podkladHex, kryvost }) {
  const rgbB = hexNaRgb(barvaHex), rgbP = hexNaRgb(podkladHex);
  if (!rgbB || !rgbP) return null;
  const labB = rgbNaLab(rgbB), labP = rgbNaLab(rgbP);
  const dL = labB[0] - labP[0];          // + = barva je světlejší než podklad
  const trida = tridaPodkladu(podkladHex);
  const sytostP = Math.sqrt(labP[1] * labP[1] + labP[2] * labP[2]);
  const kry = String(kryvost || "").toLowerCase();
  const kryci = /vysoce|krycí|kryci|opak/.test(kry);
  const transparentni = /transp/.test(kry);

  let stav = "ok", hlaska = "", podtisk = false;
  if (dL >= MEZ_PODTISK && !kryci) {
    stav = "podtisk"; podtisk = true;
    hlaska = "Barva je výrazně světlejší než podklad a není vysoce krycí — bez podtisku bílou prosvítá.";
  } else if (dL >= MEZ_PODTISK && kryci) {
    stav = "riziko";
    hlaska = "Barva je výrazně světlejší než podklad. Vysoce krycí barva to obvykle utáhne, ale počítejte s druhým průchodem.";
  } else if (dL >= MEZ_RIZIKO && !kryci) {
    stav = "riziko";
    hlaska = "Rozdíl jasu je hraniční — než se pustíte do série, udělejte zkoušku.";
  }

  // Průsvitná barva na barevném podkladu nese odstín podkladu s sebou.
  const tahne = transparentni && sytostP >= MEZ_SYTOST_PODKLADU ? odstinNazev(labP) : "";
  return {
    dL: dL, tridaPodkladu: trida, sytostPodkladu: sytostP,
    kryci: kryci, transparentni: transparentni,
    stav: stav, hlaska: hlaska, podtiskNutny: podtisk,
    tahneDo: tahne,
    posun: tahne ? "Podklad je sytý a barva průsvitná — výsledek se posune do " + tahne + "." : "",
  };
}

/* ================== PIGMENT A BÁZE ODDĚLENĚ ==================
   Převzato z toho, jak má poskládaný sortiment Matsui: pár koncentrovaných
   pigmentů, které jdou do všech bází. Odstín určuje poměr pigmentů mezi sebou,
   vlastnosti (měkkost, kryvost, odbarvování, pružnost) určuje báze.

   Praktický důsledek: tentýž odstín na světlé i tmavé tričko není dvojí
   receptura, ale tentýž poměr pigmentů ve dvou bázích. A protože pigmentů je
   hrstka, dá se u nich zapsat odstín — a teprve tím může aplikace radit, ČÍM
   korigovat, ne jen počítat, kolik přidat.

   Tabulka je v parametry/pigmenty.csv; dokud tam nic není, chová se aplikace
   jako dosud a složení bere jako plochý seznam. */
const SOUBOR_PIGMENTY = "pigmenty.csv";
const MAX_PODIL_PIGMENTU = 15;   // % dávky; strop, není-li u báze uvedený vlastní

function csvNaPigmenty(text) {
  const rows = parseCsv(text);
  if (!rows.length) throw new Error("Soubor pigmentů je prázdný.");
  const head = rows[0].map((h) => h.toLowerCase().trim());
  const i = (re) => head.findIndex((h) => re.test(h));
  const ci = { druh: i(/^(druh|typ)/), nazev: i(/^(nazev|n.zev|name)/),
    hex: i(/^(hex|odstin|odst.n|barva)/), max: i(/^(maxpodil|max)/) };
  if (ci.druh < 0 || ci.nazev < 0)
    throw new Error("CSV pigmentů musí mít sloupce druh a nazev.");
  const out = {};
  for (const r of rows.slice(1)) {
    const druh = String(r[ci.druh] || "").toLowerCase().trim();
    const nazev = String(r[ci.nazev] || "").trim();
    if (!nazev || (druh !== "pigment" && druh !== "baze" && druh !== "báze")) continue;
    const hex = ci.hex >= 0 ? String(r[ci.hex] || "").trim() : "";
    out[nazev.toLowerCase()] = {
      nazev: nazev, role: druh === "pigment" ? "pigment" : "baze",
      hex: hexNaRgb(hex) ? hex : "",
      max: ci.max >= 0 && n(r[ci.max]) > 0 ? n(r[ci.max]) : 0,
    };
  }
  return out;
}

/* Rozdělí složení receptury na pigmenty a báze. Co v tabulce není, zůstane
   nezařazené — aplikace o tom mlčky nerozhoduje, radši to přizná. */
function rozborSlozeni(components, pigmenty) {
  const tab = pigmenty || {};
  const out = { pigmenty: [], baze: [], nezname: [], pctPigment: 0, pctBaze: 0, znamy: false };
  if (!components || !components.length) return out;
  for (const c of components) {
    const zn = tab[String(c.name || "").trim().toLowerCase()];
    const pct = n(c.pct);
    if (zn && zn.role === "pigment") { out.pigmenty.push(Object.assign({}, c, { hex: zn.hex })); out.pctPigment += pct; }
    else if (zn) { out.baze.push(Object.assign({}, c, { max: zn.max })); out.pctBaze += pct; }
    else out.nezname.push(c);
  }
  out.znamy = out.pigmenty.length > 0 || out.baze.length > 0;
  // Strop bere z báze, je-li u ní uvedený — discharge snese míň než akrylát.
  const stropy = out.baze.map((b) => b.max).filter((m) => m > 0);
  out.strop = stropy.length ? Math.min.apply(null, stropy) : MAX_PODIL_PIGMENTU;
  out.pretizeno = out.pctPigment > out.strop + 1e-9;
  return out;
}

/* ===================== KOREKCE ODSTÍNU PO NÁTISKU =====================
   Uděláte nátisk, přiložíte ho k etalonu a vidíte, že je to vedle. Bez
   spektrofotometru nikdo nespočítá, o kolik — ale ví se, co se s tím dá dělat:
   z nádoby už nic neubereš, takže korekce je vždycky PŘÍDAVEK a dávka poroste.

   Podíl přidané složky se počítá z dávky, ne z té složky. Kroky jsou schválně
   malé: barvicí síla bází je velmi různá a u syté černé bývá i půl procenta
   moc. Proto se koriguje po krocích a mezi nimi se tiskne. */
const KROKY_KOREKCE = {
  mirne:    { popis: "mírně",    dil: 0.005 },
  znatelne: { popis: "znatelně", dil: 0.015 },
  vyrazne:  { popis: "výrazně",  dil: 0.040 },
};

function korekceOdstinu({ comps, totalG, index, sila }) {
  const krok = KROKY_KOREKCE[sila] || KROKY_KOREKCE.mirne;
  const T = n(totalG);
  if (!comps || !comps.length || !(T > 0)) return null;
  if (!(index >= 0 && index < comps.length)) return null;
  const pridat = T * krok.dil;
  const novaDavka = T + pridat;
  const nove = comps.map((c, i) => {
    const g = n(c.g) + (i === index ? pridat : 0);
    return { name: c.name, g: g, pct: novaDavka > 0 ? (g / novaDavka) * 100 : 0 };
  });
  const puvodniPct = comps.map((c) => (T > 0 ? (n(c.g) / T) * 100 : 0));
  return {
    slozka: comps[index].name, pridat: pridat, sila: krok.popis, dil: krok.dil,
    davka: novaDavka, puvodniDavka: T, naviceni: pridat,
    nove: nove, puvodniPct: puvodniPct,
  };
}

/* Čím korigovat: technolog popíše, co na nátisku vidí, a aplikace vybere
   pigment, který táhne opačným směrem.

   Model: přidá-li se podíl f pigmentu P do směsi M, posune se odstín přibližně
   o f × (P − M). Pigment je tedy tím vhodnější, čím líp jeho směr od současné
   barvy míří tam, kam potřebujeme; potřebný podíl vyjde jako
   f = žádaný posun / vzdálenost pigmentu od směsi.

   MEZ MODELU, kterou je nutné říct nahlas: míchání barev je odečítací, ne
   průměrovací. Silný pigment posune odstín víc, než tenhle výpočet čeká —
   u syté černé násobně. Číslo je proto začátek, ne předpis; koriguje se po
   malých krocích a rozhoduje oko. */
const SMERY_KOREKCE = {
  mocSvetle:  { popis: "je moc světlé",   v: [-1, 0, 0] },
  mocTmave:   { popis: "je moc tmavé",    v: [1, 0, 0] },
  maloCervene:{ popis: "je málo červené", v: [0, 1, 0] },
  mocCervene: { popis: "je moc červené",  v: [0, -1, 0] },
  maloZlute:  { popis: "je málo žluté",   v: [0, 0, 1] },
  mocZlute:   { popis: "je moc žluté",    v: [0, 0, -1] },
  vybledle:   { popis: "je vybledlé",     v: null, sytost: 1 },
  mocSyte:    { popis: "je moc syté",     v: null, sytost: -1 },
};
const POSUN_KOREKCE = { mirne: 1, znatelne: 3, vyrazne: 6 };   // žádaný posun v jednotkách ΔE

function doporucKorekci({ barvaHex, komponenty, pigmenty, smer, sila }) {
  const smerDef = SMERY_KOREKCE[smer];
  const rgbM = hexNaRgb(barvaHex);
  if (!smerDef || !rgbM || !komponenty || !komponenty.length) return null;
  const labM = rgbNaLab(rgbM);
  let v = smerDef.v;
  if (!v) {                       // sytost = směr od šedé (nebo k ní)
    const d = Math.sqrt(labM[1] * labM[1] + labM[2] * labM[2]);
    if (!(d > 1)) return { smer: smerDef.popis, navrhy: [], duvod: "Barva je téměř šedá — sytost nemá kam růst ani klesat." };
    v = [0, (labM[1] / d) * smerDef.sytost, (labM[2] / d) * smerDef.sytost];
  }
  const posun = POSUN_KOREKCE[sila] || POSUN_KOREKCE.mirne;
  const navrhy = [];
  for (const c of komponenty) {
    const zn = (pigmenty || {})[String(c.name || "").trim().toLowerCase()];
    if (!zn || zn.role !== "pigment" || !zn.hex) continue;
    const labP = rgbNaLab(hexNaRgb(zn.hex));
    const d = [labP[0] - labM[0], labP[1] - labM[1], labP[2] - labM[2]];
    const delka = Math.sqrt(d[0] * d[0] + d[1] * d[1] + d[2] * d[2]);
    if (!(delka > 1)) continue;   // pigment téměř totožný se směsí nikam netáhne
    const skore = (d[0] * v[0] + d[1] * v[1] + d[2] * v[2]) / delka;   // -1 až 1
    if (skore <= 0.05) continue;  // netáhne tím směrem
    const podilPct = (posun / delka) * 100;
    // Protože skutečný posun bývá větší, než lineární model čeká, je vypočtené
    // množství horní odhad — a přestřelit se nedá vzít zpět. Nabízí se proto
    // třetina, nejvýš procento dávky: raději korigovat dvakrát než jednou moc.
    navrhy.push({ name: c.name, hex: zn.hex, skore: skore, podilPct: podilPct,
      startPct: Math.min(podilPct / 3, 1) });
  }
  navrhy.sort((a, b) => b.skore - a.skore);
  return {
    smer: smerDef.popis, navrhy: navrhy,
    duvod: navrhy.length ? "" : "Žádná ze složek tímhle směrem netáhne — potřebujete pigment, který v receptuře není.",
  };
}

/* Spotřeba v g/m² ze síta a parametrů zakázky. Vrací i rozpis, aby bylo
   vidět, z čeho číslo vzniklo — technolog to musí umět zkontrolovat. */
function spotrebaZeSita({ sito, sita, tech, hustota, kryvost, material, podkladHex, koef, prenos,
                          viskozita }) {
  if (!sito || !sita || !sita.length) return null;
  const kl = String(sito).trim().toLowerCase();
  const nalezene = sita.filter((s) => s.sito.toLowerCase() === kl);
  // Parametry cizí technologie se nepoužijí — tampontisk se netiskne přes
  // sítotiskovou tkaninu a číslo z ní by nedávalo smysl. Řádek bez uvedené
  // technologie platí všude.
  const s = nalezene.find((x) => x.tech === tech) || nalezene.find((x) => !x.tech) || null;
  if (!s || !(s.vth > 0)) return null;
  const k = koef || { kryvost: {}, material: {}, podklad: {} };
  const kKryv = (kryvost && k.kryvost[String(kryvost).toLowerCase()]) || 1;
  const mat = String(material || "").toLowerCase();
  // materiál bývá složený ("Bavlna / Polyester") — vezme se nejvyšší koeficient
  let kMat = 1, matKlic = "";
  for (const klic of Object.keys(k.material || {})) {
    if (klic && mat.indexOf(klic) >= 0 && k.material[klic] > kMat) { kMat = k.material[klic]; matKlic = klic; }
  }
  const trida = tridaPodkladu(podkladHex);
  const kPod = (trida && k.podklad[trida]) || 1;
  // Řidší barva projde sítem snáz, hustší hůř. Jak moc, to je věc konkrétní
  // barvy a stroje — proto se to bere z tabulky koeficientů, ne ze vzorce.
  const kVisk = koefProHodnotu(k.viskozita, viskozita) || 1;
  const f = prenos != null ? n(prenos) : (s.prenos != null ? s.prenos : PRENOS_VYCHOZI);
  const gm2 = s.vth * f * n(hustota, 1.2) * kKryv * kMat * kPod * kVisk;
  // doporučený rozsah výtokového času k tomuhle sítu
  const dopVisk = (s.viskOd > 0 || s.viskDo > 0)
    ? { od: s.viskOd, do: s.viskDo, poharek: s.poharek } : null;
  const mimoRozsah = !!(dopVisk && n(viskozita) > 0
    && ((dopVisk.od > 0 && n(viskozita) < dopVisk.od) || (dopVisk.do > 0 && n(viskozita) > dopVisk.do)));
  return {
    gm2: gm2, sito: s, prenos: f,
    kKryvost: kKryv, kMaterial: kMat, materialKlic: matKlic,
    kPodklad: kPod, tridaPodkladu: trida,
    kViskozita: kVisk, viskozita: n(viskozita) || null,
    dopVisk: dopVisk, mimoRozsah: mimoRozsah,
  };
}

/* ========================= EVIDENCE ZBYTKŮ BAREV =========================
   Po zakázce zbude v kelímku barva. Dnes se buď vyhodí, nebo někde stojí bez
   popisku, dokud ji nikdo nepozná. Evidence ji vezme do systému: dostane kód
   na štítek, ví se z čeho je, kolik jí je, a při další zakázce aplikace sama
   nabídne, kolik z ní jde použít a kolik už stačí domíchat. */
const SOUBOR_ZBYTKY = "zbytky.csv";
const SLOZKA_EVIDENCE = "evidence";

/* Znaky kódu bez těch, které se na štítku pletou (0/O, 1/I/l). */
const ZNAKY_KODU = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
function novyKodZbytku(zbytky) {
  const obsazene = new Set((zbytky || []).map((z) => z.kod));
  for (let pokus = 0; pokus < 200; pokus++) {
    let k = "Z";
    for (let i = 0; i < 6; i++) k += ZNAKY_KODU[Math.floor(Math.random() * ZNAKY_KODU.length)];
    if (!obsazene.has(k)) return k;
  }
  return "Z" + Date.now().toString(36).toUpperCase().slice(-6);
}
const jeKodZbytku = (s) => /^Z[2-9A-HJ-NP-Z]{6}$/.test(String(s || "").trim().toUpperCase());

/* Báze (transparentní, medium) ředí barvu. Zbytek s bází se nedá použít tam,
   kde je potřeba plná sytost, a naopak — proto se na to filtruje. */
const VZOR_BAZE = /b[áa]ze|base|transparen|medium|firnis|extender/i;
const maBazi = (z) => (z.slozeni || []).some((c) => VZOR_BAZE.test(c.name || ""));
const normKomp = (s) => String(s || "").trim().toLowerCase().replace(/\s+/g, " ");

/* ---- expirace a čas použitelnosti (pot life) ----
   Dvousložkové barvy s tužidlem tuhnou od chvíle, kdy se smíchají — po
   uplynutí pot life je kelímek k ničemu, i když je plný. Expirace je proti
   tomu prosté datum spotřeby. Sleduje se obojí a rozhoduje to, co vyprší dřív. */
const HODINA = 3600 * 1000;
const POTLIFE_VYCHOZI = 8;        // hodin, běžné u dvousložkových sítotiskových barev

function stavZbytku(z, ted) {
  const nyni = ted || Date.now();
  const meze = [];
  if (z.expirace) {
    // datum spotřeby platí do konce toho dne
    const d = new Date(z.expirace + "T23:59:59");
    if (!isNaN(d)) meze.push({ do: d.getTime(), duvod: "spotřeba do " + z.expirace });
  }
  if (n(z.potlifeH) > 0) {
    const od = n(z.namichano) || n(z.ulozeno) || nyni;
    meze.push({ do: od + n(z.potlifeH) * HODINA,
      duvod: "pot life " + fmt(n(z.potlifeH), 0) + " h od namíchání" });
  }
  if (!meze.length) return { stav: "ok", zbyva: null, doKdy: null, duvod: "" };
  const nej = meze.reduce((a, b) => (a.do <= b.do ? a : b));
  const zbyva = nej.do - nyni;
  // "brzy" = poslední pětina lhůty, nejvýš ale den dopředu, ať to neřve zbytečně
  const lhuta = nej.do - (n(z.namichano) || n(z.ulozeno) || nyni);
  const prah = Math.min(24 * HODINA, Math.max(HODINA, lhuta * 0.2));
  return {
    stav: zbyva <= 0 ? "prosle" : (zbyva <= prah ? "brzy" : "ok"),
    zbyva: zbyva, doKdy: nej.do, duvod: nej.duvod,
  };
}

/* Zbývající čas lidsky: "za 3 h 20 min", "před 2 dny" */
function zbyvaText(ms) {
  if (ms == null) return "";
  const zaporne = ms < 0;
  const m = Math.abs(ms);
  const dny = Math.floor(m / (24 * HODINA));
  const hod = Math.floor((m % (24 * HODINA)) / HODINA);
  const min = Math.floor((m % HODINA) / 60000);
  let t;
  if (dny > 0) t = dny + (dny === 1 ? " den" : (dny < 5 ? " dny" : " dní")) + (hod ? " " + hod + " h" : "");
  else if (hod > 0) t = hod + " h" + (min ? " " + min + " min" : "");
  else t = Math.max(1, min) + " min";
  return zaporne ? "před " + t : "za " + t;
}

/* Viskozita se u zbytku měří výtokovým pohárkem — barva časem houstne,
   takže se drží i předchozí měření, aby byl vidět posun. */
const POHARKY = ["DIN 4 mm", "DIN 6 mm", "Ford 4 mm", "ISO 4 mm", "Zahn 2"];
function viskHistDoTextu(h) {
  return (h || []).map((m) => cislo(m.s, 1) + "@" + m.kdy).join("|");
}
function viskHistZTextu(s) {
  return String(s || "").split("|").filter(Boolean).map((kus) => {
    const [v, kdy] = kus.split("@");
    return { s: n(v), kdy: n(kdy) };
  }).filter((m) => m.s > 0);
}

/* Kolik zbytku jde do dávky použít, aniž by se rozhodil poměr.
   Zbytek je vlastně předem namíchaná část dávky: pro každou složku musí platit
   zbytek × jeho_podíl ≤ dávka × cílový_podíl. Nejtěsnější z těch podmínek
   určuje, kolik zbytku se vejde. Obsahuje-li zbytek složku, kterou cíl vůbec
   nemá, použít nejde vůbec. */
function vyuzitelnyZbytek(zbytek, comps, totalG) {
  if (!zbytek || !(n(zbytek.gramu) > 0) || !comps || !comps.length || !(totalG > 0)) return null;
  const cil = new Map();
  for (const c of comps) {
    const k = normKomp(c.name);
    cil.set(k, (cil.get(k) || 0) + n(c.g) / totalG);
  }
  const soucet = (zbytek.slozeni || []).reduce((s, c) => s + n(c.pct), 0);
  if (!(soucet > 0)) return null;
  const zb = new Map();
  for (const c of (zbytek.slozeni || [])) {
    const k = normKomp(c.name);
    zb.set(k, (zb.get(k) || 0) + n(c.pct) / soucet);
  }
  let nejtesnejsi = Infinity;
  for (const [k, q] of zb) {
    if (!(q > 0)) continue;
    const p = cil.get(k) || 0;
    if (!(p > 0)) return null;               // složka navíc — zbytek sem nepatří
    nejtesnejsi = Math.min(nejtesnejsi, p / q);
  }
  if (!isFinite(nejtesnejsi) || nejtesnejsi <= 0) return null;
  const pouzit = Math.min(n(zbytek.gramu), totalG * nejtesnejsi);
  if (!(pouzit > 0.05)) return null;
  // čím se zbytek podílí na jednotlivých složkách
  const prispevek = comps.map((c) => pouzit * (zb.get(normKomp(c.name)) || 0));
  return {
    zbytek: zbytek,
    pouzit: pouzit,
    domichat: Math.max(0, totalG - pouzit),
    zbudeVKelimku: Math.max(0, n(zbytek.gramu) - pouzit),
    prispevek: prispevek,
    // 1 = složení sedí přesně, míň = zbytek je v něčem sytější než cíl
    shoda: Math.min(1, nejtesnejsi),
    pomer: nejtesnejsi,      // neomezeně — potřeba pro dopočet celé dávky
  };
}

/* Přepočet receptury tak, aby se spotřeboval CELÝ zbytek.
   Do dávky, kterou žádá zakázka, se často vejde jen část starého kelímku.
   Zbytek se dá využít celý, když se dávka zvětší — nejmenší možná dávka je ta,
   ve které ani jedna složka zbytku nepřesahuje svůj podíl:

       dávka = zbytek / nejtěsnější poměr

   Odstín zůstává přesný, jen se namíchá víc, než zakázka potřebuje. */
function zbytekCelyPlan(zbytek, comps, totalG) {
  const zaklad = vyuzitelnyZbytek(zbytek, comps, totalG);
  if (!zaklad || !(zaklad.pomer > 0)) return null;
  const L = n(zbytek.gramu);
  // Nikdy míň, než žádá zakázka — vejde-li se zbytek do její dávky celý,
  // není co zvětšovat a plán je totožný s běžným využitím.
  const davka = Math.max(totalG, L / zaklad.pomer);
  const podil = comps.map((c) => (totalG > 0 ? n(c.g) / totalG : 0));
  // kolik z které složky zbytek přináší (celý, ne jen jeho použitelná část)
  const prispevek = zaklad.prispevek.map((p) => zaklad.pouzit > 0 ? p / zaklad.pouzit * L : 0);
  return Object.assign({}, zaklad, {
    celyZbytek: true,
    davka: davka,
    pouzit: L,
    prispevek: prispevek,
    pridat: comps.map((c, i) => Math.max(0, davka * podil[i] - prispevek[i])),
    domichat: Math.max(0, davka - L),
    zbudeVKelimku: 0,
    prebytek: Math.max(0, davka - totalG),   // o kolik víc, než zakázka žádá
  });
}

/* ---- čárový kód Code 128 pro štítek na kelímek ----
   Kreslí se rovnou v aplikaci, aby štítek šel vytisknout i bez internetu.
   Code 128 zvládne každá běžná čtečka i kamera v mobilu; sada B pokrývá
   číslice i velká písmena, ze kterých se kód zbytku skládá. */
const C128 = ["212222", "222122", "222221", "121223", "121322", "131222", "122213", "122312",
  "132212", "221213", "221312", "231212", "112232", "122132", "122231", "113222", "123122",
  "123221", "223211", "221132", "221231", "213212", "223112", "312131", "311222", "321122",
  "321221", "312212", "322112", "322211", "212123", "212321", "232121", "111323", "131123",
  "131321", "112313", "132113", "132311", "211313", "231113", "231311", "112133", "112331",
  "132131", "113123", "113321", "133121", "313121", "211331", "231131", "213113", "213311",
  "213131", "311123", "311321", "331121", "312113", "312311", "332111", "314111", "221411",
  "431111", "111224", "111422", "121124", "121421", "141122", "141221", "112214", "112412",
  "122114", "122411", "142112", "142211", "241211", "221114", "413111", "241112", "134111",
  "111242", "121142", "121241", "114212", "124112", "124211", "411212", "421112", "421211",
  "212141", "214121", "412121", "111143", "111341", "131141", "114113", "114311", "411113",
  "411311", "113141", "114131", "311141", "411131", "211412", "211214", "211232", "2331112"];

/* Vrátí šířky čar a mezer (střídavě, začíná čárou) pro daný text. */
function code128Pruhy(text) {
  const s = String(text || "");
  const hodnoty = [104];                       // START B
  for (let i = 0; i < s.length; i++) {
    const c = s.charCodeAt(i);
    if (c < 32 || c > 126) throw new Error("Kód obsahuje znak, který Code 128 sada B neumí.");
    hodnoty.push(c - 32);
  }
  let kontrola = 104;
  for (let i = 1; i < hodnoty.length; i++) kontrola += hodnoty[i] * i;
  hodnoty.push(kontrola % 103);
  hodnoty.push(106);                           // STOP
  const pruhy = [];
  for (const h of hodnoty) for (const z of C128[h]) pruhy.push(parseInt(z, 10));
  return pruhy;
}

function code128Svg(text, vyska, modul) {
  const pruhy = code128Pruhy(text);
  const m = modul || 2;
  const v = vyska || 60;
  let x = 10, cary = "";
  for (let i = 0; i < pruhy.length; i++) {
    const w = pruhy[i] * m;
    if (i % 2 === 0) cary += '<rect x="' + x + '" y="0" width="' + w + '" height="' + v + '"/>';
    x += w;
  }
  const sirka = x + 10;
  return '<svg xmlns="http://www.w3.org/2000/svg" width="' + sirka + '" height="' + v
    + '" viewBox="0 0 ' + sirka + ' ' + v + '" fill="#000">' + cary + '</svg>';
}
const code128Url = (text, vyska, modul) =>
  "data:image/svg+xml;charset=utf-8," + encodeURIComponent(code128Svg(text, vyska, modul));

/* Evidence se odkládá do souboru evidence/zbytky.csv — kelímek stojí v dílně
   a musí být vidět ze všech počítačů, ne jen z toho, kde ho někdo zapsal. */
const ZBYTKY_HLAVICKA = ["kod", "nazev", "gramu", "puvodne", "hustota", "hex", "zakazka",
  "produkt", "barva", "technologie", "poloha", "ulozeno", "zmeneno", "expirace", "pozn",
  "zdroj", "namichano", "potlife_h", "tuzidlo", "viskozita_s", "viskozita_pohar",
  "viskozita_kdy", "viskozita_historie", "stav", "davka_g", "komponenta", "procento"];

/* Čísla se zaokrouhlují — soubor někdo otevře v Excelu a 71,61999999999999
   tam vypadá jako chyba, i když o setinu procenta v barvě nejde. */
const cislo = (v, des) => (v == null || v === "") ? "" : String(Math.round(n(v) * Math.pow(10, des)) / Math.pow(10, des));

function zbytkyDoCsv(zbytky) {
  const radky = [ZBYTKY_HLAVICKA];
  for (const z of zbytky) {
    const slozky = (z.slozeni && z.slozeni.length) ? z.slozeni : [{ name: "", pct: "" }];
    for (const c of slozky) {
      radky.push([z.kod, z.nazev || "", cislo(z.gramu, 2), z.puvodne == null ? "" : cislo(z.puvodne, 2),
        z.hustota == null ? "" : z.hustota, (z.hex || "").replace(/^#/, ""),
        z.zakazka || "", z.produkt || "", z.barva || "", z.tech || "", z.poloha || "",
        z.ulozeno || "", z.zmeneno || "", z.expirace || "", z.pozn || "", z.zdroj || "",
        z.namichano || "", z.potlifeH == null ? "" : cislo(z.potlifeH, 1),
        z.tuzidlo ? "ano" : "", z.viskozita == null || z.viskozita === "" ? "" : cislo(z.viskozita, 1),
        z.viskPohar || "", z.viskKdy || "", viskHistDoTextu(z.viskHist),
        z.stav || "sklad", z.davkaG == null ? "" : cislo(z.davkaG, 2),
        c.name || "", c.pct === "" ? "" : cislo(c.pct, 4)]);
    }
  }
  return radky.map((r) => r.map((c) => '"' + String(c == null ? "" : c).replace(/"/g, '""') + '"')
    .join(";")).join("\r\n") + "\r\n";
}

function csvNaZbytky(text) {
  const rows = parseCsv(text);
  if (!rows.length) return [];
  const head = rows[0].map((h) => h.toLowerCase().trim());
  const i = (jm) => head.indexOf(jm);
  const ci = {};
  for (const jm of ZBYTKY_HLAVICKA) ci[jm] = i(jm);
  if (ci.kod < 0) throw new Error("CSV zbytků musí mít sloupec kod.");
  const mapa = new Map();
  for (const r of rows.slice(1)) {
    const kod = String(r[ci.kod] || "").trim();
    if (!kod) continue;
    if (!mapa.has(kod)) {
      const hex = String(r[ci.hex] || "").trim();
      mapa.set(kod, {
        id: uid(), kod: kod, nazev: r[ci.nazev] || "",
        gramu: n(r[ci.gramu]), puvodne: ci.puvodne >= 0 && r[ci.puvodne] !== "" ? n(r[ci.puvodne]) : null,
        hustota: ci.hustota >= 0 && r[ci.hustota] !== "" ? n(r[ci.hustota], 1.2) : 1.2,
        hex: /^#?[0-9a-f]{6}$/i.test(hex) ? (hex[0] === "#" ? hex : "#" + hex) : "#888888",
        zakazka: r[ci.zakazka] || "", produkt: r[ci.produkt] || "", barva: r[ci.barva] || "",
        tech: r[ci.technologie] || "", poloha: r[ci.poloha] || "",
        ulozeno: n(r[ci.ulozeno]) || 0, zmeneno: n(r[ci.zmeneno]) || n(r[ci.ulozeno]) || 0,
        expirace: r[ci.expirace] || "", pozn: r[ci.pozn] || "", zdroj: r[ci.zdroj] || "",
        namichano: n(r[ci.namichano]) || n(r[ci.ulozeno]) || 0,
        potlifeH: ci.potlife_h >= 0 && r[ci.potlife_h] !== "" ? n(r[ci.potlife_h]) : null,
        tuzidlo: /^(1|ano|yes|true|x)$/i.test(String(r[ci.tuzidlo] || "").trim()),
        viskozita: ci.viskozita_s >= 0 && r[ci.viskozita_s] !== "" ? n(r[ci.viskozita_s]) : "",
        viskPohar: r[ci.viskozita_pohar] || "", viskKdy: n(r[ci.viskozita_kdy]) || 0,
        viskHist: viskHistZTextu(r[ci.viskozita_historie]),
        // "vtisku" = barva se právě namíchala a je na stroji, kolik zbude
        // se teprve dozvíme; "sklad" = zbytek v kelímku k dalšímu použití
        stav: String(r[ci.stav] || "sklad").trim().toLowerCase() === "vtisku" ? "vtisku" : "sklad",
        davkaG: ci.davka_g >= 0 && r[ci.davka_g] !== "" ? n(r[ci.davka_g]) : null,
        slozeni: [],
      });
    }
    const jmenoK = String(r[ci.komponenta] || "").trim();
    if (jmenoK) mapa.get(kod).slozeni.push({ name: jmenoK, pct: n(r[ci.procento]) });
  }
  return Array.from(mapa.values());
}

/* Sloučení evidence ze souboru s tou v prohlížeči. Rozhoduje čas poslední
   změny — kelímek mohl někdo upravit na jiném počítači. */
function sloucZbytky(mistni, ze_souboru) {
  const mapa = new Map((mistni || []).map((z) => [z.kod, z]));
  for (const z of (ze_souboru || [])) {
    const stary = mapa.get(z.kod);
    if (!stary || n(z.zmeneno) > n(stary.zmeneno)) mapa.set(z.kod, Object.assign({}, z,
      { id: stary ? stary.id : z.id }));
  }
  return Array.from(mapa.values()).sort((a, b) => n(b.zmeneno) - n(a.zmeneno));
}

/* Nabídky zbytků pro danou dávku. Prošlé se nenabízejí vůbec — v kelímku sice
   barva je, ale použitelná není. Ty, kterým lhůta brzy končí, jdou naopak
   dopředu: buď se spotřebují teď, nebo se vyhodí. */
function nabidkyZbytku(zbytky, comps, totalG, ted) {
  return (zbytky || [])
    .map((z) => {
      const v = vyuzitelnyZbytek(z, comps, totalG);
      return v ? Object.assign(v, { stav: stavZbytku(z, ted) }) : null;
    })
    .filter((v) => v && v.stav.stav !== "prosle" && v.zbytek.stav !== "vtisku")
    .sort((a, b) => (a.stav.stav === "brzy" ? 0 : 1) - (b.stav.stav === "brzy" ? 0 : 1)
      || b.pouzit - a.pouzit);
}

/* Databáze, ze kterých receptury pocházejí — podklad pro filtr. */
function zdrojeReceptur(recipes) {
  const mapa = new Map();
  for (const r of (recipes || [])) {
    const z = r.zdroj || "";
    mapa.set(z, (mapa.get(z) || 0) + 1);
  }
  return Array.from(mapa.entries())
    .map(([zdroj, pocet]) => ({ zdroj: zdroj, pocet: pocet,
      nazev: zdroj ? zdroj.replace(/\.csv$/i, "") : "vlastní a ruční" }))
    .sort((a, b) => (a.zdroj ? 0 : 1) - (b.zdroj ? 0 : 1) || a.nazev.localeCompare(b.nazev, "cs"));
}

/* Přepínač databází. Dokud je databáze jediná, není co přepínat a nic se
   nezobrazuje — objeví se sám, jakmile ve složce přibude druhý soubor. */
function FiltrDatabaze({ recipes, hodnota, setHodnota, popis }) {
  const zdroje = useMemo(() => zdrojeReceptur(recipes), [recipes]);
  if (zdroje.filter((z) => z.zdroj).length < 2) return null;
  return html`
    <div style=${{ marginBottom: 10 }}>
      <label className="f">Databáze receptur</label>
      <div className="chips">
        <button className=${"chip" + (hodnota ? "" : " on")} onClick=${() => setHodnota("")}>
          vše (${fmt(recipes.length, 0)})
        </button>
        ${zdroje.map((z) => html`
          <button key=${z.zdroj || "-"} className=${"chip" + (hodnota === (z.zdroj || "@vlastni") ? " on" : "")}
            title=${z.zdroj || "receptury zadané ručně v aplikaci"}
            onClick=${() => setHodnota(z.zdroj || "@vlastni")}>
            ${z.nazev} (${fmt(z.pocet, 0)})
          </button>`)}
      </div>
      ${popis && html`<p className="note" style=${{ marginTop: 6 }}>${popis}</p>`}
    </div>`;
}

/* Vybere receptury z jedné databáze. "" = ze všech, "@vlastni" = jen ty,
   které nepřišly ze souboru. */
function podleDatabaze(recipes, filtr) {
  if (!filtr) return recipes;
  if (filtr === "@vlastni") return recipes.filter((r) => !r.zdroj);
  return recipes.filter((r) => r.zdroj === filtr);
}

/* Řady barev se vážou na technologii — sítotisková barva se do tampontisku
   nehodí. Technologie může být uvedená u receptury (sloupec v CSV), nebo se
   přiřadí celému souboru v Připojení k mostu. Neurčená řada platí všude. */
function techReceptury(r, dbTech) {
  const zRadku = String(r.tech || "").trim();
  if (zRadku) return zRadku.split(/[,;+ ]+/).filter(Boolean);
  const zeSouboru = r.zdroj ? String((dbTech || {})[r.zdroj] || "").trim() : "";
  return zeSouboru ? zeSouboru.split(/[,;+ ]+/).filter(Boolean) : [];
}
function podleTechnologie(recipes, tech, dbTech) {
  if (!tech) return recipes;
  return (recipes || []).filter((r) => {
    const t = techReceptury(r, dbTech);
    return !t.length || t.indexOf(tech) >= 0;
  });
}

function Importer({ setProducts, setRecipes, guardDelete, deletePw, setDeletePw }) {
  const [text, setText] = useState("");
  const [preview, setPreview] = useState(null);
  const [recPreview, setRecPreview] = useState(null);
  const [msg, setMsg] = useState(null);
  const fileRef = useRef(null);
  const recFileRef = useRef(null);
  const [pwCur, setPwCur] = useState("");
  const [pw1, setPw1] = useState("");
  const [pw2, setPw2] = useState("");
  const [pwMsg, setPwMsg] = useState(null);
  const savePw = () => {
    setPwMsg(null);
    if (deletePw && pwCur !== deletePw) { setPwMsg({ warn: "Současné heslo nesouhlasí." }); return; }
    if (pw1 !== pw2) { setPwMsg({ warn: "Nová hesla se neshodují." }); return; }
    setDeletePw(pw1);
    setPwCur(""); setPw1(""); setPw2("");
    setPwMsg({ ok: pw1 ? "Heslo pro mazání bylo nastaveno." : "Ochrana heslem byla odebrána — mazání teď funguje bez potvrzení." });
  };

  const analyze = (raw) => {
    setMsg(null); setRecPreview(null);
    try {
      let items;
      const t = raw.trim();
      if (!t) { setMsg({ warn: "Vložte data nebo nahrajte soubor." }); return; }
      if (t[0] === "{" || t[0] === "[") items = jsonToItems(JSON.parse(t));
      else items = rowsToItems(parseCsv(t));
      const mapped = items.filter((i) => i.name || i.ref).map((i) => Object.assign({}, i, { tech: mapTech(i.techRaw) }));
      const skipped = mapped.filter((i) => !i.tech);
      const ok = mapped.filter((i) => i.tech && i.w > 0 && i.h > 0);
      setPreview({ ok, skipped, badDim: mapped.filter((i) => i.tech && !(i.w > 0 && i.h > 0)), imgs: ok.filter((i) => i.img).length });
    } catch (e) {
      setMsg({ warn: "Data se nepodařilo přečíst: " + e.message });
      setPreview(null);
    }
  };

  const doImport = () => {
    if (!preview || !preview.ok.length) return;
    setProducts((prev) => {
      const byKey = new Map(prev.map((p) => [(p.ref || p.name).toLowerCase(), p]));
      let added = 0, updated = 0;
      for (const i of preview.ok) {
        const key = (i.ref || i.name).toLowerCase();
        const pos = { id: uid(), name: i.pos, w: i.w, h: i.h, cover: i.cover || 100, tech: i.tech, img: i.img || "" };
        const ex = byKey.get(key);
        if (ex) {
          if (i.pimg) ex.img = i.pimg;
          if (i.colors && i.colors.length) ex.colors = i.colors;
          if (i.material && !ex.material) ex.material = i.material;
          const m = ex.positions.find((x) => x.name === pos.name && x.tech === pos.tech);
          if (m) { m.w = pos.w; m.h = pos.h; m.cover = pos.cover; if (pos.img) m.img = pos.img; updated++; }
          else { ex.positions = ex.positions.concat([pos]); updated++; }
        } else {
          byKey.set(key, { id: uid(), ref: i.ref, name: i.name || i.ref, material: i.material, img: i.pimg || "", colors: i.colors || [], positions: [pos] });
          added++;
        }
      }
      setMsg({ ok: "Import hotov — nové produkty: " + added + ", aktualizované polohy: " + updated + "." });
      return Array.from(byKey.values());
    });
    setPreview(null); setText("");
  };

  const analyzeRecipes = (raw) => {
    setMsg(null); setPreview(null);
    try {
      const recs = csvToRecipes(raw);
      if (!recs.length) { setMsg({ warn: "V souboru nebyly nalezeny žádné receptury." }); return; }
      setRecPreview(recs);
    } catch (e) {
      setMsg({ warn: "Receptury se nepodařilo přečíst: " + e.message });
      setRecPreview(null);
    }
  };

  const doImportRecipes = () => {
    if (!recPreview) return;
    setRecipes((prev) => {
      const v = sloucReceptury(prev, recPreview);
      setMsg({ ok: "Receptury naimportovány — nové: " + v.pridano + ", nahrazené: " + v.obnoveno + "." });
      return v.seznam;
    });
    setRecPreview(null); setText("");
  };

  const readFile = (e, cb) => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { setText(String(rd.result)); cb(String(rd.result)); };
    rd.readAsText(f, "utf-8");
    e.target.value = "";
  };

  return html`
    <${React.Fragment}>
      <div className="card">
        <h2>Import produktů (katalog)</h2>
        <p className="hint">CSV nebo JSON. Technologie se mapují automaticky: Tampontisk → PDP · Sítotisk (plast, papír) i rotační → SCR · Sítotisk (textil) → TXP · Transfer → TRS · Firing → FIR. Opakovaný import nic nezdvojí — existující produkty se aktualizují.</p>
        <div className="rowline">
          <button className="btn sec" onClick=${() => fileRef.current && fileRef.current.click()}>Nahrát soubor produktů</button>
          <input ref=${fileRef} type="file" accept=".csv,.json,.txt" style=${{ display: "none" }} onChange=${(e) => readFile(e, analyze)} />
          <button className="btn sec" onClick=${() => recFileRef.current && recFileRef.current.click()}>Nahrát soubor receptur (CSV)</button>
          <input ref=${recFileRef} type="file" accept=".csv,.txt" style=${{ display: "none" }} onChange=${(e) => readFile(e, analyzeRecipes)} />
        </div>
        <textarea value=${text} onChange=${(e) => setText(e.target.value)} placeholder="…nebo sem vložte obsah souboru a použijte tlačítka Analyzovat níže" />
        <div className="rowline" style=${{ marginTop: 10 }}>
          <button className="btn" onClick=${() => analyze(text)}>Analyzovat jako produkty</button>
          <button className="btn" onClick=${() => analyzeRecipes(text)}>Analyzovat jako receptury</button>
          ${preview && html`<button className="btn" style=${{ background: "var(--ok)" }} onClick=${doImport} disabled=${!preview.ok.length}>Importovat ${preview.ok.length} poloh</button>`}
          ${recPreview && html`<button className="btn" style=${{ background: "var(--ok)" }} onClick=${doImportRecipes}>Importovat ${recPreview.length} receptur</button>`}
        </div>
        ${msg && msg.warn && html`<div className="warnbox">${msg.warn}</div>`}
        ${msg && msg.ok && html`<div className="okbox">${msg.ok}</div>`}

        ${preview && html`
          <${React.Fragment}>
            ${preview.imgs === 0
              ? html`<div className="warnbox"><b>Pozor:</b> soubor neobsahuje žádné obrázky náhledů — pravděpodobně stará verze exportu.</div>`
              : html`<div className="okbox">✓ Soubor obsahuje obrázkové náhledy u ${preview.imgs.toLocaleString("cs-CZ")} z ${preview.ok.length.toLocaleString("cs-CZ")} poloh.</div>`}
            ${preview.skipped.length > 0 && html`<div className="warnbox">${preview.skipped.length} řádků přeskočeno — nerozpoznaná technologie (např. „${preview.skipped[0].techRaw}").</div>`}
            ${preview.badDim.length > 0 && html`<div className="warnbox">${preview.badDim.length} řádků přeskočeno — chybí rozměr tiskové plochy.</div>`}
            <table className="t" style=${{ marginTop: 12 }}>
              <thead><tr><th>Ref.</th><th>Produkt</th><th>Poloha</th><th>Technologie</th><th className="num">Š×V mm</th></tr></thead>
              <tbody>
                ${preview.ok.slice(0, 30).map((i, k) => html`
                  <tr key=${k}>
                    <td className="num">${i.ref}</td>
                    <td>${i.name}</td>
                    <td>${i.pos}</td>
                    <td><span className="tag tech">${i.tech}</span> <span className="note">(${i.techRaw})</span></td>
                    <td className="num">${i.w}×${i.h}</td>
                  </tr>`)}
              </tbody>
            </table>
            ${preview.ok.length > 30 && html`<p className="note">… a dalších ${preview.ok.length - 30} řádků.</p>`}
          <//>`}

        ${recPreview && html`
          <table className="t" style=${{ marginTop: 12 }}>
            <thead><tr><th /><th>Receptura</th><th>Typ</th><th>Řada</th><th className="num">Hustota</th><th>Komponenty</th><th className="num">Σ %</th></tr></thead>
            <tbody>
              ${recPreview.slice(0, 30).map((r) => {
                const sum = r.components.reduce((s, c) => s + n(c.pct), 0);
                return html`
                  <tr key=${r.id}>
                    <td><span className="swatch" style=${{ background: r.hex }} /></td>
                    <td style=${{ fontWeight: 700 }}>${r.name}</td>
                    <td>${r.type}</td>
                    <td>${r.series}</td>
                    <td className="num">${fmt(r.density, 2)}</td>
                    <td>${r.components.map((c) => c.name + " " + fmt(n(c.pct)) + " %").join(" · ")}</td>
                    <td className="num" style=${{ color: Math.abs(sum - 100) > 0.01 ? "var(--warn)" : "inherit" }}>${fmt(sum)}</td>
                  </tr>`;
              })}
            </tbody>
          </table>
          ${recPreview.length > 30 && html`<p className="note">… a dalších ${recPreview.length - 30} receptur.</p>`}`}
      </div>

      <div className="card">
        <h2>Formát receptur (CSV)</h2>
        <p className="hint">Jeden řádek = jedna komponenta; řádky se stejným názvem receptury se sloučí. Tímto formátem nahrajete celou databázi Printcolor, jakmile ji od nich dostanete (jejich Pantone formule jsou licencovaná data, která poskytují zákazníkům).</p>
        <pre className="tpl">nazev;typ;rada;hustota;hex;komponenta;procento
PANTONE 485 C;Pantone;Printcolor 390;1,25;DA291C;Printcolor Warm Red;62
PANTONE 485 C;Pantone;Printcolor 390;1,25;DA291C;Printcolor Yellow 012;28
PANTONE 485 C;Pantone;Printcolor 390;1,25;DA291C;Transparentní báze;10
Firemní zelená CUST-014;Custom;Printcolor 390;1,22;0E8A5F;Printcolor Green;48
Firemní zelená CUST-014;Custom;Printcolor 390;1,22;0E8A5F;Transparentní báze;52</pre>
      </div>

      <div className="card">
        <h2>Správa dat</h2>
        <div className="rowline">
          <button className="btn sec" onClick=${() => {
            if (window.confirm("Obnovit katalog produktů z data.js? Vaše ruční úpravy produktů budou zahozeny (receptury zůstanou).")) {
              setProducts(window.KATALOG || []);
              setMsg({ ok: "Katalog obnoven z data.js (" + ((window.KATALOG || []).length) + " produktů)." });
            }
          }}>Obnovit katalog z data.js</button>
          <button className="btn danger" onClick=${() => guardDelete(() => {
            if (window.confirm("Opravdu vymazat VŠECHNY produkty? (Receptury zůstanou.)")) {
              setProducts([]);
              setMsg({ ok: "Katalog produktů vymazán." });
            }
          }, "vymazání celého katalogu produktů")}>Vymazat katalog produktů</button>
        </div>
      </div>

      <div className="card">
        <h2>Zabezpečení mazání</h2>
        <p className="hint">${deletePw
          ? "Mazání produktů a receptur je chráněno heslem — nechte nová hesla prázdná a uložte, pokud chcete ochranu odebrat."
          : "Nastavte heslo, aby šlo mazat produkty a receptury jen po jeho zadání."}</p>
        <div className="frow c3">
          ${deletePw && html`<div><label className="f">Současné heslo</label><input type="password" value=${pwCur} onChange=${(e) => setPwCur(e.target.value)} /></div>`}
          <div><label className="f">Nové heslo</label><input type="password" value=${pw1} onChange=${(e) => setPw1(e.target.value)} placeholder=${deletePw ? "prázdné = zrušit ochranu" : "heslo"} /></div>
          <div><label className="f">Zopakovat nové heslo</label><input type="password" value=${pw2} onChange=${(e) => setPw2(e.target.value)} /></div>
        </div>
        ${pwMsg && pwMsg.warn && html`<div className="warnbox">${pwMsg.warn}</div>`}
        ${pwMsg && pwMsg.ok && html`<div className="okbox">${pwMsg.ok}</div>`}
        <button className="btn" style=${{ marginTop: 10 }} onClick=${savePw}>Uložit</button>
      </div>
    <//>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
})();
}
</script>
</body>
</html>
