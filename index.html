        ${ser.err && html`<div className="warnbox">${ser.err}</div>`}

        <label className="f" style=${{ marginTop: 16 }}>3 · Kamera (QR / DataMatrix na zakázkovém listu)</label>
        <div className="rowline">
          ${!cam.on
            ? html`<button className="btn sec" onClick=${cam.start} disabled=${!cam.supported}>Zapnout kameru</button>`
            : html`<button className="btn danger sm" onClick=${cam.stop}>Vypnout kameru</button>`}
          ${!cam.supported && html`<span className="note">tento prohlížeč čtení kódů z kamery nepodporuje (vyžaduje Chrome/Edge)</span>`}
        </div>
        ${cam.err && html`<div className="warnbox">${cam.err}</div>`}
        ${cam.on && html`<video className="cam" ref=${cam.videoRef} muted playsInline></video>`}

        <label className="f" style=${{ marginTop: 16 }}>Ruční zadání / zkouška</label>
        <div className="rowline">
          <input style=${{ flex: "1 1 320px" }} value=${manual} onChange=${(e) => setManual(e.target.value)}
            onKeyDown=${(e) => { if (e.key === "Enter") { e.preventDefault(); podat(); } }}
            placeholder="Např. 11101 nebo IRM1|ref=11101|ks=500|barva=105" />
          <button className="btn sec" onClick=${podat}>Načíst</button>

      ${res && html`

            <button className="btn sec sm" onClick=${clearLog}>Vymazat</button>
          </div>
          ${scanLog.map((s) => html`
            <div key=${s.ts} className="scanrow">
              <span className="dot" style=${{ background: s.res.product ? "var(--ok)" : "var(--warn)" }}></span>
              <span className="note" style=${{ flex: "0 0 60px" }}>${new Date(s.ts).toLocaleTimeString("cs-CZ")}</span>
              <span className="scanraw">${s.raw}</span>
              <span className="note" style=${{ flex: "0 0 auto" }}>${s.res.product ? ((s.res.product.ref || "") + " " + s.res.product.name).slice(0, 40) : "nerozpoznáno"}</span>
            </div>`)}
        </div>`}

      <div className="card">
        <h2>Formát kódu specifikace</h2>
        <p className="hint">Čtečka může načíst buď samotné referenční číslo produktu, nebo celou zakázku. Klíče se oddělují svislítkem, středníkem nebo tabulátorem; pořadí nerozhoduje a chybějící údaje zůstanou v kalkulaci beze změny.</p>
        <pre className="tpl">11101

IRM1|ref=11101|ks=500|poz=2|barva=105|rec=PANTONE 485 C|ztraty=15|obj=2026-114

{"ref":"11101","ks":500,"barva":"105","rec":"PANTONE 485 C","zakaznik":"Firma s.r.o."}</pre>
        <p className="note" style=${{ marginTop: 10 }}>
          <b>Klíče:</b> ref (kod, produkt, sku) · ks (mnozstvi, pocet, qty) · poz (poloha — pořadové číslo, název nebo technologie)
          · barva (kód, název nebo hex) · rec (receptura, pantone) · gm2 (spotreba) · ztraty · min (min. dávka)
          · obj (zakazka) · zakaznik (objednavatel) · sito · kryvost · povrch · pozn.
        </p>
      </div>
    <//>`;
}

/* ============================ APP ============================ */
const ZALOZKY_NAZVY = {
  calc: "Kalkulace", pdf: "Načtení specu z PDF", scan: "Čárový kód",
  zak: "Zakázky (SGPS)", most: "Připojení k mostu", prod: "Produkty",
  rec: "Receptury", zbytky: "Zbytky barev", imp: "Import / data",
};

/* Pohyb po záložkách s možností vrátit se.
   Odskočit z rozdělané kalkulace do receptur a zpátky se musí dát jedním
   tlačítkem — a hlavně tak, aby se cestou nic nezahodilo. Kalkulace proto
   zůstává v paměti a jen se schová (viz níže), tady se pamatuje jen cesta. */
function useZalozky(vychozi) {
  const [tab, setTabPrimo] = useState(vychozi);
  const [historie, setHistorie] = useState([]);
  const tabRef = useRef(vychozi);
  const zpetRef = useRef(null);
  tabRef.current = tab;

  const setTab = (t) => {
    const stary = tabRef.current;
    if (!t || t === stary) return;
    // Odkud jdeme si musíme zapamatovat TEĎ — React funkci uvnitř setHistorie
    // spustí až při překreslení, kdy už by v tabRef byla nová záložka.
    setHistorie((h) => h.concat([stary]).slice(-20));
    tabRef.current = t;
    setTabPrimo(t);
    // ať zabere i tlačítko zpět v prohlížeči a boční tlačítko myši;
    // při otevření ze souboru (file://) to prohlížeč zakazuje, nevadí
    try { window.history.pushState({ irm: t }, ""); } catch (e) { /* nevadí */ }
  };

  const zpet = () => {
    if (!historie.length) return;
    const kam = historie[historie.length - 1];
    setHistorie(historie.slice(0, -1));
    tabRef.current = kam;
    setTabPrimo(kam);
  };
  zpetRef.current = zpet;

  useEffect(() => {
    const naZpet = () => { if (zpetRef.current) zpetRef.current(); };
    const naKlavesu = (e) => {
      if (e.altKey && e.key === "ArrowLeft") { e.preventDefault(); naZpet(); }
    };
    window.addEventListener("popstate", naZpet);
    window.addEventListener("keydown", naKlavesu);
    return () => {
      window.removeEventListener("popstate", naZpet);
      window.removeEventListener("keydown", naKlavesu);
    };
  }, []);

  return { tab: tab, setTab: setTab, zpet: zpet,
    kamZpet: historie.length ? historie[historie.length - 1] : null };
}

function App() {
  // Kalkulace se nikdy neodpojuje, jen schová (display:none) — jinak by odskok
  // do receptur nebo produktů zahodil rozdělaný výpočet i rozdělané navážení.
  const { tab, setTab, zpet, kamZpet } = useZalozky("calc");
  const [theme, setTheme] = useState(() => {
    const saved = loadLS("irm-theme", null);
    if (saved === "light" || saved === "dark") return saved;
    return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  });
  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    saveLS("irm-theme", theme);
  }, [theme]);
  const [menuOpen, setMenuOpen] = useState(false);
  const menuRef = useRef(null);
  useEffect(() => {
    if (!menuOpen) return;
    const onDocClick = (e) => { if (menuRef.current && !menuRef.current.contains(e.target)) setMenuOpen(false); };
    document.addEventListener("mousedown", onDocClick);
    return () => document.removeEventListener("mousedown", onDocClick);
  }, [menuOpen]);
  const dataJsOk = Array.isArray(window.KATALOG) && window.KATALOG.length > 0;
  const [products, setProducts] = useState(() => {
    const stored = loadLS("irm-products", null);
    const base = dataJsOk ? window.KATALOG : [];
    return fixTech(stored && stored.length ? stored : base);
  });
  const [recipes, setRecipes] = useState(() => loadLS("irm-recipes", SEED_RECIPES));
  const [links, setLinks] = useState(() => loadLS("irm-links", {}));
  useEffect(() => { saveLS("irm-links", links); }, [links]);
  const [deletePw, setDeletePw] = useState(() => loadLS("irm-delete-pw", ""));
  useEffect(() => { saveLS("irm-delete-pw", deletePw); }, [deletePw]);
  const [pwGate, setPwGate] = useState(null);
  const guardDelete = (actionFn, label) => {
    if (!deletePw) { actionFn(); return; }
    setPwGate({ onConfirm: actionFn, label: label || "smazání" });
  };
  const first = useRef(true);

  // Samoléčba: při nové verzi data.js doplní barvy, kódy a fotky do uloženého
  // katalogu podle ref — ruční produkty a úpravy zůstávají nedotčené.
  useEffect(() => {
    const ver = String(window.KATALOG_VERZE || "");
    if (!dataJsOk || !ver || loadLS("irm-katalog-verze", "") === ver) return;
    const byRef = new Map(window.KATALOG.map((k) => [String(k.ref), k]));
    let zmena = false;
    const obohacene = products.map((p) => {
      const k = byRef.get(String(p.ref || ""));
      if (!k) return p;
      const np = Object.assign({}, p);
      if (k.colors && k.colors.length) {
        const stare = JSON.stringify(p.colors || []);
        if (stare !== JSON.stringify(k.colors)) { np.colors = k.colors; zmena = true; }
      }
      if (!np.img && k.img) { np.img = k.img; zmena = true; }
      if (k.positions && k.positions.length) {
        np.positions = (np.positions || []).map((pos) => {
          if (pos.img) return pos;
          const m = k.positions.find((kp) => kp.name === pos.name && kp.tech === pos.tech) ||
                    k.positions.find((kp) => kp.tech === pos.tech && n(kp.w) === n(pos.w) && n(kp.h) === n(pos.h));
          if (m && m.img) { zmena = true; return Object.assign({}, pos, { img: m.img }); }
          return pos;
        });
      }
      return np;
    });
    if (zmena) setProducts(obohacene);
    saveLS("irm-katalog-verze", ver);
  }, []);

  useEffect(() => {
    if (first.current) { first.current = false; return; }
    saveLS("irm-products", products);
  }, [products]);
  useEffect(() => { saveLS("irm-recipes", recipes); }, [recipes]);

  // ---- napojení na SGPS + čtečka čárových kódů: spec zakázky -> kalkulace ----
  const sgps = useSgps();
  const [hidOn, setHidOn] = useState(() => { const v = loadLS("irm-scan-hid", true); return v !== false; });
  useEffect(() => { saveLS("irm-scan-hid", hidOn); }, [hidOn]);
  const [scanLog, setScanLog] = useState([]);
  const [spec, setSpec] = useState(null);
  const [pdfSpec, setPdfSpec] = useState({ stav: "cekam", pole: {}, zdroj: {}, text: "", obrazky: [], stranky: [], jmeno: "", chyba: "" });
  const [toast, setToast] = useState(null);
  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 4500);
    return () => clearTimeout(t);
  }, [toast]);

  /* ---- databáze receptur ze složky "databaze barev" ----
     Most tu složku umí přečíst, takže se CSV natáhne samo a nikdo je po každé
     úpravě nemusí ručně importovat. Načítá se jen to, co se od minule změnilo
     — poznámka podle velikosti a času souboru. */
  /* ---- parametry sít a koeficienty spotřeby ze složky "parametry" ---- */
  const [sita, setSita] = useState([]);
  const [koef, setKoef] = useState({ kryvost: {}, material: {}, podklad: {} });
  const [pigmenty, setPigmenty] = useState({});
  const [paramStav, setParamStav] = useState({ stav: "cekam", chyba: "", sit: 0, koef: 0, pigm: 0 });
  useEffect(() => {
    if (sgps.stav.stav !== "ok") return;
    let zrusen = false;
    (async () => {
      const chyby = [];
      let novaSita = [], novyKoef = { kryvost: {}, material: {}, podklad: {} }, novePigmenty = {};
      try {
        const d = await sgpsGet("/databaze?slozka=" + SLOZKA_PARAMETRY
          + "&soubor=" + encodeURIComponent(SOUBOR_SITA));
        novaSita = csvNaSita(d.text);
      } catch (e) { if (!/není/.test(String(e.message || e))) chyby.push(SOUBOR_SITA + ": " + e.message); }
      try {
        const d = await sgpsGet("/databaze?slozka=" + SLOZKA_PARAMETRY
          + "&soubor=" + encodeURIComponent(SOUBOR_KOEF));
        novyKoef = csvNaKoeficienty(d.text);
      } catch (e) { if (!/není/.test(String(e.message || e))) chyby.push(SOUBOR_KOEF + ": " + e.message); }
      try {
        const d = await sgpsGet("/databaze?slozka=" + SLOZKA_PARAMETRY
          + "&soubor=" + encodeURIComponent(SOUBOR_PIGMENTY));
        novePigmenty = csvNaPigmenty(d.text);
      } catch (e) { if (!/není/.test(String(e.message || e))) chyby.push(SOUBOR_PIGMENTY + ": " + e.message); }
      if (zrusen) return;
      setSita(novaSita);
      setKoef(novyKoef);
      setPigmenty(novePigmenty);
      setParamStav({ stav: chyby.length ? "chyba" : "hotovo", chyba: chyby.join(" · "),
        sit: novaSita.length,
        koef: Object.keys(novyKoef).reduce((s, k) => s + Object.keys(novyKoef[k]).length, 0),
        pigm: Object.keys(novePigmenty).length });
    })();
    return () => { zrusen = true; };
  }, [sgps.stav.stav]);

  /* ---- evidence zbytků ---- */
  const [zbytky, setZbytky] = useState(() => loadLS("irm-zbytky", []));
  useEffect(() => { saveLS("irm-zbytky", zbytky); }, [zbytky]);
  const [zbytekKod, setZbytekKod] = useState("");     // kód načtený čtečkou
  const [doplnitZbytek, setDoplnitZbytek] = useState(null);   // {kod, gramu} — po tisku
  // lhůty ubíhají i bez zásahu uživatele — jednou za minutu se přepočítají
  const [tikLhut, setTikLhut] = useState(0);
  useEffect(() => {
    const t = setInterval(() => setTikLhut((v) => v + 1), 60000);
    return () => clearInterval(t);
  }, []);
  const [zbytkyStav, setZbytkyStav] = useState({ stav: "cekam", chyba: "", kdy: 0 });
  const zbytkyZapsano = useRef(null);

  // načtení evidence ze souboru — kelímek stojí v dílně a musí být vidět
  // ze všech počítačů, ne jen z toho, kde ho někdo zapsal
  useEffect(() => {
    if (sgps.stav.stav !== "ok") return;
    let zrusen = false;
    (async () => {
      try {
        const d = await sgpsGet("/databaze?slozka=" + SLOZKA_EVIDENCE
          + "&soubor=" + encodeURIComponent(SOUBOR_ZBYTKY));
        if (zrusen) return;
        const ze_souboru = csvNaZbytky(d.text);
        setZbytky((prev) => {
          const slouceno = sloucZbytky(prev, ze_souboru);
          zbytkyZapsano.current = zbytkyDoCsv(slouceno);
          return slouceno;
        });
        setZbytkyStav({ stav: "nacteno", chyba: "", kdy: Date.now() });
      } catch (e) {
        // soubor ještě neexistuje — to není chyba, založí se prvním zbytkem
        const zprava = String((e && e.message) || e);
        if (!zrusen) setZbytkyStav({ stav: /není/.test(zprava) ? "prazdno" : "chyba",
          chyba: /není/.test(zprava) ? "" : zprava, kdy: Date.now() });
      }
    })();
    return () => { zrusen = true; };
  }, [sgps.stav.stav]);

  // uložení evidence do souboru při každé změně
  useEffect(() => {
    if (sgps.stav.stav !== "ok" || zbytkyStav.stav === "cekam") return;
    const text = zbytkyDoCsv(zbytky);
    if (text === zbytkyZapsano.current) return;
    const casovac = setTimeout(async () => {
      try {
        const r = await fetch(sgpsBase() + "/databaze/ulozit", { method: "POST",
          body: new Blob([JSON.stringify({ slozka: SLOZKA_EVIDENCE, jmeno: SOUBOR_ZBYTKY, text: text })],
            { type: "text/plain" }) });
        const d = await r.json();
        if (!d.ok) throw new Error(d.chyba || "zápis se nezdařil");
        zbytkyZapsano.current = text;
        setZbytkyStav({ stav: "ulozeno", chyba: "", kdy: Date.now() });
      } catch (e) {
        setZbytkyStav({ stav: "chyba", chyba: String((e && e.message) || e), kdy: Date.now() });
      }
    }, 1200);
    return () => clearTimeout(casovac);
  }, [zbytky, sgps.stav.stav, zbytkyStav.stav]);

  // Kolik kelímků potřebuje pozornost — číslo se ukazuje i v menu, aby to
  // člověk viděl, i když zrovna evidenci otevřenou nemá.
  const lhutyPocet = useMemo(() => {
    let prosle = 0, brzy = 0;
    for (const z of zbytky) {
      if (!(n(z.gramu) > 0)) continue;
      const s = stavZbytku(z);
      if (s.stav === "prosle") prosle++;
      else if (s.stav === "brzy") brzy++;
    }
    return { prosle: prosle, brzy: brzy };
  }, [zbytky, tikLhut]);

  // Upozornění na lhůty hned po načtení evidence — kelímek, kterému dnes končí
  // pot life, je potřeba spotřebovat teď, ne až si ho někdo náhodou všimne.
  const lhutyOhlaseny = useRef(false);
  useEffect(() => {
    if (lhutyOhlaseny.current || zbytkyStav.stav === "cekam" || !zbytky.length) return;
    lhutyOhlaseny.current = true;
    const zive = zbytky.filter((z) => n(z.gramu) > 0).map((z) => ({ z: z, st: stavZbytku(z) }));
    const prosle = zive.filter((x) => x.st.stav === "prosle");
    const brzy = zive.filter((x) => x.st.stav === "brzy");
    if (!prosle.length && !brzy.length) return;
    // s odstupem, ať nepřebije hlášku o načtených databázích
    const casti = [];
    if (brzy.length) casti.push(brzy.length + (brzy.length === 1 ? " kelímku končí lhůta" : " kelímkům končí lhůta")
      + " (" + brzy.map((x) => x.z.kod + " " + zbyvaText(x.st.zbyva)).slice(0, 3).join(", ") + ")");
    if (prosle.length) casti.push(prosle.length + (prosle.length === 1 ? " je po lhůtě" : " po lhůtě"));
    const t = setTimeout(() => setToast({ ok: !prosle.length,
      text: "Zbytky barev: " + casti.join(" · ") + "." }), 5000);
    return () => clearTimeout(t);
  }, [zbytky, zbytkyStav.stav]);

  /* Pracovní technologie — zužuje katalog, polohy i databáze receptur.
     "" = bez omezení, jako dosud. */
  const [technologie, setTechnologie] = useState(() => loadLS("irm-technologie", ""));
  useEffect(() => { saveLS("irm-technologie", technologie); }, [technologie]);
  // které technologie patří ke kterému souboru databáze receptur
  const [dbTech, setDbTech] = useState(() => loadLS("irm-databaze-tech", {}));
  useEffect(() => { saveLS("irm-databaze-tech", dbTech); }, [dbTech]);

  // ze které databáze se vybírají receptury ("" = ze všech)
  const [dbFiltr, setDbFiltr] = useState(() => loadLS("irm-databaze-filtr", ""));
  useEffect(() => { saveLS("irm-databaze-filtr", dbFiltr); }, [dbFiltr]);

  const [databaze, setDatabaze] = useState({ stav: "cekam", soubory: [], chyby: {}, chyba: "" });
  useEffect(() => {
    if (sgps.stav.stav !== "ok") return;
    let zrusen = false;
    (async () => {
      try {
        const seznam = await sgpsGet("/databaze");
        if (zrusen) return;
        const soubory = seznam.soubory || [];
        setDatabaze({ stav: "hotovo", soubory: soubory, chyby: {}, chyba: "" });
        const verze = loadLS("irm-databaze-verze", {});
        // Jednorázově: receptury nahrané starší verzí aplikace nemají uvedeno,
        // ze které databáze jsou. Projedeme soubory znovu a značku jim doplníme,
        // jinak by je při další databázi bylo nutné rozlišit podle jména —
        // a dvě databáze mohou mít týž pantone s jiným složením.
        const adopce = !loadLS("irm-databaze-znacky", 0);
        if (adopce) {
          for (const k of Object.keys(verze)) delete verze[k];
          saveLS("irm-databaze-znacky", 1);
        }
        const chyby = {};
        let celkemNovych = 0, celkemObnovenych = 0, souboru = 0;
        for (const s of soubory) {
          if (verze[s.jmeno] === s.verze) continue;
          try {
            const soubor = await sgpsGet("/databaze?soubor=" + encodeURIComponent(s.jmeno));
            if (zrusen) return;
            const nove = csvToRecipes(soubor.text, s.jmeno);
            setRecipes((prev) => {
              const v = sloucReceptury(prev, nove, adopce);
              celkemNovych += v.pridano; celkemObnovenych += v.obnoveno;
              // Vazby na produkty a barvy jsou uložené v samotné databázi.
              // Obnovují se až tady, kdy je jasné, jaké id receptura dostala.
              const podleKlice = new Map(v.seznam.map((r) => [klicReceptury(r), r]));
              const vazby = {};
              for (const r of nove) {
                if (!r.vazby || !r.vazby.length) continue;
                const ulozena = podleKlice.get(klicReceptury(r));
                if (ulozena) for (const k of r.vazby) vazby[k] = ulozena.id;
              }
              if (Object.keys(vazby).length) setLinks((p) => Object.assign({}, p, vazby));
              return v.seznam;
            });
            souboru++;
            // verzi si pamatujeme až po úspěchu, ať se vadný soubor zkusí znovu
            verze[s.jmeno] = soubor.verze || s.verze;
            saveLS("irm-databaze-verze", verze);
          } catch (e) {
            chyby[s.jmeno] = String((e && e.message) || e);
          }
        }
        if (zrusen) return;
        setDatabaze({ stav: "hotovo", soubory: soubory, chyby: chyby, chyba: "" });
        if (souboru) {
          setToast({ ok: true, text: "Databáze barev: " + fmt(celkemNovych, 0) + " nových receptur"
            + (celkemObnovenych ? ", " + fmt(celkemObnovenych, 0) + " obnovených" : "")
            + " z " + souboru + (souboru === 1 ? " souboru" : " souborů") + "." });
        } else if (Object.keys(chyby).length) {
          setToast({ ok: false, text: "Databázi se nepodařilo načíst — podrobnosti v Připojení k mostu." });
        }
      } catch (e) {
        if (!zrusen) setDatabaze({ stav: "chyba", soubory: [], chyby: {},
          chyba: String((e && e.message) || e) });
      }
    })();
    return () => { zrusen = true; };
  }, [sgps.stav.stav]);

  /* ---- vlastní receptury se odkládají do vlastního CSV ve složce ----
     Aby vazba „tenhle produkt v téhle barvě se míchá takhle“ nezůstala jen
     v prohlížeči. Ukládá se se zpožděním, ať psaní v editoru nezapisuje
     soubor po každém písmenu. */
  const [vlastniStav, setVlastniStav] = useState({ stav: "cekam", kdy: 0, chyba: "", pocet: 0, vazeb: 0 });
  const zapsanoRef = useRef("");
  useEffect(() => {
    if (sgps.stav.stav !== "ok" || databaze.stav !== "hotovo") return;
    const vlastni = recipes.filter(jeVlastni);
    // Soubor se zakládá i prázdný — jen s hlavičkou. Ať je ve složce vidět
    // od začátku a je poznat, kam se vlastní receptury ukládají.
    const text = vlastniDoCsv(recipes, links);
    if (text === zapsanoRef.current) return;
    const casovac = setTimeout(async () => {
      try {
        const r = await fetch(sgpsBase() + "/databaze/ulozit", { method: "POST",
          body: new Blob([JSON.stringify({ jmeno: SOUBOR_VLASTNI, text: text })], { type: "text/plain" }) });
        const d = await r.json();
        if (!d.ok) throw new Error(d.chyba || "zápis se nezdařil");
        zapsanoRef.current = text;
        // ať si most uložený soubor hned nenačítá zpátky jako změněnou databázi
        const v = loadLS("irm-databaze-verze", {});
        v[SOUBOR_VLASTNI] = d.verze;
        saveLS("irm-databaze-verze", v);
        // receptury označíme za pocházející z tohoto souboru, aby se při
        // příštím načtení spárovaly a nevznikly z nich duplikáty
        setRecipes((prev) => prev.some((x) => jeVlastni(x) && !x.zdroj)
          ? prev.map((x) => (jeVlastni(x) && !x.zdroj) ? Object.assign({}, x, { zdroj: SOUBOR_VLASTNI }) : x)
          : prev);
        // ať je soubor v seznamu databází vidět hned, ne až po dalším načtení
        setDatabaze((p) => {
          const soubory = (p.soubory || []).slice();
          const zaznam = { jmeno: SOUBOR_VLASTNI, verze: d.verze, velikost: d.velikost || 0,
            druh: "receptury", radku: Math.max(0, text.split(/\r?\n/).filter(Boolean).length - 1) };
          const i = soubory.findIndex((s) => s.jmeno === SOUBOR_VLASTNI);
          if (i >= 0) soubory[i] = Object.assign({}, soubory[i], zaznam); else soubory.push(zaznam);
          soubory.sort((a, b) => a.jmeno.localeCompare(b.jmeno, "cs"));
          return Object.assign({}, p, { soubory: soubory });
        });
        setVlastniStav({ stav: "ulozeno", kdy: Date.now(), chyba: "",
          pocet: vlastni.length,
          vazeb: vlastni.reduce((s, x) => s + vazbyReceptury(links, x.id).length, 0) });
      } catch (e) {
        setVlastniStav((p) => Object.assign({}, p, { stav: "chyba",
          chyba: String((e && e.message) || e) }));
      }
    }, 1500);
    return () => clearTimeout(casovac);
  }, [recipes, links, sgps.stav.stav, databaze]);

  const pouzitSpec = (res) => {
    // Zakázkový list může být z jiné technologie, než ve které se zrovna
    // pracuje — pak se režim přepne, jinak by poloha z listu nebyla vidět.
    const techSpecu = res.position && res.position.tech;
    if (technologie && techSpecu && techSpecu !== technologie) {
      setTechnologie(techSpecu);
      setToast({ ok: true, text: "Přepnuto na technologii " + techSpecu + " podle zakázky." });
    }
    setSpec(Object.assign({}, res, { ts: Date.now() }));
    setTab("calc");
    setToast({ ok: true, text: "Zakázka načtena: " + (res.product.ref ? res.product.ref + " · " : "") + res.product.name
      + (res.qty != null ? " — " + fmt(res.qty, 0) + " ks" : "") });
  };

  // handleCode drží aktuální data v ref, aby globální posluchač nepracoval se zastaralým stavem
  const scanCtx = useRef({});
  scanCtx.current = { products, recipes, tab, zbytky, sgpsOk: sgps.stav.stav === "ok" };
  const handleCode = useRef(null);
  handleCode.current = async (raw) => {
    const c = scanCtx.current;
    // Kód z kelímku se pozná na první pohled a nemá smysl ho hnát rozborem specu.
    const kod = String(raw || "").trim().toUpperCase();
    if (jeKodZbytku(kod)) {
      const z = (c.zbytky || []).find((x) => x.kod === kod);
      if (!z) {
        setZbytekKod(kod); setTab("zbytky");
        setToast({ ok: false, text: "Kelímek " + kod + " v evidenci není." });
        return;
      }
      // Dávka označená při míchání — teď je po tisku a je čas zapsat, co zbylo.
      if (z.stav === "vtisku") { setDoplnitZbytek({ kod: kod, gramu: "" }); return; }
      setZbytekKod(kod);
      setTab("zbytky");
      setToast({ ok: true, text: "Zbytek " + kod + ": " + z.nazev + " — " + fmt(n(z.gramu)) + " g" });
      return;
    }
    let parsed = parseSpec(raw);
    const f = parsed.fields;
    // Holý kód: pokud přesně sedí na ref. číslo produktu, je to produkt; jinak
    // (a vždy u klíče obj=) to zkusíme ve SGPS jako číslo zakázky.
    const holy = !!f.ref && Object.keys(f).length === 1;
    const jeProdukt = holy && c.products.some((p) => String(p.ref || "").toLowerCase() === f.ref.toLowerCase());
    const cislo = f.order || (holy && !jeProdukt ? f.ref : "");
    let zeSgps = null;
    if (c.sgpsOk && cislo) {
      try {
        const d = await sgpsGet("/zakazka/" + encodeURIComponent(cislo));
        zeSgps = d.zakazka;
      } catch (e) {
        if (!f.ref || !jeProdukt) {
          setScanLog((l) => [{ ts: Date.now(), raw: raw,
            res: { parsed: parsed, fields: f, product: null, colorIdx: -1, ok: [],
                   warn: ["SGPS: " + String((e && e.message) || e)] } }].concat(l).slice(0, 25));
          if (c.tab !== "scan") setTab("scan");
          setToast({ ok: false, text: "Zakázka " + cislo + ": " + String((e && e.message) || e) });
          return;
        }
      }
    }
    if (zeSgps) {                       // údaje ze skenu mají přednost před SGPS
      const zeZak = zakazkaNaSpec(zeSgps);
      const prepis = Object.assign({}, f);
      if (!f.order && cislo === f.ref) delete prepis.ref;   // holý kód byl číslo zakázky
      parsed = { raw: raw, fields: Object.assign(zeZak.fields, prepis),
                 unknown: parsed.unknown, sgps: zeSgps };
    }
    const res = resolveSpec(parsed, c.products, c.recipes);
    if (zeSgps) res.ok.unshift("Zakázka " + (zeSgps.cislo || cislo) + " načtena ze SGPS");
    setScanLog((l) => [{ ts: Date.now(), raw: raw, res: res }].concat(l).slice(0, 25));
    if (res.product) {
      setSpec(Object.assign({}, res, { ts: Date.now() }));
      if (c.tab !== "scan") setTab("calc");
      setToast({ ok: true, text: (zeSgps ? "Zakázka " + (zeSgps.cislo || cislo) + ": " : "Načteno: ")
        + (res.product.ref ? res.product.ref + " · " : "") + res.product.name
        + (res.qty != null ? " — " + fmt(res.qty, 0) + " ks" : "")
        + (res.warn.length ? " (" + res.warn.length + " upozornění)" : "") });
    } else {
      if (c.tab !== "scan") setTab("scan");
      setToast({ ok: false, text: res.warn[0] || "Kód se nepodařilo přiřadit." });
    }
  };
  const onCode = (raw) => handleCode.current(raw);

  // otevření zakázky vybrané ze seznamu SGPS
  const otevriZakazku = (z) => {
    const res = resolveSpec(zakazkaNaSpec(z), products, recipes);
    if (!res.product) {
      setToast({ ok: false, text: res.warn[0] || "Produkt zakázky není v katalogu." });
      return;
    }
    res.ok.unshift("Zakázka " + (z.cislo || "") + " načtena ze SGPS");
    setScanLog((l) => [{ ts: Date.now(), raw: "SGPS · zakázka " + (z.cislo || ""), res: res }].concat(l).slice(0, 25));
    pouzitSpec(res);
  };

  // Čtečka v režimu klávesnice: rozpozná se podle rychlosti zadání (člověk tak psát nedokáže).
  // Kód se přitom „napíše" do právě zaostřeného pole — po rozpoznání ho vrátíme do původního
  // stavu přes nativní setter, aby o změně věděl i React.
  const buf = useRef({ s: "", t0: 0, tl: 0, el: null, val: "" });
  useEffect(() => {
    if (!hidOn) return;
    const obnovPole = (el, val) => {
      try {
        const proto = el.tagName === "TEXTAREA" ? HTMLTextAreaElement.prototype : HTMLInputElement.prototype;
        const setter = Object.getOwnPropertyDescriptor(proto, "value").set;
        setter.call(el, val);
        el.dispatchEvent(new Event("input", { bubbles: true }));
      } catch (e) {}
    };
    const onKey = (e) => {
      if (e.ctrlKey || e.altKey || e.metaKey) return;
      const now = Date.now();
      const b = buf.current;
      if (now - b.tl > 80) {                       // začátek nové dávky znaků
        b.s = ""; b.t0 = now;
        const el = document.activeElement;
        const pole = el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA") && el.type !== "checkbox" && el.type !== "radio";
        b.el = pole ? el : null;
        b.val = pole ? el.value : "";
      }
      b.tl = now;
      if (e.key === "Enter" || e.key === "Tab") {
        const code = b.s; b.s = "";
        if (code.length >= 4 && (now - b.t0) / code.length < 45) {
          e.preventDefault(); e.stopPropagation();
          if (b.el && b.el.isConnected) obnovPole(b.el, b.val);
          b.el = null;
          handleCode.current(code);
        }
        return;
      }
      if (e.key.length === 1) b.s += e.key;
      else if (e.key !== "Shift") b.s = "";
    };
    window.addEventListener("keydown", onKey, true);
    return () => window.removeEventListener("keydown", onKey, true);
  }, [hidOn]);

  return html`
    <div>
      <header className="hdr">
        <div className="navleft">
        <div className="menuwrap" ref=${menuRef}>
          <button className="navbtn" type="button" onClick=${() => setMenuOpen((o) => !o)}
            title="Menu" aria-label="Otevřít menu" aria-expanded=${menuOpen}>
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true">
              <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" strokeWidth="2" strokeLinecap="round" />
            </svg>
          </button>
          ${menuOpen && html`
            <div className="navdrop">
              <div className="note" style=${{ padding: "6px 14px 2px", letterSpacing: ".06em" }}>TECHNOLOGIE</div>
              <button className=${technologie ? "" : "on"}
                onClick=${() => { setTechnologie(""); setMenuOpen(false); }}>
                Všechny technologie
                <span className="note" style=${{ float: "right" }}>${fmt(products.length, 0)}</span>
              </button>
              ${TECH_PORADI.filter((t) => TECHS[t]).map((t) => {
                const kolik = products.filter((p) => produktUmi(p, t)).length;
                if (!kolik) return null;
                return html`
                  <button key=${t} className=${technologie === t ? "on" : ""}
                    onClick=${() => { setTechnologie(t); setMenuOpen(false); }}
                    title=${TECHS[t].name}>
                    ${t} — ${TECHS[t].name.replace(/\s*\(.*/, "")}
                    <span className="note" style=${{ float: "right" }}>${fmt(kolik, 0)}</span>
                  </button>`;
              })}
              <div style=${{ borderTop: "1px solid var(--line)", margin: "6px 8px" }}></div>
              <button className=${tab === "pdf" ? "on" : ""} onClick=${() => { setTab("pdf"); setMenuOpen(false); }}>Načíst spec z PDF</button>
              <button className=${tab === "scan" ? "on" : ""} onClick=${() => { setTab("scan"); setMenuOpen(false); }}>Načíst spec (čárový kód)</button>
              <button className=${tab === "zak" ? "on" : ""} onClick=${() => { setTab("zak"); setMenuOpen(false); }}>Zakázky (SGPS)</button>
              <button className=${tab === "most" ? "on" : ""} onClick=${() => { setTab("most"); setMenuOpen(false); }}>Připojení k mostu</button>
              <button className=${tab === "prod" ? "on" : ""} onClick=${() => { setTab("prod"); setMenuOpen(false); }}>Produkty</button>
              <button className=${tab === "rec" ? "on" : ""} onClick=${() => { setTab("rec"); setMenuOpen(false); }}>Receptury</button>
              <button className=${tab === "zbytky" ? "on" : ""} onClick=${() => { setTab("zbytky"); setMenuOpen(false); }}>
                Zbytky barev
${lhutyPocet.prosle + lhutyPocet.brzy > 0 && html`<span className="tag"
                  style=${{ marginLeft: 8, background: lhutyPocet.prosle ? "#B23B2A" : "var(--warn)",
                    color: "#fff", boxShadow: "none" }}
                  title=${[lhutyPocet.prosle ? lhutyPocet.prosle + " po lhůtě" : "",
                    lhutyPocet.brzy ? lhutyPocet.brzy + " brzy končí" : ""].filter(Boolean).join(", ")}>
                  ${lhutyPocet.prosle + lhutyPocet.brzy}</span>`}
              </button>
              <button className=${tab === "imp" ? "on" : ""} onClick=${() => { setTab("imp"); setMenuOpen(false); }}>Import / data</button>
            </div>`}
        </div>
        ${kamZpet && html`
          <button className="backbtn" type="button" onClick=${zpet}
            title=${"Zpět na „" + (ZALOZKY_NAZVY[kamZpet] || kamZpet) + "“ (Alt + ←)"}>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
              <path d="M15 5l-7 7 7 7" stroke="currentColor" strokeWidth="2.2"
                strokeLinecap="round" strokeLinejoin="round" />
            </svg>
            <span>${ZALOZKY_NAZVY[kamZpet] || kamZpet}</span>
          </button>`}
        </div>
        <div style=${{ gridColumn: 2, justifySelf: "center", textAlign: "center" }}>
          <h1 title="Zpět na Kalkulaci" onClick=${() => setTab("calc")}>IRM</h1>
          ${technologie && html`<div className="tag tech" style=${{ marginTop: -8 }}
            title=${(TECHS[technologie] || {}).name || ""}>
            ${technologie} — ${((TECHS[technologie] || {}).name || "").replace(/\s*\(.*/, "")}
          </div>`}
        </div>
        <button className="themebtn" type="button"
          onClick=${() => setTheme((t) => t === "dark" ? "light" : "dark")}
          title=${theme === "dark" ? "Přepnout na světlý režim" : "Přepnout na tmavý režim"}
          aria-label="Přepnout světlý/tmavý režim">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="9" stroke="currentColor" strokeWidth="2" />
            <path d="M12 3 A9 9 0 0 1 12 21 Z" fill="currentColor" />
          </svg>
        </button>
      </header>
      <main className="wrap">
        ${!dataJsOk && html`
          <div className="warnbox" style=${{ marginTop: 0, marginBottom: 18 }}>
            <b>Katalog (soubor data.js) se nenačetl.</b><br />
            Aplikace musí běžet ze složky, kde leží pohromadě všechny soubory balíčku
            (index.html, data.js, stahni_obrazky.py, složky lib a obrazky).<br />
            Nejčastější příčina: index.html byl otevřen přímo ze ZIPu nebo zkopírován jinam samostatně.
            <b> Rozbalte celý ZIP do jedné složky a otevřete index.html z ní.</b>
          </div>`}
        <div style=${{ display: tab === "calc" ? "" : "none" }}>
          <${Calc} products=${products} recipes=${recipes} setRecipes=${setRecipes} links=${links} setLinks=${setLinks}
            spec=${spec} onSpecUsed=${() => setSpec(null)}
            onUpravitSpec=${pdfSpec.stav === "hotovo" ? () => setTab("pdf") : null}
            sgps=${sgps} onPouzitSpec=${pouzitSpec} onPdfNacteno=${setPdfSpec} pdfObrazky=${pdfSpec.obrazky || []} pdfStranky=${pdfSpec.stranky || []} pdfId=${pdfSpec.pdfId || ""}
            dbFiltr=${dbFiltr} setDbFiltr=${setDbFiltr}
            zbytky=${zbytky} setZbytky=${setZbytky} technologie=${technologie} dbTech=${dbTech}
            sita=${sita} koef=${koef}
            onZbytekUlozen=${(kod) => { setZbytekKod(kod); setTab("zbytky"); }} />
        </div>
        ${tab === "scan" && html`<${ScanTab} hidOn=${hidOn} setHidOn=${setHidOn} scanLog=${scanLog}
          onCode=${onCode} onApply=${pouzitSpec} clearLog=${() => setScanLog([])} sgps=${sgps} />`}
        ${tab === "pdf" && html`<${PdfTab} sgps=${sgps} products=${products} recipes=${recipes}
          ulozeny=${pdfSpec} setUlozeny=${setPdfSpec}
          onApply=${(res) => { setScanLog((l) => [{ ts: Date.now(), raw: res.parsed.raw, res: res }].concat(l).slice(0, 25)); pouzitSpec(res); }} />`}
        ${tab === "zak" && html`<${ZakazkyTab} sgps=${sgps} onOtevri=${otevriZakazku} />`}
        ${tab === "most" && html`<${PripojeniTab} sgps=${sgps} databaze=${databaze} recipes=${recipes}
          links=${links} vlastniStav=${vlastniStav} dbTech=${dbTech} setDbTech=${setDbTech}
          onOdebratZdroj=${(z) => guardDelete(() => {
            setRecipes((prev) => prev.filter((r) => r.zdroj !== z));
            const v = loadLS("irm-databaze-verze", {});
            delete v[z];
            saveLS("irm-databaze-verze", v);
          }, "odebrání receptur z databáze " + z)} />`}
        ${tab === "prod" && html`<${Products} products=${products} setProducts=${setProducts} guardDelete=${guardDelete} />`}
        ${tab === "rec" && html`<${Recipes} recipes=${recipes} setRecipes=${setRecipes} guardDelete=${guardDelete}
          dbFiltr=${dbFiltr} setDbFiltr=${setDbFiltr} technologie=${technologie} dbTech=${dbTech} sita=${sita} />`}
        ${tab === "zbytky" && html`<${ZbytkyTab} zbytky=${zbytky} setZbytky=${setZbytky} recipes=${recipes}
          guardDelete=${guardDelete} otevrenyKod=${zbytekKod} onOtevreno=${() => setZbytekKod("")}
          onDoplnit=${(kod) => setDoplnitZbytek({ kod: kod, gramu: "" })} />`}
        ${tab === "imp" && html`<${Importer} setProducts=${setProducts} setRecipes=${setRecipes} guardDelete=${guardDelete} deletePw=${deletePw} setDeletePw=${setDeletePw} />`}
      </main>
      ${doplnitZbytek && (() => {
        const z = zbytky.find((x) => x.kod === doplnitZbytek.kod);
        if (!z) return null;
        const zbylo = n(doplnitZbytek.gramu);
        const spotreba = n(z.davkaG) - zbylo;
        const zapis = (naSklad) => {
          setZbytky((prev) => prev.map((x) => x.kod === z.kod ? Object.assign({}, x, {
            stav: "sklad", gramu: naSklad ? zbylo : 0, zmeneno: Date.now(),
          }) : x));
          setDoplnitZbytek(null);
          setToast(naSklad
            ? { ok: true, text: "Do evidence uloženo " + fmt(zbylo) + " g — kelímek " + z.kod + "." }
            : { ok: true, text: "Kelímek " + z.kod + " uzavřen, nezbylo nic." });
        };
        return html`
          <div className="modalbg" onClick=${(e) => { if (e.target === e.currentTarget) setDoplnitZbytek(null); }}>
            <div className="modalbox" style=${{ width: "min(460px,100%)" }}>
              <div className="card" style=${{ margin: 0 }}>
                <h2 style=${{ margin: 0 }}>Kolik barvy zbylo?</h2>
                <p className="hint">Kelímek <b>${z.kod}</b> byl označený při míchání. Teď stačí zvážit,
                  co v něm zůstalo, a dostane se do evidence zbytků.</p>
                <div className="rowline" style=${{ marginTop: 6 }}>
                  <span className="swatch" style=${{ background: z.hex }} />
                  <span className="note">${z.nazev}${z.zakazka ? " · zakázka " + z.zakazka : ""}
                    · namícháno ${fmt(n(z.davkaG))} g</span>
                </div>
                <label className="f" style=${{ marginTop: 12 }}>Zbylo (g)</label>
                <input type="number" step="1" min="0" autoFocus value=${doplnitZbytek.gramu}
                  onChange=${(e) => setDoplnitZbytek(Object.assign({}, doplnitZbytek, { gramu: e.target.value }))}
                  onKeyDown=${(e) => { if (e.key === "Enter" && zbylo > 0) zapis(true); }} />
                ${zbylo > 0 && html`<p className="note" style=${{ marginTop: 6 }}>
                  Z ${fmt(n(z.davkaG))} g se spotřebovalo ${fmt(Math.max(0, spotreba))} g
                  ${spotreba < 0 ? html`<b> — zadané množství je větší než namíchaná dávka, zkontrolujte to.</b>` : ""}
                </p>`}
                <div className="rowline" style=${{ marginTop: 14, marginBottom: 0 }}>
                  <button className="btn" disabled=${!(zbylo > 0)} onClick=${() => zapis(true)}>
                    Uložit do evidence
                  </button>
                  <button className="btn sec" onClick=${() => zapis(false)}>Nezbylo nic</button>
                  <button className="btn sec" onClick=${() => setDoplnitZbytek(null)}>Později</button>
                </div>
              </div>
            </div>
          </div>`;
      })()}

      ${pwGate && html`<${PwGate} label=${pwGate.label} correctPw=${deletePw}
        onConfirm=${() => { pwGate.onConfirm(); setPwGate(null); }}
        onCancel=${() => setPwGate(null)} />`}
      ${toast && html`
        <div className=${"toast" + (toast.ok ? "" : " bad")} onClick=${() => setToast(null)}>
          <span>${toast.ok ? "▮▯▮" : "⚠"}</span><span>${toast.text}</span>
        </div>`}
    </div>`;
}

function PwGate({ label, correctPw, onConfirm, onCancel }) {
  const [val, setVal] = useState("");
  const [err, setErr] = useState(false);
  const submit = () => {
    if (val === correctPw) onConfirm();
    else { setErr(true); setVal(""); }
  };
  return html`
    <div className="modalbg" onClick=${(e) => { if (e.target === e.currentTarget) onCancel(); }}>
      <div className="modalbox" style=${{ width: "min(380px,100%)" }}>
        <div className="card" style=${{ margin: 0 }}>
          <h2>Ověření hesla</h2>
          <p className="hint">Pro potvrzení akce „${label}" zadejte heslo.</p>
          <input type="password" autoFocus value=${val}
            onChange=${(e) => { setVal(e.target.value); setErr(false); }}
            onKeyDown=${(e) => { if (e.key === "Enter") submit(); }}
            placeholder="Heslo" />
          ${err && html`<div className="warnbox">Nesprávné heslo.</div>`}
          <div className="rowline" style=${{ marginTop: 14 }}>
            <button className="btn danger" onClick=${submit}>Potvrdit smazání</button>
            <button className="btn sec" onClick=${onCancel}>Zrušit</button>
          </div>
        </div>
      </div>
    </div>`;
}

/* ============================ KALKULACE ============================ */
function Calc({ products, recipes, setRecipes, links, setLinks, spec, onSpecUsed, onUpravitSpec,
                sgps, onPouzitSpec, onPdfNacteno, pdfObrazky, pdfStranky, pdfId,
                dbFiltr, setDbFiltr, zbytky, setZbytky, onZbytekUlozen,
                technologie, dbTech, sita, koef }) {
  const [q, setQ] = useState("");
  // hodnoty ze načteného specu mají přednost před automatikami níže (reset barvy,
  // vázaná receptura, spotřeba dle technologie) — proto je propašujeme přes ref
  const pend = useRef({ color: null, rec: null, gm2: null });
  const [zak, setZak] = useState(null);   // hlavička zakázky ze specu (číslo, zákazník, rozměr…)
  const [pouzitRozmer, setPouzitRozmer] = useState(true);
  const [pokrytiJob, setPokrytiJob] = useState(null);   // % z rozboru náhledu
  const [odsazeniJob, setOdsazeniJob] = useState(null); // mm použité při rozboru
  const [pokrytiOkno, setPokrytiOkno] = useState(false);
  // krycí plocha se pamatuje ke každé zakázce zvlášť
  const [pokrytiZakazek, setPokrytiZakazek] = useState(() => loadLS("irm-pokryti", {}));
  useEffect(() => { saveLS("irm-pokryti", pokrytiZakazek); }, [pokrytiZakazek]);
  const ulozPokryti = (pct, mm) => {
    setPokrytiJob(pct); setOdsazeniJob(mm);
    const cislo = zak && zak.order ? String(zak.order) : "";
    if (cislo) setPokrytiZakazek((prev) => Object.assign({}, prev, { [cislo]: { pct: pct, odsazeni: mm, ts: Date.now() } }));
  };
  // katalog zúžený na zvolenou technologii — sítotiskaři nemá co nabízet
  // produkty, které se sítotiskem netisknou
  const proTech = useMemo(() => technologie
    ? products.filter((p) => produktUmi(p, technologie)) : products, [products, technologie]);
  const filtered = useMemo(() => {
    const s = q.trim().toLowerCase();
    if (!s) return proTech;
    return proTech.filter((p) =>
      (p.name + " " + (p.ref || "") + " " + (p.material || "")).toLowerCase().includes(s));
  }, [q, proTech]);

  const [prodId, setProdId] = useState(products[0] ? products[0].id : "");
  useEffect(() => {
    if (filtered.length && !filtered.some((p) => p.id === prodId)) setProdId(filtered[0].id);
  }, [filtered]);
  const product = products.find((p) => p.id === prodId);
  // polohy potisku jen té technologie, ve které se pracuje
  const polohy = useMemo(() => polohyTech(product, technologie), [product, technologie]);

  const [posId, setPosId] = useState("");
  useEffect(() => {
    if (product && !polohy.some((p) => p.id === posId))
      setPosId(polohy[0] ? polohy[0].id : "");
  }, [prodId, product, technologie]);
  const colors = (product && product.colors) ? product.colors : [];
  const [colorIdx, setColorIdx] = useState(0);
  useEffect(() => {
    setColorIdx(pend.current.color != null ? pend.current.color : 0);
    pend.current.color = null;
  }, [prodId]);
  const colorSel = colors[colorIdx] || colors[0] || null;
  const [pickerOpen, setPickerOpen] = useState(false);
  const [dropOpen, setDropOpen] = useState(false);
  const pickProduct = (id) => { setProdId(id); setPickerOpen(true); setDropOpen(false); };
  const prodPhotos = [colorSel && colorSel.img, product && product.img].filter(Boolean);

  // ---- vazba produkt + barva + technologie + poloha -> receptura ----
  // Starší vazby byly jen produkt+barva; ty se stále čtou, aby o ně nikdo nepřišel.
  const klicBarva = (p, c) => (p && c) ? String(p.ref || p.id) + "|" + String(c.code || c.name || "") : "";
  const klicUplny = (p, c, pos) => (p && c && pos)
    ? klicBarva(p, c) + "|" + String(pos.tech || "") + "|" + String(pos.name || "") : "";

  // ---- nástroj odvození receptury ----
  const [odvod, setOdvod] = useState(null);      // null | {mode:"pick"} | {mode:"edit", initial}
  const [baseQ, setBaseQ] = useState("");
  const [baseId, setBaseId] = useState("");
  const baseList = baseQ.trim()
    ? recipes.filter((r) => (r.name + " " + (r.series || "")).toLowerCase().includes(baseQ.trim().toLowerCase()))
    : recipes;
  const baseSel = recipes.find((r) => r.id === baseId) || null;
  const odvodit = (base) => {
    const label = colorSel ? ((colorSel.code ? colorSel.code + " " : "") + (colorSel.name || "")).trim() : "";
    const kde = position ? " · " + position.tech + " " + position.name : "";
    setOdvod({ mode: "edit", initial: {
      id: uid(),
      name: ((product && product.ref ? product.ref + " · " : "") + label + kde + " — " + base.name).trim(),
      type: "Custom", series: "odvozeno z " + base.name,
      // z čeho a ze které databáze receptura vznikla — zapíše se i do CSV
      zaklad: base.name + (base.zdroj ? " (" + base.zdroj.replace(/\.csv$/i, "") + ")" : ""),
      density: base.density, hex: base.hex,
      components: base.components.map((c) => ({ id: uid(), name: c.name, pct: c.pct })),
    }});
  };
  const ulozOdvozenou = (r) => {
    setRecipes((prev) => prev.some((x) => x.id === r.id) ? prev.map((x) => x.id === r.id ? r : x) : prev.concat([r]));
    if (lk) setLinks(Object.assign({}, links, { [lk]: r.id }));
    setRecId(r.id);
    setAdHoc(null);            // rozpracovaná receptura je teď uložená natrvalo
    setOdvod(null);
  };
  const zrusVazbu = () => {
    const nl = Object.assign({}, links);
    delete nl[lkUplny]; delete nl[lkBarva];
    setLinks(nl);
  };
  const position = polohy.find((p) => p.id === posId) || null;

  // vazba se hledá nejdřív na přesnou kombinaci, pak na starší vazbu jen dle barvy
  const lkUplny = klicUplny(product, colorSel, position);
  const lkBarva = klicBarva(product, colorSel);
  const lk = lkUplny || lkBarva;
  const vazbaId = (lkUplny && links[lkUplny]) || (lkBarva && links[lkBarva]) || "";
  const vazbaSiroka = !!(vazbaId && !(lkUplny && links[lkUplny]));   // zděděná vazba jen dle barvy
  const vazRec = recipes.find((r) => r.id === vazbaId) || null;
  useEffect(() => {                       // automatické načtení vázané receptury
    if (pend.current.rec) { pend.current.rec = null; return; }   // spec určil recepturu výslovně
    if (vazbaId && recipes.some((r) => r.id === vazbaId)) setRecId(vazbaId);
  }, [prodId, colorIdx, posId]);

  const tech = position ? position.tech : "SCR";
  const maSito = techMaSito(tech);      // tampontisk tiskne přes klišé, ne přes síto
  // klišé, která jsou pro tuhle technologii v parametrech; dokud nejsou, nic se nenabízí
  const klisePro = useMemo(() => sitaPro(sita, tech, true), [sita, tech]);
  // síta té technologie; bez vlastních dat padne na standardní řadu
  const sitaProTech = useMemo(() => sitaPro(sita, tech, false), [sita, tech]);
  const [recId, setRecId] = useState(recipes[0] ? recipes[0].id : "");
  // Receptura ze zakázkového listu nemusí být v databázi (nebo databáze ještě
  // není). Rozpracovaná receptura pak žije tady, aby šlo dojít až k míchacímu
  // lístku; teprve tlačítkem se uloží natrvalo a naváže na kombinaci.
  const [adHoc, setAdHoc] = useState(null);
  const recipeDb = recipes.find((r) => r.id === recId) || null;
  const recipe = recipeDb || adHoc || recipes[0] || null;
  const jeAdHoc = !!(recipe && adHoc && recipe.id === adHoc.id);
  const novaAdHoc = (nazev, rada) => ({
    id: "adhoc", name: (nazev || "").trim() || "Nepojmenovaná barva", type: "Custom",
    series: (rada || "").trim(), density: 1.2, hex: "#888888", components: [],
  });
  // Barva potisku pro výpis a pro lístek: pantone z názvu, jinak CMYK z odstínu.
  const [zListu, setZListu] = useState(false);   // odstín přišel ze vzorníku v PDF
  const barvaPotisku = useMemo(() => {
    if (!recipe) return null;
    const p = popisBarvyPotisku(recipe.name, recipe.hex, recipes);
    if (!p.pantone && !p.cmyk) return null;
    p.zListu = zListu && !!(adHoc && recipe.id === adHoc.id);
    return p;
  }, [recipe, recipes, zListu, adHoc]);

  /* ---- zbytek z evidence použitý na tuhle dávku ---- */
  const [pouzityZbytek, setPouzityZbytek] = useState(null);   // {kod}
  const [ulozitZbytek, setUlozitZbytek] = useState(null);     // dialog uložení
  const [kodDavky, setKodDavky] = useState("");               // kód dávky — drží se i po zavření štítku
  const [stitekOtevren, setStitekOtevren] = useState(false);
  const [dvouslozkova, setDvouslozkova] = useState(false);    // barva s tužidlem — hlídat pot life

  const [recQ, setRecQ] = useState("");
  const pantoneAll = podleTechnologie(podleDatabaze(recipes, dbFiltr), technologie, dbTech)
    .filter((r) => r.type !== "Custom");
  const pantoneList = recQ.trim()
    ? pantoneAll.filter((r) => (r.name + " " + (r.series || "")).toLowerCase().includes(recQ.trim().toLowerCase()))
    : pantoneAll;

  /* Viskozita — výtokový čas barvy. U zakázky se buď změří, nebo se vezme
     referenční hodnota uložená u receptury. */
  const [viskoz, setViskoz] = useState("");
  useEffect(() => { setViskoz(recipe && recipe.viskozita != null ? String(recipe.viskozita) : ""); },
    [recipe && recipe.id]);

  /* Spotřeba spočítaná ze síta — kolik barvy tou tkaninou projde.
     Nabízí se jen jako návrh; ručně zadanou hodnotu nepřepisuje. */
  const zeSita = useMemo(() => {
    if (!recipe || !recipe.mesh || !sita || !sita.length) return null;
    return spotrebaZeSita({
      sito: recipe.mesh, sita: sita, tech: tech, hustota: n(recipe.density, 1.2),
      kryvost: recipe.opacity, material: product ? product.material : "",
      podkladHex: colorSel ? colorSel.hex : "", koef: koef,
      viskozita: viskoz,
    });
  }, [recipe, sita, koef, tech, product, colorSel, viskoz]);

  // Podklad dosud vstupoval jen do spotřeby. Tohle je druhá otázka: projde ta
  // barva na tomhle materiálu vůbec, nebo bude prosvítat?
  const podklad = useMemo(() => {
    if (!recipe || !colorSel) return null;
    return analyzaPodkladu({
      barvaHex: recipe.hex, podkladHex: colorSel.hex, kryvost: recipe.opacity,
    });
  }, [recipe, colorSel]);

  // Rozdělení složení na pigmenty a bázi — odstín dělá poměr pigmentů,
  // vlastnosti dělá báze.
  const slozeni = useMemo(
    () => rozborSlozeni(recipe ? recipe.components : [], pigmenty),
    [recipe, pigmenty]);
  // báze, které dílna má — pro nabídku výměny na jiný materiál
  const bazeVolby = useMemo(
    () => Object.values(pigmenty || {}).filter((p) => p.role === "baze"),
    [pigmenty]);

  const [qty, setQty] = useState(500);
  const [gm2, setGm2] = useState(TECHS[tech] ? TECHS[tech].gm2 : 6);
  const [loss, setLoss] = useState(15);
  const [minBatch, setMinBatch] = useState(50);
  useEffect(() => {
    if (pend.current.gm2 != null) { setGm2(pend.current.gm2); pend.current.gm2 = null; return; }
    setGm2(TECHS[tech] ? TECHS[tech].gm2 : 6);
  }, [tech]);

  // ---- převzetí specifikace načtené čtečkou ----
  useEffect(() => {
    if (!spec || !spec.product) return;
    pend.current = {
      color: spec.colorIdx >= 0 ? spec.colorIdx : null,
      rec: spec.recipe ? spec.recipe.id : null,
      gm2: spec.gm2,
    };
    setProdId(spec.product.id);
    if (spec.position) setPosId(spec.position.id);
    if (spec.colorIdx >= 0) setColorIdx(spec.colorIdx);
    if (spec.recipe) {
      setRecId(spec.recipe.id);
      setAdHoc(null);
    } else if (spec.fields.recipe) {
      // barva z listu není v databázi — založíme rozpracovanou recepturu,
      // ať jde dojít k míchacímu lístku a složení doplnit až u míchačky
      setRecId("");
      const vz = vzornikProHodnotu(spec.vzorniky, spec.fields.recipe);
      const nova = novaAdHoc(spec.fields.recipe, spec.fields.series);
      // barvu vezmeme ze vzorníku vedle názvu v listu, ať odstín sedí
      setAdHoc(vz ? Object.assign(nova, { hex: vz.hex }) : nova);
      setZListu(!!vz);
    } else {
      setZListu(false);
    }
    if (spec.qty != null) setQty(spec.qty);
    if (spec.gm2 != null) setGm2(spec.gm2);
    if (spec.loss != null) setLoss(spec.loss);
    if (spec.minBatch != null) setMinBatch(spec.minBatch);
    const f = spec.fields;
    setZak((f.order || f.customer || f.note || f.mesh || f.opacity || f.surface || spec.w)
      ? { order: f.order || "", customer: f.customer || "", note: f.note || "",
          mesh: f.mesh || "", opacity: f.opacity || "", surface: f.surface || "",
          w: spec.w || 0, h: spec.h || 0, warn: spec.warn, ts: spec.ts }
      : null);
    setPouzitRozmer(true);
    const cisloZ = spec.fields.order ? String(spec.fields.order) : "";
    const ulozene = cisloZ ? pokrytiZakazek[cisloZ] : null;
    setPokrytiJob(ulozene ? ulozene.pct : null);
    setOdsazeniJob(ulozene ? ulozene.odsazeni : null);
    setPickerOpen(false);
    // po doběhnutí navazujících efektů příznaky zahodíme, ať neovlivní další ruční změny
    setTimeout(() => { pend.current = { color: null, rec: null, gm2: null }; }, 0);
    onSpecUsed();
  }, [spec]);

  // úprava vybrané receptury — rozpracovaná žije v paměti, uložená v databázi
  const upravRecepturu = (patch) => {
    if (!recipe) return;
    if (jeAdHoc) setAdHoc(Object.assign({}, adHoc, patch));
    else setRecipes((prev) => prev.map((x) => x.id === recipe.id ? Object.assign({}, x, patch) : x));
  };

  // zápis parametrů ze specu (síto / kryvost / povrch) do vybrané receptury — jen na vyžádání
  const zapsatParametry = () => {
    if (!zak || !recipe) return;
    const patch = {};
    if (zak.mesh) patch.mesh = zak.mesh;
    if (zak.opacity) patch.opacity = zak.opacity;
    if (zak.surface) patch.surface = zak.surface;
    if (zak.customer) patch.customer = zak.customer;
    upravRecepturu(patch);
    setZak(Object.assign({}, zak, { mesh: "", opacity: "", surface: "" }));
  };

  // rozměr ze zakázkového listu má přednost před největší plochou z katalogu
  const rozmerListu = (zak && pouzitRozmer && zak.w > 0 && zak.h > 0) ? { w: zak.w, h: zak.h } : null;
  const sirka = rozmerListu ? rozmerListu.w : (position ? n(position.w) : 0);
  const vyska = rozmerListu ? rozmerListu.h : (position ? n(position.h) : 0);
  // pokrytí spočítané z náhledu má přednost před údajem z katalogu
  const pokryti = pokrytiJob != null ? pokrytiJob : n(position ? position.cover : 100, 100);

  const calc = useMemo(() => {
    if (!position || !recipe) return null;
    const areaM2 = (sirka * vyska / 1000000) * (pokryti / 100);
    const netto = areaM2 * n(qty) * n(gm2);
    const withLoss = netto * (1 + n(loss) / 100);
    const totalG = Math.max(withLoss, n(minBatch));
    const totalMl = totalG / (n(recipe.density, 1) || 1);
    const pctSum = recipe.components.reduce((s, c) => s + n(c.pct), 0);
    const comps = recipe.components.map((c) => {
      const share = pctSum ? n(c.pct) / pctSum : 0;
      return Object.assign({}, c, { g: totalG * share, ml: totalMl * share, norm: share * 100 });
    });
    return { areaM2, netto, totalG, totalMl, comps, pctSum, minApplied: totalG > withLoss + 1e-9 };
  }, [position, recipe, qty, gm2, loss, minBatch, sirka, vyska, pokryti]);

  // Které kelímky ze skladu na tuhle dávku sednou a kolik z nich jde použít.
  const nabidky = useMemo(() => (calc && calc.comps.length)
    ? nabidkyZbytku(zbytky, calc.comps, calc.totalG) : [], [zbytky, calc]);
  const vyuzitiZbytku = useMemo(() => {
    if (!pouzityZbytek || !calc || !calc.comps.length) return null;
    const z = (zbytky || []).find((x) => x.kod === pouzityZbytek.kod);
    if (!z) return null;
    return pouzityZbytek.rezim === "cely"
      ? zbytekCelyPlan(z, calc.comps, calc.totalG)
      : vyuzitelnyZbytek(z, calc.comps, calc.totalG);
  }, [pouzityZbytek, zbytky, calc]);

  /* Dávka po přepočtu na zbytek. Při využití celého kelímku se míchá víc,
     než zakázka žádá — poměr složek zůstává, jen se všechno škáluje. */
  const calcAkt = useMemo(() => {
    if (!calc) return calc;
    const cil = vyuzitiZbytku && vyuzitiZbytku.davka;
    if (!cil || Math.abs(cil - calc.totalG) < 0.01) return calc;
    const k = cil / calc.totalG;
    return Object.assign({}, calc, {
      totalG: calc.totalG * k, totalMl: calc.totalMl * k,
      comps: calc.comps.map((c) => Object.assign({}, c, { g: c.g * k, ml: c.ml * k })),
      zvetseno: true, davkaZakazky: calc.totalG,
    });
  }, [calc, vyuzitiZbytku]);
  // změní-li se receptura nebo dávka tak, že zbytek nesedí, volba se zruší sama
  useEffect(() => { setPouzityZbytek(null); setKodDavky(""); }, [recipe && recipe.id]);

  const odepisZbytku = () => {
    if (!vyuzitiZbytku) return;
    const kod = vyuzitiZbytku.zbytek.kod, ubrat = vyuzitiZbytku.pouzit;
    setZbytky((prev) => prev.map((z) => z.kod === kod
      ? Object.assign({}, z, { gramu: Math.max(0, n(z.gramu) - ubrat), zmeneno: Date.now() })
      : z));
    setPouzityZbytek(null);
  };

  /* Štítek se lepí na kelímek hned po namíchání — kolik z barvy zbude, se
     ví až po tisku. Proto se dávka do evidence založí rovnou celá a ve stavu
     "v tisku"; po zakázce se štítek načte čtečkou a doplní se zbytek. */
  const oznacDavku = () => {
    if (!recipe || !calc) return;
    const kod = novyKodZbytku(zbytky);
    const pct = calc.pctSum || 100;
    setZbytky((prev) => [{
      id: uid(), kod: kod, nazev: recipe.name, stav: "vtisku",
      gramu: calc.totalG, davkaG: calc.totalG, puvodne: calc.totalG,
      hustota: n(recipe.density, 1.2), hex: recipe.hex,
      zakazka: (zak && zak.order) || "", produkt: (product && product.ref) || "",
      barva: colorSel ? (colorSel.code || colorSel.name || "") : "",
      tech: tech || "", poloha: position ? position.name : "",
      ulozeno: Date.now(), zmeneno: Date.now(), namichano: Date.now(),
      expirace: "", potlifeH: dvouslozkova ? POTLIFE_VYCHOZI : null, tuzidlo: !!dvouslozkova,
      viskozita: "", viskPohar: "", viskKdy: 0, viskHist: [],
      pozn: "", zdroj: recipe.zdroj || "",
      slozeni: recipe.components.map((c) => ({ name: c.name, pct: n(c.pct) / pct * 100 })),
    }].concat(prev));
    setKodDavky(kod);
    setStitekOtevren(true);
  };

  const ulozZbytekZKalkulace = () => {
    if (!ulozitZbytek || !recipe || !(n(ulozitZbytek.gramu) > 0)) return;
    const kod = novyKodZbytku(zbytky);
    const pct = calc && calc.pctSum ? calc.pctSum : 100;
    setZbytky((prev) => [{
      id: uid(), kod: kod, nazev: recipe.name, gramu: n(ulozitZbytek.gramu),
      puvodne: n(ulozitZbytek.gramu), hustota: n(recipe.density, 1.2), hex: recipe.hex,
      zakazka: (zak && zak.order) || "", produkt: (product && product.ref) || "",
      barva: colorSel ? (colorSel.code || colorSel.name || "") : "",
      tech: tech || "", poloha: position ? position.name : "",
      ulozeno: Date.now(), zmeneno: Date.now(), namichano: Date.now(),
      expirace: ulozitZbytek.expirace || "",
      potlifeH: ulozitZbytek.potlifeH === "" || ulozitZbytek.potlifeH == null ? null : n(ulozitZbytek.potlifeH),
      tuzidlo: !!ulozitZbytek.tuzidlo,
      viskozita: "", viskPohar: "", viskKdy: 0, viskHist: [],
      pozn: ulozitZbytek.pozn || "", zdroj: recipe.zdroj || "",
      slozeni: recipe.components.map((c) => ({ name: c.name, pct: n(c.pct) / pct * 100 })),
    }].concat(prev));
    setUlozitZbytek(null);
    if (onZbytekUlozen) onZbytekUlozen(kod);
  };

  const esc = (x) => String(x == null ? "" : x).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const tiskLisku = () => {
    if (!calcAkt || !product || !position || !recipe) return;
    const d = new Date();
    const dat = d.toLocaleDateString("cs-CZ") + " " + d.toLocaleTimeString("cs-CZ", { hour: "2-digit", minute: "2-digit" });
    let kum = 0;
    const radky = calcAkt.comps.length
      ? calcAkt.comps.map((c, i) => {
          kum += c.g;
          return `<tr>
        <td class="num">${i + 1}</td>
        <td>${esc(c.name)}</td>
        <td class="num">${fmt(c.norm)}</td>
        <td class="num b">${fmt(c.g)}</td>
        <td class="num">${fmt(kum)}</td>
        <td class="num">${fmt(c.ml)}</td>
        <td class="chk"></td>
      </tr>`;
        }).join("")
      // složení zatím není — lístek se vytiskne s prázdnými řádky na dopsání
      : Array.from({ length: 8 }, (_, i) =>
          `<tr><td class="num">${i + 1}</td><td>&nbsp;</td><td></td><td></td><td></td><td></td><td class="chk"></td></tr>`).join("");
    const w = window.open("", "_blank");
    if (!w) { alert("Prohlížeč zablokoval nové okno — povolte vyskakovací okna pro tuto stránku."); return; }
    w.document.write(`<!doctype html><html lang="cs"><head><meta charset="utf-8"><title>Míchací lístek — ${esc(recipe.name)}</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;color:#18170F;margin:24px;font-size:13px}

  .g2{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px}
  .lbl{color:#78766C;font-size:10px;text-transform:uppercase;letter-spacing:.6px}

    <div><div class="lbl">Poloha potisku</div><div class="val">${esc(position.name)} · ${fmt(sirka, 1)}×${fmt(vyska, 1)} mm${rozmerListu ? " (dle listu)" : ""} · krycí plocha ${fmt(pokryti, 1)} %${pokrytiJob != null
      ? " (z náhledu motivu" + (odsazeniJob ? ", odsazení " + fmt(odsazeniJob, 1) + " mm" : "") + ")" : ""}</div></div>
    <div><div class="lbl">Technologie</div><div class="val">${esc(tech)} — ${esc(TECHS[tech] ? TECHS[tech].name : "")}</div></div>
    <div><div class="lbl">Zakázka</div><div class="val">${fmt(n(qty), 0)} ks · ${fmt(n(gm2), 1)} g/m² · ztráty ${fmt(n(loss), 0)} %</div></div>
    ${kodDavky ? `<div><div class="lbl">Kód kelímku</div><div class="val" style="font-family:Consolas,monospace;font-weight:800">${esc(kodDavky)}
      <img src="${code128Url(kodDavky, 34, 1)}" alt="${esc(kodDavky)}" style="display:block;margin-top:2px">
      <span style="font-size:10px;color:#78766C;font-family:Segoe UI,Arial,sans-serif;font-weight:400">po zakázce načtěte a zapište zbytek</span></div></div>` : ""}
    <div><div class="lbl">Barva / řada</div><div class="val">${esc(recipe.name)}${recipe.series ? " · " + esc(recipe.series) : ""} · hustota ${fmt(n(recipe.density, 1), 2)} g/ml${jeAdHoc ? " · <b>neuložená receptura</b>" : ""}</div></div>
    ${barvaPotisku ? `<div><div class="lbl">Odstín potisku</div><div class="val">${
      barvaPotisku.pantone
        ? `<b>${esc(barvaPotisku.pantone)}</b>`
        : `<b>CMYK ${esc(cmykText(barvaPotisku.cmyk))}</b>`
      }${barvaPotisku.pantone && barvaPotisku.cmyk ? " · ≈ CMYK " + esc(cmykText(barvaPotisku.cmyk)) : ""
      }${barvaPotisku.hex ? " · " + esc(barvaPotisku.hex) : ""
      }${barvaPotisku.zListu ? " · vzorník ze zakázkového listu" : ""
      }${barvaPotisku.blizky ? " · nejblíž " + esc(barvaPotisku.blizky.recipe.name)
           + " (odchylka " + fmt(barvaPotisku.blizky.dE, 1) + ")" : ""}</div></div>` : ""}
    ${n(viskoz) > 0 ? `<div><div class="lbl">Viskozita</div><div class="val">${fmt(n(viskoz), 1)} s${
      zeSita && zeSita.dopVisk ? ` <span style="font-size:10px;color:#78766C">doporučeno ${fmt(zeSita.dopVisk.od, 0)}–${fmt(zeSita.dopVisk.do, 0)} s</span>` : ""
      }</div></div>` : ""}
    <div><div class="lbl">${maSito ? "Síto / kryvost / povrch" : "Kryvost / povrch"}</div><div class="val">${
      maSito ? esc(recipe.mesh || "—") + " · " : ""}${esc(recipe.opacity || "—")} · ${esc(recipe.surface || "—")}</div></div>
    <div><div class="lbl">Objednavatel</div><div class="val">${esc((zak && zak.customer) || recipe.customer || "—")}</div></div>
    ${zak && zak.order ? `<div><div class="lbl">Zakázka</div><div class="val">${esc(zak.order)}</div></div>` : ""}
    ${zak && zak.note ? `<div><div class="lbl">Poznámka k zakázce</div><div class="val">${esc(zak.note)}</div></div>` : ""}
    ${zak && (zak.mesh || zak.opacity || zak.surface)
      ? `<div><div class="lbl">Požadavek z listu</div><div class="val">${esc([zak.mesh, zak.opacity, zak.surface].filter(Boolean).join(" · "))}</div></div>` : ""}
    <div><div class="lbl">Příznaky</div><div class="val">${[recipe.tested ? "otestovaný" : "", recipe.fade ? "odolný vůči vyblednutí" : ""].filter(Boolean).join(" · ") || "—"}</div></div>
  </div>
  <div class="box">
    <div class="lbl">Celkem namíchat${calcAkt.minApplied ? " (uplatněna min. dávka)" : ""}</div>
    <div class="big">${fmt(calcAkt.totalG)} g <span style="font-size:15px;color:#78766C">≈ ${fmt(calcAkt.totalMl)} ml</span></div>
  </div>
  <table>
    <thead><tr><th style="text-align:right">#</th><th>Komponenta</th><th style="text-align:right">%</th><th style="text-align:right">navážit g</th><th style="text-align:right">kumulativně g</th><th style="text-align:right">ml</th><th style="text-align:center">✓</th></tr></thead>
    <tbody>${radky}</tbody>
    <tfoot><tr><td></td><td>Celkem</td><td class="num">${calcAkt.comps.length ? "100,0" : ""}</td><td class="num">${fmt(calcAkt.totalG)}</td><td class="num">${fmt(calcAkt.totalG)}</td><td class="num">${fmt(calcAkt.totalMl)}</td><td></td></tr></tfoot>
  </table>
  ${calcAkt.comps.length
    ? `<div class="note">Kumulativní vážení do jedné nádoby: po každé komponentě má displej váhy ukazovat hodnotu ve sloupci „kumulativně g". Tolerance navážení ±0,5 g, pokud technolog neurčí jinak.</div>`
    : `<div class="note"><b>Složení receptury zatím není v aplikaci zadané.</b> Namíchejte podle firemní receptury na celkovou dávku uvedenou výše a navážky zapište do tabulky. Tolerance navážení ±0,5 g, pokud technolog neurčí jinak.</div>`}
  <div class="pods"><div>Namíchal/a</div><div>Datum a čas</div><div>Kontrola / šarže</div></div>
  <script>window.addEventListener("load",function(){setTimeout(function(){window.print()},150)})<\/script>
</body></html>`);
    w.document.close();
  };

  if (!products.length) return html`<div className="empty">Katalog je prázdný — v záložce Import / data obnovte katalog nebo nahrajte soubor.</div>`;

  return html`
    <div>
      <div className="searchwrap">
        <div className="searchbar">
          <span className="ic" aria-hidden="true">⌕</span>
          <input value=${q}
            onChange=${(e) => { setQ(e.target.value); setDropOpen(true); }}
            onFocus=${() => setDropOpen(true)}
            onBlur=${() => setTimeout(() => setDropOpen(false), 150)}
            onKeyDown=${(e) => { if (e.key === "Escape") { e.currentTarget.blur(); setDropOpen(false); } if (e.key === "Enter" && filtered[0]) pickProduct(filtered[0].id); }}
            placeholder="Hledat produkt podle názvu nebo ref. čísla…" />
          <span className="count">${filtered.length} z ${products.length}</span>
        </div>
        ${dropOpen && html`
          <div className="searchdrop">
            ${filtered.length === 0 && html`<div className="searchitem note">Nic nenalezeno.</div>`}
            ${filtered.slice(0, 12).map((p) => html`
              <div key=${p.id} className="searchitem" onMouseDown=${() => pickProduct(p.id)}>
                <${Img} className="searchitem-img" src=${p.img} alt=${p.name}
                  fallback=${html`<div className="searchitem-img noimg" style=${{ height: 40 }}></div>`}
                  errFallback=${html`<div className="searchitem-img noimg" style=${{ height: 40 }}></div>`} />
                <div style=${{ minWidth: 0 }}>
                  <div className="searchitem-nm">${p.ref ? p.ref + " · " : ""}${p.name}</div>
                  <div className="searchitem-dm">${p.material || ""}</div>
                </div>
              </div>`)}
            ${filtered.length > 12 && html`<div className="searchitem note">… a dalších ${filtered.length - 12} — upřesněte hledání.</div>`}
          </div>`}
      </div>

      ${zak && html`
        <div className="specbar">
          <span className="tag tech">spec načten</span>
          ${zak.order && html`<span>Zakázka <b>${zak.order}</b></span>`}
          ${zak.customer && html`<span>Objednavatel <b>${zak.customer}</b></span>`}
          ${zak.w > 0 && zak.h > 0 && html`
            <${React.Fragment}>
              <label className="tgl" title="Katalog uvádí jen největší možnou plochu — rozměr z listu je ten skutečný">
                <input type="checkbox" checked=${pouzitRozmer} onChange=${(e) => setPouzitRozmer(e.target.checked)} />
                <span className="tglt"></span>
                Rozměr z listu <b>${fmt(zak.w, 1)}×${fmt(zak.h, 1)} mm</b>
              </label>
              ${position && html`<span className="note">katalog max. ${fmt(n(position.w), 0)}×${fmt(n(position.h), 0)} mm</span>`}
            <//>`}
          ${zak.note && html`<span className="note">${zak.note}</span>`}
          ${(zak.mesh || zak.opacity || zak.surface) && html`
            <${React.Fragment}>
              <span className="note">požadováno: ${[zak.mesh, zak.opacity, zak.surface].filter(Boolean).join(" · ")}</span>
              <button className="btn sec sm" onClick=${zapsatParametry}>Zapsat do receptury</button>
            <//>`}
          ${zak.warn && zak.warn.length > 0 && html`<span className="note" style=${{ color: "var(--warn)" }}>${zak.warn.length} upozornění</span>`}
          <span style=${{ marginLeft: "auto" }}></span>
          ${onUpravitSpec && html`<button className="btn sec sm" onClick=${onUpravitSpec}>Upravit spec</button>`}
          <button className="btn sec sm" onClick=${() => setZak(null)}>✕</button>
        </div>`}

      <div className="grid calc">
        <div style=${{ display: "grid", gap: 20, alignContent: "start" }}>

          <div className="card" style=${{ margin: 0 }}>
            <h2>Vybraný produkt</h2>
            <div className="rowline" style=${{ alignItems: "flex-start", margin: "2px 0 0" }}>
              <${Img} className="prodphoto" srcs=${prodPhotos} alt=${product ? product.name : ""}
                errFallback=${html`<div className="prodphoto noimg">fotka nenalezena</div>`} />
              <div style=${{ minWidth: 0, flex: 1 }}>
                <div style=${{ fontWeight: 800 }}>${product && product.ref ? product.ref + " · " : ""}${product ? product.name : ""}</div>
                ${product && product.material && html`<div className="note">${product.material}</div>`}
                <div className="rowline" style=${{ marginTop: 8, marginBottom: 0 }}>
                  <span className="tag tech">${tech} — ${TECHS[tech] ? TECHS[tech].name : ""}</span>
                  <span className="tag" title=${rozmerListu ? "rozměr ze zakázkového listu" : "největší tisková plocha dle katalogu"}>
                    ${position ? fmt(sirka, 1) + "×" + fmt(vyska, 1) : "?"} mm${rozmerListu ? " ⌂" : ""}
                  </span>
                  ${colorSel && html`<span className="tag"><span className="cdot" style=${{ background: colorSel.hex || "#CCCCCC" }}></span>${colorSel.code || colorSel.name || ""}</span>`}
                </div>
                <button className="btn sec sm" style=${{ marginTop: 12 }} onClick=${() => setPickerOpen(true)} disabled=${!product}>Barva a poloha potisku →</button>
              </div>
              ${onPouzitSpec && html`<${PdfVKalkulaci} sgps=${sgps} products=${products} recipes=${recipes}
                onApply=${onPouzitSpec} onNacteno=${onPdfNacteno} />`}
            </div>
          </div>

          <div className="card bigform" style=${{ margin: 0 }}>
            <h2>Receptura a zakázka</h2>
            <p className="hint">Vyberte recepturu — technologie a rozměry se doplní z vybrané polohy potisku.</p>
            <${FiltrDatabaze} recipes=${recipes} hodnota=${dbFiltr} setHodnota=${setDbFiltr}
              popis="Vybírá se jen z označené databáze — tatáž receptura může mít v jiné databázi jiné složení." />
            <div className="frow c2">
              <div>
                <label className="f">Receptura (Pantone standard) — ${pantoneList.length} z ${pantoneAll.length}</label>
                <input value=${recQ} onChange=${(e) => setRecQ(e.target.value)} placeholder="Filtr: např. 485 nebo Reflex…" style=${{ marginBottom: 6 }} />
                <select value=${pantoneList.some((r) => r.id === recId) ? recId : ""}
                  onChange=${(e) => e.target.value && setRecId(e.target.value)}>
                  <option value="">— vyberte Pantone recepturu —</option>
                  ${pantoneList.slice(0, 400).map((r) => html`<option key=${r.id} value=${r.id}>${r.name} · ${r.series}</option>`)}
                </select>
                ${pantoneList.length > 400 && html`<div className="note" style=${{ marginTop: 4 }}>Zobrazeno prvních 400 — upřesněte filtr.</div>`}

              <div>
